    });

    var trBtn = document.getElementById('btnCheckTradeReqs');
    if (trBtn) trBtn.addEventListener('click', function() {
      if (typeof renderTradeRequests === 'function') renderTradeRequests();
    });

    /* Free Agency section buttons (hidden until unlocked) */
    var faBtn = document.getElementById('btnFreeAgency');
    if (faBtn) faBtn.addEventListener('click', function() {
      if (typeof renderFreeAgencyScreen === 'function') renderFreeAgencyScreen();
    });

    var capBtn = document.getElementById('btnCapChart');
    if (capBtn) capBtn.addEventListener('click', function() {
      if (typeof renderCapChart === 'function') renderCapChart();
    });

    var simFABtn = document.getElementById('btnSimFA');
    if (simFABtn) simFABtn.addEventListener('click', function() {
      if (typeof simulateFullFreeAgency === 'function') simulateFullFreeAgency();
    });

    /* Draft section buttons (hidden until unlocked) */
    var draftOrderBtn = document.getElementById('btnViewDraftOrder');
    if (draftOrderBtn) draftOrderBtn.addEventListener('click', function() {
      if (typeof renderDraftOrder === 'function') renderDraftOrder();
    });

    var startDraftBtn = document.getElementById('btnStartDraft');
    if (startDraftBtn) startDraftBtn.addEventListener('click', function() {
      if (typeof calculateDraftOrder === 'function') calculateDraftOrder();
      if (typeof generateDraftClass === 'function') generateDraftClass();
      draftRound = 1; draftIndex = 0;
      var team = getTeamOnClock ? getTeamOnClock() : null;
      if (team && team.id === userTeamId) {
        renderDraftScreen();
      } else if (typeof cpuDraftPlayer === 'function') {
        cpuDraftPlayer();
      }
    });

    /* Suppress dynamically-injected offseason buttons from old scripts.
       They target sections that no longer exist so they silently fail,
       EXCEPT "Offseason Hub" which appends directly to sidebar.
       Remove it on the next tick after DOMContentLoaded fires. */
    setTimeout(function() {
      var sidebar = document.getElementById('sidebar');
      if (!sidebar) return;
      sidebar.querySelectorAll('button').forEach(function(btn) {
        var label = btn.textContent.trim();
        var offseasonOnly = [
          'Offseason Hub','Simulate Free Agency Period',
          'CPU Roster Cleanup','Offseason Summary',
          'My Team Offseason Report','Salary Cap Overview',
          'Black Monday Simulation','Check Trade Requests','Weekly Gameplan'
        ];
        if (offseasonOnly.indexOf(label) !== -1) {
          btn.remove();
        }
      });
    }, 0);
  });

  /* ── Patch renderWeekResults to trigger end-of-season ─ */
  var _origRWR = window.renderWeekResults;
  window.renderWeekResults = function(week) {
    _origRWR(week);
    /* currentWeekIndex was already incremented before this call */
    /* Only show the Regular Season Complete banner immediately after week 17.
       During playoffs (gmPhase==='postseason') this banner should stay hidden. */
    if (currentWeekIndex === schedule.length && window.gmPhase !== 'postseason') {
      var main = document.getElementById('main');
      if (!main) return;
      var banner = document.createElement('div');
      banner.className = 'welcome-hero';
      banner.style.marginTop = '16px';
      banner.innerHTML =
        '<h2 style="color:var(--gold)">🏁 Regular Season Complete</h2>' +
        '<p style="color:var(--muted2);font-size:13px">' +
          'All 17 weeks have been played. Time for the postseason.' +
        '</p>' +
        '<button onclick="beginAwardsPhase()" style="margin-top:10px">' +
          '🏆 View Awards &amp; Begin Offseason →' +
        '</button>';
      main.appendChild(banner);
    }
  };

  /* ── Phase 1: Awards ─────────────────────────────────── */
  window.beginAwardsPhase = function() {
    if (typeof renderAwards === 'function') renderAwards();
    /* Append a "Continue" button after awards render */
    setTimeout(function() {
      var main = document.getElementById('main');
      if (!main) return;
      var div = document.createElement('div');
      div.style.marginTop = '16px';
      div.innerHTML =
        '<button onclick="beginPlayoffsPhase()">' +
          '🏟️ Begin Playoffs →' +
        '</button>';
      main.appendChild(div);
    }, 50);
  };

  /* ═══════════════════════════════════════════════════════════
     PLAYOFF SYSTEM — week-by-week, driven by the Sim Week button
     ═══════════════════════════════════════════════════════════
     State stored on window.playoffs = {
       confNames: [str, str],
       rounds: ['Wild Card','Divisional','Conference Championship','Super Bowl'],
       roundIdx: 0,          // which round we're on
       conf1: [team...],     // survivors (shrinks each round)
       conf2: [team...],
       conf1Seeds: [7 teams], // original seeds
       conf2Seeds: [7 teams],
       userIn: bool,
       done: false,
       sbWinner: null
     }
     Each round builds a "playoff week" object identical in shape
     to a regular-season week (games[]) and passes it through the
     existing simulateWeek / renderWeekResults pipeline.
  ════════════════════════════════════════════════════════════ */

  window.beginPlayoffsPhase = function () {
    window.gmPhase = 'postseason';
    var allTeams = listAllTeams(league);

    /* Discover conference names */
    var confNames = [];
    allTeams.forEach(function (t) {
      if (t.conference && confNames.indexOf(t.conference) < 0) confNames.push(t.conference);
    });
    if (confNames.length < 2) confNames = [confNames[0]||'Conference A', confNames[1]||'Conference B'];

    function confStandings(name) {
      return allTeams
        .filter(function (t) { return t.conference === name; })
        .sort(function (a, b) {
          if (b.wins !== a.wins) return b.wins - a.wins;
          return (b.pointsFor||0) - (a.pointsFor||0);
        });
    }

    function padTo7(arr) {
      var out = arr.slice(0, 7);
      while (out.length < 7) out.push(out[Math.max(0, out.length-1)]);
      return out;
    }

    var c1Seeds = padTo7(confStandings(confNames[0]));
    var c2Seeds = padTo7(confStandings(confNames[1]));

    var tid = typeof userTeamId !== 'undefined' ? userTeamId : null;
    var userIn = tid && c1Seeds.concat(c2Seeds).some(function(t){ return t.id === tid; });

    /* Store state */
    window.playoffs = {
      confNames  : confNames,
      conf1Seeds : c1Seeds,
      conf2Seeds : c2Seeds,
      /* Wild Card survivors start as seeds 2-7; seed 1 gets a bye */
      conf1      : c1Seeds.slice(1),   /* will be replaced after WC */
      conf2      : c2Seeds.slice(1),
      conf1Bye   : c1Seeds[0],         /* seed 1 byes */
      conf2Bye   : c2Seeds[0],
      roundIdx   : 0,
      rounds     : ['Wild Card','Divisional Round','Conference Championship','Super Bowl'],
      userIn     : userIn,
      done       : false,
      sbWinner   : null,
      results    : []
    };

    /* Build the first playoff week (Wild Card) and store it */
    window._buildNextPlayoffRound();

    /* Show the bracket / notification screen */
    window._renderPlayoffLobby();
  };

  /* ── Build the next round's game slate ───────────────────────── */
  window._buildNextPlayoffRound = function () {
    var ps = window.playoffs;
    if (!ps || ps.done) return;
    var round = ps.rounds[ps.roundIdx];
    var games = [];

    function makeGame(home, away) {
      return {
        homeTeamId : home.id,
        awayTeamId : away.id,
        played     : false,
        isPlayoff  : true,
        playoffRound: round,
        homeScore  : 0,
        awayScore  : 0
      };
    }

    if (round === 'Wild Card') {
      /* Seed 1 has a bye. 2v7, 3v6, 4v5 per conference */
      var c1 = ps.conf1Seeds, c2 = ps.conf2Seeds;
      games.push(makeGame(c1[1], c1[6]));
      games.push(makeGame(c1[2], c1[5]));
      games.push(makeGame(c1[3], c1[4]));
      games.push(makeGame(c2[1], c2[6]));
      games.push(makeGame(c2[2], c2[5]));
      games.push(makeGame(c2[3], c2[4]));
    } else if (round === 'Divisional Round') {
      /* conf1: seed1 vs lowest WC winner; other two WC winners play each other */
      games.push(makeGame(ps.conf1Bye, ps.conf1[0]));
      games.push(makeGame(ps.conf1[1], ps.conf1[2]));
      games.push(makeGame(ps.conf2Bye, ps.conf2[0]));
      games.push(makeGame(ps.conf2[1], ps.conf2[2]));
    } else if (round === 'Conference Championship') {
      games.push(makeGame(ps.conf1[0], ps.conf1[1]));
      games.push(makeGame(ps.conf2[0], ps.conf2[1]));
    } else if (round === 'Super Bowl') {
      games.push(makeGame(ps.conf1[0], ps.conf2[0]));
    }

    /* Store as a week-shaped object the sim pipeline can use */
    ps.currentWeek = {
      weekNumber : 17 + ps.roundIdx + 1,
      label      : round,
      games      : games,
      isPlayoff  : true
    };
  };

  /* ── Advance survivors after a round completes ───────────────── */
  window._advancePlayoffRound = function () {
    var ps = window.playoffs;
    if (!ps) return;
    var round = ps.rounds[ps.roundIdx];
    var week  = ps.currentWeek;

    function winner(game) {
      var h = getTeamById(game.homeTeamId);
      var a = getTeamById(game.awayTeamId);
      return (game.homeScore >= game.awayScore) ? h : a;
    }

    if (round === 'Wild Card') {
      /* Winners of each conf's 3 WC games, sorted by original seed (lowest seed # = higher seed) */
      function wcWinners(confSeeds, gameOffset) {
        var wc = week.games.slice(gameOffset, gameOffset + 3).map(winner);
        /* Sort by original seed rank */
        return wc.sort(function(a, b){
          return confSeeds.indexOf(a) - confSeeds.indexOf(b);
        });
      }
      ps.conf1 = wcWinners(ps.conf1Seeds, 0);
      ps.conf2 = wcWinners(ps.conf2Seeds, 3);
      /* Byes (seed 1) are already stored in conf1Bye / conf2Bye */

    } else if (round === 'Divisional Round') {
      ps.conf1 = [winner(week.games[0]), winner(week.games[1])];
      ps.conf2 = [winner(week.games[2]), winner(week.games[3])];

    } else if (round === 'Conference Championship') {
      var champ1 = winner(week.games[0]);
      var champ2 = winner(week.games[1]);
      ps.conf1 = [champ1];
      ps.conf2 = [champ2];

    } else if (round === 'Super Bowl') {
      ps.sbWinner = winner(week.games[0]);
      ps.done = true;
    }

    ps.results.push({ round: round, games: week.games.slice() });
    ps.roundIdx++;

    if (!ps.done) {
      window._buildNextPlayoffRound();
    }
  };

  /* ── Playoff lobby / bracket status screen ───────────────────── */
  window._renderPlayoffLobby = function () {
    var ps = window.playoffs;
    if (!ps) return;
    var tid    = typeof userTeamId !== 'undefined' ? userTeamId : null;
    var myTeam = tid && getTeamById(tid);

    /* User status banner */
    var userBanner = '';
    if (ps.userIn) {
      userBanner = '<div style="background:rgba(96,165,250,.12);border:1px solid #3b82f6;'
        + 'border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#60a5fa;text-align:center">'
        + '🏟️ <strong>' + (myTeam ? myTeam.city + ' ' + myTeam.nickname : 'Your team') + '</strong> made the playoffs!'
      + '</div>';
    } else {
      userBanner = '<div style="background:rgba(148,163,184,.08);border:1px solid var(--border);'
        + 'border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--muted2);text-align:center">'
        + 'Your team did not qualify for the playoffs this season.'
      + '</div>';
    }

    /* Seed tables */
    function seedTable(seeds, confName) {
      var rows = seeds.map(function(t, i) {
        var isUser = tid && t.id === tid;
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;'
          + 'background:' + (isUser ? 'rgba(96,165,250,.1)' : 'transparent') + ';border-radius:5px">'
          + '<span style="font-size:10px;font-weight:700;color:var(--muted2);min-width:18px">#' + (i+1) + '</span>'
          + '<span style="font-size:12px;flex:1' + (isUser ? ';color:#60a5fa;font-weight:700' : '') + '">'
            + t.city + ' ' + t.nickname + '</span>'
          + '<span style="font-size:11px;color:var(--muted2)">' + t.wins + '-' + t.losses + '</span>'
        + '</div>';
      }).join('');
      return '<div style="flex:1;min-width:0">'
        + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;'
          + 'color:var(--accent2);margin-bottom:6px">' + confName + '</div>'
        + rows
      + '</div>';
    }

    var round = ps.rounds[ps.roundIdx] || '';
    var nextRoundLabel = round === 'Wild Card' ? 'Wild Card' : round;

    setMainContent(
      '<div style="max-width:600px;margin:0 auto">'
      + '<h2 style="color:var(--gold);margin-bottom:4px">🏟️ Playoffs</h2>'
      + '<p style="color:var(--muted2);font-size:12px;margin-bottom:14px">Next round: <strong>' + nextRoundLabel + '</strong></p>'
      + userBanner
      + '<div style="display:flex;gap:12px;margin-bottom:16px">'
        + seedTable(ps.conf1Seeds, ps.confNames[0])
        + seedTable(ps.conf2Seeds, ps.confNames[1])
      + '</div>'
       + '<button onclick="renderHome()" '
         + 'style="width:100%;padding:16px;font-size:16px;font-weight:700;'
         + 'font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.5px;'
         + 'background:var(--accent-dim);border-color:var(--accent);color:var(--accent2);margin-top:4px">'
         + '⚡ Sim ' + nextRoundLabel + ' →'
       + '</button>'
      + '</div>'
    );
  };

  /* ── Phase 3: Black Monday ───────────────────────────── */
  window.beginBlackMonday = function() {
    if (typeof runBlackMonday === 'function') runBlackMonday();

    var html = phaseCard(
      '🔥 Black Monday',
      'Coaches have been evaluated. Firings and hirings are complete.',
      '<p style="font-size:13px;color:var(--muted2)">Check the transaction log to see all coaching changes.</p>',
      [{ label: '💼 Open Free Agency →', fn: 'beginFreeAgencyPhase()' }]
    );
    setMainContent(html);
  };

  /* ── Phase 3: Free Agency ────────────────────────────── */
  window.beginFreeAgencyPhase = function() {
    /* Process contract expirations + generate FA pool */
    if (typeof processContractExpirations === 'function') processContractExpirations();
    if (typeof generateFreeAgentPool === 'function') generateFreeAgentPool();
    if (typeof cpuRosterCleanup === 'function') cpuRosterCleanup();

    /* Unlock FA section in sidebar */
    showSection('section-free-agency');

    /* Navigate to FA screen */
    if (typeof renderFreeAgencyScreen === 'function') renderFreeAgencyScreen();

  };

  /* ── Phase 4: Draft ──────────────────────────────────── */
  window.beginDraftPhase = function() {
    /* CPU signs any remaining free agents */
    if (typeof simulateFullFreeAgency === 'function') {
      /* Run CPU waves silently without navigating away */
      if (typeof freeAgents !== 'undefined' && freeAgents.length > 0) {
        if (typeof simulateFreeAgencyWave === 'function') {
          simulateFreeAgencyWave(85, 99);
          simulateFreeAgencyWave(78, 84);
          simulateFreeAgencyWave(70, 77);
          simulateFreeAgencyWave(0, 69);
        }
      }
    }

    /* Hide FA section, show Draft section */
    hideSection('section-free-agency');
    showSection('section-draft');

    /* Calculate draft order + generate class */
    if (typeof calculateDraftOrder === 'function') calculateDraftOrder();
    if (typeof generateDraftClass === 'function') generateDraftClass();

    var _importBadge = window._customDraftImported
      ? '✅ ' + window._customDraftImported.count + ' custom prospects loaded'
      : '';

    var _draftBody =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'

  window.launchDraft = function() {

    if (first && first.id === userTeamId) {
      renderDraftScreen();

  /* ── Phase 5: New Season ─────────────────────────────── */
  /* Patch renderDraftComplete to offer a "New Season" button */
  var _origRDC = window.renderDraftComplete;
  window.renderDraftComplete = function() {
    var html = phaseCard(
      '✅ Draft Complete',
      'All 7 rounds are done. Rosters are set for the new season.',

      [{ label: '🏈 Start New Season', fn: 'beginNewSeason()' }]

  window.beginNewSeason = function() {
    /* Increment tracked season year */
    window.simYear = (window.simYear || 1) + 1;

    /* Recalculate capUsed from actual rosters — removes any drift from
       trades, FA signings, and draft across the offseason              */
    if (typeof recalcAllTeamCap === 'function') recalcAllTeamCap();

    /* ── RESET all team records and season stats ── */
    if (typeof league !== 'undefined' && league) {
      listAllTeams(league).forEach(function(team) {
        team.wins        = 0;
        team.losses      = 0;
        team.ties        = 0;
        team.pointsFor   = 0;
        team.pointsAgainst = 0;
        team.teamStats = {
          totalOffenseYards:  0,
          totalDefenseYards:  0,
          turnoversForced:    0,
          turnoversCommitted: 0
        };
        /* Reset each player's season stats */
        team.roster.forEach(function(p) {
          /* Archive this season into career before wiping */
          if (!p.careerStats) p.careerStats = {};
          var s = p.stats || {};
          ['gamesPlayed','passingYards','passingTD','interceptionsThrown',
           'rushingYards','rushingTD','receivingYards','receivingTD',
           'tackles','sacks','interceptions','fieldGoalsMade','fieldGoalsMissed',
           'xpMade','xpMissed'
          ].forEach(function(k){ p.careerStats[k] = (p.careerStats[k]||0) + (s[k]||0); });

          /* Wipe season stats */
          p.stats = {
            gamesPlayed:0, passingYards:0, passingTD:0, interceptionsThrown:0,
            rushingYards:0, rushingTD:0, receivingYards:0, receivingTD:0,
            tackles:0, sacks:0, interceptions:0, fieldGoalsMade:0, fieldGoalsMissed:0,
            xpMade:0, xpMissed:0
          };

          p.seasonStartOVR = p.attributes.overall;
          p._ovrYear = window.simYear;
          p.devAccum = 0; /* reset accumulator for new season */
        });
      });

    /* Reset week counter */

    if (typeof runUDFA === 'function') runUDFA();

    /* Run preseason roster cuts + morale/chemistry reset */

    /* Regenerate schedule */

    /* Hide offseason sections */
    hideSection('section-free-agency');
    hideSection('section-draft');

    /* ── Draft Grade Rankings ─────────────────────────────── */
    var _allTeams = (typeof listAllTeams === 'function' && league) ? listAllTeams(league) : [];
    var _userTeam = (typeof teamMap !== 'undefined' && teamMap && userTeamId) ? teamMap[userTeamId] : null;

    function _gradeDraft(team) {
      var rookies = team.roster.filter(function(p) { return p.isRookie; });
      if (!rookies.length) return { score: 38, rookies: 0, avgOVR: 0, needPct: 0, stars: 0 };

      var avgOVR = rookies.reduce(function(s, p) { return s + p.attributes.overall; }, 0) / rookies.length;

      /* Approximate pre-draft need by temporarily removing rookies */
      var preTeam = { roster: team.roster.filter(function(p) { return !p.isRookie; }) };
      var needSum = rookies.reduce(function(s, p) {
        var n = (typeof getTeamNeedAtPosition === 'function')
          ? getTeamNeedAtPosition(preTeam, p.positions[0]) : 0.5;
        return s + n;
      }, 0);
      var needScore = needSum / rookies.length; /* 0.0 – 1.0 */

      /* Quality: normalize OVR (55–95) to 0–100 */
      var qualPct = Math.min(100, Math.max(0, (avgOVR - 55) / 40 * 100));
      var needPct = needScore * 100;

      /* 60% quality, 40% need fulfilment */
      var score = qualPct * 0.60 + needPct * 0.40;

      /* Star-player bonus (OVR ≥ 88) */
      var stars = rookies.filter(function(p) { return p.attributes.overall >= 88; }).length;
      score = Math.min(100, score + stars * 3);

      /* Depth bonus */
      if (rookies.length >= 6)  score = Math.min(100, score + 3);
      if (rookies.length >= 10) score = Math.min(100, score + 2);

      return { score: Math.round(score), rookies: rookies.length,
               avgOVR: Math.round(avgOVR), needPct: Math.round(needPct), stars: stars };
    }

    function _letterGrade(s) {
      if (s >= 97) return 'A+'; if (s >= 92) return 'A';  if (s >= 87) return 'A-';
      if (s >= 82) return 'B+'; if (s >= 77) return 'B';  if (s >= 72) return 'B-';
      if (s >= 67) return 'C+'; if (s >= 62) return 'C';  if (s >= 57) return 'C-';
      if (s >= 50) return 'D+'; if (s >= 44) return 'D';  return 'D-';
    }

    function _gradeColor(g) {
      if (g[0] === 'A') return '#22c55e';
      if (g[0] === 'B') return '#3b82f6';
      if (g[0] === 'C') return '#f59e0b';
      return '#ef4444';
    }

    /* Rank all teams */
    var _ranked = _allTeams.map(function(t) {
      var g = _gradeDraft(t);
      return { team: t, letter: _letterGrade(g.score), score: g.score,
               rookies: g.rookies, avgOVR: g.avgOVR, needPct: g.needPct, stars: g.stars };
    }).sort(function(a, b) { return b.score - a.score; });

    var _userEntry = _userTeam
      ? _ranked.find(function(r) { return r.team.id === _userTeam.id; }) : null;
    var _userRank  = _userEntry ? _ranked.indexOf(_userEntry) + 1 : null;

    /* Table rows */
    var _rows = _ranked.map(function(r, idx) {
      var isUser = _userTeam && r.team.id === _userTeam.id;
      var gc     = _gradeColor(r.letter);
      var rowBg  = isUser
        ? 'background:rgba(22,163,74,0.10);outline:1px solid var(--accent);outline-offset:-1px;'
        : '';
      var badge  = isUser
        ? '<span style="margin-left:7px;font-size:10px;background:var(--accent-dim);color:var(--accent2);padding:1px 7px;border-radius:4px;font-weight:700;vertical-align:middle;letter-spacing:.5px">★ YOU</span>'
        : '';
      var starStr = r.stars > 0 ? '★'.repeat(Math.min(r.stars, 3)) : '—';
      return '<tr style="' + rowBg + '">' +
        '<td style="font-family:Barlow Condensed,sans-serif;font-weight:700;font-size:13px;color:var(--muted)">' + (idx + 1) + '</td>' +
        '<td style="font-weight:' + (isUser ? '700' : '500') + ';color:' + (isUser ? 'var(--text)' : 'inherit') + '">' +
          r.team.city + ' ' + r.team.nickname + badge +
        '</td>' +
        '<td style="text-align:center">' +
          '<span style="font-family:Barlow Condensed,sans-serif;font-size:17px;font-weight:700;color:' + gc + '">' + r.letter + '</span>' +
        '</td>' +
        '<td style="text-align:center;color:var(--muted2);font-size:12px">' + (r.avgOVR || '—') + '</td>' +
        '<td style="text-align:center;color:var(--muted2);font-size:12px">' + r.rookies + '</td>' +
        '<td style="text-align:center;color:var(--gold);letter-spacing:1px">' + starStr + '</td>' +
      '</tr>';
    }).join('');

    /* User team callout card */
    var _userCard = '';
    if (_userEntry) {
      var _gc2 = _gradeColor(_userEntry.letter);
      _userCard =
        '<div style="background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:18px">' +
          '<div style="font-family:Barlow Condensed,sans-serif;font-size:52px;font-weight:700;color:' + _gc2 + ';line-height:1;min-width:64px;text-align:center">' + _userEntry.letter + '</div>' +
          '<div>' +
            '<div style="font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px">' +
              '★ ' + _userTeam.city + ' ' + _userTeam.nickname + ' — Your Draft Grade' +
            '</div>' +
            '<div style="font-size:12px;color:var(--muted2);line-height:1.6">' +
              'Ranked <strong style="color:var(--text)">#' + _userRank + '</strong> of ' + _ranked.length + ' teams' +
              ' &nbsp;·&nbsp; ' + _userEntry.rookies + ' rookies on roster' +
              ' &nbsp;·&nbsp; Avg OVR <strong style="color:var(--text)">' + (_userEntry.avgOVR || '—') + '</strong>' +
              (_userEntry.stars > 0
                ? ' &nbsp;·&nbsp; <span style="color:var(--gold)">' + _userEntry.stars + ' star prospect' + (_userEntry.stars !== 1 ? 's' : '') + '</span>'
                : '') +
            '</div>' +
          '</div>' +
        '</div>';
    }

    /* Final page */
    setMainContent(
      '<div class="welcome-hero" style="margin-bottom:14px">' +
        '<h2 style="color:var(--accent2)">🏈 Season ' + window.simYear + ' Begins!</h2>' +
        '<p style="color:var(--muted2);font-size:13px;margin:0">Rosters are set. Records cleared. Time to play.</p>' +
      '</div>' +

      /* Home tile */
      '<button onclick="typeof renderHome===\'function\'&&renderHome()" ' +
        'style="display:inline-flex;align-items:center;gap:7px;width:auto;padding:7px 16px;' +
        'font-size:12px;margin-bottom:16px;background:transparent;border:1px solid var(--border);color:var(--muted2)">' +
        '🏠 Back to Home' +
      '</button>' +

      _userCard +

      '<h3 style="font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:600;' +
        'color:var(--accent2);margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid var(--accent-dim)">' +
        '📋 Draft Class Rankings — All Teams' +
      '</h3>' +

      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>#</th>' +
          '<th>Team</th>' +
          '<th style="text-align:center">Grade</th>' +
          '<th style="text-align:center">Avg OVR</th>' +

          '<th style="text-align:center">Stars</th>' +

        '<tbody>' + _rows + '</tbody>' +

  };

})();

<script>
/* ============================================================
   SORTABLE TABLES
   Patches setMainContent so every table rendered anywhere in
   the app gets clickable column headers with ↑ / ↓ indicators.
   ============================================================ */
(function() {

  function cellValue(cell) {
    if (!cell) return '';
    /* Skip cells that contain only a button — those are action columns */
    var text = cell.textContent.trim();
    if (!text || cell.querySelector('button')) return null; // null = unsortable

    /* Record strings like "5-3-0" → sort by wins (first number) */
    var recMatch = text.match(/^(\d+)-(\d+)/);
    if (recMatch) return parseInt(recMatch[1], 10) * 1000 - parseInt(recMatch[2], 10);

    /* Strip $, commas, %, "/ yr", letters after digits */
    var numeric = parseFloat(text.replace(/[$,%]/g, '').replace(/[^\d.-]/g, ' ').trim().split(' ')[0]);
    if (!isNaN(numeric)) return numeric;

    return text.toLowerCase(); /* fall back to string */
  }

  function makeTablesSortable() {
    var main = document.getElementById('main');
    if (!main) return;

    main.querySelectorAll('table').forEach(function(table) {
      var ths = table.querySelectorAll('thead th');
      if (!ths.length) return;

      /* Avoid double-binding */
      if (table.dataset.sortable) return;
      table.dataset.sortable = '1';

      var sortCol = -1, sortDir = 1; /* 1 = asc, -1 = desc */

      ths.forEach(function(th, ci) {
        /* Peek at first data row to decide if column is sortable */
        var firstRow = table.querySelector('tbody tr');
        var firstCell = firstRow ? firstRow.cells[ci] : null;
        if (firstCell && firstCell.querySelector('button')) return; /* skip action cols */

        th.classList.add('th-sort');

        /* Indicator span */
        var icon = document.createElement('span');
        icon.className = 'sort-icon';
        icon.textContent = '⇅';
        th.appendChild(icon);

        th.addEventListener('click', function() {
          if (sortCol === ci) {
            sortDir *= -1;
          } else {
            sortCol = ci;
            sortDir = 1; /* always start descending-first for numeric makes more sense */
            /* Actually start with desc for numbers (highest first), asc for text */
            var sampleVal = firstCell ? cellValue(firstCell) : '';
            sortDir = (typeof sampleVal === 'number') ? -1 : 1;
          }

          /* Update all icons */
          ths.forEach(function(h, i) {
            var ic = h.querySelector('.sort-icon');
            if (!ic) return;
            if (i === ci) {
              ic.textContent = sortDir === 1 ? '↑' : '↓';
              ic.classList.add('active');
            } else {
              ic.textContent = '⇅';
              ic.classList.remove('active');
            }
          });

          /* Sort rows */
          var tbody = table.querySelector('tbody');
          if (!tbody) return;
          var rows = Array.from(tbody.querySelectorAll('tr'));

          rows.sort(function(a, b) {
            var av = cellValue(a.cells[ci]);
            var bv = cellValue(b.cells[ci]);
            if (av === null || bv === null) return 0;
            if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
            if (typeof av === 'string' && typeof bv === 'string') return av.localeCompare(bv) * sortDir;
            return 0;
          });

          rows.forEach(function(r) { tbody.appendChild(r); });
        });
      });
    });
  }

  /* Patch setMainContent to call makeTablesSortable after each render */
  var _prev = window.setMainContent;
  window.setMainContent = function(html) {
    _prev(html);
    /* Small delay so the DOM has settled */
    setTimeout(makeTablesSortable, 0);
  };

})();
</script>


<script>
/* ============================================================
   PATCH 1 — POSITION / ROSTER TEMPLATE / DEPTH CHART / TEAM SELECT
   ============================================================ */
(function () {

  /* ── Position compatibility: no nonsense dual roles ───── */
  var SECONDARY_POS_MAP = {
    QB:   [],
    RB:   ['WR'],
    WR:   ['RB'],
    TE:   ['WR', 'T'],
    T:    ['G'],
    G:    ['T', 'C'],
    C:    ['G'],
    EDGE: ['DT', 'LB'],
    DT:   ['EDGE'],
    LB:   ['EDGE', 'SS'],
    CB:   ['FS'],
    FS:   ['CB', 'SS'],
    SS:   ['FS', 'LB'],
    K:    [],
    P:    [],
  };

  window.generatePositionsForPlayer = function (primaryPos) {
    if (!primaryPos) {
      var FB = ['QB','RB','RB','WR','WR','WR','TE','TE','OL','OL','OL','OL',
                'EDGE','EDGE','DT','DT','LB','LB','LB','CB','CB','CB','S','S'];
      primaryPos = FB[randomInt(0, FB.length - 1)];
    }
    var opts = SECONDARY_POS_MAP[primaryPos] || [];
    if (opts.length && Math.random() < 0.12)
      return [primaryPos, opts[Math.floor(Math.random() * opts.length)]];
    return [primaryPos];
  };

  /* ── 55-man roster template: exactly 1 K, 1 P ──────────
     3+5+7+3+9+4+5+6+7+4+1+1 = 55                          */
  var ROSTER_TEMPLATE = [
    {pos:'QB', count:3},
    {pos:'RB', count:5},
    {pos:'WR', count:7},
    {pos:'TE', count:3},
    {pos:'T',  count:4},   /* Tackles: LT, RT + 2 depth */
    {pos:'G',  count:3},   /* Guards: LG, RG + 1 depth  */
    {pos:'C',  count:2},   /* Center + 1 backup          */
    {pos:'EDGE',count:4},
    {pos:'DT', count:5},
    {pos:'LB', count:6},
    {pos:'CB', count:7},
    {pos:'FS', count:2},   /* Free Safety + backup       */
    {pos:'SS', count:2},   /* Strong Safety + backup     */
    {pos:'K',  count:1},
    {pos:'P',  count:1},
  ];  /* Total: 3+5+7+3+4+3+2+4+5+6+7+2+2+1+1 = 55 */

  var _origBL = window.buildLeague;
  window.buildLeague = function () {
    var lg = _origBL();
    listAllTeams(lg).forEach(function (team) {
      team.roster = []; team.capUsed = 0;
      ROSTER_TEMPLATE.forEach(function (slot) {
        for (var i = 0; i < slot.count; i++) {
          var p = generatePlayer(slot.pos);   /* pass pos for attribute gen */
          p.positions = generatePositionsForPlayer(slot.pos);
          team.roster.push(p);
          if (p.contract) team.capUsed += p.contract.capHitPerYear;
        }
      });
      team.powerRating = computeTeamPowerRating(team);
    });
    return lg;
  };

  /* ── Depth chart with LT/LG/C/RG/RT, WILL/MIKE/SAM ───── */
  var OL_L=['LT','LG','C','RG','RT'], LB_L=['WILL','MIKE','SAM'],
      ED_L=['LE','RE'], S_L=['SS','FS'];

  function ovc(v){return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';}
  function tbadge(p){var t=p.devTrait;if(!t||t==='Normal')return '';var c=t==='Star'?'dc-badge-star':t==='Superstar'?'dc-badge-ss':t==='X-Factor'?'dc-badge-xfactor':'';return c?'<span class="dc-badge '+c+'">'+t+'</span>':'';}

  /* ── Depth-chart swap helper (Bug 9+10 fix) ──────────────── */
  window._dcMove = function(playerId, dir) {
    var tid = document.getElementById('teamSelect') && document.getElementById('teamSelect').value;
    if (!tid) return;
    var team = (typeof getTeamById === 'function') ? getTeamById(tid) : null;
    if (!team) return;
    var p = team.roster.find(function(x){ return String(x.id) === String(playerId); });
    if (!p) return;
    var pos = p.positions[0];
    var group = team.roster
      .filter(function(x){ return x.positions[0] === pos; })
      .sort(function(a,b){ return (a.depthChartRank||999)-(b.depthChartRank||999); });
    var idx = group.findIndex(function(x){ return String(x.id) === String(playerId); });
    var swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= group.length) return;
    var tmp = group[idx].depthChartRank;
    group[idx].depthChartRank   = group[swapIdx].depthChartRank;
    group[swapIdx].depthChartRank = tmp;
    if (typeof window.renderDepthChart === 'function') window.renderDepthChart();
  };

  function dcRow(p,lbl,starter,up,dn){
    var o=p.attributes?p.attributes.overall:70;
    var rc=(starter&&lbl&&lbl!=='●')?'<span style="color:var(--accent2);font-size:9px;font-weight:700">'+lbl+'</span>':starter?'<span style="color:var(--accent2)">●</span>':'<span style="color:var(--muted);font-size:11px">'+lbl+'</span>';
    var upBtn  = up ? '<button class="dc-arr" onclick="window._dcMove(\''+p.id+'\',-1)">▲</button>' : '<span class="dc-arr-ph"></span>';
    var downBtn = dn ? '<button class="dc-arr" onclick="window._dcMove(\''+p.id+'\',1)">▼</button>' : '<span class="dc-arr-ph"></span>';
    return '<div class="dc-row'+(starter?' dc-starter':'')+'"><div class="dc-rank">'+rc+'</div><div class="dc-info"><span class="dc-name">'+p.name+'</span><span class="dc-meta" style="color:'+ovc(o)+'">OVR '+o+'</span></div>'+tbadge(p)+'<div class="dc-arrows">'+upBtn+downBtn+'</div></div>';
  }

  function dcGrp(hdr,players,ns,labels){
    if(!players.length)return '';
    var rows=players.map(function(p,i){var s=i<ns;return dcRow(p,(s&&labels&&labels[i])?labels[i]:s?'●':String(i+1),s,i>0,i<players.length-1);}).join('');
    return '<div class="dc-group"><div class="dc-pos-header">'+hdr+'</div>'+rows+'</div>';
  }
  function dcSect(lbl,h){return h?'<div class="dc-section-label">'+lbl+'</div><div class="dc-grid">'+h+'</div>':'';}

  window.renderDepthChart = function () {
    var tid=document.getElementById('teamSelect')&&document.getElementById('teamSelect').value;
    if(!tid)return;
    var team=getTeamById(tid); if(!team)return;
    if(typeof ensureDepthChart==='function')ensureDepthChart(team);
    var bp={};
    ['QB','RB','WR','TE','T','G','C','EDGE','DT','LB','CB','FS','SS','K','P'].forEach(function(pos){bp[pos]=[];});
    team.roster.forEach(function(p){var pos=p.positions[0];if(bp[pos])bp[pos].push(p);});
    Object.keys(bp).forEach(function(pos){bp[pos].sort(function(a,b){return(a.depthChartRank||999)-(b.depthChartRank||999);});});
    var sn=team.dc&&team.dc.scheme?' · Scheme: '+team.dc.scheme:'';
    setMainContent(
      '<h2>'+team.city+' '+team.nickname+' — Depth Chart</h2>'+
      '<p class="small" style="margin-bottom:14px">● = starter &nbsp;|&nbsp; ▲▼ = reorder'+sn+'</p>'+
      dcSect('Offense',dcGrp('QB',bp['QB'],1,[])+dcGrp('T — LT / RT',bp['T']||[],2,['LT','RT'])+dcGrp('G — LG / RG',bp['G']||[],2,['LG','RG'])+dcGrp('C',bp['C']||[],1,[])+dcGrp('RB',bp['RB'],1,[])+dcGrp('WR — X / Y / Slot',bp['WR'],3,['X','Y','Slot'])+dcGrp('TE',bp['TE'],1,[]))+
      dcSect('Defense',dcGrp('EDGE — LE / RE',bp['EDGE'],2,ED_L)+dcGrp('DT',bp['DT'],2,[])+dcGrp('LB — WILL / MIKE / SAM',bp['LB'],3,LB_L)+dcGrp('CB — LC / RC / Slot',bp['CB'],3,['LC','RC','SlotC'])+dcGrp('SS',bp['SS']||[],1,['SS'])+dcGrp('FS',bp['FS']||[],1,['FS']))+
      dcSect('Special Teams',dcGrp('K',bp['K'],1,[])+dcGrp('P',bp['P'],1,[]))
    );
  };

  /* ── Fix teamSelect: update the actual let variable ────── */
  window.addEventListener('DOMContentLoaded', function () {
    var sel = document.getElementById('teamSelect');
    if (!sel) return;
    sel.addEventListener('change', function () {
      /* Assign to the global let userTeamId directly */
      try { userTeamId = this.value; } catch(e) {}
      window._activeTeamId = this.value;
      var team = getTeamById(this.value);
      var h1 = document.querySelector('.header-brand h1');
      var sub = document.querySelector('.header-brand .sub');
      if (h1 && team) h1.textContent = '⚡ ' + team.city + ' ' + team.nickname;
      if (sub && team) sub.textContent = team.conference + ' · ' + team.division;
    });
  });

  if (typeof window.draftTrades === 'undefined') window.draftTrades = {};
})();
</script>

<script>
/* ============================================================
   PATCH 2 — SEASON END ROUTES TO OFFSEASON INSTEAD OF ALERT
   ============================================================ */
(function () {

  /* Pre-sim roster validation for the user's team.
     Returns a non-empty error string if the roster isn't sim-ready, or null if OK. */
  function checkRosterBeforeSim() {
    var team;
    try { team = getTeamById(userTeamId); } catch(e) { return null; }
    if (!team || !team.roster) return null;

    var MIN_ROSTER = 37;
    var MAX_ROSTER = 55;
    var REQUIRED = ["QB","RB","WR","TE","T","G","C","EDGE","DT","LB","CB","FS","SS","K","P"];

    if (team.roster.length < MIN_ROSTER) {
      return 'Your roster only has ' + team.roster.length + ' players (minimum is ' + MIN_ROSTER + '). Sign free agents before simulating.';
    }
    if (team.roster.length > MAX_ROSTER) {
      return 'Your roster has ' + team.roster.length + ' players (maximum is ' + MAX_ROSTER + '). Release players before simulating.';
    }

    var missing = REQUIRED.filter(function(pos) {
      return !team.roster.some(function(p) { return p.positions[0] === pos; });
    });
    if (missing.length > 0) {
      return 'Missing players at required position(s): ' + missing.join(', ') + '. Fill every depth-chart slot before simulating.';
    }

    return null;
  }

  function syncBtn() {
    var btn = document.getElementById('btnSimWeek'); if (!btn) return;
    /* Update button label during playoffs */
    if (window.gmPhase === 'postseason' && window.playoffs && !window.playoffs.done) {
      var round = window.playoffs.rounds[window.playoffs.roundIdx] || 'Playoff';
      btn.textContent = '⚡ Sim ' + round;
    } else if (window.gmPhase === 'season' || !window.gmPhase) {
      btn.textContent = '⚡ Simulate Week';
    }
    var done = schedule && currentWeekIndex >= schedule.length;
    if (done) {
      btn.textContent='🏆 Begin Offseason →';
      btn.style.cssText='background:var(--gold);border-color:var(--gold);color:#000;font-weight:700';
    } else {
      btn.textContent='⚡ Simulate Week';
      btn.style.cssText='';
    }
  }

  var _uwl = window.updateWeekLabel;
  window.updateWeekLabel = function(){ if(typeof _uwl==='function')_uwl(); syncBtn(); };

  window.addEventListener('DOMContentLoaded', function () {
    var old = document.getElementById('btnSimWeek'); if (!old) return;
    var btn = old.cloneNode(true);
    old.parentNode.replaceChild(btn, old);

    btn.addEventListener('click', function () {

      /* ── Roster validity check (blocks sim if team isn't ready) ── */
      var rosterErr = checkRosterBeforeSim();
      if (rosterErr) { alert(rosterErr); return; }

      /* ── Playoff round sim ─────────────────────────── */
      if (window.gmPhase === 'postseason' && window.playoffs && !window.playoffs.done) {
        closeDrawer();
        var ps=window.playoffs, week=ps.currentWeek; if(!week) return;
        var strat={offPlaybook:(document.getElementById('offPlaybook')||{value:'West Coast'}).value,
          offensiveStyle:(document.getElementById('offStyle')||{value:'Balanced'}).value,
          defPlaybook:(document.getElementById('defPlaybook')||{value:'4-3'}).value,
          defensiveStyle:(document.getElementById('defStyle')||{value:'Balanced'}).value};
        simulateWeek(week,teamMap,strat,userTeamId);
        window._advancePlayoffRound();
        renderWeekResults(week);
        setTimeout(function(){
          var main=document.getElementById('main'); if(!main) return;
          var div=document.createElement('div'); div.style.marginTop='16px';
          if(window.playoffs&&window.playoffs.done){
            var sb=window.playoffs.sbWinner;
            var tid=typeof userTeamId!=='undefined'?userTeamId:null;
            var uw=tid&&sb&&sb.id===tid;
            div.innerHTML=(uw
              ?'<div style="background:rgba(250,204,21,.12);border:1px solid #facc15;border-radius:8px;padding:12px;text-align:center;margin-bottom:12px;font-weight:700;color:#facc15">🎉 '+sb.city+' '+sb.nickname+' win the Super Bowl!</div>'
              :'<div style="background:rgba(22,163,74,.08);border:1px solid var(--accent);border-radius:8px;padding:12px;text-align:center;margin-bottom:12px;color:var(--accent2)">🏆 '+(sb?sb.city+' '+sb.nickname:'Champions')+' win the Super Bowl!</div>')
              +'<button onclick="beginBlackMonday()" style="width:100%;font-weight:700;background:rgba(239,68,68,.12);border-color:#ef4444;color:#f87171">🔥 Black Monday →</button>';
          } else {
            var nr=window.playoffs?window.playoffs.rounds[window.playoffs.roundIdx]:'';
            div.innerHTML='<button onclick="renderHome()" style="width:100%;background:var(--surface2);border-color:var(--border);color:var(--muted2)">← Home · next: '+nr+'</button>';
          }
          main.appendChild(div);
        },80);
        return;
      }
      /* ── Playoffs done ───────────────────────────────── */
      if(window.gmPhase==='postseason'&&window.playoffs&&window.playoffs.done){closeDrawer();beginBlackMonday();return;}

      if (schedule && currentWeekIndex >= schedule.length) {
        closeDrawer();
        if (typeof beginAwardsPhase === 'function') { beginAwardsPhase(); return; }
        setMainContent('<div class="welcome-hero"><h2 style="color:var(--gold)">🏁 Season Complete</h2><button onclick="typeof renderAwards===\'function\'&&renderAwards()" style="margin-top:10px">🏆 View Awards</button><button onclick="typeof beginFreeAgencyPhase===\'function\'&&beginFreeAgencyPhase()" style="margin-top:8px">💼 Free Agency</button></div>');
        return;
      }
      var strat={
        offPlaybook:   (document.getElementById('offPlaybook')||{value:'West Coast'}).value,
        offensiveStyle:(document.getElementById('offStyle')||{value:'Balanced'}).value,
        defPlaybook:   (document.getElementById('defPlaybook')||{value:'4-3'}).value,
        defensiveStyle:(document.getElementById('defStyle')||{value:'Balanced'}).value,
      };
      var week=schedule[currentWeekIndex];
      simulateWeek(week,teamMap,strat,userTeamId);
      currentWeekIndex++; updateWeekLabel(); renderWeekResults(week); closeDrawer();
    });

    setTimeout(syncBtn, 150);
  });
})();
</script>

<script>

  /* ══════════════════════════════════════════════════════════

  window.renderPlayerStats = function () {

        +'<td>'+(s.rushingTD||0)+'</td>'
        +'<td>'+(s.receivingYards||0)+'</td>'
        +'<td>'+(s.receivingTD||0)+'</td>'
        +'<td>'+(s.tackles||0)+'</td>'
        +'<td>'+(s.sacks||0)+'</td>'
        +'<td>'+(s.interceptions||0)+'</td>'
        +'</tr>';
    }).join('');

    /* ── Kicker rows ── */
    var kickers = team.roster.filter(function(p){
      return p.positions.indexOf('K') !== -1;
    });
    var kickerSection = '';
    if (kickers.length) {
      var kRows = kickers.map(function(p){
        var s      = p.stats || {};
        var fgMade = s.fieldGoalsMade  || 0;
        var fgMiss = s.fieldGoalsMissed|| 0;
        var fgAtt  = fgMade + fgMiss;
        var fgPct  = fgAtt > 0 ? Math.round(fgMade / fgAtt * 100) : '—';
        var xpMade = s.xpMade  || 0;
        var xpMiss = s.xpMissed|| 0;
        var xpAtt  = xpMade + xpMiss;
        var xpPct  = xpAtt > 0 ? Math.round(xpMade / xpAtt * 100) : '—';
        var fgColor = (typeof fgPct === 'number') ? (fgPct >= 85 ? '#4ade80' : fgPct >= 75 ? '#facc15' : '#f87171') : 'var(--muted2)';
        var xpColor = (typeof xpPct === 'number') ? (xpPct >= 95 ? '#4ade80' : xpPct >= 85 ? '#facc15' : '#f87171') : 'var(--muted2)';
        return '<tr style="cursor:pointer" onclick="renderPlayerDetail(\''+p.id+'\')">'
          +'<td><span style="color:var(--accent2)">'+p.name+'</span></td>'

        +'</tr></thead><tbody>'+kRows+'</tbody></table>';

      +'<th>Rec Yds</th><th>Rec TD</th>'
      +'<th>Tackles</th><th>Sacks</th><th>INT(D)</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table>'
      + kickerSection
    );
  };

  /* ══════════════════════════════════════════════════════════
     PLAYER DETAIL SCREEN
     ════════════════════════════════════════════════════════ */
  window.renderPlayerDetail = function (playerId) {
    /* Find player across ALL teams */
    var found=null, foundTeam=null;
    listAllTeams(league).forEach(function(t){
      t.roster.forEach(function(p){ if(String(p.id)===String(playerId)){found=p;foundTeam=t;} });
    });

    var p=found, team=foundTeam, s=p.stats||{}, cs=p.careerStats||{}, a=p.attributes||{};
    var onMyTeam = team.id === activeTeamId();

    /* Attribute progress bar */
    function bar(label,val){

    var devColor=p.devTrait==='X-Factor'?'#c084fc':p.devTrait==='Superstar'?'#60a5fa':p.devTrait==='Star'?'#facc15':'var(--muted2)';
    var moraleC=(p.morale||70)>=80?'#4ade80':(p.morale||70)>=60?'#facc15':'#f87171';
    var contract=p.contract
      ?'<strong>$'+p.contract.capHitPerYear.toLocaleString()+'</strong>/yr · '+p.contract.years+' yr'+(p.contract.years!==1?'s':'')+' left'
      :'<em style="color:var(--muted)">Expiring</em>';

    var actions = onMyTeam
      ?'<div style="display:flex;gap:8px;margin-top:14px">'
        +'<button onclick="confirmCutPlayer(\''+p.id+'\')" style="flex:1;background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444;font-size:12px">✂ Cut</button>'
        +'<button onclick="window.renderTradeOffers&&window.renderTradeOffers(\''+p.id+'\')" style="flex:1;background:rgba(59,130,246,.15);border-color:#3b82f6;color:#60a5fa;font-size:12px">🔄 Trade</button>'
        +'</div>'
      :'<p style="font-size:11px;color:var(--muted);margin-top:10px">Not on your roster — view only.</p>';

    setMainContent(
      '<button onclick="renderRoster()" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Roster</button>'

      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'

        /* Identity card */
        +'<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">'

          +'</tbody></table>'
