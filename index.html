    var posCard = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">'
      + '<div style="font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);margin-bottom:6px">Overall by Position</div>'
      + '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Converting a player changes which attrs count toward their OVR.</div>'
      + posRows
      + '</div>';

    setMainContent(
      /* Back button */
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'

      /* Header */
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:700;color:var(--accent2);margin-bottom:2px">' + p.name + '</div>'
      + '<div style="font-size:12px;color:var(--muted2);margin-bottom:16px">' + p.positions.join(' / ') + ' · Age ' + p.age + ' · <span style="color:' + ovc(p.attributes.overall) + ';font-weight:600">OVR ' + p.attributes.overall + '</span></div>'

      /* Top row: composites + position OVR side-by-side */
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px">'
        + compCard
        + posCard
      + '</div>'

      /* Physical — full width */
      + groupCard('Physical', ATTR_GROUPS['Physical'])

      /* Specialist groups in two columns */
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
        + '<div>'
          + groupCard('Passing',      ATTR_GROUPS['Passing'])
          + groupCard('Ball Carrier', ATTR_GROUPS['Ball Carrier'])
          + groupCard('Receiving',    ATTR_GROUPS['Receiving'])
        + '</div>'
        + '<div>'
          + groupCard('Blocking',  ATTR_GROUPS['Blocking'])
          + groupCard('Defense',   ATTR_GROUPS['Defense'])
          + groupCard('Kicking',   ATTR_GROUPS['Kicking'])
        + '</div>'
      + '</div>'
    );
  };

  /* ── 8. Inject "Attributes" button into player detail page ── */

  var _origRPD_attrs = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _origRPD_attrs === 'function') _origRPD_attrs(playerId);

    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;

      /* Find the player */
      var p = null, onMyTeam = false;
      var tid = typeof activeTeamId === 'function' ? activeTeamId()
              : (typeof userTeamId !== 'undefined' ? userTeamId : null);
      listAllTeams(league).forEach(function(t){
        t.roster.forEach(function(x){
          if (String(x.id) === String(playerId)){
            p = x;
            if (tid && t.id === tid) onMyTeam = true;
          }
        });
      });
      if (!p) return;

      /* Pre-generate so OVR on the card is already position-specific */
      window.initGranularAttrs(p);

      /* Avoid double injection */
      if (main.querySelector('.attrs-btn')) return;

      var btn = document.createElement('button');
      btn.className = 'attrs-btn';
      btn.onclick   = function(){ window.renderAttributesScreen(playerId); };
      btn.style.cssText = 'flex:1;background:rgba(168,85,247,.15);border-color:#a855f7;color:#c084fc;font-size:12px';
      btn.textContent = '📊 Attributes';

      /* Find the Cut/Trade actions flex row */
      var actionsRow = null;
      main.querySelectorAll('div').forEach(function(div){
        if (div.style && div.style.display === 'flex'
            && div.style.gap === '8px'
            && div.style.marginTop === '14px') {
          var btns = div.querySelectorAll('button');
          var hasCut = false;
          btns.forEach(function(b){ if (b.textContent.indexOf('Cut') !== -1) hasCut = true; });
          if (hasCut) actionsRow = div;
        }
      });

      if (actionsRow) {
        actionsRow.appendChild(btn);
      } else {
        /* Player not on user's team — append under the "view only" message */
        main.querySelectorAll('p').forEach(function(el){
          if (el.textContent.indexOf('Not on your roster') !== -1) {
            var wrap = document.createElement('div');
            wrap.style.marginTop = '10px';
            wrap.appendChild(btn);
            el.parentNode.insertBefore(wrap, el.nextSibling);
          }
        });
      }
    }, 100); /* after re-sign patch (50ms) to ensure actionsRow is settled */
  };

  /* ── 9. Export shared functions for other scripts ─────────── */

  window.calcPosOVR      = calcPosOVR;
  window.POS_OVR         = POS_OVR;
  window.POS_BIAS        = POS_BIAS;
  window.ATTR_LABELS     = ATTR_LABELS;
  window.deriveComposites = deriveComposites;
  window.POS_OVR    = POS_OVR;

  /* ── 10. Init all players at startup ─────────────────────── */

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (typeof league === 'undefined' || !league) return;
      listAllTeams(league).forEach(function(t){
        t.roster.forEach(function(p){ window.initGranularAttrs(p); });
      });
      if (typeof freeAgents !== 'undefined') {
        freeAgents.forEach(function(p){ window.initGranularAttrs(p); });
      }
    }, 1000);
  });

})();
</script>

<script>
/* ============================================================
   EDIT POSITION SYSTEM
   Lets the user change a player's primary position from their
   profile page. OVR instantly recalculates using the granular
   attribute formulas specific to the new position.
   ============================================================ */
(function () {

  /* ── Position definitions shown to the user ─────────────── */

  var POSITIONS_DEF = [
    /* Offense */
    { pos:'QB',   label:'Quarterback',     unit:'offense' },
    { pos:'RB',   label:'Running Back',     unit:'offense' },
    { pos:'WR',   label:'Wide Receiver',    unit:'offense' },
    { pos:'TE',   label:'Tight End',        unit:'offense' },
    { pos:'T',    label:'Offensive Tackle', unit:'offense' },
    { pos:'G',    label:'Guard',            unit:'offense' },
    { pos:'C',    label:'Center',           unit:'offense' },
    /* Defense */
    { pos:'DT',   label:'Def. Tackle',       unit:'defense' },
    { pos:'EDGE', label:'Edge Rusher',      unit:'defense' },
    { pos:'LB',   label:'Linebacker',       unit:'defense' },
    { pos:'CB',   label:'Cornerback',       unit:'defense' },
    { pos:'SS',   label:'Strong Safety',    unit:'defense' },
    { pos:'FS',   label:'Free Safety',      unit:'defense' },
    /* Special Teams */
    { pos:'K',    label:'Kicker',           unit:'special'  },
    { pos:'P',    label:'Punter',           unit:'special'  }
  ];

  /* Unit colours */
  var UNIT_CLR = {
    offense: { bg:'rgba(22,163,74,.12)',  border:'#16a34a', text:'#4ade80'  },
    defense: { bg:'rgba(59,130,246,.12)', border:'#3b82f6', text:'#60a5fa'  },
    special: { bg:'rgba(245,158,11,.12)', border:'#f59e0b', text:'#fbbf24'  }
  };

  /* ── Add SS, FS, DL to the POS_OVR table once it exists ──── */

  function extendPosOVR() {
    var p = window.POS_OVR;
    if (!p) return;

    /* DL — same emphasis as DT but label shown as "DL" */
    if (!p.DL) p.DL = {
      blockShedding:20, powerMoves:20, strength:20,
      tackle:15, pursuit:10, awareness:10, stamina:5
    };

    /* SS — run-stopper safety, physical, box presence */
    if (!p.SS) p.SS = {
      tackle:25, hitPower:15, strength:15,
      manCoverage:15, playRecognition:15, speed:10, awareness:5
    };

    /* FS — coverage safety, deep zone, rangy */
    if (!p.FS) p.FS = {
      zoneCoverage:25, playRecognition:20, speed:15,
      awareness:15, manCoverage:10, tackle:10, agility:5
    };
  }

  /* ── Helper: locate player anywhere ────────────────────────  */

  function findPlayer(playerId) {
    var p = null;
    listAllTeams(league).forEach(function(t){
      t.roster.forEach(function(x){
        if (String(x.id) === String(playerId)) p = x;
      });
    });
    if (!p && typeof freeAgents !== 'undefined') {
      freeAgents.forEach(function(x){
        if (String(x.id) === String(playerId)) p = x;
      });
    }
    return p;
  }

  /* ── OVR colour helper ──────────────────────────────────────  */

  function ovc(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; }

  /* ── Render position-select screen ─────────────────────────  */

  window.renderEditPositionScreen = function (playerId) {
    extendPosOVR();

    var p = findPlayer(playerId);
    if (!p) return;

    var g      = window.initGranularAttrs(p);
    var curPos = p.positions[0];

    /* Build tile HTML for every position */
    var tiles = POSITIONS_DEF.map(function (def) {
      var isCurrent = (def.pos === curPos);
      var projOVR   = window.calcPosOVR ? window.calcPosOVR(g, def.pos) : p.attributes.overall;
      var clr       = UNIT_CLR[def.unit];

      return '<button onclick="window.applyPositionChange(\'' + playerId + '\',\'' + def.pos + '\')"'
        + ' style="'
          + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
          + 'gap:4px;padding:14px 8px;border-radius:10px;cursor:pointer;'
          + 'background:' + (isCurrent ? clr.bg : 'var(--surface2)') + ';'
          + 'border:2px solid ' + (isCurrent ? clr.border : 'var(--border)') + ';'
          + 'width:100%;margin:0;transition:border-color .15s,background .15s;'
        + '"'
        + ' onmouseover="this.style.borderColor=\'' + clr.border + '\';this.style.background=\'' + clr.bg + '\'"'
        + ' onmouseout="this.style.borderColor=\'' + (isCurrent ? clr.border : 'var(--border)') + '\';this.style.background=\'' + (isCurrent ? clr.bg : 'var(--surface2)') + '\'"'
        + '>'
          + '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:700;color:' + clr.text + ';line-height:1">'
            + def.pos
          + '</span>'
          + '<span style="font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;text-align:center;line-height:1.3">'
            + def.label
          + '</span>'
          + '<span style="font-size:14px;font-weight:700;color:' + ovc(projOVR) + ';margin-top:4px">'
            + projOVR
          + '</span>'
          + '<span style="font-size:9px;color:var(--muted);margin-top:-2px">proj OVR</span>'
          + (isCurrent ? '<span style="font-size:8px;font-weight:700;color:' + clr.text + ';letter-spacing:.5px;text-transform:uppercase;margin-top:2px">current</span>' : '')
        + '</button>';
    }).join('');

    /* Section separators */
    function sectionLabel(label) {
      return '<div style="grid-column:1/-1;font-family:\'Barlow Condensed\',sans-serif;font-size:10px;'
        + 'font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);'
        + 'padding:2px 0 4px;border-bottom:1px solid var(--border);margin-bottom:2px">'
        + label + '</div>';
    }

    /* Build grouped tile grid */
    var offenseTiles = POSITIONS_DEF.filter(function(d){ return d.unit==='offense'; });
    var defenseTiles = POSITIONS_DEF.filter(function(d){ return d.unit==='defense'; });
    var specialTiles = POSITIONS_DEF.filter(function(d){ return d.unit==='special';  });

    function tileRow(defs) {
      return defs.map(function(def){
        var isCurrent = (def.pos === curPos);
        /* For the current position, show actual OVR (matches roster).
           For other positions, show the projected OVR if attributes
           were redistributed to fit that position's demands.        */
        var projOVR   = isCurrent
          ? p.attributes.overall
          : (window.calcPosOVR ? window.calcPosOVR(g, def.pos) : p.attributes.overall);
        var clr       = UNIT_CLR[def.unit];
        return '<button onclick="window.applyPositionChange(\'' + playerId + '\',\'' + def.pos + '\')"'
          + ' style="'
            + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
            + 'gap:3px;padding:12px 6px;border-radius:10px;cursor:pointer;'
            + 'background:' + (isCurrent ? clr.bg : 'var(--surface2)') + ';'
            + 'border:2px solid ' + (isCurrent ? clr.border : 'var(--border)') + ';'
            + 'width:100%;margin:0'
          + '">'
            + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:' + clr.text + ';line-height:1">' + def.pos + '</div>'
            + '<div style="font-size:9px;color:var(--muted2);text-align:center;line-height:1.2">' + def.label + '</div>'
            + '<div style="font-size:14px;font-weight:700;color:' + ovc(projOVR) + ';margin-top:3px">' + projOVR + '</div>'
            + '<div style="font-size:9px;color:var(--muted)">proj OVR</div>'
            + (isCurrent ? '<div style="font-size:8px;font-weight:700;color:' + clr.text + ';letter-spacing:.5px">CURRENT</div>' : '')
          + '</button>';
      }).join('');
    }

    setMainContent(
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'

      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:700;color:var(--accent2);margin-bottom:2px">Edit Position — ' + p.name + '</div>'
      + '<div style="font-size:12px;color:var(--muted2);margin-bottom:4px">Current position: <strong style="color:var(--text)">' + curPos + '</strong> · Age ' + p.age + ' · OVR <strong>' + p.attributes.overall + '</strong></div>'
      + '<p style="font-size:12px;color:var(--muted);margin-bottom:18px">Each tile shows the projected OVR at that position using this player\'s existing attributes. Only skills relevant to the position count toward OVR.</p>'

      /* Offense row */
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#4ade80;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(22,163,74,.3)">⚔ Offense</div>'
      + '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px">'
        + tileRow(offenseTiles)
      + '</div>'

      /* Defense rows */
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#60a5fa;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(59,130,246,.3)">🛡 Defense</div>'
      + '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px">'
        + tileRow(defenseTiles)
      + '</div>'

      /* Special Teams */
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fbbf24;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(245,158,11,.3)">⭐ Special Teams</div>'
      + '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;max-width:240px">'
        + tileRow(specialTiles)
      + '</div>'
    );
  };

  /* ── Apply the position change ──────────────────────────────  */

  /* Map depth-chart slot labels to canonical roster position codes.
     LT / RT are just slot labels for Tackle (T).
     LG / RG are just slot labels for Guard (G).               */
  var SLOT_TO_POS = { LT:'T', RT:'T', LG:'G', RG:'G', DL:'DT' };

  window.applyPositionChange = function (playerId, newPos) {
    extendPosOVR();

    /* Normalise: LT/RT → T, LG/RG → G */
    newPos = SLOT_TO_POS[newPos] || newPos;

    var p = findPlayer(playerId);
    if (!p) return;

    var oldPos = p.positions[0];
    if (oldPos === newPos) {
      /* Already at that position — just go back */
      renderPlayerDetail(playerId);
      return;
    }

    /* Update primary position (keep secondary if it exists and differs) */
    p.positions[0] = newPos;

    /* Recalculate OVR for the new position using the canonical code */
    var g      = window.initGranularAttrs(p);
    var newOVR = window.calcPosOVR ? window.calcPosOVR(g, newPos) : p.attributes.overall;
    var oldOVR = p.attributes.overall;
    p.attributes.overall = newOVR;

    /* Log the transaction */
    if (typeof logTransaction === 'function') {
      var tid  = typeof activeTeamId === 'function' ? activeTeamId() : userTeamId;
      var team = getTeamById && tid ? getTeamById(tid) : null;
      var teamName = team ? team.city + ' ' + team.nickname : 'Team';
      logTransaction('Position Change',
        teamName + ' converted ' + p.name + ' from ' + oldPos + ' to ' + newPos,
        tid, p);
    }

    /* Brief confirmation flash, then return to player page */
    var ovc = function(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; };
    var delta  = newOVR - oldOVR;
    var deltaHtml = delta === 0 ? ''
      : ' <span style="color:' + (delta>0?'#4ade80':'#f87171') + ';font-size:14px">'
          + (delta>0?'+':'') + delta + '</span>';

    setMainContent(
      '<div class="welcome-hero" style="max-width:480px">'
      + '<h2 style="color:var(--accent2)">✅ Position Updated</h2>'
      + '<p style="font-size:14px;color:var(--text);margin-bottom:8px">'
        + '<strong>' + p.name + '</strong> has been converted from '
        + '<strong style="color:var(--muted2)">' + oldPos + '</strong> → '
        + '<strong style="color:var(--accent2)">' + newPos + '</strong>.'
      + '</p>'
      + '<p style="font-size:13px;color:var(--muted2);margin-bottom:4px">'
        + 'New OVR at <strong>' + newPos + '</strong>: '
        + '<strong style="color:' + ovc(newOVR) + ';font-size:16px">' + newOVR + '</strong>'
        + deltaHtml
      + '</p>'
      + '<p style="font-size:11px;color:var(--muted)">Only attributes relevant to ' + newPos + ' were used to calculate this rating.</p>'
      + '<div style="display:flex;gap:8px;margin-top:14px">'
        + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="flex:1;background:rgba(22,163,74,.15);border-color:var(--accent);color:var(--accent2);font-weight:600">← View Player</button>'
        + '<button onclick="window.renderEditPositionScreen(\'' + playerId + '\')" style="flex:1">🔄 Change Again</button>'
      + '</div>'
      + '</div>'
    );
  };

  /* ── Inject "Edit Position" button into player detail page ── */

  var _origRPD_pos = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _origRPD_pos === 'function') _origRPD_pos(playerId);

    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;

      /* Only for players on the user's team */
      var onMyTeam = false;
      var tid = typeof activeTeamId === 'function' ? activeTeamId()
              : (typeof userTeamId !== 'undefined' ? userTeamId : null);
      if (!tid) return;
      listAllTeams(league).forEach(function(t){
        if (t.id !== tid) return;
        t.roster.forEach(function(x){
          if (String(x.id) === String(playerId)) onMyTeam = true;
        });
      });
      if (!onMyTeam) return;

      /* Avoid double-injection */
      if (main.querySelector('.editpos-btn')) return;

      var btn = document.createElement('button');
      btn.className = 'editpos-btn';
      btn.onclick   = function(){ window.renderEditPositionScreen(playerId); };
      btn.style.cssText = 'flex:1;background:rgba(251,191,36,.15);border-color:#f59e0b;color:#fbbf24;font-size:12px';
      btn.textContent = '🏷 Edit Pos';

      /* Find the Cut/Trade actions flex row */
      var actionsRow = null;
      main.querySelectorAll('div').forEach(function(div){
        if (div.style && div.style.display === 'flex'
            && div.style.gap === '8px'
            && div.style.marginTop === '14px') {
          var btns = div.querySelectorAll('button');
          var hasCut = false;
          btns.forEach(function(b){ if (b.textContent.indexOf('Cut') !== -1) hasCut = true; });
          if (hasCut) actionsRow = div;
        }
      });

      if (actionsRow) actionsRow.appendChild(btn);
    }, 150); /* last in the chain: cut(0) → resign(50) → attrs(100) → pos(150) */
  };

})();
</script>

<script>
/* ============================================================
   DEPTH CHART v3 + OL SUB-POSITIONS + SS/FS SPLIT
   ─────────────────────────────────────────────────────────────
   1. Adds LT / LG / C / RG / RT to POS_OVR with distinct weights
   2. Updates Edit Position screen to show OL sub-position tiles
   3. Rebuilds renderDepthChart:
        • OL pool = any of OL/LT/LG/C/RG/RT, 5 starter slots
        • Safety split: SS group (1 starter) + FS group (1 starter)
        • DL pool  = DT + DL tagged players
   ============================================================ */
(function () {

  /* ── 1. OL sub-position POS_OVR formulas ─────────────────── */

  function extendOLPos() {
    var p = window.POS_OVR;
    if (!p) return;

    /* LT — blind-side pass protector; agility & footwork critical */
    if (!p.LT) p.LT = {
      passBlock:22, passBlockFootwork:22, passBlockStrength:18,
      agility:15, strength:13, awareness:10
    };

    /* RT — right tackle; balanced pass/run but more physical */
    if (!p.RT) p.RT = {
      passBlock:18, runBlock:18, passBlockStrength:16,
      runBlockStrength:16, strength:14, awareness:10, agility:8
    };

    /* LG — left guard; run-block dominant, still passes too */
    if (!p.LG) p.LG = {
      runBlock:20, passBlock:18, strength:18,
      runBlockStrength:16, passBlockStrength:14,
      runBlockFinesse:8, awareness:6
    };

    /* RG — right guard; same profile as LG */
    if (!p.RG) p.RG = {
      runBlock:20, passBlock:18, strength:18,
      runBlockStrength:16, passBlockStrength:14,
      runBlockFinesse:8, awareness:6
    };

    /* C — center; awareness above all (ID blitzes, snap counts) */
    if (!p.C) p.C = {
      awareness:28, passBlock:18, passBlockStrength:14,
      runBlock:14, strength:14, runBlockStrength:12
    };

    /* Ensure SS / FS / DL exist (also added by Edit Position script) */
    if (!p.SS) p.SS = {
      tackle:25, hitPower:15, strength:15,
      manCoverage:15, playRecognition:15, speed:10, awareness:5
    };
    if (!p.FS) p.FS = {
      zoneCoverage:25, playRecognition:20, speed:15,
      awareness:15, manCoverage:10, tackle:10, agility:5
    };
    if (!p.DL) p.DL = {
      blockShedding:20, powerMoves:20, strength:20,
      tackle:15, pursuit:10, awareness:10, stamina:5
    };
  }

  /* ── 2. Updated Edit Position screen (OL → 5 sub-positions) ─ */

  var OL_GROUP = [
    { pos:'LT', label:'Left Tackle',   unit:'offense' },
    { pos:'LG', label:'Left Guard',    unit:'offense' },
    { pos:'C',  label:'Center',        unit:'offense' },
    { pos:'RG', label:'Right Guard',   unit:'offense' },
    { pos:'RT', label:'Right Tackle',  unit:'offense' }
  ];

  var POSITIONS_DEF_v3 = [
    /* OL sub-positions */
    { pos:'LT',   label:'Left Tackle',   unit:'offense' },
    { pos:'LG',   label:'Left Guard',    unit:'offense' },
    { pos:'C',    label:'Center',        unit:'offense' },
    { pos:'RG',   label:'Right Guard',   unit:'offense' },
    { pos:'RT',   label:'Right Tackle',  unit:'offense' },
    /* Other offense */
    { pos:'QB',   label:'Quarterback',   unit:'offense' },
    { pos:'RB',   label:'Running Back',  unit:'offense' },
    { pos:'WR',   label:'Wide Receiver', unit:'offense' },
    { pos:'TE',   label:'Tight End',     unit:'offense' },
    /* Defense */
    { pos:'DT',   label:'Def. Tackle',  unit:'defense' },
    { pos:'EDGE', label:'Edge Rusher',   unit:'defense' },
    { pos:'LB',   label:'Linebacker',   unit:'defense' },
    { pos:'CB',   label:'Cornerback',   unit:'defense' },
    { pos:'SS',   label:'Strong Safety', unit:'defense' },
    { pos:'FS',   label:'Free Safety',  unit:'defense' },
    /* Special Teams */
    { pos:'K',    label:'Kicker',        unit:'special' },
    { pos:'P',    label:'Punter',        unit:'special' }
  ];

  var UNIT_CLR = {
    offense:{ bg:'rgba(22,163,74,.12)',  border:'#16a34a', text:'#4ade80'  },
    defense:{ bg:'rgba(59,130,246,.12)', border:'#3b82f6', text:'#60a5fa'  },
    special:{ bg:'rgba(245,158,11,.12)', border:'#f59e0b', text:'#fbbf24'  }
  };

  function ovc(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; }

  function findPlayer(playerId) {
    var p = null;
    listAllTeams(league).forEach(function(t){
      t.roster.forEach(function(x){ if (String(x.id)===String(playerId)) p = x; });
    });
    if (!p && typeof freeAgents !== 'undefined') {
      freeAgents.forEach(function(x){ if (String(x.id)===String(playerId)) p = x; });
    }
    return p;
  }

  window.renderEditPositionScreen = function (playerId) {
    extendOLPos();

    var p = findPlayer(playerId);
    if (!p) return;

    var g      = window.initGranularAttrs(p);
    var curPos = p.positions[0];

    function tileRow(defs) {
      return defs.map(function (def) {
        var isCurrent = (def.pos === curPos);
        /* Current position tile always shows the real OVR — no recalculation */
        var projOVR   = isCurrent
          ? p.attributes.overall
          : (window.calcPosOVR ? window.calcPosOVR(g, def.pos) : p.attributes.overall);
        var projLabel = isCurrent ? 'current OVR' : 'proj OVR';
        var clr       = UNIT_CLR[def.unit];
        return '<button onclick="window.applyPositionChange(\'' + playerId + '\',\'' + def.pos + '\')"'
          + ' style="display:flex;flex-direction:column;align-items:center;justify-content:center;'
          + 'gap:3px;padding:12px 6px;border-radius:10px;cursor:pointer;'
          + 'background:' + (isCurrent ? clr.bg : 'var(--surface2)') + ';'
          + 'border:2px solid ' + (isCurrent ? clr.border : 'var(--border)') + ';width:100%">'
            + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:' + clr.text + ';line-height:1">' + def.pos + '</div>'
            + '<div style="font-size:9px;color:var(--muted2);text-align:center;line-height:1.2">' + def.label + '</div>'
            + '<div style="font-size:14px;font-weight:700;color:' + ovc(projOVR) + ';margin-top:3px">' + projOVR + '</div>'
            + '<div style="font-size:9px;color:var(--muted)">' + projLabel + '</div>'
            + (isCurrent ? '<div style="font-size:8px;font-weight:700;color:' + clr.text + ';letter-spacing:.5px">CURRENT</div>' : '')
          + '</button>';
      }).join('');
    }

    function sect(icon, label, color, borderColor, defs, cols) {
      return '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:10px;font-weight:600;'
        + 'letter-spacing:1.5px;text-transform:uppercase;color:' + color + ';margin-bottom:8px;'
        + 'padding-bottom:4px;border-bottom:1px solid ' + borderColor + '">' + icon + ' ' + label + '</div>'
        + '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:8px;margin-bottom:16px">'
          + tileRow(defs)
        + '</div>';
    }

    /* OL shown as T / G / C — LT/RT/LG/RG are depth chart labels, not
       distinct positions. Converting to LT just makes you a Tackle (T). */
    var olDefs = [
      { pos:'T', label:'Tackle (LT/RT)', unit:'offense' },
      { pos:'G', label:'Guard (LG/RG)',  unit:'offense' },
      { pos:'C', label:'Center',         unit:'offense' },
    ];
    var offOther   = POSITIONS_DEF_v3.filter(function(d){ return ['QB','RB','WR','TE'].indexOf(d.pos)!==-1; });
    var defDefs    = POSITIONS_DEF_v3.filter(function(d){ return d.unit==='defense'; });
    var stDefs     = POSITIONS_DEF_v3.filter(function(d){ return d.unit==='special'; });

    setMainContent(
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'
      + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:700;color:var(--accent2);margin-bottom:2px">Edit Position — ' + p.name + '</div>'
      + '<div style="font-size:12px;color:var(--muted2);margin-bottom:4px">Current: <strong style="color:var(--text)">' + curPos + '</strong> · Age ' + p.age + ' · OVR <strong>' + p.attributes.overall + '</strong></div>'
      + '<p style="font-size:12px;color:var(--muted);margin-bottom:18px">Each tile shows this player\'s projected OVR using only the attributes that matter at that position.</p>'

      + sect('⚔','Offensive Line','#4ade80','rgba(22,163,74,.3)',   olDefs,   5)
      + sect('⚔','Other Offense', '#4ade80','rgba(22,163,74,.3)',   offOther, 4)
      + sect('🛡','Defense',       '#60a5fa','rgba(59,130,246,.3)', defDefs,  6)
      + sect('⭐','Special Teams', '#fbbf24','rgba(245,158,11,.3)', stDefs,   2)
    );
  };

  /* ── 3. Depth Chart v3 ───────────────────────────────────── */

  var OL_SLOTS  = ['LT','LG','C','RG','RT'];
  var LB_LBLS   = ['WILL','MIKE','SAM'];
  var EDGE_LBLS = ['LE','RE'];
  var CB_LBLS   = ['LC','RC','SlotC'];
  var WR_LBLS   = ['X','Y','Slot'];

  /* Positions that belong to the OL depth pool */
  var OL_POS_SET  = { OL:1, LT:1, LG:1, C:1, RG:1, RT:1 };
  /* Positions that belong to the DL depth pool */
  var DL_POS_SET  = { DT:1, DL:1 };
  /* Positions that belong to Safety pools */
  var SS_POS_SET  = { SS:1 };
  var FS_POS_SET  = { FS:1 };
  var S_POS_SET   = { S:1 };

  function _ovc(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; }

  function _tbadge(p) {
    var t = p.devTrait; if (!t || t==='Normal') return '';
    var c = t==='Star'?'dc-badge-star':t==='Superstar'?'dc-badge-ss':t==='X-Factor'?'dc-badge-xfactor':'';
    return c ? '<span class="dc-badge '+c+'">'+t+'</span>' : '';
  }

  function _dcRow(p, label, isStarter, canUp, canDown) {
    var ovr    = p.attributes ? p.attributes.overall : 70;
    var isSel  = window._dcSelectedId && String(window._dcSelectedId) === String(p.id);
    var hasSel = !!window._dcSelectedId && !isSel;
    var rc = (isStarter && label && label !== '●')
      ? '<span style="color:var(--accent2);font-size:9px;font-weight:700">'+label+'</span>'
      : isStarter
        ? '<span style="color:var(--accent2)">●</span>'
        : '<span style="color:var(--muted);font-size:11px">'+label+'</span>';
    var selStyle = isSel
      ? 'background:var(--accent-dim);border-left:3px solid var(--accent);cursor:pointer'
      : 'cursor:pointer' + (hasSel ? ';opacity:.80' : '');
    return '<div class="dc-row'+(isStarter?' dc-starter':'')+'" '
      + 'onclick="window.dcSelectPlayer(\''+p.id+'\')" style="'+selStyle+'">'
      + '<div class="dc-rank">'+rc+'</div>'
      + '<div class="dc-info">'
        + '<span class="dc-name">'+p.name+'</span>'
        + (isSel
            ? '<span class="dc-meta" style="color:var(--accent2);font-size:10px">✎ tap another to swap</span>'
            : '<span class="dc-meta" style="color:'+_ovc(ovr)+'">OVR '+ovr+'</span>')
      + '</div>'+_tbadge(p)
      + (isSel ? '<span style="color:var(--accent2);font-size:13px;padding:0 8px">✎</span>' : '')
    + '</div>';
  }

  /* OL row: shows slot label for starters; slot-projected OVR if they're a specific sub-pos */
  function _olRow(p, slotLabel, i, total) {
    var isStarter = i < 5;
    var baseOVR   = p.attributes ? p.attributes.overall : 70;
    /* If player has a specific OL sub-pos, show their real OVR (already slot-calculated).
       If they're generic "OL", show projected OVR at this slot in parentheses. */
    var posTag = p.positions[0];
    var showProj = (posTag === 'OL') && window.calcPosOVR && window.initGranularAttrs && window.POS_OVR && window.POS_OVR[slotLabel];
    var projOVR  = showProj ? window.calcPosOVR(window.initGranularAttrs(p), slotLabel) : null;

    var isSel  = window._dcSelectedId && String(window._dcSelectedId) === String(p.id);
    var hasSel = !!window._dcSelectedId && !isSel;

    var rc = isStarter
      ? '<span style="color:var(--accent2);font-size:9px;font-weight:700">'+slotLabel+'</span>'
      : '<span style="color:var(--muted);font-size:11px">'+(i+1)+'</span>';

    var ovrCell = '<span class="dc-meta" style="color:'+_ovc(baseOVR)+'">OVR '+baseOVR+'</span>';
    if (projOVR !== null) {
      ovrCell += '<span class="dc-meta" style="color:var(--muted2);font-size:10px;margin-left:4px">('+(projOVR>baseOVR?'<span style="color:#4ade80">+':'<span style="color:#f87171">'+(projOVR<baseOVR?'':''))+(projOVR-baseOVR)+' at '+slotLabel+'</span>)</span>';
    }

    var selStyle  = isSel
      ? 'background:var(--accent-dim);border-left:3px solid var(--accent);cursor:pointer'
      : hasSel ? 'cursor:pointer;opacity:0.85' : 'cursor:pointer';

    return '<div class="dc-row'+(isStarter?' dc-starter':'')+'" '
      + 'onclick="window.dcSelectPlayer(\''+p.id+'\')" '
      + 'style="'+selStyle+'">'
      + '<div class="dc-rank">'+rc+'</div>'
      + '<div class="dc-info">'
        + '<span class="dc-name">'+p.name+'</span>'
        + (isSel
            ? '<span class="dc-meta" style="color:var(--accent2);font-size:10px">✎ selected — tap another to swap</span>'
            : ovrCell)
      + '</div>'+_tbadge(p)
      + (isSel ? '<div style="color:var(--accent2);font-size:14px;padding:0 8px">✎</div>' : '')
    + '</div>';
  }

  function _dcFlexRow(p, fromPos) {
    var ovr = p.attributes ? p.attributes.overall : 70;
    return '<div class="dc-row" style="border-left:2px solid var(--gold);opacity:.85">'+
      '<div class="dc-rank"><span style="font-size:8px;color:var(--gold);font-weight:700">FLEX</span></div>'+
      '<div class="dc-info">'+
        '<span class="dc-name">'+p.name+'</span>'+
        '<span class="dc-meta" style="color:'+_ovc(ovr)+'">OVR '+ovr+
          ' <span style="color:var(--gold)">· '+fromPos+'</span></span>'+
      '</div>'+_tbadge(p)+
      '<div class="dc-arrows"><span class="dc-arr-ph"></span><span class="dc-arr-ph"></span></div>'+
    '</div>';
  }

  function _dcGrp(headerText, primaryPlayers, numStarters, labelArr, flexPlayers) {
    if (!primaryPlayers.length && !(flexPlayers && flexPlayers.length)) return '';
    var rows = primaryPlayers.map(function (p, i) {
      var s   = i < numStarters;
      var lbl = (s && labelArr && labelArr[i]) ? labelArr[i] : s ? '●' : String(i+1);
      return _dcRow(p, lbl, s, i > 0, i < primaryPlayers.length - 1);
    }).join('');
    if (flexPlayers && flexPlayers.length) {
      rows += flexPlayers.map(function(e){ return _dcFlexRow(e.p, e.fromPos); }).join('');
    }
    return '<div class="dc-group"><div class="dc-pos-header">'+headerText+'</div>'+rows+'</div>';
  }

  function _dcSect(lbl, h) {
    return h ? '<div class="dc-section-label">'+lbl+'</div><div class="dc-grid">'+h+'</div>' : '';
  }

  window.renderDepthChart = function () {
    extendOLPos();

    var tid  = document.getElementById('teamSelect') && document.getElementById('teamSelect').value;
    if (!tid) return;
    var team = getTeamById(tid); if (!team) return;
    if (typeof ensureDepthChart === 'function') ensureDepthChart(team);

    /* ── Pool buckets ── */
    var pools = { QB:[], RB:[], WR:[], TE:[], T:[], G:[], C:[], DT:[], EDGE:[], LB:[], CB:[], SS:[], FS:[], K:[], P:[] };
    var flex  = { QB:[], RB:[], WR:[], TE:[], T:[], G:[], C:[], DT:[], EDGE:[], LB:[], CB:[], SS:[], FS:[], K:[], P:[] };

    /* S-players: split by alternating depth rank into SS/FS buckets */
    var sPlayers = [];
    team.roster.forEach(function (p) {
      var pos = p.positions[0];
      if (S_POS_SET[pos]) sPlayers.push(p);
    });
    sPlayers.sort(function(a,b){ return (a.depthChartRank||999)-(b.depthChartRank||999); });
    sPlayers.forEach(function(p, i){
      (i % 2 === 0 ? pools['SS'] : pools['FS']).push(p);
    });

    team.roster.forEach(function (p) {
      var pos = p.positions[0];

      /* Primary bucket — route T/G/C and DT to their own groups */
      var primaryBucket =
          pos === 'T'  ? 'T'  :
          pos === 'G'  ? 'G'  :
          pos === 'C'  ? 'C'  :
          pos === 'DT' ? 'DT' :
          SS_POS_SET[pos] ? 'SS' :
          FS_POS_SET[pos] ? 'FS' :
          pos;
      if (pools[primaryBucket]) pools[primaryBucket].push(p);

      /* Secondary (flex) positions */
      for (var i = 1; i < p.positions.length; i++) {
        var sp = p.positions[i];
        var targetBucket =
          sp === 'T'  ? 'T'  :
          sp === 'G'  ? 'G'  :
          sp === 'C'  ? 'C'  :
          sp === 'DT' ? 'DT' :
          SS_POS_SET[sp]  ? 'SS' :
          FS_POS_SET[sp]  ? 'FS' :
          S_POS_SET[sp]   ? 'SS' :
          sp;
        if (flex[targetBucket]) flex[targetBucket].push({ p:p, fromPos:pos });
      }
    });

    /* Sort all pools by depth chart rank */
    Object.keys(pools).forEach(function(k){
      pools[k].sort(function(a,b){ return (a.depthChartRank||999)-(b.depthChartRank||999); });
    });

    /* ── OL: three separate tiles — T, G, C ─────────────────────── */
    var olHtml =
      _dcGrp('T — LT / RT',   pools['T']||[],  2, ['LT','RT'],  flex['T']||[]) +
      _dcGrp('G — LG / RG',   pools['G']||[],  2, ['LG','RG'],  flex['G']||[]) +
      _dcGrp('C',             pools['C']||[],  1, [],            flex['C']||[]);

    var sn = team.dc && team.dc.scheme ? ' · Scheme: '+team.dc.scheme : '';

    var offHtml =
      _dcGrp('QB',                         pools['QB'],   1, [],         flex['QB'])  +
      olHtml                                                                            +
      _dcGrp('RB',                         pools['RB'],   1, [],         flex['RB'])  +
      _dcGrp('WR — X / Y / Slot',          pools['WR'],   3, WR_LBLS,   flex['WR'])  +
      _dcGrp('TE',                         pools['TE'],   1, [],         flex['TE']);

    var defHtml =
      _dcGrp('EDGE — LE / RE',             pools['EDGE'], 2, EDGE_LBLS, flex['EDGE'])+
      _dcGrp('DT — Defensive Tackle',      pools['DT']||[], 2, [],       flex['DT']||[])  +
      _dcGrp('LB — WILL / MIKE / SAM',     pools['LB'],   3, LB_LBLS,   flex['LB'])  +
      _dcGrp('CB — LC / RC / SlotC',       pools['CB'],   3, CB_LBLS,   flex['CB'])  +
      _dcGrp('SS — Strong Safety',         pools['SS'],   1, ['SS'],    flex['SS'])  +
      _dcGrp('FS — Free Safety',           pools['FS'],   1, ['FS'],    flex['FS']);

    var stHtml =
      _dcGrp('K',                          pools['K'],    1, [],         flex['K'])   +
      _dcGrp('P',                          pools['P'],    1, [],         flex['P']);

    setMainContent(
      '<h2>'+team.city+' '+team.nickname+' — Depth Chart</h2>'+
      '<p class="small" style="margin-bottom:14px">'+
        '● = starter &nbsp;|&nbsp; ▲▼ = reorder &nbsp;|&nbsp; '+
        '<span style="color:var(--gold)">FLEX</span> = secondary position'+sn+
      '</p>'+
      _dcSect('Offense',       offHtml)+
      _dcSect('Defense',       defHtml)+
      _dcSect('Special Teams', stHtml)
    );
  };

})();
</script>

<script>
/* ============================================================
   IN-SEASON FREE AGENT SIGNING
   Removes the season-phase block so the user can sign free
   agents at any time during the regular season.

   What changes:
   • renderFreeAgencyScreen — always shows full offer buttons;
     banner text differs between in-season and offseason so
     the user knows what's happening
   • submitContractOffer / renderNegotiationScreen — unblocked
     in-season (cpuOffersForPlayer already returns [] during
     the season, so the user's offer is automatically the best;
     the player just evaluates salary vs market value)

   What stays gated to offseason:
   • simulateFullFreeAgency — CPU wave signing (only relevant
     after the season when new FAs flood the market)
   • cpuOffersForPlayer — returns [] during season (user faces
     no competition for in-season pool pickups)
   ============================================================ */
(function () {

  /* ── Helpers ──────────────────────────────────────────────── */

  function ovc(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; }

  function weeksRemaining() {
    if (typeof schedule === 'undefined' || !schedule) return null;
    return Math.max(0, schedule.length - (currentWeekIndex || 0));
  }

  /* ── In-season banner ─────────────────────────────────────── */

  function inSeasonBanner() {
    var wk = weeksRemaining();
    var wkStr = wk !== null
      ? (wk > 0 ? wk + ' week' + (wk !== 1 ? 's' : '') + ' left in the season.' : 'Season complete.')
      : '';
    return '<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.4);'
      + 'border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px">'
      + '<span style="font-size:20px;line-height:1.4">🏈</span>'
      + '<div style="flex:1">'
        + '<div style="font-weight:600;color:#4ade80;font-size:13px">Mid-Season Free Agency</div>'
        + '<div style="font-size:11px;color:var(--muted2);margin-top:3px;line-height:1.5">'
          + 'Sign available free agents now — no CPU teams are competing for mid-season pickups. '
          + 'Cap space and the player\'s market value still apply. '
          + (wkStr ? '<br>' + wkStr + ' New free agents (expiring contracts) join the pool at season end.' : '')
        + '</div>'
        + '<button onclick="window.renderQuickRoster()" '
        + 'style="margin-top:10px;width:auto;padding:5px 12px;font-size:11px;'
        + 'background:rgba(59,130,246,.15);border-color:#3b82f6;color:#60a5fa">'
        + '👥 My Roster</button>'
      + '</div>'
    + '</div>';
  }

  /* ── Offseason banner ─────────────────────────────────────── */

  function offseasonBanner() {
    return '<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.4);'
      + 'border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px">'
      + '<span style="font-size:20px;line-height:1.4">🏆</span>'
      + '<div>'
        + '<div style="font-weight:600;color:#fbbf24;font-size:13px">Offseason Free Agency</div>'
        + '<div style="font-size:11px;color:var(--muted2);margin-top:3px;line-height:1.5">'
          + 'All 32 teams are competing for free agents. CPU teams will also submit offers — '
          + 'pay above market value or sweeten the deal to win the bidding.'
        + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
        + '<button onclick="beginDraftPhase()" style="background:var(--accent-dim);'
        + 'border-color:var(--accent);color:var(--accent2);font-weight:600;width:auto;padding:6px 14px;font-size:12px">'
        + '🎯 Close Free Agency &amp; Begin Draft →</button>'
        + '<button onclick="window.renderQuickRoster()" '
        + 'style="width:auto;padding:6px 14px;font-size:12px;'
        + 'background:rgba(59,130,246,.15);border-color:#3b82f6;color:#60a5fa">'
        + '👥 My Roster</button>'
        + '</div>'
      + '</div>'
    + '</div>';
  }

  /* ── Rebuild renderFreeAgencyScreen — always allows signing ─ */

  window.renderFreeAgencyScreen = function () {
    if (typeof freeAgents === 'undefined') return;
    if (!freeAgents.length && typeof generateFreeAgentPool === 'function') {
      generateFreeAgentPool();
    }

    var isOffseason = (window.gmPhase === 'offseason');
    var pool = freeAgents
      .slice()
      .sort(function (a, b) { return b.attributes.overall - a.attributes.overall; });

    var rows = pool.map(function (p) {
      var mv  = typeof calculateMarketValue === 'function' ? calculateMarketValue(p) : { capHitPerYear: 0, years: 1 };
      var ovr = p.attributes ? p.attributes.overall : 70;
      var dev = (p.devTrait && p.devTrait !== 'Normal')
        ? ' <span style="font-size:9px;color:#facc15">' + p.devTrait + '</span>' : '';
      var age = p.age || '—';
      var capHit = mv.capHitPerYear ? '$' + mv.capHitPerYear.toLocaleString() + '/yr' : '—';

      /* Offer button — always active now */
      var offerBtn = '<button onclick="renderNegotiationScreen(\'' + p.id + '\')" '
        + 'style="font-size:11px;padding:4px 10px;background:rgba(34,197,94,.15);'
        + 'border-color:var(--accent);color:var(--accent2)">Sign</button>';

      return '<tr>'
        + '<td>' + p.name + dev + '</td>'
        + '<td>' + p.positions[0] + '</td>'
        + '<td>' + age + '</td>'
        + '<td style="color:' + ovc(ovr) + ';font-weight:600">' + ovr + '</td>'
        + '<td>' + capHit + '</td>'
        + '<td>' + offerBtn + '</td>'
        + '</tr>';
    }).join('');

    var emptyMsg = '<p style="color:var(--muted2);font-size:13px">No free agents currently available.</p>';

    setMainContent(
      '<h2>Free Agents</h2>'
      + (isOffseason ? offseasonBanner() : inSeasonBanner())
      + (pool.length
        ? '<table><thead><tr>'
            + '<th>Name</th><th>Pos</th><th>Age</th><th>OVR</th><th>Est. Value</th><th>Sign</th>'
          + '</tr></thead><tbody>' + rows + '</tbody></table>'
        : emptyMsg)
    );
  };

  /* ── Unblock submitContractOffer in-season ────────────────── */

  var _origSCO = window.submitContractOffer;
  window.submitContractOffer = function (playerId) {
    /* Always defer to the real function — cpuOffersForPlayer
       already returns [] in-season, so the user's offer wins
       automatically and the player just evaluates salary.      */
    if (typeof _origSCO === 'function') _origSCO(playerId);
  };

  /* ── Unblock renderNegotiationScreen in-season ────────────── */

  var _origRNS = window.renderNegotiationScreen;
  window.renderNegotiationScreen = function (playerId) {
    /* Find player in FA pool */
    var p = null;
    if (typeof freeAgents !== 'undefined') {
      freeAgents.forEach(function (x) { if (String(x.id) === String(playerId)) p = x; });
    }
    if (!p) { renderFreeAgencyScreen(); return; }

    var mv = typeof calculateMarketValue === 'function'
      ? calculateMarketValue(p) : { capHitPerYear: 500000, years: 2 };

    var isOffseason = (window.gmPhase === 'offseason');
    var competitionNote = isOffseason
      ? '<div style="font-size:11px;color:#fbbf24;margin-bottom:10px">⚠️ CPU teams are also interested — offer above market value to win.</div>'
      : '<div style="font-size:11px;color:#4ade80;margin-bottom:10px">✅ No competing offers mid-season — player evaluates your offer alone.</div>';

    /* Set negotiation state for round-2 logic */
    if (typeof negotiationState !== 'undefined') {
      negotiationState.player = p;
      negotiationState.round  = 1;
    } else {
      window.negotiationState = { player: p, round: 1 };
    }

    setMainContent(
      '<h2>Offer Contract — ' + p.name + '</h2>'
      + '<p class="small" style="margin-bottom:4px">Position: <strong>' + p.positions[0] + '</strong>'
        + ' · Age: <strong>' + (p.age||'—') + '</strong>'
        + ' · OVR: <strong style="color:' + ovc(p.attributes.overall) + '">' + p.attributes.overall + '</strong></p>'
      + '<p class="small" style="margin-bottom:12px">Market value: <strong>$' + mv.capHitPerYear.toLocaleString() + '/yr</strong></p>'
      + competitionNote

      + '<label style="display:block;margin-bottom:4px">Years:</label>'
      + '<select id="negYears" style="margin-bottom:12px;width:100%;max-width:240px">'
        + '<option value="1">1 year</option>'
        + '<option value="2" selected>2 years</option>'
        + '<option value="3">3 years</option>'
        + '<option value="4">4 years</option>'
      + '</select>'

      + '<label style="display:block;margin-bottom:4px">Salary per year ($):</label>'
      + '<input id="negSalary" type="number" value="' + mv.capHitPerYear + '" '
        + 'style="margin-bottom:14px;width:100%;max-width:240px" />'

      + '<div style="display:flex;gap:8px;margin-top:4px">'
        + '<button onclick="submitNegotiationOffer()" '
          + 'style="flex:1;max-width:180px;background:rgba(34,197,94,.15);border-color:var(--accent);color:var(--accent2);font-weight:600">'
          + 'Submit Offer'
        + '</button>'
        + '<button onclick="renderFreeAgencyScreen()" style="flex:1;max-width:180px">Cancel</button>'
      + '</div>'
    );
  };

  /* ── Wire the sidebar button (always open FA screen) ─────── */

  window.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('btnFreeAgency');
    if (btn) {
      /* Replace any prior listeners by cloning */
      var fresh = btn.cloneNode(true);
      btn.parentNode.replaceChild(fresh, btn);
      fresh.addEventListener('click', function () {
        closeDrawer && closeDrawer();
        renderFreeAgencyScreen();
      });
    }
  });

})();
</script>

<script>
/* ============================================================
   PROGRESSION / REGRESSION BUG FIX

   Root cause 1 — initGranularAttrs overwrites player.attributes.overall
   ─────────────────────────────────────────────────────────────────────
   When a player's granular attributes are generated for the first time
   (at page load or new-game start), calcPosOVR() is called and the
   result is written back to player.attributes.overall.  Because the
   granular attrs are generated with a random spread, calcPosOVR rarely
   returns exactly the same number as the original OVR.  The player
   therefore appears to gain or lose rating points before a single game
   has been simulated.

   Fix: wrap window.initGranularAttrs so the original OVR is preserved
   after the first-time generation.  OVR is still recalculated by
   applyPositionChange() when the user explicitly changes a position.

   Root cause 2 — age regression fires even when gamesPlayed = 0
   ─────────────────────────────────────────────────────────────
   progressTeamWeek() applies age regression (−1 OVR chance for
   players aged 30+) on every call to simulateWeek().  For backups
   or players on bye, gamesPlayed may still be 0 when the function
   runs, meaning they can regress without ever seeing the field.

   Fix: wrap simulateWeek to skip age regression for any player whose
   gamesPlayed hasn't increased since the last call.  We do this by
   patching progressTeamWeek to gate the regression roll on whether
   the player has played at least 1 game in the season.
   ============================================================ */
(function () {

  /* ── Fix 1: preserve OVR through initGranularAttrs ────────── */

  var _origIGA = window.initGranularAttrs;
  window.initGranularAttrs = function (player) {
    /* If granularAttrs already exist, just return them — no change */
    if (player.granularAttrs) return player.granularAttrs;

    /* Save the current OVR before generation overwrites it */
    var savedOVR = player.attributes ? player.attributes.overall : undefined;

    var g = _origIGA(player);   /* generates granular attrs + recalcs OVR */

    /* Restore original OVR — granular generation must not move the needle.
       OVR is intentionally recalculated ONLY when the user explicitly
       changes position via applyPositionChange().                         */
    if (savedOVR !== undefined && player.attributes) {
      player.attributes.overall = savedOVR;
    }

    return g;
  };

  /* ── Fix 2: gate age regression on gamesPlayed > 0 ────────── */

  /* We intercept the outer simulateWeek wrapper and, after the week
     runs, scan every team for players whose gamesPlayed is still 0 and
     undo any OVR drop that the progression logic may have applied.
     This is a safety-net approach: it works regardless of how many
     layers wrap simulateWeek.                                           */

  var _origSW2 = window.simulateWeek;
  window.simulateWeek = function (week, teamMap, userStrategy, uid) {

    /* Snapshot OVR for every player with gamesPlayed = 0 BEFORE the sim */
    var snapshots = {};
    if (typeof league !== 'undefined' && league && typeof listAllTeams === 'function') {
      listAllTeams(league).forEach(function (team) {
        team.roster.forEach(function (p) {
          if (!p.stats || !p.stats.gamesPlayed) {
            /* Player hasn't played yet — freeze their OVR */
            snapshots[p.id] = p.attributes ? p.attributes.overall : null;
          }
        });
      });
    }

    /* Run the real simulateWeek (which includes stats + progression) */
    if (typeof _origSW2 === 'function') _origSW2(week, teamMap, userStrategy, uid);

    /* After the sim: restore OVR for players who STILL haven't played */
    if (typeof league !== 'undefined' && league && typeof listAllTeams === 'function') {
      listAllTeams(league).forEach(function (team) {
        team.roster.forEach(function (p) {
          if (snapshots[p.id] !== undefined
              && snapshots[p.id] !== null
              && (!p.stats || !p.stats.gamesPlayed)
              && p.attributes) {
            /* Still 0 games — undo any regression the progression applied */
            p.attributes.overall = snapshots[p.id];
          }
        });
      });
    }
  };

})();
</script>

<script>
/* ============================================================
   PATCH — COACHING SYSTEM COMPREHENSIVE FIX

   Bugs fixed:
   1. simulateGame scheme hook used wrong signature & expected
      return value that never existed. Replaced with direct
      power rating modifier applied inside simulateGame.
   2. developOC/DC/HC received undefined gameStats — now reads
      from player stats accumulated on the team after a game.
   3. runBlackMonday never called updateCoachJobSecurityAfterSeason
      so coaches almost never got fired. Fixed order.
   4. contractRemaining was never decremented each season.
   5. Black Monday now has a full interactive UI where the user
      can fire/keep their own coach and hire a replacement.
   6. calculateTeamGameModifier null-safety throughout.
   7. Coordinators re-initialized on save/load.
   ============================================================ */
(function () {

  /* ── Null-safe scheme/coordinator helpers ───────────────── */
  function safeOC(team) {
    if (!team.oc) {
      team.oc = { name:'Unknown OC', offenseRating:70, scheme:'Balanced', jobSecurity:60 };
    }
    return team.oc;
  }
  function safeDC(team) {
    if (!team.dc) {
      team.dc = { name:'Unknown DC', defenseRating:70, scheme:'4-3', jobSecurity:60 };
    }
    return team.dc;
  }
  function safeCoach(team) {
    if (!team.coach) {
      team.coach = { name:'Unknown HC', offenseRating:70, defenseRating:70,
                     leadership:70, jobSecurity:60, contractRemaining:2 };
    }
    if (team.coach.contractRemaining === undefined) team.coach.contractRemaining = 2;
    if (team.coach.jobSecurity === undefined) team.coach.jobSecurity = 60;
    return team.coach;
  }

  /* ── Fix 1: Apply scheme + coordinator boosts directly to
     simulateGame's power ratings instead of hooking a broken
     return-value API.                                         */
  function coachingPowerBoost(team) {
    var oc    = safeOC(team);
    var dc    = safeDC(team);
    var coach = safeCoach(team);
    var chem  = typeof getTeamChemistryOVRModifier === 'function'
                ? getTeamChemistryOVRModifier(team) : 0;

    var offBoost = Math.floor((oc.offenseRating - 75) / 4);
    var defBoost = Math.floor((dc.defenseRating - 75) / 4);
    var leadBoost = Math.floor((coach.leadership - 75) / 6);

    /* Scheme fit: average of top-12 starters' fit scores */
    var fitScore = 0;
    if (team.roster && team.roster.length && typeof calculateSchemeFit === 'function') {
      var starters = team.roster.slice(0, 22);
      fitScore = Math.floor(
        starters.reduce(function(s,p){ return s + calculateSchemeFit(p,team); }, 0)
        / starters.length / 20    /* map 50-100 fit → roughly -1 to +2 */
        - 2.5
      );
    }

    return offBoost + defBoost + leadBoost + fitScore + chem;
  }

  /* Patch simulateGame to apply coaching boost to powerRatings */
  var _origSG = window.simulateGame;
  window.simulateGame = function(game, teamMap, userStrategy, userTeamId) {
    /* Temporarily bump power ratings, run sim, restore */
    if (teamMap && game) {
      var home = teamMap[game.homeTeamId];
      var away = teamMap[game.awayTeamId];
      if (home && away) {
        var hBoost = coachingPowerBoost(home);
        var aBoost = coachingPowerBoost(away);
        home.powerRating += hBoost;
        away.powerRating += aBoost;
        try {
          if (typeof _origSG === 'function') _origSG(game, teamMap, userStrategy, userTeamId);
        } finally {
          home.powerRating -= hBoost;
          away.powerRating -= aBoost;
        }
        return;
      }
    }
    if (typeof _origSG === 'function') _origSG(game, teamMap, userStrategy, userTeamId);
  };

  /* ── Fix 2: Coach development — read from team player stats ── */
  function teamOffensiveStats(team) {
    var qb = (team.roster || []).find(function(p){ return p.positions[0]==='QB'; });
    var s  = qb ? (qb.stats || {}) : {};
    return {
      passYds     : s.passingYards   || 0,
      passTD      : s.passingTD      || 0,
      rushYds     : (team.teamStats || {}).totalOffenseYards || 0,
      rushTD      : 0,
      ptsAllowed  : team.pointsAgainst || 0,
      sacks       : (team.roster||[]).reduce(function(n,p){return n+(p.stats||{}).sacks||0;},0),
      turnovers   : (team.teamStats||{}).turnoversForced || 0,
      yardsAllowed: (team.teamStats||{}).totalDefenseYards || 0,
      margin      : (team.pointsFor||0)-(team.pointsAgainst||0),
    };
  }

  function runCoachDevelopmentForAllTeams() {
    if (typeof league === 'undefined' || !league) return;
    listAllTeams(league).forEach(function(team) {
      var stats  = teamOffensiveStats(team);
      var didWin = (team.wins||0) > (team.losses||0);
      if (typeof developOC === 'function')         developOC(team, stats);
      if (typeof developDC === 'function')         developDC(team, stats);
      if (typeof developHeadCoach === 'function')  developHeadCoach(team, stats, didWin);
    });
  }

  /* ── Fix 3 & 4: runBlackMonday — update job security FIRST,
     decrement contracts, then evaluate firings.              */
  window.runBlackMonday = function() {
    if (typeof league === 'undefined' || !league) return [];
    var teams   = listAllTeams(league);
    var firings = [];

    /* Run coach development end-of-season */
    runCoachDevelopmentForAllTeams();

    /* Apply scheme fit effects */
    if (typeof applySchemeFitMoraleEffects === 'function')
      teams.forEach(function(t){ applySchemeFitMoraleEffects(t); });
    if (typeof applySchemeFitChemistryEffects === 'function')
      teams.forEach(function(t){ applySchemeFitChemistryEffects(t); });

    /* Build candidate pool */
    if (typeof buildHeadCoachCandidatePool === 'function') buildHeadCoachCandidatePool();

    teams.forEach(function(team) {
      var hc = safeCoach(team);

      /* Decrement contract */
      hc.contractRemaining = Math.max(0, (hc.contractRemaining || 1) - 1);

      /* Update job security BEFORE firing decision */
      if (typeof updateCoachJobSecurityAfterSeason === 'function')
        updateCoachJobSecurityAfterSeason(team);

      /* Skip if contract protected and job security OK */
      if (hc.contractRemaining > 0 && hc.jobSecurity > 30) return;

      /* Evaluate whether to fire */
      var shouldFire = typeof evaluateCoachFiring === 'function'
        ? evaluateCoachFiring(team)
        : hc.jobSecurity <= 25;

      if (shouldFire) {
        firings.push({ team: team, coach: Object.assign({}, hc) });
        if (typeof logTransaction === 'function')
          logTransaction('Coach Firing',
            team.city+' '+team.nickname+' fired '+hc.name, team.id, null);
        coachFreeAgents.push({
          id: 'cfa_' + team.id,
          name: hc.name,
          offenseRating: hc.offenseRating,
          defenseRating: hc.defenseRating,
          leadership: hc.leadership,
          style: hc.offenseRating >= hc.defenseRating ? 'Offensive' : 'Defensive',
        });
        /* CPU teams auto-hire; user team waits for user input */
        if (team.id !== userTeamId) {
          if (typeof cpuHireHeadCoach === 'function') cpuHireHeadCoach(team);
        }
      }
    });

    /* Poach coordinators for CPU teams */
    if (typeof cpuPoachCoordinators === 'function') cpuPoachCoordinators();

    return firings;
  };

  /* ── Fix 5: Black Monday UI with user interaction ────────── */
  window.beginBlackMonday = function() {
    window.gmPhase = 'postseason';
    var firings = window.runBlackMonday();

    /* Separate user's team firing from CPU firings */
    var userFired = firings.find(function(f){ return f.team.id === userTeamId; });
    var cpuFired  = firings.filter(function(f){ return f.team.id !== userTeamId; });

    var userTeam  = typeof getTeamById === 'function' ? getTeamById(userTeamId) : null;
    var hc        = userTeam ? safeCoach(userTeam) : null;

    /* Build CPU firings summary */
    var cpuRows = cpuFired.length ? cpuFired.map(function(f) {
      var newHC = safeCoach(f.team);
      return '<tr>'
        + '<td>'+f.team.city+' '+f.team.nickname+'</td>'
        + '<td style="color:#f87171">'+f.coach.name+' fired</td>'
        + '<td style="color:#4ade80">'+newHC.name+' hired</td>'
        + '</tr>';
    }).join('') : '<tr><td colspan="3" style="color:var(--muted2);text-align:center">No CPU coach changes</td></tr>';

    /* User coaching status */
    var userSection;
    if (userFired) {
      /* User's coach was automatically fired — must hire replacement */
      userSection =
        '<div style="background:rgba(239,68,68,.12);border:1px solid #ef4444;'
        + 'border-radius:10px;padding:16px;margin-bottom:14px">'
        + '<div style="font-size:15px;font-weight:700;color:#f87171;margin-bottom:6px">'
        + '🔥 Your coach was fired</div>'
        + '<p style="font-size:13px;color:var(--muted2);margin:0 0 12px">'
        + hc.name+' has been let go after a '+userTeam.wins+'-'+userTeam.losses+' season. '
        + 'Job security reached '+(userFired.coach.jobSecurity||0)+'.</p>'
        + '<button onclick="renderUserCoachHire()" '
        + 'style="background:var(--accent-dim);border-color:var(--accent);'
        + 'color:var(--accent2);font-weight:600">👔 Hire New Head Coach →</button>'
        + '</div>';
    } else if (userTeam && hc) {
      var js = hc.jobSecurity || 60;
      var jsColor = js >= 70 ? '#4ade80' : js >= 45 ? '#facc15' : '#f87171';
      userSection =
        '<div style="background:var(--surface);border:1px solid var(--border);'
        + 'border-radius:10px;padding:16px;margin-bottom:14px">'
        + '<div style="font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:8px">'
        + 'Your Coaching Staff</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'

        /* HC card */
        + '<div style="background:var(--surface2);border-radius:8px;padding:10px">'
        + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Head Coach</div>'
        + '<div style="font-weight:600">'+hc.name+'</div>'
        + '<div style="font-size:11px;color:var(--muted2)">Off: '+hc.offenseRating+' | Def: '+hc.defenseRating+' | Lead: '+hc.leadership+'</div>'
        + '<div style="font-size:11px;margin-top:4px">Job Security: <span style="font-weight:700;color:'+jsColor+'">'+js+'</span>'
        + ' | Contract: '+(hc.contractRemaining||0)+' yr left</div>'
        + '</div>'

        /* OC card */
        + '<div style="background:var(--surface2);border-radius:8px;padding:10px">'
        + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Coordinators</div>'
        + '<div style="font-size:12px"><strong>OC:</strong> '+(userTeam.oc?userTeam.oc.name:'—')+'</div>'
        + '<div style="font-size:11px;color:var(--muted2)">'+(userTeam.oc?userTeam.oc.scheme:'—')+'</div>'
        + '<div style="font-size:12px;margin-top:4px"><strong>DC:</strong> '+(userTeam.dc?userTeam.dc.name:'—')+'</div>'
        + '<div style="font-size:11px;color:var(--muted2)">'+(userTeam.dc?userTeam.dc.scheme:'—')+'</div>'
        + '</div>'
        + '</div>'

        /* Action buttons */
        + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
        + '<button onclick="renderUserCoachHire()" style="flex:1;font-size:12px;background:rgba(239,68,68,.12);border-color:#ef4444;color:#f87171">🔥 Fire &amp; Hire HC</button>'
        + '<button onclick="renderUserOCHire()" style="flex:1;font-size:12px">👔 Change OC</button>'
        + '<button onclick="renderUserDCHire()" style="flex:1;font-size:12px">🛡 Change DC</button>'
        + '<button onclick="if(window.gmPhase===\'offseason\'||window.gmPhase===\'postseason\')beginFreeAgencyPhase();else{if(typeof _toast===\'function\')_toast(\'⚠ Free Agency opens after the season\',false);}" style="flex:1;min-width:140px;font-size:12px;background:var(--accent-dim);border-color:var(--accent);color:var(--accent2);font-weight:600">💼 Open Free Agency →</button>'
        + '</div>'
        + '</div>';
    } else {
      userSection = '';
    }

    var html =
      '<h2>🔥 Black Monday</h2>'
      + '<p class="small">Season review complete. Coaching changes have been processed.</p>'
      + userSection
      + '<h3>League-Wide Coaching Changes</h3>'
      + (cpuFired.length
        ? '<table><thead><tr><th>Team</th><th>Departure</th><th>Arrival</th></tr></thead>'
          + '<tbody>'+cpuRows+'</tbody></table>'
        : '<p class="small" style="color:var(--muted2)">No other coaching changes this offseason.</p>');

    setMainContent(html);
  };

  /* ── User HC hire screen ──────────────────────────────────── */
  window.renderUserCoachHire = function() {
    if (typeof coachFreeAgents === 'undefined') { coachFreeAgents = []; }
    if (typeof generateCoachFreeAgents === 'function' && coachFreeAgents.length < 5)
      generateCoachFreeAgents();

    var rows = coachFreeAgents.slice()
      .sort(function(a,b){ return (b.offenseRating+b.defenseRating+b.leadership)
                                 -(a.offenseRating+a.defenseRating+a.leadership); })
      .map(function(c) {
        var ovr = Math.round((c.offenseRating+c.defenseRating+c.leadership)/3);
        return '<tr>'
          + '<td><strong>'+c.name+'</strong><br><span style="font-size:10px;color:var(--muted2)">'
          + (c.style||'Balanced')+'</span></td>'
          + '<td style="text-align:center">'+c.offenseRating+'</td>'
          + '<td style="text-align:center">'+c.defenseRating+'</td>'
          + '<td style="text-align:center">'+c.leadership+'</td>'
          + '<td style="text-align:center;font-weight:700;color:var(--accent2)">'+ovr+'</td>'
          + '<td><button onclick="userHireHC(\''+c.id+'\')" '
          + 'style="width:auto;padding:4px 10px;font-size:11px;'
          + 'background:var(--accent-dim);border-color:var(--accent);color:var(--accent2)">'
          + 'Hire</button></td>'
          + '</tr>';
      }).join('');

    setMainContent(
      '<h2>Hire Head Coach</h2>'
      + '<p class="small">Select a new head coach for your franchise.</p>'
      + '<table><thead><tr><th>Name</th><th>Off</th><th>Def</th><th>Lead</th><th>AVG</th><th></th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table>'
      + (window.gmPhase === 'offseason' || window.gmPhase === 'postseason'
        ? '<button onclick="beginFreeAgencyPhase()" style="margin-top:12px;background:var(--accent-dim);border-color:var(--accent);color:var(--accent2);font-weight:600">Skip → Open Free Agency</button>'
        : '<button onclick="window.renderCoachingHub&&window.renderCoachingHub()" style="margin-top:12px">← Back to Coaching Hub</button>')
    );
  };

  window.userHireHC = function(coachId) {
    var team  = typeof getTeamById === 'function' ? getTeamById(userTeamId) : null;
    if (!team) return;
    var c = coachFreeAgents.find(function(x){ return x.id === coachId; });
    if (!c) return;

    /* Send old HC to pool */
    if (team.coach && team.coach.name) {
      coachFreeAgents.push({
        id: 'cfa_old_user',
        name: team.coach.name,
        offenseRating: team.coach.offenseRating,
        defenseRating: team.coach.defenseRating,
        leadership: team.coach.leadership,
        style: team.coach.offenseRating >= team.coach.defenseRating ? 'Offensive' : 'Defensive',
      });
    }

    var yrs = randomInt(2,5);
    team.coach = {
      name: c.name,
      offenseRating: c.offenseRating,
      defenseRating: c.defenseRating,
      leadership: c.leadership,
      jobSecurity: 70,
      contractYears: yrs,
      contractRemaining: yrs,
    };
    coachFreeAgents = coachFreeAgents.filter(function(x){ return x.id !== coachId; });
    if (typeof logTransaction === 'function')
      logTransaction('Coach Hiring', team.city+' '+team.nickname+' hired '+c.name, team.id, null);
    if (typeof window.syncPlaybookDropdowns === 'function') window.syncPlaybookDropdowns();

    /* Only advance the offseason pipeline if we're actually in the offseason */
    if (window.gmPhase === 'offseason' || window.gmPhase === 'postseason') {
      beginFreeAgencyPhase();
    } else {
      /* Midseason hire — just return to coaching hub with confirmation */
      if (typeof window.renderCoachingHub === 'function') {
        window.renderCoachingHub();
      }
      if (typeof _toast === 'function') _toast('✅ ' + c.name + ' hired as Head Coach', true);
    }
  };

  /* ── User OC hire screen ─────────────────────────────────── */
  window.renderUserOCHire = function() {
    if (typeof coordinatorFreeAgents === 'undefined') { coordinatorFreeAgents = []; }
    if (typeof generateCoordinatorFreeAgents === 'function' && coordinatorFreeAgents.length < 5)
      generateCoordinatorFreeAgents();

    var ocs = coordinatorFreeAgents.filter(function(c){ return c.type === 'OC'; });
    var rows = ocs.sort(function(a,b){ return b.offenseRating - a.offenseRating; })
      .map(function(c) {
        return '<tr>'
          + '<td><strong>'+c.name+'</strong></td>'
          + '<td>'+c.scheme+'</td>'
          + '<td>'+c.offenseRating+'</td>'
          + '<td><button onclick="userHireOC(\''+c.id+'\')" '
          + 'style="width:auto;padding:4px 10px;font-size:11px">Hire</button></td>'
          + '</tr>';
      }).join('');

    setMainContent(
      '<h2>Hire Offensive Coordinator</h2>'
      + '<table><thead><tr><th>Name</th><th>Scheme</th><th>Off Rtg</th><th></th></tr></thead>'
      + '<tbody>'+(rows||'<tr><td colspan="4" style="color:var(--muted2)">No OC candidates available</td></tr>')+'</tbody></table>'
      + '<button onclick="window.gmPhase===\'offseason\'||window.gmPhase===\'postseason\'?beginBlackMonday():window.renderCoachingHub()" style="margin-top:10px">← Back</button>'
    );
  };

  window.userHireOC = function(coordId) {
    var team = getTeamById(userTeamId); if (!team) return;
    var c    = coordinatorFreeAgents.find(function(x){ return x.id === coordId; });
    if (!c) return;
    team.oc = { name:c.name, offenseRating:c.offenseRating, scheme:c.scheme, jobSecurity:70 };
    coordinatorFreeAgents = coordinatorFreeAgents.filter(function(x){ return x.id !== coordId; });
    if (typeof logTransaction === 'function')
      logTransaction('OC Hired', team.city+' hired OC '+c.name, team.id, null);
    if (typeof window.syncPlaybookDropdowns === 'function') window.syncPlaybookDropdowns();

    /* Never call beginBlackMonday() on a coordinator hire — return to coaching hub */
    if (typeof window.renderCoachingHub === 'function') window.renderCoachingHub();
    if (typeof _toast === 'function') _toast('✅ ' + c.name + ' hired as OC', true);
  };

  /* ── User DC hire screen ─────────────────────────────────── */
  window.renderUserDCHire = function() {
    if (typeof coordinatorFreeAgents === 'undefined') { coordinatorFreeAgents = []; }
    if (typeof generateCoordinatorFreeAgents === 'function' && coordinatorFreeAgents.length < 5)
      generateCoordinatorFreeAgents();

    var dcs = coordinatorFreeAgents.filter(function(c){ return c.type === 'DC'; });
    var rows = dcs.sort(function(a,b){ return b.defenseRating - a.defenseRating; })
      .map(function(c) {
        return '<tr>'
          + '<td><strong>'+c.name+'</strong></td>'
          + '<td>'+c.scheme+'</td>'
          + '<td>'+c.defenseRating+'</td>'
          + '<td><button onclick="userHireDC(\''+c.id+'\')" '
          + 'style="width:auto;padding:4px 10px;font-size:11px">Hire</button></td>'
          + '</tr>';
      }).join('');

    setMainContent(
      '<h2>Hire Defensive Coordinator</h2>'
      + '<table><thead><tr><th>Name</th><th>Scheme</th><th>Def Rtg</th><th></th></tr></thead>'
      + '<tbody>'+(rows||'<tr><td colspan="4" style="color:var(--muted2)">No DC candidates available</td></tr>')+'</tbody></table>'
      + '<button onclick="window.gmPhase===\'offseason\'||window.gmPhase===\'postseason\'?beginBlackMonday():window.renderCoachingHub()" style="margin-top:10px">← Back</button>'
    );
  };

  window.userHireDC = function(coordId) {
    var team = getTeamById(userTeamId); if (!team) return;
    var c    = coordinatorFreeAgents.find(function(x){ return x.id === coordId; });
    if (!c) return;
    team.dc = { name:c.name, defenseRating:c.defenseRating, scheme:c.scheme, jobSecurity:70 };
    coordinatorFreeAgents = coordinatorFreeAgents.filter(function(x){ return x.id !== coordId; });
    if (typeof logTransaction === 'function')
      logTransaction('DC Hired', team.city+' hired DC '+c.name, team.id, null);
    if (typeof window.syncPlaybookDropdowns === 'function') window.syncPlaybookDropdowns();

    /* Never call beginBlackMonday() on a coordinator hire — return to coaching hub */
    if (typeof window.renderCoachingHub === 'function') window.renderCoachingHub();
    if (typeof _toast === 'function') _toast('✅ ' + c.name + ' hired as DC', true);
  };

  /* ── Fix 7: Re-init coordinators after save/load ─────────── */
  var _origDoLoad = window._doLoad;
  window._doLoad = function(slotIdx) {
    if (typeof _origDoLoad === 'function') _origDoLoad(slotIdx);
    setTimeout(function() {
      if (typeof league !== 'undefined' && league
          && typeof listAllTeams === 'function'
          && typeof initializeCoordinators === 'function') {
        listAllTeams(league).forEach(function(team) {
          if (!team.oc || !team.dc) initializeCoordinators();
        });
      }
      if (typeof initializeCoachJobSecurity === 'function') initializeCoachJobSecurity();
    }, 200);
  };

})();
</script>

<script>
/* ── Coaching Hub — home tile destination ─────────────────── */
window.renderCoachingHub = function () {
  var tid  = document.getElementById('teamSelect') && document.getElementById('teamSelect').value;
  var team = tid && typeof getTeamById === 'function' ? getTeamById(tid) : null;
  if (!team) { setMainContent('<p>Select a team first.</p>'); return; }

  var hc = team.coach || {};
  var oc = team.oc   || {};
  var dc = team.dc   || {};

  function stars(val) {
    val = val || 0;
    var filled = Math.round(val / 20);
    return '★'.repeat(filled) + '☆'.repeat(5 - filled);
  }

  function ratingBar(label, val) {
    val = val || 0;
    var c = val>=88?'#c084fc':val>=80?'#60a5fa':val>=72?'#4ade80':val>=65?'#facc15':'#f87171';
    return '<div style="margin-bottom:7px">'
      + '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">'
        + '<span style="color:var(--muted2)">'+label+'</span>'
        + '<span style="font-weight:600;color:'+c+'">'+val+'</span>'
      + '</div>'
      + '<div style="height:4px;background:var(--surface3);border-radius:2px">'
        + '<div style="height:4px;width:'+val+'%;background:'+c+';border-radius:2px"></div>'
      + '</div>'
    + '</div>';
  }

  function card(title, icon, person, ratingRows, schemeNote, changeBtn) {
    var js = person.jobSecurity || 60;
    var jsC = js>=70?'#4ade80':js>=45?'#facc15':'#f87171';
    var ctrt = person.contractRemaining !== undefined
      ? person.contractRemaining + ' yr' + (person.contractRemaining !== 1 ? 's' : '') + ' left'
      : '';
    return '<div style="background:var(--surface);border:1px solid var(--border);'
      + 'border-radius:10px;padding:16px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
        + '<span style="font-size:22px">'+icon+'</span>'
        + '<div>'
          + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">'+title+'</div>'
          + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;'
            + 'font-weight:700;color:var(--accent2)">'+(person.name||'Vacant')+'</div>'
          + (schemeNote ? '<div style="font-size:11px;color:var(--gold)">'+schemeNote+'</div>' : '')
        + '</div>'
      + '</div>'
      + ratingRows
      + '<div style="display:flex;justify-content:space-between;align-items:center;'
        + 'margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">'
        + '<span style="font-size:11px;color:var(--muted2)">'
          + 'Job Security: <strong style="color:'+jsC+'">'+js+'</strong>'
          + (ctrt ? ' &nbsp;·&nbsp; Contract: '+ctrt : '')
        + '</span>'
        + changeBtn
      + '</div>'
    + '</div>';
  }

  /* Scheme matchup preview */
  var ocScheme = oc.scheme || '—';
  var dcScheme = dc.scheme || '—';

  /* Scheme fit score summary */
  var fitHtml = '';
  if (typeof calculateSchemeFit === 'function' && team.roster && team.roster.length) {
    var offPlayers = team.roster.filter(function(p){ return ['QB','RB','WR','TE','T','G','C'].indexOf(p.positions[0]) >= 0; });
    var defPlayers = team.roster.filter(function(p){ return ['EDGE','DT','LB','CB','FS','SS'].indexOf(p.positions[0]) >= 0; });
    function avgFit(players) {
      if (!players.length) return 0;
      return Math.round(players.reduce(function(s,p){ return s + calculateSchemeFit(p,team); }, 0) / players.length);
    }
    var offFit = avgFit(offPlayers);
    var defFit = avgFit(defPlayers);
    var offFitC = offFit>=75?'#4ade80':offFit>=60?'#facc15':'#f87171';
    var defFitC = defFit>=75?'#4ade80':defFit>=60?'#facc15':'#f87171';
    fitHtml =
      '<div style="background:var(--surface);border:1px solid var(--border);'
      + 'border-radius:10px;padding:14px;margin-bottom:12px">'
      + '<div style="font-size:10px;font-weight:600;letter-spacing:1px;'
        + 'text-transform:uppercase;color:var(--accent2);margin-bottom:10px">Scheme Fit</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
        + '<div style="text-align:center">'
          + '<div style="font-size:26px;font-weight:700;color:'+offFitC+'">'+offFit+'</div>'
          + '<div style="font-size:10px;color:var(--muted2)">Offensive Fit</div>'
          + '<div style="font-size:11px;color:var(--gold);margin-top:2px">'+ocScheme+'</div>'
        + '</div>'
        + '<div style="text-align:center">'
          + '<div style="font-size:26px;font-weight:700;color:'+defFitC+'">'+defFit+'</div>'
          + '<div style="font-size:10px;color:var(--muted2)">Defensive Fit</div>'
          + '<div style="font-size:11px;color:var(--gold);margin-top:2px">'+dcScheme+'</div>'
        + '</div>'
      + '</div>'
    + '</div>';
  }

  var hcCard = card(
    'Head Coach', '🏈', hc,
    ratingBar('Offense Rating', hc.offenseRating) +
    ratingBar('Defense Rating', hc.defenseRating) +
    ratingBar('Leadership', hc.leadership),
    null,
    '<button onclick="typeof renderUserCoachHire===\'function\'&&renderUserCoachHire()" '
    + 'style="width:auto;padding:4px 10px;font-size:11px;'
