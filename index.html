/* ═══════════════════════════════════════════════════════════
   CUSTOM ROSTER — Download Template & Import
═══════════════════════════════════════════════════════════ */

/* Ordered list of every granular attribute column (must match ATTR_LABELS keys) */
var _ROSTER_ATTR_COLS = [
  'speed','acceleration','agility','strength','stamina','awareness',
  'throwPower','throwAccShort','throwAccMid','throwAccDeep',
  'elusiveness','trucking','jukeMoves','spinMove','ballCarrierVision','carrying',
  'catching','catchInTraffic','routeRunning','release','spectacularCatch',
  'passBlock','runBlock','passBlockStrength','passBlockFootwork',
  'runBlockStrength','runBlockFinesse',
  'blockShedding','tackle','powerMoves','finesseMoves',
  'pursuit','playRecognition','manCoverage','zoneCoverage','press','hitPower',
  'kickPower','kickAccuracy'
];

/* Simple quoted-CSV/TSV row parser — auto-detects tab vs comma delimiter */
var _csvDelimiter = ',';  /* set by importCustomRoster before parsing */
function _parseCSVRow(row) {
  var delim = _csvDelimiter;
  /* Tab-delimited: no quoting convention, fast-path split */
  if (delim === '\t') return row.split('\t').map(function(c){ return c.trim(); });
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < row.length; i++) {
    var c = row[i];
    if (c === '"') {
      if (inQ && row[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === delim && !inQ) {
      result.push(cur.trim()); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur.trim());
  return result;
}

function _csvQuote(v) {
  return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
}

/* Download the current league rosters as a CSV template */
window.downloadRosterTemplate = function () {
  if (typeof league === 'undefined' || !league) {
    if (typeof _toast === 'function') _toast('⚠ No league loaded yet', false);
    return;
  }

  /* Header: identity columns + every granular attribute */
  var header = ['team_id','team_name','name','position','age'].concat(_ROSTER_ATTR_COLS);
  var rows   = [header.join(',')];

  listAllTeams(league).forEach(function (team) {
    var teamName = team.city + ' ' + team.nickname;
    (team.roster || []).forEach(function (p) {
      /* Ensure granular attrs exist on the player */
      var g = p.granularAttrs;
      if (!g && typeof window.initGranularAttrs === 'function') {
        g = window.initGranularAttrs(p);
      }
      g = g || {};

      var pos = p.positions ? p.positions[0] : 'LB';
      var row = [
        _csvQuote(team.id),
        _csvQuote(teamName),
        _csvQuote(p.name),
        _csvQuote(pos),
        _csvQuote(p.age)
      ];
      _ROSTER_ATTR_COLS.forEach(function (k) {
        row.push(_csvQuote(g[k] !== undefined ? g[k] : 60));
      });
      rows.push(row.join(','));
    });
  });

  var csv  = rows.join('\r\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'roster_template.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (typeof _toast === 'function') _toast('📥 roster_template.csv downloaded', true);
};

/* Import a CSV and apply it to the current league */
window.importCustomRoster = function (file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var lines   = e.target.result.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n');
      /* Auto-detect delimiter: if the header row has tabs, treat as TSV */
      _csvDelimiter = (lines[0].indexOf('\t') !== -1) ? '\t' : ',';
      var headers = _parseCSVRow(lines[0]).map(function (h) { return h.trim().toLowerCase().replace(/[^a-z_]/g, ''); });

      var iTeamId = headers.indexOf('team_id');
      var iName   = headers.indexOf('name');
      var iPos    = headers.indexOf('position');
      var iAge    = headers.indexOf('age');

      if (iTeamId < 0 || iName < 0 || iPos < 0) {
        if (typeof _toast === 'function') _toast('⚠ CSV missing required columns (team_id, name, position)', false);
        return;
      }

      /* Build a column-index map for every granular attribute present in the CSV.
         Headers were normalized to lowercase (no uppercase letters), so normalise
         each _ROSTER_ATTR_COLS key the same way before looking it up.            */
      var attrColIdx = {};
      _ROSTER_ATTR_COLS.forEach(function (k) {
        var normKey = k.toLowerCase().replace(/[^a-z_]/g, '');
        var idx = headers.indexOf(normKey);
        if (idx >= 0) attrColIdx[k] = idx;
      });

      /* Also accept a legacy "overall" column as a fallback */
      var iOvr = headers.indexOf('overall');

      /* Require at least one of: granular attr columns OR an overall column */
      var hasGranular = Object.keys(attrColIdx).length > 0;
      if (!hasGranular && iOvr < 0) {
        if (typeof _toast === 'function')
          _toast('⚠ CSV must have granular attribute columns or an overall column', false);
        return;
      }

      /* Group rows by team_id */
      var byTeam = {};
      for (var i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        var cols = _parseCSVRow(lines[i]);
        var tid  = cols[iTeamId] || '';
        if (!tid) continue;
        if (!byTeam[tid]) byTeam[tid] = [];

        /* Read every granular attribute that appears in the CSV */
        var g = {};
        _ROSTER_ATTR_COLS.forEach(function (k) {
          if (attrColIdx[k] !== undefined) {
            var val = parseInt(cols[attrColIdx[k]]);
            g[k] = isNaN(val) ? 60 : Math.max(20, Math.min(99, val));
          }
        });

        byTeam[tid].push({
          name      : cols[iName] || 'Unknown',
          pos       : cols[iPos]  || 'QB',
          age       : parseInt(cols[iAge]) || 23,
          g         : g,
          legacyOvr : iOvr >= 0 ? parseInt(cols[iOvr]) || null : null
        });
      }

      /* Apply to league */
      var teamsUpdated = 0, playersImported = 0;
      listAllTeams(league).forEach(function (team) {
        var rows = byTeam[team.id];
        if (!rows || !rows.length) return;
        team.roster  = [];
        team.capUsed = 0;

        rows.forEach(function (r) {
          var pos = r.pos;
          var g   = r.g;

          /* If the CSV had no granular attrs (legacy "overall" only), generate
             a full attribute set seeded from that overall value.              */
          if (!Object.keys(g).length) {
            var seedOvr = r.legacyOvr || 72;
            var fakePlayer = {
              positions     : [pos],
              granularAttrs : null,
              attributes    : { overall: seedOvr, athleticism: seedOvr,
                                intelligence: seedOvr, toughness: seedOvr, discipline: seedOvr }
            };
            if (typeof window.initGranularAttrs === 'function') {
              g = window.initGranularAttrs(fakePlayer) || {};
            }
          }

          /* Derive overall and composites from the granular set */
          var overall = 72;
          var comp    = { athleticism: 72, intelligence: 72, toughness: 72, discipline: 72 };
          if (typeof window.calcPosOVR === 'function' && Object.keys(g).length) {
            overall = window.calcPosOVR(g, pos);
          } else if (r.legacyOvr) {
            overall = r.legacyOvr;
          }
          if (typeof window.deriveComposites === 'function' && Object.keys(g).length) {
            comp = window.deriveComposites(g);
          }

          var attrs = {
            overall      : overall,
            athleticism  : comp.athleticism,
            intelligence : comp.intelligence,
            toughness    : comp.toughness,
            discipline   : comp.discipline
          };

          var positions = (typeof generatePositionsForPlayer === 'function')
            ? generatePositionsForPlayer(pos) : [pos];

          var contract = (typeof generateContract === 'function')
            ? generateContract(overall, r.age) : { capHitPerYear: 0 };

          var p = {
            id            : typeof globalPlayerId !== 'undefined' ? globalPlayerId++ : Math.random(),
            name          : r.name,
            positions     : positions,
            age           : r.age,
            attributes    : attrs,
            granularAttrs : Object.keys(g).length ? g : undefined,
            contract      : contract,
            stats         : (typeof defaultPlayerStats === 'function') ? defaultPlayerStats() : {}
          };

          team.roster.push(p);
          if (contract) team.capUsed += (contract.capHitPerYear || 0);
          playersImported++;
        });

        if (typeof computeTeamPowerRating === 'function')
          team.powerRating = computeTeamPowerRating(team);
        teamsUpdated++;
      });

      window._customRosterImported = { teams: teamsUpdated, players: playersImported };

      /* Update the status badge if the coach creation screen is still open */
      var badge = document.getElementById('_rosterImportBadge');
      if (badge) {
        badge.innerHTML = '✅ ' + playersImported + ' players across ' + teamsUpdated + ' teams imported';
        badge.style.color   = 'var(--accent2)';
        badge.style.display = 'block';
      }
      if (typeof _toast === 'function')
        _toast('✅ Custom roster imported — ' + playersImported + ' players, ' + teamsUpdated + ' teams', true);

    } catch (err) {
      if (typeof _toast === 'function') _toast('⚠ Import failed: ' + err.message, false);
    }
  };
  reader.readAsText(file);
};

/* ── On load: if no game exists show a start-game prompt ─────── */
window.addEventListener('DOMContentLoaded', function () {
  setTimeout(function () {
    /* If the league hasn't been started yet, swap the hero into
       a minimal splash so the user knows to click New Game.     */
    var hasGame = typeof userTeamId !== 'undefined' && userTeamId;
    if (!hasGame) {
      var name = document.getElementById('homeFranchiseName');
      if (name) name.textContent = 'Football Sim';
      var dash = document.getElementById('homeDashboard');
      if (dash) dash.innerHTML =
        '<p style="font-size:12px;color:var(--muted2);margin:8px 0 0">Click <strong>New Game</strong> below to start your franchise.</p>';
    }
  }, 600);
});

</script>

<script>
/* ============================================================
   CONTEXT ANIMATIONS ENGINE
   Fired on: win, loss, trade complete, FA signing, draft pick
   ============================================================ */
(function () {

  function getOv() {
    var el = document.getElementById('_ctx_ov');
    if (!el) {
      el = document.createElement('div');
      el.id = '_ctx_ov';
      el.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
      document.body.appendChild(el);
    }
    el.innerHTML = '';
    return el;
  }

  window._ctxAnimate = function (type) {
    if (!type) return;
    var ov = getOv();

    /* ── WIN ─ confetti rain + radial green flash ─────────── */
    if (type === 'win') {
      var flash = document.createElement('div');
      flash.style.cssText = 'position:absolute;inset:0;'
        + 'background:radial-gradient(ellipse at 50% 30%,rgba(34,197,94,.38) 0%,rgba(22,163,74,.16) 55%,transparent 100%);'
        + 'animation:ctx-flash-green 1.8s ease-out forwards';
      ov.appendChild(flash);

      var COLORS = ['#22c55e','#4ade80','#86efac','#f59e0b','#fbbf24',
                    '#3b82f6','#93c5fd','#e2e8f0','#f0abfc','#fda4af'];
      var SHAPES = ['50%','0%','0% 50%'];
      for (var i = 0; i < 60; i++) {
        var c = document.createElement('div');
        var sz = 5 + Math.random() * 10;
        c.style.cssText = 'position:absolute;top:-14px;'
          + 'left:'  + (Math.random() * 102) + '%;'
          + 'width:' + sz + 'px;height:' + sz + 'px;'
          + 'background:' + COLORS[i % COLORS.length] + ';'
          + 'border-radius:' + SHAPES[Math.floor(Math.random() * SHAPES.length)] + ';'
          + 'animation:ctx-confetti-fall '
            + (1.3 + Math.random() * 1.5) + 's '
            + (Math.random() * 1.1) + 's ease-in forwards';
        ov.appendChild(c);
      }

      var banner = document.createElement('div');
      banner.textContent = '🏆 VICTORY';
      banner.style.cssText = 'position:absolute;bottom:20%;left:50%;'
        + 'font-family:"Barlow Condensed",sans-serif;font-size:44px;font-weight:900;'
        + 'color:#4ade80;letter-spacing:6px;white-space:nowrap;'
        + 'text-shadow:0 0 24px rgba(74,222,128,.9),0 0 50px rgba(22,163,74,.5);'
        + 'animation:ctx-float-up 2.2s 0.4s ease-out forwards';
      ov.appendChild(banner);
      setTimeout(function () { ov.innerHTML = ''; }, 3900);

    /* ── LOSS ─ red flash + screen shake ─────────────────── */
    } else if (type === 'loss') {
      var rflash = document.createElement('div');
      rflash.style.cssText = 'position:absolute;inset:0;'
        + 'background:radial-gradient(ellipse at 50% 50%,rgba(239,68,68,.22) 0%,transparent 70%);'
        + 'animation:ctx-flash-red 0.9s ease-out forwards';
      ov.appendChild(rflash);

      var sad = document.createElement('div');
      sad.textContent = '😔';
      sad.style.cssText = 'position:absolute;top:38%;left:50%;'
        + 'font-size:56px;animation:ctx-float-up 1.4s 0.1s ease-out forwards';
      ov.appendChild(sad);

      var main = document.getElementById('main');
      if (main) {
        main.style.animation = 'ctx-shake 0.52s ease';
        setTimeout(function () { main.style.animation = ''; }, 560);
      }
      setTimeout(function () { ov.innerHTML = ''; }, 1300);

    /* ── TRADE ─ ink stamp + spark burst ─────────────────── */
    } else if (type === 'trade') {
      var stamp = document.createElement('div');
      stamp.textContent = '✓ DEAL';
      stamp.style.cssText = 'position:absolute;top:44%;left:50%;'
        + 'font-family:"Barlow Condensed",sans-serif;font-size:68px;font-weight:900;'
        + 'color:#4ade80;letter-spacing:4px;white-space:nowrap;'
        + 'border:5px solid #4ade80;border-radius:8px;padding:4px 18px;'
        + 'text-shadow:0 0 20px rgba(74,222,128,.8);'
        + 'box-shadow:0 0 30px rgba(34,197,94,.4),inset 0 0 20px rgba(34,197,94,.1);'
        + 'animation:ctx-stamp 2s cubic-bezier(.175,.885,.32,1.275) forwards';
      ov.appendChild(stamp);

      var SPARK_C = ['#4ade80','#fbbf24','#60a5fa','#f9a8d4','#a78bfa','#fb923c'];
      for (var si = 0; si < 14; si++) {
        var angle = (si / 14) * Math.PI * 2;
        var dist  = 90 + Math.random() * 130;
        var sp    = document.createElement('div');
        sp.style.cssText = 'position:absolute;top:50%;left:50%;'
          + '--sx:' + Math.round(Math.cos(angle) * dist) + 'px;'
          + '--sy:' + Math.round(Math.sin(angle) * dist) + 'px;'
          + 'width:9px;height:9px;border-radius:50%;'
          + 'background:' + SPARK_C[si % SPARK_C.length] + ';'
          + 'animation:ctx-spark 0.8s ' + (0.15 + Math.random() * 0.25) + 's ease-out forwards';
        ov.appendChild(sp);
      }
      setTimeout(function () { ov.innerHTML = ''; }, 2500);

    /* ── SIGNING ─ SVG checkmark draw + ripple ───────────── */
    } else if (type === 'signing') {
      var ring = document.createElement('div');
      ring.style.cssText = 'position:absolute;top:40%;left:50%;'
        + 'width:56px;height:56px;border-radius:50%;border:3px solid #4ade80;'
        + 'animation:ctx-sign-ripple 1.1s ease-out forwards';
      ov.appendChild(ring);

      var NS  = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 50 50');
      svg.style.cssText = 'position:absolute;top:calc(40% - 52px);left:calc(50% - 52px);'
        + 'width:104px;height:104px;overflow:visible';
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M 8 26 L 20 38 L 42 14');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#4ade80');
      path.setAttribute('stroke-width', '4.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('stroke-dasharray', '100');
      path.setAttribute('stroke-dashoffset', '100');
      path.style.cssText = 'filter:drop-shadow(0 0 6px rgba(74,222,128,.8));'
        + 'animation:ctx-sign-check 1.2s ease-out forwards';
      svg.appendChild(path);
      ov.appendChild(svg);

      var lbl = document.createElement('div');
      lbl.textContent = '✍ Signed!';
      lbl.style.cssText = 'position:absolute;top:37%;left:50%;'
        + 'font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;'
        + 'color:#4ade80;letter-spacing:2px;white-space:nowrap;'
        + 'text-shadow:0 0 14px rgba(74,222,128,.7);'
        + 'animation:ctx-float-up 1.3s 0.25s ease-out forwards';
      ov.appendChild(lbl);
      setTimeout(function () { ov.innerHTML = ''; }, 1800);

    /* ── DRAFT ─ gold spotlight + gold confetti ──────────── */
    } else if (type === 'draft') {
      var spot = document.createElement('div');
      spot.style.cssText = 'position:absolute;top:0;left:50%;transform:translateX(-50%);'
        + 'width:0;height:0;'
        + 'border-left:200px solid transparent;border-right:200px solid transparent;'
        + 'border-top:70vh solid rgba(245,158,11,.15);'
        + 'filter:blur(22px);'
        + 'animation:ctx-flash-green 2.2s ease-out forwards';
      ov.appendChild(spot);

      var pickLbl = document.createElement('div');
      pickLbl.textContent = '🎯 PICK MADE';
      pickLbl.style.cssText = 'position:absolute;top:36%;left:50%;'
        + 'font-family:"Barlow Condensed",sans-serif;font-size:38px;font-weight:900;'
        + 'color:#fbbf24;letter-spacing:5px;white-space:nowrap;'
        + 'text-shadow:0 0 22px rgba(251,191,36,.85);'
        + 'animation:ctx-float-up 1.8s 0.2s ease-out forwards';
      ov.appendChild(pickLbl);

      var GOLD = ['#fbbf24','#f59e0b','#fde68a','#fef3c7'];
      for (var di = 0; di < 30; di++) {
        var dc = document.createElement('div');
        var dsz = 4 + Math.random() * 7;
        dc.style.cssText = 'position:absolute;top:-12px;'
          + 'left:' + (20 + Math.random() * 60) + '%;'
          + 'width:' + dsz + 'px;height:' + dsz + 'px;'
          + 'background:' + GOLD[di % GOLD.length] + ';border-radius:50%;'
          + 'animation:ctx-confetti-fall '
            + (1.1 + Math.random() * 1.0) + 's '
            + (Math.random() * 0.8) + 's ease-in forwards';
        ov.appendChild(dc);
      }
      setTimeout(function () { ov.innerHTML = ''; }, 2700);
    }
  };

  /* ── Auto-trigger: win / loss after week results ─────────── */
  var _origRWR_anim = window.renderWeekResults;
  window.renderWeekResults = function (week) {
    if (typeof _origRWR_anim === 'function') _origRWR_anim(week);
    var tid = (document.getElementById('teamSelect') || {}).value
           || (typeof userTeamId !== 'undefined' ? userTeamId : null);
    if (!tid || !week || !week.games) return;
    week.games.forEach(function (g) {
      if (!g.played) return;
      if (g.homeTeamId !== tid && g.awayTeamId !== tid) return;
      var isHome = g.homeTeamId === tid;
      var mine = isHome ? g.homeScore : g.awayScore;
      var opp  = isHome ? g.awayScore : g.homeScore;
      setTimeout(function () {
        window._ctxAnimate(mine > opp ? 'win' : mine < opp ? 'loss' : null);
      }, 280);
    });
  };

})();
</script>

<script>
/* ============================================================
   INJURY & SUSPENSION SYSTEM
   ============================================================
   Data model per player:
     p.injury = {
       type:     string   e.g. "Hamstring", "Concussion", "Broken Arm"
       severity: 'minor' | 'moderate' | 'major' | 'careerThreatening'
       weeksRemaining: int   (weeks until the player is healthy)
       weeksSustained: int   (sim year + week when it happened — for history)
     }
     p.suspension = {
       weeksRemaining: int
       reason: string
     }

   Active injury → player is OUT of the lineup (power rating penalty).
   Suspension     → player is OUT of the lineup.
   Recovery       → weeksRemaining ticks down each simulated week.
   History        → pushed to p.injuryHistory[] for regression calc.

   UI surface:
     • Week Results panel shows an "Injury Report" section for YOUR team.
     • Roster shows a 🤕 / 🚫 badge next to injured / suspended players.
     • Player card shows status banner.
   ============================================================ */

(function () {

  /* ── Injury type tables by position group ─────────────────── */
  var INJ_TABLE = {
    skill : ['Hamstring','Quad','Ankle','Shoulder','Concussion','Wrist'],
    line  : ['Knee','Pectoral','Shoulder','Back','Hand','Concussion'],
    db    : ['Hamstring','Ankle','Quad','Shoulder','Concussion','Knee'],
    spec  : ['Groin','Quad','Ankle','Back','Concussion'],
  };
  function injType(pos) {
    if (['QB','RB','WR','TE'].includes(pos))   return INJ_TABLE.skill;
    if (['T','G','C','DT','EDGE'].includes(pos)) return INJ_TABLE.line;
    if (['CB','FS','SS','LB'].includes(pos))   return INJ_TABLE.db;
    return INJ_TABLE.spec;
  }
  function randomInjuryType(pos) {
    var pool = injType(pos);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* ── Injury severity → weeks out ──────────────────────────── */
  /* ── Severity table — weeks out range ──────────────────────── */
  var SEVERITY = {
    minor            : { label:'Questionable', weeks:[1,1],  color:'#facc15' },
    moderate         : { label:'Out',          weeks:[2,3],  color:'#f97316' },
    major            : { label:'IR',           weeks:[4,6],  color:'#ef4444' },
    careerThreatening: { label:'Season',       weeks:[6,10], color:'#c084fc' },
  };

  /* 60% minor · 28% moderate · 10% major · 2% season-ending */
  function rollSeverity() {
    var r = Math.random();
    if (r < 0.60) return 'minor';
    if (r < 0.88) return 'moderate';
    if (r < 0.98) return 'major';
    return 'careerThreatening';
  }
  function weeksForSeverity(sev) {
    var range = SEVERITY[sev].weeks;
    return range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
  }

  /* ── Injury roll probability per player per game ──────────── *
     Tuned for ~1-2 new injuries per team per week and
     ~2-4 players out at any one time (realistic NFL scale).     */
  function injuryProbability(player) {
    var base  = 0.025;                   /* 2.5% base per game (was 6%) */
    var age   = player.age || 25;
    var tough = (player.attributes && player.attributes.toughness) || 70;
    if (age >= 32)      base += 0.015;   /* veterans more fragile */
    else if (age >= 29) base += 0.008;
    base -= (tough - 70) * 0.001;       /* toughness helps a little */
    if (player.injury && player.injury.weeksRemaining > 0) return 0;
    return Math.max(0.005, Math.min(0.08, base));
  }

  /* ── Suspension roll — rare, ~1-2 per league per season ───── */
  var SUSPENSION_REASONS = [
    'PED violation','Conduct detrimental','Unsportsmanlike act','DUI arrest',
  ];
  function suspensionProbability(player) {
    return 0.0015;   /* was 0.004 — now ~1 event per season league-wide */
  }
  function rollSuspensionWeeks() { return 1 + Math.floor(Math.random() * 2); }

  /* ── Apply injuries & suspensions after a game ────────────── */
  function processTeamInjuries(team) {
    if (!team || !team.roster) return [];
    var events = [];
    team.roster.forEach(function (p) {
      /* Tick down existing injury */
      if (p.injury && p.injury.weeksRemaining > 0) {
        p.injury.weeksRemaining--;
        if (p.injury.weeksRemaining === 0) {
          events.push({ player: p, type: 'recovery', injury: p.injury });
          /* Push to injuryHistory for long-term regression */
          if (!p.injuryHistory) p.injuryHistory = [];
          p.injuryHistory.push({ severity: p.injury.severity, type: p.injury.type });
          p.injury = null;
        }
        return;   /* already injured — skip new roll */
      }

      /* Tick down existing suspension */
      if (p.suspension && p.suspension.weeksRemaining > 0) {
        p.suspension.weeksRemaining--;
        if (p.suspension.weeksRemaining === 0) {
          events.push({ player: p, type: 'suspension_return', reason: p.suspension.reason });
          p.suspension = null;
        }
        return;
      }

      /* Roll for new injury */
      if (Math.random() < injuryProbability(p)) {
        var sev   = rollSeverity();
        var weeks = weeksForSeverity(sev);
        var itype = randomInjuryType(p.positions[0]);
        p.injury  = { type: itype, severity: sev, weeksRemaining: weeks, weeksSustained: (window.simYear||1) };
        events.push({ player: p, type: 'new_injury', injury: p.injury });
        return;
      }

      /* Roll for suspension */
      if (Math.random() < suspensionProbability(p)) {
        var reason = SUSPENSION_REASONS[Math.floor(Math.random() * SUSPENSION_REASONS.length)];
        var sus    = rollSuspensionWeeks();
        p.suspension = { weeksRemaining: sus, reason: reason };
        events.push({ player: p, type: 'new_suspension', reason: reason, weeks: sus });
      }
    });
    return events;
  }

  /* ── Clear all injuries/suspensions at season end ─────────── */
  window.clearAllInjuries = function () {
    if (typeof league === 'undefined' || !league || typeof listAllTeams !== 'function') return;
    listAllTeams(league).forEach(function (team) {
      (team.roster || []).forEach(function (p) {
        /* Only clear non-season injuries at EOS; season injuries are already 0 */
        p.injury     = null;
        p.suspension = null;
      });
    });
  };

  /* ── Roster status badge ──────────────────────────────────── */
  window.injuryBadge = function (player) {
    if (player.injury && player.injury.weeksRemaining > 0) {
      var sev = SEVERITY[player.injury.severity] || SEVERITY.minor;
      return ' <span title="' + player.injury.type + ' — ' + sev.label
        + ' (' + player.injury.weeksRemaining + 'w)"'
        + ' style="font-size:9px;background:rgba(239,68,68,.18);color:' + sev.color
        + ';border-radius:3px;padding:1px 4px;font-weight:700">'
        + '🤕 ' + sev.label + '</span>';
    }
    if (player.suspension && player.suspension.weeksRemaining > 0) {
      return ' <span title="Suspended: ' + player.suspension.reason
        + ' (' + player.suspension.weeksRemaining + 'w)"'
        + ' style="font-size:9px;background:rgba(168,85,247,.18);color:#c084fc;'
        + 'border-radius:3px;padding:1px 4px;font-weight:700">'
        + '🚫 Susp.</span>';
    }
    return '';
  };

  /* ── Power rating penalty for missing starters ────────────── */
  function teamInjuryPenalty(team) {
    var penalty = 0;
    (team.roster || []).forEach(function (p) {
      var isOut = (p.injury && p.injury.weeksRemaining > 0)
               || (p.suspension && p.suspension.weeksRemaining > 0);
      if (!isOut) return;
      var ovr = (p.attributes && p.attributes.overall) || 70;
      /* Higher-rated players hurt more when missing */
      if (ovr >= 85) penalty += 2.5;
      else if (ovr >= 78) penalty += 1.5;
      else if (ovr >= 72) penalty += 0.8;
      else penalty += 0.3;
    });
    return Math.min(penalty, 10);   /* cap at -10 pts */
  }

  /* ── Wrap simulateGame to apply injuries after each game ──── */
  var _prevSimGame = window.simulateGame;
  window.simulateGame = function (game, tMap, userStrat, uid) {
    /* Apply injury penalty before rating calc */
    var tMapRef = tMap || teamMap;
    if (tMapRef && game) {
      var ht = tMapRef[game.homeTeamId];
      var at = tMapRef[game.awayTeamId];
      if (ht) ht._injPenalty = teamInjuryPenalty(ht);
      if (at) at._injPenalty = teamInjuryPenalty(at);
    }
    /* Run the game */
    var result = (typeof _prevSimGame === 'function')
      ? _prevSimGame.call(this, game, tMap, userStrat, uid)
      : undefined;
    /* Roll injuries for both teams post-game */
    if (tMapRef && game) {
      var ht2 = tMapRef[game.homeTeamId];
      var at2 = tMapRef[game.awayTeamId];
      if (ht2) { var evH = processTeamInjuries(ht2); game._injuryEvents = game._injuryEvents || {}; game._injuryEvents[ht2.id] = evH; }
      if (at2) { var evA = processTeamInjuries(at2); game._injuryEvents = game._injuryEvents || {}; game._injuryEvents[at2.id] = evA; }
    }
    return result;
  };

  /* ── Injury report section for week results ──────────────── */
  function buildInjuryReport(week, tid) {
    if (!week || !week.games) return '';
    var events = [];
    week.games.forEach(function (g) {
      if (!g._injuryEvents) return;
      var myEvents = g._injuryEvents[tid];
      if (myEvents) events = events.concat(myEvents);
    });
    if (!events.length) return '';

    var rows = events.map(function (e) {
      var p    = e.player;
      var pos  = (p.positions && p.positions[0]) || '?';
      var name = p.name || '?';
      if (e.type === 'new_injury') {
        var sev  = SEVERITY[e.injury.severity] || SEVERITY.minor;
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">' + pos + '</span>'
          + '<span style="flex:1;font-size:12px">' + name + '</span>'
          + '<span style="font-size:11px;font-weight:700;color:' + sev.color + '">'
            + '🤕 ' + e.injury.type + ' — ' + sev.label + ' (' + e.injury.weeksRemaining + 'w)'
          + '</span>'
        + '</div>';
      }
      if (e.type === 'recovery') {
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">' + pos + '</span>'
          + '<span style="flex:1;font-size:12px">' + name + '</span>'
          + '<span style="font-size:11px;font-weight:700;color:#4ade80">✅ Cleared to play</span>'
        + '</div>';
      }
      if (e.type === 'new_suspension') {
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">' + pos + '</span>'
          + '<span style="flex:1;font-size:12px">' + name + '</span>'
          + '<span style="font-size:11px;font-weight:700;color:#c084fc">'
            + '🚫 Suspended ' + e.weeks + 'w — ' + e.reason
          + '</span>'
        + '</div>';
      }
      if (e.type === 'suspension_return') {
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">' + pos + '</span>'
          + '<span style="flex:1;font-size:12px">' + name + '</span>'
          + '<span style="font-size:11px;font-weight:700;color:#94a3b8">↩ Suspension served — eligible</span>'
        + '</div>';
      }
      return '';
    }).join('');

    return '<div style="background:var(--surface);border:1px solid var(--border);'
      + 'border-radius:10px;padding:14px;margin-top:14px">'
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;'
        + 'letter-spacing:.8px;color:var(--accent2);margin-bottom:8px">📋 Injury Report</div>'
      + rows
    + '</div>';
  }

  /* ── Wrap renderWeekResults to append injury report ─────── */
  var _prevRWR = window.renderWeekResults;
  window.renderWeekResults = function (week) {
    if (typeof _prevRWR === 'function') _prevRWR(week);
    var tid = (document.getElementById('teamSelect') || {}).value
           || (typeof userTeamId !== 'undefined' ? userTeamId : null);
    if (!tid) return;
    var report = buildInjuryReport(week, tid);
    if (!report) return;
    var main = document.getElementById('main');
    if (main) main.insertAdjacentHTML('beforeend', report);
  };

  /* ── Patch renderRoster to show injury badges ──────────────── */
  var _prevRR = window.renderRoster;
  window.renderRoster = function () {
    if (typeof _prevRR === 'function') _prevRR();
    /* After roster renders, inject badges next to each player name */
    setTimeout(function () {
      var tid = (document.getElementById('teamSelect') || {}).value
             || (typeof userTeamId !== 'undefined' ? userTeamId : null);
      if (!tid || typeof getTeamById !== 'function') return;
      var team = getTeamById(tid);
      if (!team) return;
      /* Walk each roster row — find name cells and append badge if needed */
      var rows = document.querySelectorAll('[data-player-id]');
      rows.forEach(function (row) {
        var pid = row.getAttribute('data-player-id');
        var p   = team.roster.find(function (x) { return String(x.id) === String(pid); });
        if (!p) return;
        var badge = window.injuryBadge(p);
        if (!badge) return;
        /* Append to existing name cell if badge not already there */
        var nameCell = row.querySelector('.player-name, td:nth-child(2)');
        if (nameCell && !nameCell.querySelector('.inj-badge')) {
          nameCell.insertAdjacentHTML('beforeend',
            '<span class="inj-badge">' + badge.replace(/<span /, '<span class="inj-badge-inner" ') + '</span>'
          );
        }
      });
    }, 60);
  };

  /* ── Patch renderPlayerDetail to show status banner ────────── */
  var _prevRPD = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _prevRPD === 'function') _prevRPD(playerId);
    setTimeout(function () {
      var tid = (document.getElementById('teamSelect') || {}).value
             || (typeof userTeamId !== 'undefined' ? userTeamId : null);
      if (!tid || typeof getTeamById !== 'function') return;
      var team = getTeamById(tid);
      if (!team) return;
      var p = team.roster.find(function (x) { return String(x.id) === String(playerId); });
      if (!p) return;
      var banner = '';
      if (p.injury && p.injury.weeksRemaining > 0) {
        var sev = SEVERITY[p.injury.severity] || SEVERITY.minor;
        banner = '<div style="background:rgba(239,68,68,.12);border:1px solid #ef4444;'
          + 'border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px">'
          + '🤕 <strong>' + p.injury.type + '</strong> — ' + sev.label
          + ' · <span style="color:#94a3b8">' + p.injury.weeksRemaining + ' week'
          + (p.injury.weeksRemaining !== 1 ? 's' : '') + ' remaining</span>'
        + '</div>';
      } else if (p.suspension && p.suspension.weeksRemaining > 0) {
        banner = '<div style="background:rgba(168,85,247,.12);border:1px solid #a855f7;'
          + 'border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px">'
          + '🚫 <strong>Suspended</strong> — ' + p.suspension.reason
          + ' · <span style="color:#94a3b8">' + p.suspension.weeksRemaining + ' week'
          + (p.suspension.weeksRemaining !== 1 ? 's' : '') + ' remaining</span>'
        + '</div>';
      }
      if (!banner) return;
      var main = document.getElementById('main');
      if (!main) return;
      /* Insert after first h2 or at top */
      var h2 = main.querySelector('h2');
      if (h2 && h2.parentNode) {
        h2.insertAdjacentHTML('afterend', banner);
      } else {
        main.insertAdjacentHTML('afterbegin', banner);
      }
    }, 80);
  };

  /* ── Clear injuries at end of season ───────────────────────── */
  var _prevEOS = window.runEndOfSeasonDevelopment;
  window.runEndOfSeasonDevelopment = function () {
    if (typeof _prevEOS === 'function') _prevEOS();
    window.clearAllInjuries();
  };

})();
</script>


<script>
/* ============================================================
   INJURY / SUSPENSION POPUP + REPORT PAGE
   ============================================================ */
(function () {

  /* ── Modal popup for new injuries/suspensions ────────────── */
  function showInjuryModal(events, teamName) {
    /* Remove any stale modal */
    var old = document.getElementById('_injModal');
    if (old) old.remove();

    var rows = events.map(function (e) {
      var p = e.player;
      var pos = (p.positions && p.positions[0]) || '?';
      if (e.type === 'new_injury') {
        var sev  = e.injury.severity;
        var smap = { minor:'#facc15', moderate:'#f97316', major:'#ef4444', careerThreatening:'#c084fc' };
        var slbl = { minor:'Questionable', moderate:'Out', major:'IR', careerThreatening:'Season' };
        var col  = smap[sev] || '#f87171';
        return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<div style="min-width:36px;font-size:11px;font-weight:700;color:var(--accent2)">' + pos + '</div>'
          + '<div style="flex:1">'
            + '<div style="font-size:13px;font-weight:600">' + p.name + '</div>'
            + '<div style="font-size:11px;color:' + col + '">🤕 ' + e.injury.type + ' — ' + (slbl[sev]||sev)
              + ' · <span style="color:var(--muted2)">' + e.injury.weeksRemaining + ' week' + (e.injury.weeksRemaining !== 1 ? 's' : '') + '</span>'
            + '</div>'
          + '</div>'
        + '</div>';
      }
      if (e.type === 'new_suspension') {
        return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<div style="min-width:36px;font-size:11px;font-weight:700;color:var(--accent2)">' + pos + '</div>'
          + '<div style="flex:1">'
            + '<div style="font-size:13px;font-weight:600">' + p.name + '</div>'
            + '<div style="font-size:11px;color:#c084fc">🚫 ' + e.reason
              + ' — ' + e.weeks + ' week' + (e.weeks !== 1 ? 's' : '')
            + '</div>'
          + '</div>'
        + '</div>';
      }
      return '';
    }).filter(Boolean).join('');

    if (!rows) return;

    var modal = document.createElement('div');
    modal.id = '_injModal';
    modal.style.cssText =
      'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99998;'
      + 'display:flex;align-items:center;justify-content:center;padding:20px';

    modal.innerHTML =
      '<div style="background:var(--bg,#0f1923);border:1px solid var(--border,#1e2d47);'
        + 'border-radius:14px;padding:20px;max-width:420px;width:100%;'
        + 'box-shadow:0 8px 40px rgba(0,0,0,.7)">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
          + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;color:#f87171">'
            + '📋 Injury / Suspension News'
          + '</div>'
          + '<button onclick="document.getElementById(\'_injModal\').remove()" '
            + 'style="width:auto;padding:2px 10px;font-size:12px;border-radius:6px">✕</button>'
        + '</div>'
        + '<div style="font-size:11px;color:var(--muted2,#4a5568);margin-bottom:10px">'
          + teamName
        + '</div>'
        + rows
        + '<button onclick="document.getElementById(\'_injModal\').remove()" '
          + 'style="width:100%;margin-top:14px;font-size:13px">Dismiss</button>'
      + '</div>';

    document.body.appendChild(modal);
    /* Close on backdrop click */
    modal.addEventListener('click', function (e) {
      if (e.target === modal) modal.remove();
    });
  }

  /* ── Hook into simulateGame to fire popup for user's team ── */
  var _prevSG = window.simulateGame;
  window.simulateGame = function (game, tMap, userStrat, uid) {
    var result = (typeof _prevSG === 'function')
      ? _prevSG.call(this, game, tMap, userStrat, uid) : undefined;

    /* Check if this game involved the user's team */
    var tid = (typeof userTeamId !== 'undefined' ? userTeamId : null)
           || ((document.getElementById('teamSelect')||{}).value);
    if (!tid) return result;
    var tMapRef = tMap || (typeof teamMap !== 'undefined' ? teamMap : null);
    if (!tMapRef || !game) return result;

    var isUserGame = game.homeTeamId === tid || game.awayTeamId === tid;
    if (!isUserGame) return result;

    /* Gather new-injury and new-suspension events for user's team */
    var events = [];
    if (game._injuryEvents && game._injuryEvents[tid]) {
      events = game._injuryEvents[tid].filter(function (e) {
        return e.type === 'new_injury' || e.type === 'new_suspension';
      });
    }

    if (events.length) {
      var myTeam = tMapRef[tid];
      var teamName = myTeam ? myTeam.city + ' ' + myTeam.nickname : 'Your Team';
      setTimeout(function () { showInjuryModal(events, teamName); }, 400);
    }

    return result;
  };

  /* ── Update the injury badge count on the tile ──────────── */
  window._updateInjuryBadge = function () {
    var badge = document.getElementById('injBadgeCount');
    if (!badge) return;
    var tid = (typeof userTeamId !== 'undefined' ? userTeamId : null)
           || ((document.getElementById('teamSelect')||{}).value);
    if (!tid || typeof getTeamById !== 'function') return;
    var team = getTeamById(tid);
    if (!team) return;
    var count = (team.roster || []).filter(function (p) {
      return (p.injury && p.injury.weeksRemaining > 0)
          || (p.suspension && p.suspension.weeksRemaining > 0);
    }).length;
    badge.style.display = count > 0 ? 'inline' : 'none';
    badge.textContent   = count;
  };

  /* ── Injury Report screen ───────────────────────────────── */
  window.renderInjuryReport = function () {
    var tid = (typeof userTeamId !== 'undefined' ? userTeamId : null)
           || ((document.getElementById('teamSelect')||{}).value);
    if (!tid || typeof getTeamById !== 'function') {
      setMainContent('<div class="welcome-hero"><p>Start a game first.</p></div>');
      return;
    }
    var team = getTeamById(tid);
    if (!team) return;

    var injured    = [];
    var suspended  = [];
    var healthy    = [];

    (team.roster || []).forEach(function (p) {
      if (p.injury && p.injury.weeksRemaining > 0) injured.push(p);
      else if (p.suspension && p.suspension.weeksRemaining > 0) suspended.push(p);
      else healthy.push(p);
    });

    function playerRow(p, statusHtml) {
      var ovr = (p.attributes && p.attributes.overall) || 70;
      var ovc = ovr>=90?'#c084fc':ovr>=85?'#60a5fa':ovr>=80?'#4ade80':ovr>=75?'#facc15':ovr>=70?'#94a3b8':'#f87171';
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;'
        + 'border-bottom:1px solid rgba(30,45,71,.3)">'
        + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:36px">' + (p.positions&&p.positions[0]||'?') + '</span>'
        + '<span style="flex:1;font-size:13px">' + p.name + '</span>'
        + '<span style="font-size:12px;font-weight:700;color:' + ovc + ';margin-right:8px">' + ovr + '</span>'
        + statusHtml
      + '</div>';
    }

    var smap = { minor:'#facc15', moderate:'#f97316', major:'#ef4444', careerThreatening:'#c084fc' };
    var slbl = { minor:'Questionable', moderate:'Out', major:'IR', careerThreatening:'Season' };

    var injRows = injured.map(function (p) {
      var col = smap[p.injury.severity] || '#f87171';
      var lbl = slbl[p.injury.severity] || p.injury.severity;
      return playerRow(p,
        '<span style="font-size:11px;color:' + col + ';font-weight:600">'
        + '🤕 ' + p.injury.type + ' — ' + lbl + ' · ' + p.injury.weeksRemaining + 'w</span>');
    }).join('');

    var susRows = suspended.map(function (p) {
      return playerRow(p,
        '<span style="font-size:11px;color:#c084fc;font-weight:600">'
        + '🚫 Suspended · ' + p.suspension.weeksRemaining + 'w</span>');
    }).join('');

    function section(title, rows, emptyMsg) {
      return '<div style="background:var(--surface);border:1px solid var(--border);'
        + 'border-radius:10px;overflow:hidden;margin-bottom:12px">'
        + '<div style="background:var(--surface2);padding:8px 12px;font-size:10px;font-weight:700;'
          + 'text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);'
          + 'border-bottom:1px solid var(--border)">' + title + '</div>'
        + (rows || '<div style="padding:10px 12px;font-size:12px;color:var(--muted2);font-style:italic">'
            + emptyMsg + '</div>')
      + '</div>';
    }

    var totalOut = injured.length + suspended.length;
    var healthyLine = healthy.length + ' player' + (healthy.length !== 1 ? 's' : '') + ' available';

    setMainContent(
      '<div style="max-width:560px;margin:0 auto">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'
        + '<button onclick="renderHome()" style="width:auto;padding:5px 12px;font-size:12px">⌂ Home</button>'
        + '<h2 style="margin:0">📋 Injury / Suspension Report</h2>'
      + '</div>'
      + (totalOut === 0
        ? '<div style="background:rgba(22,163,74,.08);border:1px solid var(--accent);border-radius:8px;'
            + 'padding:14px;text-align:center;margin-bottom:12px;color:var(--accent2);font-size:13px">'
            + '✅ No active injuries or suspensions — full squad available.'
          + '</div>'
        : '<div style="font-size:12px;color:var(--muted2);margin-bottom:12px">'
            + totalOut + ' player' + (totalOut !== 1 ? 's' : '') + ' unavailable · ' + healthyLine
          + '</div>')
      + section('Injuries (' + injured.length + ')',    injRows, 'No active injuries')
      + section('Suspensions (' + suspended.length + ')', susRows, 'No active suspensions')
      + '</div>'
    );

    window._updateInjuryBadge();
  };

  /* ── Refresh badge whenever renderHome fires ─────────────── */
  var _prevRH = window.renderHome;
  window.renderHome = function () {
    if (typeof _prevRH === 'function') _prevRH();
    setTimeout(window._updateInjuryBadge, 200);
  };

})();
</script>

<script>
/* ============================================================
   TRADE PICK MODAL — offer-card version
   Mirrors renderTradeOffers: CPU teams auto-generate packages
   of players + picks in exchange for the user's current pick.
   After accepting, closes the modal and sims to next user pick.
   ============================================================ */
window.renderTradePickModal = function () {
  var pl     = window._draftPickList;
  var absIdx = window._draftAbsIndex || 0;
  var myPick = pl && pl[absIdx];

  if (!myPick || String(myPick.curOwner) !== String(userTeamId)) {
    return;
  }

  var tv      = window.tradeValueOf    || function (p) { return (p.attributes ? p.attributes.overall * 50 : 0); };
  var pvById  = window.pickValueById   || function () { return 200; };
  var myVal   = pvById(myPick.pickId);
  var myLabel = 'Round ' + myPick.round + ', Pick ' + myPick.slot;
  var myTeam  = getTeamById(userTeamId);

  /* ── Build offers from every CPU team ── */
  function picksForTeam(cpu) {
    var out = [];
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        if (pk.curOwner === cpu.id) out.push(pk);
      });
    });
    return out.sort(function (a, b) { return pvById(b.pickId) - pvById(a.pickId); });
  }
  function picksVal(ids) {
    return ids.reduce(function (s, id) { return s + pvById(id); }, 0);
  }
  function greedyPlayers(pool, target, maxPl) {
    if (target <= 0) return [];
    var out = [], rem = target;
    pool.slice().sort(function (a, b) { return tv(b) - tv(a); }).forEach(function (p) {
      if (out.length >= maxPl) return;
      var v = tv(p);
      if (v > target * 1.30) return;
      if (v <= rem * 1.25) { out.push(p); rem -= v; }
    });
    return out;
  }
  function greedyPicks(picks, target, max) {
    var out = [], rem = target;
    picks.forEach(function (pk) {
      if (out.length >= max) return;
      var v = pvById(pk.pickId);
      if (v <= rem * 1.30) { out.push(pk.pickId); rem -= v; }
    });
    return out;
  }
  function makeOffer(cpu, players, picks, interest, need) {
    var val = players.reduce(function (s, p) { return s + tv(p); }, 0) + picksVal(picks);
    if (val <= 0) return null;
    var max = Math.max(myVal * 2.0, myVal + 1000);
    if (val > max || val < myVal * 0.35) return null;
    return { team: cpu, players: players.slice(), picks: picks.slice(),
             value: val, gap: (myVal - val) / Math.max(myVal, 1),
             interest: interest, need: need };
  }

  var offers = [];
  listAllTeams(league).forEach(function (cpu) {
    if (String(cpu.id) === String(userTeamId)) return;

    /* General need: fraction of roster spots that are thin */
    var need = 0.5;
    if (typeof getTeamNeedAtPosition === 'function') {
      var positions = ['QB','RB','WR','TE','T','G','C','EDGE','DT','LB','CB','FS','SS'];
      var totalNeed = positions.reduce(function (s, pos) {
        return s + getTeamNeedAtPosition(cpu, pos);
      }, 0);
      need = Math.min(1, totalNeed / positions.length * 2);
    }

    var interest = need * 0.55 + Math.random() * 0.55;
    if (interest < 0.32) return;

    var stretch  = Math.min(1.25, 1.0 + (need > 0.6 ? (need - 0.6) * 0.6 : 0));
    var budget   = Math.round(myVal * (0.70 + interest * 0.42) * stretch);

    var allSorted = (cpu.roster || [])
      .filter(function (p) { return p.contract && p.attributes && p.attributes.overall >= 60; })
      .sort(function (a, b) { return tv(b) - tv(a); });
    var reserve   = need >= 0.85 ? 1 : 2;
    var tradeable = allSorted.slice(reserve);
    if (!tradeable.length && allSorted.length) tradeable = allSorted.slice(1);
    var cpuPicks  = picksForTeam(cpu);

    /* Template A: players only */
    (function () {
      var p = greedyPlayers(tradeable, budget, 4);
      if (p.length) offers.push(makeOffer(cpu, p, [], interest, need));
    })();
    /* Template B: players + 1 pick */
    (function () {
      if (!cpuPicks.length) return;
      var pk1 = cpuPicks[0], pkV = pvById(pk1.pickId);
      var p = greedyPlayers(tradeable, budget - pkV, 3);
      if (p.length) offers.push(makeOffer(cpu, p, [pk1.pickId], interest, need));
    })();
    /* Template C: picks only */
    (function () {
      if (!cpuPicks.length) return;
      var pks = greedyPicks(cpuPicks, budget, 4);
      if (pks.length) offers.push(makeOffer(cpu, [], pks, interest, need));
    })();
    /* Template D: picks + 1 player */
    (function () {
      if (!cpuPicks.length || !tradeable.length) return;
      var topPks = cpuPicks.slice(0, 2).map(function (pk) { return pk.pickId; });
      var pkV    = picksVal(topPks);
      var p      = greedyPlayers(tradeable, budget - pkV, 2);
      if (p.length) offers.push(makeOffer(cpu, p, topPks, interest, need));
    })();
  });

  /* Deduplicate */
  var seen = {};
  offers = offers.filter(function (o) {
    var key = o.team.id + '|' + o.players.map(function (p) { return p.id; }).sort().join(',')
              + '|' + o.picks.slice().sort().join(',');
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
  offers.sort(function (a, b) { return a.gap - b.gap; });
  offers = offers.slice(0, 24);

  /* ── Accept handler ── */
  window._acceptPickOffer = function (idx) {
    var o = offers[idx];
    if (!o) return;

    /* Transfer user's pick to CPU */
    window.transferPick(myPick.pickId, userTeamId, o.team.id);
    var pickList = window._draftPickList || [];
    var curIdx   = window._draftAbsIndex || 0;
    if (pickList[curIdx]) pickList[curIdx].curOwner = o.team.id;

    /* Transfer CPU players to user */
    o.players.forEach(function (p) {
      o.team.roster = o.team.roster.filter(function (x) { return String(x.id) !== String(p.id); });
      if (p.contract) o.team.capUsed -= p.contract.capHitPerYear;
      myTeam.roster.push(p);
      if (p.contract) myTeam.capUsed += p.contract.capHitPerYear;
    });
    /* Transfer CPU picks to user */
    o.picks.forEach(function (id) {
      window.transferPick(id, o.team.id, userTeamId);
      pickList.forEach(function (pk) { if (pk.pickId === id) pk.curOwner = userTeamId; });
    });

    if (typeof logTradeTransaction === 'function')
      logTradeTransaction(myTeam, [], [myPick.pickId], o.team, o.players, o.picks);

    /* Close modal */
    var m = document.getElementById('_tradePickModal');
    if (m) m.remove();

    /* Decrement so advanceDraft re-processes the current slot (now CPU-owned) */
    window._draftAbsIndex = Math.max((window._draftAbsIndex || 1) - 1, 0);
    if (typeof window.advanceDraft === 'function') window.advanceDraft();
  };

  /* ── UI helpers ── */
  function ovc(v) {
    return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';
  }
  function interestLabel(i) {
    if (i >= 0.80) return { txt:'&#x1F525; Very Interested', c:'#f87171' };
    if (i >= 0.58) return { txt:'&#x2B50; Interested',      c:'#facc15' };
    return               { txt:'&#x1F4CB; Making an Offer', c:'#94a3b8' };
  }

  function offerCard(o, idx) {
    var good = o.gap < 0, fair = o.gap <= 0.12;
    var vc   = good ? '#4ade80' : fair ? '#facc15' : '#f87171';
    var vl   = good ? '&#x1F7E2; Above Market' : fair ? '&#x1F7E1; Fair Value' : '&#x1F534; Below Market';
    var pct  = Math.abs(Math.round(o.gap * 100));
    var il   = interestLabel(o.interest);

    var plRows = o.players.map(function (p) {
      return '<div style="display:flex;align-items:center;gap:7px;padding:5px 0;'
        + 'border-bottom:1px solid rgba(30,45,71,.3)">'
        + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">'
          + p.positions[0] + '</span>'
        + '<div style="flex:1"><div style="font-size:12px;font-weight:500">' + p.name + '</div>'
          + '<div style="font-size:10px;color:var(--muted2)">Age ' + p.age + '</div></div>'
        + '<span style="font-size:13px;font-weight:700;color:' + ovc(p.attributes.overall) + '">'
          + p.attributes.overall + '</span>'
        + '<span style="font-size:10px;color:var(--muted2);min-width:50px;text-align:right">'
          + tv(p).toLocaleString() + ' pts</span>'
        + '</div>';
    }).join('');

    var pkRows = o.picks.map(function (id) {
      var m2 = id.match(/_R(\d+)_Y(\d+)/);
      var origT = id.split('_R')[0];
      var via = (origT && origT !== o.team.id)
        ? ' <span style="color:var(--gold);font-size:9px">via '
          + ((getTeamById(origT)||{}).nickname||'?') + '</span>' : '';
      return '<div style="display:flex;align-items:center;gap:7px;padding:5px 0;'
        + 'border-bottom:1px solid rgba(30,45,71,.3)">'
        + '<span style="font-size:10px;font-weight:700;color:#facc15;min-width:34px">PICK</span>'
        + '<div style="flex:1;font-size:12px">'
          + (m2 ? 'Season ' + m2[2] + ' &middot; Rd ' + m2[1] : id) + via + '</div>'
        + '<span style="font-size:10px;color:var(--muted2);min-width:50px;text-align:right">'
          + pvById(id).toLocaleString() + ' pts</span>'
        + '</div>';
    }).join('');

    return '<div style="background:var(--surface);border:1px solid '
      + (good ? 'var(--accent)' : 'var(--border)') + ';border-radius:10px;'
      + 'padding:14px;margin-bottom:10px'
      + (good ? ';box-shadow:0 0 0 1px rgba(22,163,74,.15)' : '') + '">'
      + '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">'
        + '<div>'
          + '<div style="font-size:14px;font-weight:700;color:var(--accent2)">'
            + o.team.city + ' ' + o.team.nickname + '</div>'
          + '<div style="font-size:10px;color:' + il.c + ';margin-top:2px">' + il.txt + '</div>'
        + '</div>'
        + '<div style="text-align:right">'
          + '<div style="font-size:11px;font-weight:700;color:' + vc + '">' + vl + '</div>'
          + '<div style="font-size:10px;color:var(--muted2);margin-top:2px">'
            + o.value.toLocaleString() + ' vs ' + myVal.toLocaleString() + ' pts'
            + (pct > 0 ? ' (' + (good ? '+' : '-') + pct + '%)' : '')
          + '</div>'
        + '</div>'
      + '</div>'
      + (plRows || '') + (pkRows || '')
      + '<button onclick="window._acceptPickOffer(' + idx + ')" '
        + 'style="width:100%;margin-top:10px;font-size:12px;font-weight:600;'
        + 'background:' + (good ? 'var(--accent-dim)' : 'var(--surface2)') + ';'
        + 'border-color:' + (good ? 'var(--accent)' : 'var(--border)') + ';'
        + 'color:' + (good ? 'var(--accent2)' : 'var(--muted2)') + '">'
        + 'Accept Trade'
      + '</button>'
    + '</div>';
  }

  var cards = offers.length
    ? offers.map(offerCard).join('')
    : '<p style="font-size:12px;color:var(--muted2);padding:12px 0">'
      + 'No teams are making offers for this pick right now. Try again later.</p>';

  var viaNote = (myPick.origOwner !== myPick.curOwner)
    ? ' <span style="color:var(--gold);font-size:10px">(via '
      + (getTeamById(myPick.origOwner) ? getTeamById(myPick.origOwner).nickname : '?') + ')</span>'
    : '';

  /* ── Build modal ── */
  var old = document.getElementById('_tradePickModal');
  if (old) old.remove();

  var modal = document.createElement('div');
  modal.id = '_tradePickModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9100;display:flex;'
    + 'align-items:stretch;justify-content:flex-end;'
    + 'background:rgba(0,0,0,.65);backdrop-filter:blur(2px)';

  modal.innerHTML =
    '<div style="width:min(400px,96vw);background:var(--surface);'
    + 'border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column">'

      /* Header */
      + '<div style="position:sticky;top:0;background:var(--surface);'
      + 'border-bottom:1px solid var(--border);padding:12px 14px;'
      + 'display:flex;align-items:center;justify-content:space-between;z-index:1">'
        + '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;'
        + 'font-weight:700;color:#fb923c">&#x1F504; Trade Finder &mdash; Current Pick</span>'
        + '<button onclick="document.getElementById(\'_tradePickModal\').remove()" '
        + 'style="width:auto;padding:4px 10px;font-size:12px;'
        + 'background:var(--surface2);border-color:var(--border);color:var(--muted2)">&times; Close</button>'
      + '</div>'

      + '<div style="padding:14px">'

        /* Pick summary */
        + '<div style="background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:14px">'
          + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;'
          + 'letter-spacing:.8px;margin-bottom:4px">You Are Trading Away</div>'
          + '<div style="font-size:14px;font-weight:700;color:#fb923c">' + myLabel + viaNote + '</div>'
          + '<div style="font-size:11px;color:var(--muted2);margin-top:2px">Value: '
          + myVal.toLocaleString() + ' pts</div>'
        + '</div>'

        /* Offer count */
        + (offers.length
          ? '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">'
            + offers.length + ' offer' + (offers.length !== 1 ? 's' : '')
            + ' from ' + new Set(offers.map(function(o){return o.team.id;})).size
            + ' team' + (new Set(offers.map(function(o){return o.team.id;})).size !== 1 ? 's' : '')
            + ' &mdash; best deals first</div>'
          : '')

        /* Offer cards */
        + cards

      + '</div>'
    + '</div>';

  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.remove();
  });
  document.body.appendChild(modal);
};


/* ============================================================
   SIM ENTIRE SEASON
   Simulates every remaining regular-season week sequentially
   (current week through week 17) with one button press, then
   hands off to the awards / postseason phase exactly as the
   normal week-by-week path would.
   ============================================================ */
(function () {

  window.simEntireSeason = function () {
    /* Guard: schedule must be loaded */
    if (typeof schedule === 'undefined' || !schedule || !schedule.length) {
      alert('No schedule found. Start a new game first.');
      return;
    }

    /* Guard: already in postseason */
    if (window.gmPhase === 'postseason') {
      alert('The regular season is already over.');
      return;
    }

    /* Guard: already finished */
    if (currentWeekIndex >= schedule.length) {
      alert('All regular-season weeks have already been simulated.');
      return;
    }

    var remaining = schedule.length - currentWeekIndex;
    if (!confirm('Simulate all ' + remaining + ' remaining week(s) through Week 17?\n\nAll injuries, stat progressions, and weekly events will still apply \u2014 just no results screen between weeks.')) return;

    /* Build strategy from DOM (same as the normal Sim Week button) */
    var strat = {
      offPlaybook:    (document.getElementById('offPlaybook')    || { value: 'West Coast' }).value,
      offensiveStyle: (document.getElementById('offStyle')       || { value: 'Balanced'   }).value,
      defPlaybook:    (document.getElementById('defPlaybook')    || { value: '4-3'        }).value,
      defensiveStyle: (document.getElementById('defStyle')       || { value: 'Balanced'   }).value
    };

    /* Sim every remaining week */
    while (currentWeekIndex < schedule.length) {
      var week = schedule[currentWeekIndex];
      simulateWeek(week, teamMap, strat, userTeamId);
      currentWeekIndex++;
    }

    /* Sync the header week label + Sim Week button text */
    if (typeof updateWeekLabel === 'function') updateWeekLabel();

    /* Transition to awards / offseason exactly as the normal path does */
    if (typeof beginAwardsPhase === 'function') {
      beginAwardsPhase();
    } else {
      setMainContent(
        '<div class="welcome-hero">'
        + '<h2 style="color:var(--gold)">\uD83C\uDFC1 Season Complete</h2>'
        + '<p style="color:var(--muted2);font-size:13px">All 17 weeks simulated.</p>'
        + '<button onclick="typeof renderAwards===\'function\'&&renderAwards()" style="margin-top:10px">\uD83C\uDFC6 View Awards</button>'
        + '<button onclick="typeof beginFreeAgencyPhase===\'function\'&&beginFreeAgencyPhase()" style="margin-top:8px">\uD83D\uDCBC Free Agency</button>'
        + '</div>'
      );
    }
  };

})();
</script>

<script>
/* ============================================================
   PATCH — MATCHUP-AWARE STAT GENERATION

   Connects four layers to game totals and individual stats:

   TEAM POWER RATING already drives the base totals via strengthMult.
   This patch adds on top of that:

   1. POSITIONAL MATCHUPS — group OVR comparisons adjust totals:
        QB + WR/TE  vs  CB/FS/SS  → pass yards & pass TDs
        RB + OL     vs  DT/LB     → rush yards & rush TDs
        Opp EDGE/DT vs  our OL    → INTs thrown (pressure)
        Our EDGE/DT vs  opp OL    → sacks generated

   2. INDIVIDUAL OVR WEIGHTS — stat splits use each player's OVR
      instead of hardcoded ratios. A 90 OVR WR1 genuinely
      outproduces a 70 OVR WR1 given the same team totals.

   3. SCHEME FIT — each player's scheme fit (0-100) scales their
      OVR weight by 0.80×–1.20×, so players in the wrong scheme
      give up a share of production to better-fitting teammates.

   Flow:
     outermost simulateGame wrapper (this patch)
       → computes group OVRs, stores home/away._matchups on teams
       → calls prior chain (coachingPowerBoost wrapper)
           → original simulateGame
               → patched generateGameTotals (reads _matchups)
               → patched distributeStatsToPlayers (OVR weights)
   ============================================================ */
(function () {

  /* ── Group OVR helper ──────────────────────────────────────
     Average OVR of the top-n healthy starters across positions. */
  function groupOVR(team, positions, n) {
    var players = [];
    positions.forEach(function (pos) {
      (team.roster || []).forEach(function (p) {
        if (p.positions[0] === pos
            && !(p.injury     && p.injury.weeksRemaining     > 0)
            && !(p.suspension && p.suspension.weeksRemaining > 0)) {
          players.push(p);
        }
      });
    });
    players.sort(function (a, b) {
      var ra = a.depthChartRank != null ? a.depthChartRank : 999;
      var rb = b.depthChartRank != null ? b.depthChartRank : 999;
      return ra !== rb ? ra - rb : b.attributes.overall - a.attributes.overall;
    });
    var top = players.slice(0, n);
    if (!top.length) return 72;
    return top.reduce(function (s, p) { return s + p.attributes.overall; }, 0) / top.length;
  }

  /* ── Matchup multiplier ────────────────────────────────────
     +10 OVR edge → ×1.08,  -10 OVR → ×0.92.  Capped ±20%. */
  function matchupMult(ourOVR, theirOVR) {
    return Math.max(0.80, Math.min(1.20, 1.0 + (ourOVR - theirOVR) * 0.008));
  }

  /* ── 1. Patch generateGameTotals ──────────────────────────
     Reads team._matchups (set by the simulateGame wrapper)
     and adjusts the raw totals the original function produces. */
  var _origGGT = (typeof generateGameTotals !== 'undefined') ? generateGameTotals : null;
  if (_origGGT) {
    window.generateGameTotals = function (team, strengthMult, oppStrengthMult) {
      var totals = _origGGT(team, strengthMult, oppStrengthMult);
      var m = team._matchups;
      if (!m) return totals;

      /* Passing: QB/WR/TE OVR vs opponent CB/FS/SS OVR */
      totals.passYds = Math.max(60,  Math.round(totals.passYds * m.passMult));
      totals.passTDs = Math.max(0, Math.min(6, Math.round(totals.passTDs * m.passMult)));

      /* Rushing: RB+OL OVR vs opponent DT/LB OVR */
      totals.rushYds = Math.max(15,  Math.round(totals.rushYds * m.rushMult));
      totals.rushTDs = Math.max(0, Math.min(4, Math.round(totals.rushTDs * m.rushMult)));

      /* Pressure: opponent EDGE/DT vs our OL → drives INT rate up */
      totals.intThrown = Math.max(0, Math.min(4, Math.round(totals.intThrown * m.pressureMult)));

      /* Our pass rush vs opponent OL → drives sacks up */
      totals.teamSacks = Math.max(0, Math.min(8, Math.round(totals.teamSacks * m.ourRushMult)));

      /* Keep turnoversCommitted in sync */
      totals.turnoversCommitted = totals.intThrown + (totals.fumbles || 0);

      return totals;
    };
  }

  /* ── 2 & 3. Patch distributeStatsToPlayers ────────────────
     Replaces hardcoded split weights with per-player OVR × scheme-fit.
     The starter selection logic (depth rank, injury check) is unchanged. */
  window.distributeStatsToPlayers = function (team, off, def) {
    var _played = {};

    function markPlayed(players) {
      players.forEach(function (p) {
        if (!_played[p.id]) {
          p.stats.gamesPlayed = (p.stats.gamesPlayed || 0) + 1;
          _played[p.id] = true;
        }
      });
    }

    function playerOut(p) {
      return (p.injury     && p.injury.weeksRemaining     > 0)
          || (p.suspension && p.suspension.weeksRemaining > 0);
    }

    function best(pos, n) {
      var pool = (team.roster || [])
        .filter(function (p) { return p.positions.indexOf(pos) !== -1; })
        .sort(function (a, b) {
          var aOut = playerOut(a) ? 1 : 0, bOut = playerOut(b) ? 1 : 0;
          if (aOut !== bOut) return aOut - bOut;
          var ra = a.depthChartRank != null ? a.depthChartRank : 999;
          var rb = b.depthChartRank != null ? b.depthChartRank : 999;
          return ra !== rb ? ra - rb : b.attributes.overall - a.attributes.overall;
        });
      var healthy = pool.filter(function (p) { return !playerOut(p); });
      var result  = healthy.slice(0, n);
      if (result.length < n) {
        var injured = pool.filter(function (p) { return playerOut(p); });
        for (var i = 0; result.length < n && i < injured.length; i++) result.push(injured[i]);
      }
      return result;
    }

    /* Offensive weight — squared curve so stars dominate:
       70 OVR→1.00, 80 OVR→1.78, 90 OVR→2.67  (vs linear 1.0/1.33/1.67)
       Multiplied by scheme fit: 0→0.80×, 50→1.00×, 100→1.20× */
    function offWeight(p) {
      var ovr  = (p.attributes && p.attributes.overall) || 70;
      var base = Math.pow(Math.max(0.30, (ovr - 40) / 30), 2);
      var fit  = 50;
      if (typeof calculateSchemeFit === 'function') {
        try { fit = calculateSchemeFit(p, team); } catch (e) {}
      }
      return base * (0.80 + (Math.max(0, Math.min(100, fit)) / 100) * 0.40);
    }

    /* Defensive weight — power-1.5 curve (used for sacks/ints only)
       70 OVR→1.00, 80 OVR→1.49, 90 OVR→2.05 */
    function defWeight(p) {
      var ovr  = (p.attributes && p.attributes.overall) || 70;
      var base = Math.pow(Math.max(0.30, (ovr - 40) / 30), 1.5);
      var fit  = 50;
      if (typeof calculateSchemeFit === 'function') {
        try { fit = calculateSchemeFit(p, team); } catch (e) {}
      }
      return base * (0.80 + (Math.max(0, Math.min(100, fit)) / 100) * 0.40);
    }

    /* Tackle weight — flatter OVR curve (power 1.1) multiplied by a
       position role factor so the position distribution is realistic:
       LBs dominate, then Safeties, then CBs; DL get a small share.
       LB:2.0  SS/FS:1.5  CB:0.9  DT:0.45  EDGE:0.55 */
    function tackleWeight(p) {
      var ovr  = (p.attributes && p.attributes.overall) || 70;
      var base = Math.pow(Math.max(0.30, (ovr - 40) / 30), 1.1);
      var pos  = p.positions || [];
      var posMult = 0.55;
      if (pos.indexOf('LB') !== -1) {
        var rank = p.depthChartRank || 3;
        var lbMultipliers = [2.0, 1.8, 1.5, 1.0, 0.6];
        posMult = lbMultipliers[Math.min(rank - 1, 4)];
      }
      else if (pos.indexOf('SS')   !== -1) posMult = 1.50;
      else if (pos.indexOf('FS')   !== -1) posMult = 1.50;
      else if (pos.indexOf('CB')   !== -1) posMult = 0.90;
      else if (pos.indexOf('DT')   !== -1) posMult = 0.45;
      return base * posMult;
    }

    function wtsOff(players)    { return players.map(offWeight); }
    function wtsDef(players)    { return players.map(defWeight); }
    function wtsTackle(players) { return players.map(tackleWeight); }

    function split(players, total, key, wFn) {
      if (!players.length || total <= 0) return;
      wFn = wFn || wtsOff;
      var w    = wFn(players);
      var sumW = w.reduce(function (a, b) { return a + b; }, 0);
      var rem  = total;
      players.forEach(function (p, i) {
        if (rem <= 0) return;
        var share = (i === players.length - 1)
          ? Math.min(rem, Math.round(total * w[i] / sumW * 1.15))
          : Math.min(rem, Math.max(0,
              Math.round(total * w[i] / sumW * (0.85 + Math.random() * 0.30))));
        p.stats[key] = (p.stats[key] || 0) + share;
        rem -= share;
      });
    }

    function lottery(players, total, key, wFn) {
      if (!players.length || total <= 0) return;
      wFn = wFn || wtsOff;
      var w    = wFn(players);
      var sumW = w.reduce(function (a, b) { return a + b; }, 0);
      for (var n = 0; n < total; n++) {
        var r = Math.random() * sumW, cum = 0;
        for (var j = 0; j < players.length; j++) {
          cum += w[j];
          if (r <= cum) { players[j].stats[key] = (players[j].stats[key] || 0) + 1; break; }
        }
      }
    }

    /* ── QB ── */
    var qbs = best('QB', 1);
    markPlayed(qbs);
    var qb = qbs[0];
    if (qb) {
      qb.stats.passingYards        = (qb.stats.passingYards        || 0) + off.passYds;
      qb.stats.passingTD           = (qb.stats.passingTD           || 0) + off.passTDs;
      qb.stats.interceptionsThrown = (qb.stats.interceptionsThrown || 0) + off.intThrown;
      qb.stats.rushingYards        = (qb.stats.rushingYards        || 0) + randomInt(0, 30);
      if (Math.random() < 0.07) qb.stats.rushingTD = (qb.stats.rushingTD || 0) + 1;
    }

    /* ── Receiving — OVR² weighted (stars dominate) ── */
    var wrs  = best('WR', 4);
    var tes  = best('TE', 2);
    var rbR  = best('RB', 1);
    var seen = {};
    var recGrp = wrs.concat(tes).concat(rbR).filter(function (p) {
      if (seen[p.id]) return false; seen[p.id] = true; return true;
    });
    markPlayed(recGrp);
    split(recGrp,   off.passYds, 'receivingYards', wtsOff);
    lottery(recGrp, off.passTDs, 'receivingTD',    wtsOff);

    /* ── Rushing — OVR² weighted ── */
    var rbs = best('RB', 3);
    markPlayed(rbs);
    split(rbs,   off.rushYds, 'rushingYards', wtsOff);
    lottery(rbs, off.rushTDs, 'rushingTD',    wtsOff);

    /* ── OL — mark played only ── */
    markPlayed(best('T', 2));
    markPlayed(best('G', 2));
    markPlayed(best('C', 1));

    /* ── Defense — extended pools so backups get real reps ──
       Starters + depth players all see the field; OVR^1.5 weights
       mean starters lead but backups accumulate realistic totals. */
    var lbs   = best('LB',   5);   /* 3 starters + 2 depth */
    var safes = best('SS', 2).concat(best('FS', 2));  /* starter + backup each */
    var cbs   = best('CB',   5);   /* 3 starters + 2 nickel/depth */
    var dts   = best('DT',   4);   /* 2 starters + 2 depth */
    var edges = best('EDGE', 3);   /* 2 starters + 1 rotational */
    var defAll = lbs.concat(safes).concat(cbs).concat(dts).concat(edges);
    markPlayed(defAll);
    split(defAll,                                         def.teamTackles, 'tackles',       wtsTackle);
    lottery(edges.concat(dts).concat(lbs.slice(0, 1)),   def.teamSacks,   'sacks',         wtsDef);
    lottery(cbs.concat(safes),                            def.defInts,     'interceptions', wtsDef);

    /* ── Kicker ── */
    var k = best('K', 1)[0];
    if (k && !_played[k.id]) {
      k.stats.gamesPlayed = (k.stats.gamesPlayed || 0) + 1;
      _played[k.id] = true;
    }
    if (k) {
      k.stats.fieldGoalsMade   = (k.stats.fieldGoalsMade   || 0) + off.fgMade;
      k.stats.fieldGoalsMissed = (k.stats.fieldGoalsMissed || 0) + (off.fgAtt - off.fgMade);
      k.stats.xpMade           = (k.stats.xpMade           || 0) + (off.xpMade   || 0);
      k.stats.xpMissed         = (k.stats.xpMissed         || 0) + (off.xpMissed || 0);
    }
    markPlayed(best('P', 1));
  };

  /* ── 4. Outermost simulateGame wrapper ─────────────────────
     Computes positional group OVRs for both teams, stores them
     as _matchups on each team before the sim chain runs, then
     cleans up. The chain eventually calls the original
     simulateGame which now uses the two patched functions above. */
  var _prevSG = window.simulateGame;
  window.simulateGame = function (game, tMap, userStrategy, uid) {
    var home = tMap && game ? tMap[game.homeTeamId] : null;
    var away = tMap && game ? tMap[game.awayTeamId] : null;

    if (home && away) {
      /* ── Gather group OVRs ── */
      var hQB  = groupOVR(home, ['QB'],           1);
      var hRec = groupOVR(home, ['WR', 'TE'],     3);
      var hRB  = groupOVR(home, ['RB'],           2);
      var hOL  = groupOVR(home, ['T', 'G', 'C'],  5);
      var hDB  = groupOVR(home, ['CB', 'FS', 'SS'], 4);
      var hEDG = groupOVR(home, ['EDGE'],         2);
      var hDL  = groupOVR(home, ['DT', 'LB'],    4);

      var aQB  = groupOVR(away, ['QB'],           1);
      var aRec = groupOVR(away, ['WR', 'TE'],     3);
      var aRB  = groupOVR(away, ['RB'],           2);
      var aOL  = groupOVR(away, ['T', 'G', 'C'],  5);
      var aDB  = groupOVR(away, ['CB', 'FS', 'SS'], 4);
      var aEDG = groupOVR(away, ['EDGE'],         2);
      var aDL  = groupOVR(away, ['DT', 'LB'],    4);

      /* Blended offense groups */
      var hPassOff  = hQB * 0.50 + hRec * 0.50; /* home passing offense  */
      var aPassOff  = aQB * 0.50 + aRec * 0.50; /* away passing offense  */
      var hRushOff  = hOL * 0.60 + hRB  * 0.40; /* home run game         */
      var aRushOff  = aOL * 0.60 + aRB  * 0.40; /* away run game         */

      /* Blended pass-rush groups (EDGE leads, DL supports) */
      var hPassRush = hEDG * 0.70 + hDL * 0.30;
      var aPassRush = aEDG * 0.70 + aDL * 0.30;

      /* HOME team matchups (home offense vs away defense, and vice-versa) */
      home._matchups = {
        passMult:     matchupMult(hPassOff,  aDB),       /* home WR/TE vs away CBs/Ss  */
        rushMult:     matchupMult(hRushOff,  aDL),       /* home RB/OL vs away DL/LB   */
        pressureMult: matchupMult(aPassRush, hOL),       /* away pass rush vs home OL  → home INTs */
        ourRushMult:  matchupMult(hPassRush, aOL),       /* home pass rush vs away OL  → home sacks */
      };

      /* AWAY team matchups */
      away._matchups = {
        passMult:     matchupMult(aPassOff,  hDB),
        rushMult:     matchupMult(aRushOff,  hDL),
        pressureMult: matchupMult(hPassRush, aOL),       /* home pass rush vs away OL  → away INTs */
        ourRushMult:  matchupMult(aPassRush, hOL),       /* away pass rush vs home OL  → away sacks */
      };
    }

    try {
      if (typeof _prevSG === 'function') _prevSG(game, tMap, userStrategy, uid);
    } finally {
      if (home) delete home._matchups;
      if (away) delete away._matchups;
    }
  };

})();
</script>
