<script>
/* ============================================================
   PHASE 6C — PART 1
   PLAYER MORALE SYSTEM (0–100) + PERFORMANCE EFFECTS
   ============================================================ */

/* ------------------------------------------------------------
   1. Initialize Morale for All Players
------------------------------------------------------------ */

function initializeMoraleForPlayer(player) {
  if (player.morale === undefined) {
    player.morale = randomInt(60, 85); // baseline morale
    player.moraleTrend = 0;
  }
}

function initializeMoraleForLeague() {
  const teams = listAllTeams(league);
  teams.forEach(team => {
    team.roster.forEach(p => initializeMoraleForPlayer(p));
  });
  freeAgents.forEach(p => initializeMoraleForPlayer(p));
}

/* ------------------------------------------------------------
   2. Morale Update After Games
------------------------------------------------------------ */

function updateMoraleAfterGame(team, didWin) {
  team.roster.forEach(player => {
    let change = 0;

    if (didWin) change += randomInt(1, 3);
    else change -= randomInt(1, 4);

    // Starters get bigger swings
    if (player.isStarter) {
      change *= 1.3;
    }

    // Scheme fit boosts morale
    if (isSchemeFit(player, team)) {
      change += 1;
    }

    player.morale = Math.max(0, Math.min(100, player.morale + change));
    player.moraleTrend = change;
  });
}

/* ------------------------------------------------------------
   3. Scheme Fit Helper
------------------------------------------------------------ */

function isSchemeFit(player, team) {
  const pos = player.positions[0];

  if (["QB", "WR", "RB"].includes(pos)) {
    return team.coach.offenseRating >= 75;
  } else {
    return team.coach.defenseRating >= 75;
  }
}

/* ------------------------------------------------------------
   4. Morale Effects on OVR
------------------------------------------------------------ */

function getEffectiveOVR(player) {
  const base = player.attributes.overall;

  if (player.morale >= 85) return base + 3;
  if (player.morale >= 70) return base + 1;
  if (player.morale >= 40) return base;
  if (player.morale >= 20) return base - 2;
  return base - 4;
}

/* ------------------------------------------------------------
   5. Display Morale on Roster Screen
------------------------------------------------------------ */

const oldRenderRoster2 = renderRoster;

renderRoster = function() {
  oldRenderRoster2();

  const team = getTeamById(userTeamId);

  let html = `
    <h3>Player Morale</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Pos</th>
          <th>OVR</th>
          <th>Morale</th>
          <th>Trend</th>
        </tr>
      </thead>
      <tbody>
  `;

  team.roster.forEach(p => {
    initializeMoraleForPlayer(p);

    const moraleColor =
      p.morale >= 80 ? "lightgreen" :
      p.morale >= 60 ? "khaki" :
      p.morale >= 40 ? "orange" :
      "red";

    html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.positions[0]}</td>
        <td>${getEffectiveOVR(p)}</td>
        <td style="color:${moraleColor};">${p.morale}</td>
        <td>${p.moraleTrend > 0 ? "+" : ""}${p.moraleTrend}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;

  const container = document.createElement("div");
  container.innerHTML = html;

  document.getElementById("main").appendChild(container);
};
</script>
<script>
/* ============================================================
   PHASE 6C — PART 2
   TEAM CHEMISTRY SYSTEM (0–100) + PERFORMANCE EFFECTS
   ============================================================ */

/* ------------------------------------------------------------
   1. Initialize Chemistry for All Teams
------------------------------------------------------------ */

function initializeTeamChemistry() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    if (team.chemistry === undefined) {
      team.chemistry = randomInt(55, 75); // baseline chemistry
      team.chemistryTrend = 0;
    }
  });
}

/* ------------------------------------------------------------
   2. Calculate Team Chemistry Based on Factors
------------------------------------------------------------ */

function updateTeamChemistry(team) {
  const players = team.roster;

  // Average morale
  const avgMorale =
    players.reduce((sum, p) => sum + (p.morale || 60), 0) / players.length;

  // Roster stability (fewer new players = better chemistry)
  const newPlayers = players.filter(p => p.yearsWithTeam === 0).length;
  const stabilityPenalty = Math.min(10, newPlayers * 1.5);

  // Coach leadership
  const coachLeadership = team.coach.leadership;

  // Winning or losing streak
  const streak = team.winningStreak || 0;
  const streakBonus = streak * 2;

  // Star player happiness
  const stars = players.filter(p => p.attributes.overall >= 85);
  const starMorale =
    stars.reduce((sum, p) => sum + (p.morale || 60), 0) /
    Math.max(1, stars.length);

  // Chemistry formula
  let newChem =
    avgMorale * 0.4 +
    coachLeadership * 0.2 +
    starMorale * 0.2 +
    streakBonus -
    stabilityPenalty +
    10; // baseline

  newChem = Math.max(0, Math.min(100, Math.round(newChem)));

  team.chemistryTrend = newChem - team.chemistry;
  team.chemistry = newChem;
}

/* ------------------------------------------------------------
   3. Chemistry Effects on Team OVR
------------------------------------------------------------ */

function getTeamChemistryOVRModifier(team) {
  if (team.chemistry >= 85) return +5;
  if (team.chemistry >= 70) return +2;
  if (team.chemistry >= 50) return 0;
  if (team.chemistry >= 30) return -3;
  return -6;
}

/* ------------------------------------------------------------
   4. Chemistry Effects on Win Probability
------------------------------------------------------------ */

function applyChemistryToWinChance(baseChance, team) {
  const mod = getTeamChemistryOVRModifier(team);

  // Each point of modifier = ~1.5% win chance swing
  return baseChance + mod * 1.5;
}

/* ------------------------------------------------------------
   5. Display Chemistry on Team Dashboard
------------------------------------------------------------ */

function renderTeamChemistry() {
  const team = getTeamById(userTeamId);

  let color =
    team.chemistry >= 80 ? "lightgreen" :
    team.chemistry >= 60 ? "khaki" :
    team.chemistry >= 40 ? "orange" :
    "red";

  let html = `
    <h3>Team Chemistry</h3>
    <p style="color:${color}; font-size:1.2em;">
      ${team.chemistry} (${team.chemistryTrend > 0 ? "+" : ""}${team.chemistryTrend})
    </p>
    <p class="small">Chemistry affects team performance, player development, and free agency interest.</p>
  `;

  const container = document.createElement("div");
  container.innerHTML = html;

  document.getElementById("main").appendChild(container);
}

/* ------------------------------------------------------------
   6. Hook Chemistry Display into Roster Screen
------------------------------------------------------------ */

const oldRenderRosterChem = renderRoster;

renderRoster = function() {
  oldRenderRosterChem();
  renderTeamChemistry();
};

/* ------------------------------------------------------------
   7. Update Chemistry at Key Offseason Moments
------------------------------------------------------------ */

function updateAllTeamChemistry() {
  const teams = listAllTeams(league);
  teams.forEach(team => updateTeamChemistry(team));
}

/* ------------------------------------------------------------
   8. Initialize Chemistry on Load
------------------------------------------------------------ */

window.addEventListener("DOMContentLoaded", () => {
  initializeTeamChemistry();
});
</script>
<script>
/* ============================================================
   PHASE 6C — PART 3
   MORALE + CHEMISTRY INTEGRATION WITH FA, TRADES, CONTRACTS
   ============================================================ */

/* ------------------------------------------------------------
   1. Morale Impact on Free Agency Interest
------------------------------------------------------------ */

function applyMoraleToFAInterest(player, baseInterest) {
  // Low morale players want a fresh start
  if (player.morale <= 40) baseInterest += 0.15;

  // High morale players prefer stability
  if (player.morale >= 80) baseInterest -= 0.10;

  return baseInterest;
}

/* ------------------------------------------------------------
   2. Chemistry Impact on Free Agency Interest
------------------------------------------------------------ */

function applyChemistryToFAInterest(team, baseInterest) {
  if (team.chemistry >= 80) baseInterest += 0.20; // destination team
  else if (team.chemistry >= 60) baseInterest += 0.05;
  else if (team.chemistry >= 40) baseInterest -= 0.10;
  else baseInterest -= 0.20; // toxic locker room

  return baseInterest;
}

/* ------------------------------------------------------------
   3. Integrate Morale + Chemistry into FA Acceptance
------------------------------------------------------------ */

const oldEvaluateOffer = evaluateOffer;

evaluateOffer = function(player, team, salary, years) {
  let score = oldEvaluateOffer(player, team, salary, years);

  // Morale factor
  score = applyMoraleToFAInterest(player, score);

  // Chemistry factor
  score = applyChemistryToFAInterest(team, score);

  return score;
};

/* ------------------------------------------------------------
   4. Morale Impact on Contract Negotiations
------------------------------------------------------------ */

function applyMoraleToNegotiationDifficulty(player, baseScore) {
  if (player.morale >= 80) return baseScore * 1.1;  // easier to sign
  if (player.morale <= 40) return baseScore * 0.85; // harder to sign
  return baseScore;
}

const oldCalculateInterest = calculateInterest;

calculateInterest = function(player, team, salary, years) {
  let score = oldCalculateInterest(player, team, salary, years);
  return applyMoraleToNegotiationDifficulty(player, score);
};

/* ------------------------------------------------------------
   5. Chemistry Impact on Negotiations
------------------------------------------------------------ */

function applyChemistryToNegotiation(team, baseScore) {
  if (team.chemistry >= 80) return baseScore * 1.15;
  if (team.chemistry <= 40) return baseScore * 0.85;
  return baseScore;
}

const oldCalculateInterest2 = calculateInterest;

calculateInterest = function(player, team, salary, years) {
  let score = oldCalculateInterest2(player, team, salary, years);
  score = applyChemistryToNegotiation(team, score);
  return score;
};

/* ------------------------------------------------------------
   6. Morale Effects After Trades
------------------------------------------------------------ */

function applyTradeMoraleEffects(player, oldTeam, newTeam) {
  // Leaving a contender hurts morale
  if (oldTeam.chemistry >= 75) player.morale -= randomInt(3, 6);

  // Joining a contender boosts morale
  if (newTeam.chemistry >= 75) player.morale += randomInt(3, 6);

  // Being traded unexpectedly hurts morale
  player.morale -= randomInt(1, 4);

  // Cap morale between 0–100
  player.morale = Math.max(0, Math.min(100, player.morale));
}

/* ------------------------------------------------------------
   7. Integrate Morale Effects into Trade Execution
------------------------------------------------------------ */

const oldExecuteTrade2 = executeTrade;

executeTrade = function(teamA, teamB, playersA, playersB, picksA, picksB) {
  oldExecuteTrade2(teamA, teamB, playersA, playersB, picksA, picksB);

  // Apply morale effects for traded players
  playersA.forEach(p => applyTradeMoraleEffects(p, teamA, teamB));
  playersB.forEach(p => applyTradeMoraleEffects(p, teamB, teamA));
};

/* ------------------------------------------------------------
   8. Trade Requests (Low Morale)
------------------------------------------------------------ */

function checkForTradeRequests(team) {
  const requests = [];

  team.roster.forEach(player => {
    if (player.morale <= 25 && Math.random() < 0.15) {
      requests.push(player);
    }
  });

  return requests;
}

function renderTradeRequests() {
  const team = getTeamById(userTeamId);
  const requests = checkForTradeRequests(team);

  if (requests.length === 0) {
    alert("No players are requesting trades.");
    return;
  }

  let html = `
    <h2>Trade Requests</h2>
    <p class="small">These players want out due to low morale.</p>

    <ul>
  `;

  requests.forEach(p => {
    html += `<li>${p.name} (${p.positions[0]}, OVR ${p.attributes.overall})</li>`;
  });

  html += `
    </ul>
    <button onclick="renderRoster()">Back</button>
  `;

  setMainContent(html);
}

/* ------------------------------------------------------------
   9. Add Trade Request Button to Roster Screen
------------------------------------------------------------ */

window.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById("sidebar");

  const tradeReqBtn = document.createElement("button");
  tradeReqBtn.textContent = "Check Trade Requests";
  tradeReqBtn.onclick = renderTradeRequests;

  const rosterSection = Array.from(sidebar.querySelectorAll(".section"))
    .find(sec => sec.querySelector("h2")?.textContent === "Roster");

  if (rosterSection) rosterSection.appendChild(tradeReqBtn);
});
</script>
<script>
/* ============================================================
   PHASE 6D — PART 1
   COACHING CAROUSEL: JOB SECURITY + FIRINGS + HIRING
   ============================================================ */

/* ------------------------------------------------------------
   1. Coach Job Security
------------------------------------------------------------ */

function initializeCoachJobSecurity() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    if (team.coach.jobSecurity === undefined) {
      // Baseline: mid-range security
      team.coach.jobSecurity = randomInt(55, 80);
    }
  });
}

function updateCoachJobSecurityAfterSeason(team) {
  const wins = team.wins || 0;
  const losses = team.losses || 0;
  const games = wins + losses || 1;
  const winPct = wins / games;

  let delta = 0;

  // Performance
  if (winPct >= 0.7) delta += 10;
  else if (winPct >= 0.5) delta += 3;
  else if (winPct >= 0.35) delta -= 5;
  else delta -= 12;

  // Chemistry influence
  if (team.chemistry >= 80) delta += 3;
  else if (team.chemistry <= 40) delta -= 5;

  team.coach.jobSecurity = Math.max(0, Math.min(100, team.coach.jobSecurity + delta));
}

/* ------------------------------------------------------------
   2. Coach Free Agent Pool
------------------------------------------------------------ */

let coachFreeAgents = [];

function generateCoachFreeAgents() {
  coachFreeAgents = [];

  for (let i = 0; i < 15; i++) {
    coachFreeAgents.push({
      id: "coachFA_" + i,
      name: generateRookieName(), // reuse name generator
      offenseRating: randomInt(60, 95),
      defenseRating: randomInt(60, 95),
      leadership: randomInt(60, 95),
      style: Math.random() < 0.5 ? "Offensive" : "Defensive"
    });
  }
}

/* ------------------------------------------------------------
   3. Firing Logic
------------------------------------------------------------ */

function evaluateCoachFiring(team) {
  // Auto-fire if job security very low
  if (team.coach.jobSecurity <= 25) return true;

  // Very bad season + low chemistry
  const wins = team.wins || 0;
  const losses = team.losses || 0;
  const games = wins + losses || 1;
  const winPct = wins / games;

  if (winPct <= 0.3 && team.chemistry <= 45) {
    return Math.random() < 0.5;
  }

  return false;
}

function runCoachingCarousel() {
  const teams = listAllTeams(league);

  if (coachFreeAgents.length === 0) generateCoachFreeAgents();

  teams.forEach(team => {
    updateCoachJobSecurityAfterSeason(team);

    if (evaluateCoachFiring(team)) {
      // Fire coach
      logTransaction("Coach Firing", `${team.city} ${team.nickname} fired ${team.coach.name}`, team.id, null);

      // Old coach becomes FA
      coachFreeAgents.push({
        id: "coachFA_old_" + team.id,
        name: team.coach.name,
        offenseRating: team.coach.offenseRating,
        defenseRating: team.coach.defenseRating,
        leadership: team.coach.leadership,
        style: team.coach.offenseRating >= team.coach.defenseRating ? "Offensive" : "Defensive"
      });

      // Hire best available fit
      hireBestCoachForTeam(team);
    }
  });
}

/* ------------------------------------------------------------
   4. CPU Hiring Logic
------------------------------------------------------------ */

function hireBestCoachForTeam(team) {
  if (coachFreeAgents.length === 0) generateCoachFreeAgents();

  // Simple: pick highest leadership, slight bias to team weakness
  const needsOffense = (team.offenseOVR || 75) < (team.defenseOVR || 75);

  let best = null;
  let bestScore = -Infinity;

  coachFreeAgents.forEach(c => {
    let score = c.leadership * 1.2;

    if (needsOffense) score += c.offenseRating;
    else score += c.defenseRating;

    if (score > bestScore) {
      bestScore = score;
      best = c;
    }
  });

  if (!best) return;

  team.coach = {
    name: best.name,
    offenseRating: best.offenseRating,
    defenseRating: best.defenseRating,
    leadership: best.leadership,
    jobSecurity: 60
  };

  logTransaction("Coach Hiring", `${team.city} ${team.nickname} hired ${best.name}`, team.id, null);

  coachFreeAgents = coachFreeAgents.filter(c => c.id !== best.id);
}

/* ------------------------------------------------------------
   5. User Coach Hiring UI
------------------------------------------------------------ */

function renderCoachMarket() {
  if (coachFreeAgents.length === 0) generateCoachFreeAgents();

  let html = `
    <h2>Coach Market</h2>
    <p class="small">Available head coaches.</p>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Style</th>
          <th>Off</th>
          <th>Def</th>
          <th>Lead</th>
          <th>Hire</th>
        </tr>
      </thead>
      <tbody>
  `;

  coachFreeAgents
    .slice()
    .sort((a, b) => (b.leadership + b.offenseRating + b.defenseRating) - (a.leadership + a.offenseRating + a.defenseRating))
    .forEach(c => {
      html += `
        <tr>
          <td>${c.name}</td>
          <td>${c.style}</td>
          <td>${c.offenseRating}</td>
          <td>${c.defenseRating}</td>
          <td>${c.leadership}</td>
          <td><button onclick="hireCoach('${c.id}')">Hire</button></td>
        </tr>
      `;
    });

  html += `</tbody></table>
    <button onclick="renderRoster()">Back</button>
  `;

  setMainContent(html);
}

function hireCoach(coachId) {
  const team = getTeamById(userTeamId);
  const c = coachFreeAgents.find(x => x.id === coachId);
  if (!c) return;

  // Old coach to FA
  coachFreeAgents.push({
    id: "coachFA_old_user",
    name: team.coach.name,
    offenseRating: team.coach.offenseRating,
    defenseRating: team.coach.defenseRating,
    leadership: team.coach.leadership,
    style: team.coach.offenseRating >= team.coach.defenseRating ? "Offensive" : "Defensive"
  });

  team.coach = {
    name: c.name,
    offenseRating: c.offenseRating,
    defenseRating: c.defenseRating,
    leadership: c.leadership,
    jobSecurity: 70
  };

  coachFreeAgents = coachFreeAgents.filter(x => x.id !== coachId);

  logTransaction("Coach Hiring", `${team.city} ${team.nickname} hired ${c.name}`, team.id, null);

  renderRoster();
}

/* ------------------------------------------------------------
   6. UI Hook: Coach Info + Market Button
------------------------------------------------------------ */

const oldRenderRosterCoach = renderRoster;

renderRoster = function() {
  oldRenderRosterCoach();

  const team = getTeamById(userTeamId);

  let html = `
    <h3>Head Coach</h3>
    <p><strong>${team.coach.name}</strong></p>
    <p>Off: ${team.coach.offenseRating} | Def: ${team.coach.defenseRating} | Lead: ${team.coach.leadership}</p>
    <p>Job Security: ${team.coach.jobSecurity}</p>
    <button onclick="renderCoachMarket()">View Coach Market</button>
  `;

  const container = document.createElement("div");
  container.innerHTML = html;

  document.getElementById("main").appendChild(container);
};

/* ------------------------------------------------------------
   7. Initialize on Load
------------------------------------------------------------ */

window.addEventListener("DOMContentLoaded", () => {
  initializeCoachJobSecurity();
});
</script>
<script>
/* ============================================================
   PHASE 6D — PART 2
   COORDINATORS + SCHEMES + SCHEME FIT SYSTEM
   ============================================================ */

/* ------------------------------------------------------------
   1. Coordinator Schemes
------------------------------------------------------------ */

const OFFENSIVE_SCHEMES = [
  "West Coast",
  "Air Raid",
  "Spread",
  "Power Run"
];

const DEFENSIVE_SCHEMES = [
  "4-3",
  "3-4",
  "Cover 2",
  "Blitz Heavy"
];

/* ------------------------------------------------------------
   2. Initialize Coordinators for Teams
------------------------------------------------------------ */

function initializeCoordinators() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    if (!team.oc) {
      team.oc = {
        name: generateRookieName(),
        offenseRating: randomInt(60, 95),
        scheme: OFFENSIVE_SCHEMES[randomInt(0, OFFENSIVE_SCHEMES.length - 1)],
        jobSecurity: randomInt(55, 80)
      };
    }

    if (!team.dc) {
      team.dc = {
        name: generateRookieName(),
        defenseRating: randomInt(60, 95),
        scheme: DEFENSIVE_SCHEMES[randomInt(0, DEFENSIVE_SCHEMES.length - 1)],
        jobSecurity: randomInt(55, 80)
      };
    }
  });
}

/* ------------------------------------------------------------
   3. Scheme Fit Calculation
------------------------------------------------------------ */

function calculateSchemeFit(player, team) {
  /* Returns 0-100. Measures how well this player's attribute
     profile matches what the coordinator's scheme demands.

     Scheme demands:
       West Coast   — intelligent QB, disciplined route runners,
                      pass-blocking OL, receiving TE
       Air Raid     — athletic QB, fast WRs, space-eating TE
       Spread       — mobile QB, versatile athletes everywhere
       Power Run    — tough RB, strong T/G/C, physical TE blocker
       4-3          — two-gap DTs, rangy LBs, man-coverage CBs
       3-4          — athletic EDGE (must drop into coverage),
                      versatile LBs, big strong NT
       Cover 2      — disciplined CBs in zone, fast FS with range
       Blitz Heavy  — explosive EDGE, physical SS, aggressive LBs
  */

  const pos = player.positions[0];
  const a   = player.attributes || {};
  const oc  = team.oc || {};
  const dc  = team.dc || {};

  /* Helper: score an attribute check. Returns 0-30 based on how
     far above/below the threshold the player's attribute is.   */
  function attrScore(val, threshold, weight) {
    val = val || 0;
    if (val >= threshold + 10) return weight;
    if (val >= threshold)      return Math.round(weight * 0.7);
    if (val >= threshold - 10) return Math.round(weight * 0.3);
    return 0;
  }

  let fit = 50;

  /* ── OFFENSIVE POSITIONS ─────────────────────────────── */
  const OFF_POS = ['QB','RB','WR','TE','T','G','C'];
  if (OFF_POS.includes(pos)) {
    const scheme = oc.scheme || '';

    if (scheme === 'West Coast') {
      /* Needs a smart QB, disciplined route runners, receiving TE,
         pass-blocking linemen. Slow & methodical progression reads. */
      if (pos === 'QB') fit += attrScore(a.intelligence, 78, 25)
                             + attrScore(a.throwAccuracy, 78, 15)
                             - attrScore(a.speed, 82, 8);  /* scrambling hurts WC timing */
      if (pos === 'WR') fit += attrScore(a.discipline, 75, 20)
                             + attrScore(a.routeRunning || a.athleticism, 75, 15);
      if (pos === 'TE') fit += attrScore(a.catching, 75, 20)
                             + attrScore(a.routeRunning || a.intelligence, 70, 10);
      if (pos === 'RB') fit += attrScore(a.catching || a.athleticism, 72, 15);
      if (pos === 'T' || pos === 'G' || pos === 'C')
                        fit += attrScore(a.passBlock || a.intelligence, 75, 20);
    }

    if (scheme === 'Air Raid') {
      /* Needs a mobile QB who can extend plays, burner WRs,
         light protection schemes (quick release saves time). */
      if (pos === 'QB') fit += attrScore(a.speed || a.athleticism, 78, 20)
                             + attrScore(a.throwPower || a.athleticism, 78, 15);
      if (pos === 'WR') fit += attrScore(a.speed || a.athleticism, 82, 25)
                             + attrScore(a.catching, 75, 10);
      if (pos === 'TE') fit += attrScore(a.speed || a.athleticism, 75, 15)
                             + attrScore(a.catching, 78, 10);
      if (pos === 'RB') fit += attrScore(a.speed || a.athleticism, 78, 10);
      if (pos === 'T' || pos === 'G')
                        fit += attrScore(a.passBlock || a.athleticism, 72, 15);
      if (pos === 'C') fit += attrScore(a.intelligence || a.discipline, 75, 15);
    }

    if (scheme === 'Spread') {
      /* Needs a QB who reads fast, versatile athletes at every skill
         position. Space > power. Works best with athletic linemen. */
      if (pos === 'QB') fit += attrScore(a.intelligence, 75, 20)
                             + attrScore(a.speed || a.athleticism, 75, 15);
      if (pos === 'WR') fit += attrScore(a.athleticism, 78, 20)
                             + attrScore(a.speed || a.acceleration, 75, 10);
      if (pos === 'TE') fit += attrScore(a.athleticism, 72, 15);
      if (pos === 'RB') fit += attrScore(a.speed || a.athleticism, 78, 20)
                             + attrScore(a.changeOfDirection || a.athleticism, 75, 10);
      if (pos === 'T' || pos === 'G' || pos === 'C')
                        fit += attrScore(a.athleticism, 72, 12);
    }

    if (scheme === 'Power Run') {
      /* Needs a bruising RB, dominant T/G/C run blockers,
         blocking TE. QB doesn't need to be special. */
      if (pos === 'RB') fit += attrScore(a.toughness, 82, 25)
                             + attrScore(a.trucking || a.toughness, 80, 15)
                             + attrScore(a.stiffArm || a.athleticism, 75, 5);
      if (pos === 'T')  fit += attrScore(a.toughness, 80, 25)
                             + attrScore(a.runBlock || a.toughness, 78, 15);
      if (pos === 'G')  fit += attrScore(a.toughness, 80, 25)
                             + attrScore(a.runBlock || a.toughness, 80, 15);
      if (pos === 'C')  fit += attrScore(a.strength || a.toughness, 78, 20)
                             + attrScore(a.runBlock || a.toughness, 75, 15);
      if (pos === 'TE') fit += attrScore(a.toughness, 78, 20)
                             + attrScore(a.runBlock || a.toughness, 75, 10);
      if (pos === 'QB') fit += attrScore(a.toughness, 72, 10); /* pocket presence */
      if (pos === 'WR') fit += attrScore(a.toughness, 70, 8);  /* blocks downfield */
    }

    /* OC quality adds up to ±8 */
    fit += Math.floor(((oc.offenseRating || 70) - 75) / 3);
  }

  /* ── DEFENSIVE POSITIONS ─────────────────────────────── */
  const DEF_POS = ['EDGE','DT','LB','CB','FS','SS'];
  if (DEF_POS.includes(pos)) {
    const scheme = dc.scheme || '';

    if (scheme === '4-3') {
      /* Two DTs hold the A/B gaps, 3 LBs roam, CBs in man/zone.
         Values disciplined, smart front seven. */
      if (pos === 'DT') fit += attrScore(a.toughness, 80, 20)
                             + attrScore(a.blockShedding || a.toughness, 78, 15)
                             + attrScore(a.strength || a.toughness, 78, 10);
      if (pos === 'LB') fit += attrScore(a.intelligence, 75, 25)
                             + attrScore(a.tackle || a.toughness, 78, 15)
                             + attrScore(a.playRecognition || a.intelligence, 75, 10);
      if (pos === 'EDGE') fit += attrScore(a.passRush || a.athleticism, 78, 20)
                               + attrScore(a.speed || a.athleticism, 78, 10);
      if (pos === 'CB') fit += attrScore(a.manCoverage || a.discipline, 75, 20)
                            + attrScore(a.tackle || a.toughness, 70, 10);
      if (pos === 'FS') fit += attrScore(a.zoneCoverage || a.intelligence, 75, 20);
      if (pos === 'SS') fit += attrScore(a.tackle || a.toughness, 75, 20)
                            + attrScore(a.hitPower || a.toughness, 75, 10);
    }

    if (scheme === '3-4') {
      /* 3 DTs (including big NT), 4 LBs (2 OLBs must pass-rush),
         athletic EDGE who can set edge AND drop into zones. */
      if (pos === 'EDGE') fit += attrScore(a.athleticism, 83, 25)
                               + attrScore(a.passRush || a.athleticism, 80, 15)
                               + attrScore(a.speed || a.athleticism, 78, 10);
      if (pos === 'DT') fit += attrScore(a.strength || a.toughness, 82, 25)  /* NT eats blocks */
                            + attrScore(a.toughness, 80, 15);
      if (pos === 'LB') fit += attrScore(a.discipline, 75, 20)
                            + attrScore(a.athleticism, 78, 15)
                            + attrScore(a.passRush || a.athleticism, 72, 10);
      if (pos === 'CB') fit += attrScore(a.manCoverage || a.discipline, 75, 15);
      if (pos === 'FS') fit += attrScore(a.athleticism, 78, 15)
                            + attrScore(a.zoneCoverage || a.intelligence, 75, 15);
      if (pos === 'SS') fit += attrScore(a.athleticism, 78, 15);
    }

    if (scheme === 'Cover 2') {
      /* CBs own the flat zones, FS covers deep halves, LBs drop
         into hooks. Needs disciplined zone coverage everywhere. */
      if (pos === 'CB') fit += attrScore(a.zoneCoverage || a.intelligence, 78, 25)
                            + attrScore(a.discipline, 75, 15)
                            + attrScore(a.tackle || a.toughness, 72, 10);
      if (pos === 'FS') fit += attrScore(a.speed || a.athleticism, 80, 25)
                            + attrScore(a.zoneCoverage || a.intelligence, 80, 20)
                            + attrScore(a.catching || a.athleticism, 75, 10); /* range for INTs */
      if (pos === 'SS') fit += attrScore(a.discipline, 75, 15)
                            + attrScore(a.zoneCoverage || a.intelligence, 72, 15);
      if (pos === 'LB') fit += attrScore(a.intelligence, 75, 15)
                            + attrScore(a.zoneCoverage || a.discipline, 70, 10);
      if (pos === 'DT') fit += attrScore(a.toughness, 78, 15);
      if (pos === 'EDGE') fit += attrScore(a.passRush || a.athleticism, 75, 10);
    }

    if (scheme === 'Blitz Heavy') {
      /* Every snap is an attack. Needs explosive EDGE rushers,
         physical SS who can blitz, aggressive LBs. DBs must be
         able to survive in man coverage with no safety help. */
      if (pos === 'EDGE') fit += attrScore(a.toughness, 82, 25)
                               + attrScore(a.passRush || a.athleticism, 82, 20)
                               + attrScore(a.hitPower || a.toughness, 78, 10);
      if (pos === 'LB') fit += attrScore(a.athleticism, 78, 20)
                            + attrScore(a.hitPower || a.toughness, 78, 15)
                            + attrScore(a.passRush || a.athleticism, 72, 10);
      if (pos === 'SS') fit += attrScore(a.hitPower || a.toughness, 80, 25)
                            + attrScore(a.athleticism, 78, 15);
      if (pos === 'CB') fit += attrScore(a.manCoverage || a.discipline, 78, 20); /* no safety help */
      if (pos === 'FS') fit += attrScore(a.manCoverage || a.athleticism, 75, 15);
      if (pos === 'DT') fit += attrScore(a.passRush || a.toughness, 75, 15)
                            + attrScore(a.blockShedding || a.toughness, 75, 10);
    }

    /* DC quality adds up to ±8 */
    fit += Math.floor(((dc.defenseRating || 70) - 75) / 3);
  }

  return Math.max(0, Math.min(100, fit));
}

/* ------------------------------------------------------------
   4. Scheme Fit Effects on Morale + Chemistry
------------------------------------------------------------ */

function applySchemeFitMoraleEffects(team) {
  team.roster.forEach(player => {
    const fit = calculateSchemeFit(player, team);

    if (fit >= 80) player.morale += randomInt(1, 3);
    else if (fit <= 40) player.morale -= randomInt(1, 3);

    player.morale = Math.max(0, Math.min(100, player.morale));
  });
}

function applySchemeFitChemistryEffects(team) {
  const avgFit =
    team.roster.reduce((sum, p) => sum + calculateSchemeFit(p, team), 0) /
    team.roster.length;

  if (avgFit >= 75) team.chemistry += 3;
  else if (avgFit <= 45) team.chemistry -= 3;

  team.chemistry = Math.max(0, Math.min(100, team.chemistry));
}

/* ------------------------------------------------------------
   3. Scheme Matchup Matrix
------------------------------------------------------------ */

function getSchemeMatchupModifier(offScheme, defScheme) {
  // Positive = offense advantage
  // Negative = defense advantage

  const matrix = {
    "Air Raid": {
      "4-3": +5,
      "3-4": +2,
      "Cover 2": -5,
      "Blitz Heavy": -8
    },
    "West Coast": {
      "4-3": +2,

      "Cover 2": +6,

    },
    "Spread": {
      "4-3": +4,
      "3-4": +1,
      "Cover 2": -3,
      "Blitz Heavy": -6
    },
    "Power Run": {
      "4-3": -2,
      "3-4": +8,
      "Cover 2": 0,
      "Blitz Heavy": -1
    }
  };

  return matrix[offScheme]?.[defScheme] ?? 0;
}

/* ------------------------------------------------------------
   4. Coordinator Influence on Game Performance
------------------------------------------------------------ */

function getCoordinatorModifiers(team) {
  const oc = team.oc;
  const dc = team.dc;

  return {
    offenseBoost: Math.floor((oc.offenseRating - 75) / 3),
    defenseBoost: Math.floor((dc.defenseRating - 75) / 3),
    leadershipBoost: Math.floor((team.coach.leadership - 75) / 5)
  };
}

/* ------------------------------------------------------------
   5. Gameplan Effects on Win Probability
------------------------------------------------------------ */

function applyGameplanModifiers(baseChance, team) {
  /* Legacy gameplan field kept for compatibility */
  const gp = team.gameplan || 'Balanced';
  var mod = 0;

  /* Offensive style */
  if (gp === 'Run Heavy' || gp === 'Pass Heavy') mod += 2;

  /* Defensive style from weekly strategy (stored on team after each sim) */
  var defStyle = team._defStyle || 'Balanced';
  if (defStyle === 'Blitz Heavy')  mod += 3;
  if (defStyle === 'Defend Run')   mod += 1;
  if (defStyle === 'Defend Pass')  mod += 1;

  return baseChance + mod;
}

/* ------------------------------------------------------------
   6. Full Game Simulation Modifier
------------------------------------------------------------ */

function calculateTeamGameModifier(team, opponent) {
  const ocScheme = team.oc.scheme;
  const dcScheme = team.dc.scheme;

  const oppOC = opponent.oc.scheme;
  const oppDC = opponent.dc.scheme;

  // Scheme matchup
  const offenseMatchup = getSchemeMatchupModifier(ocScheme, opponent.dc.scheme);
  const defenseMatchup = -getSchemeMatchupModifier(opponent.oc.scheme, dcScheme);

  // Coordinator ratings
  const coord = getCoordinatorModifiers(team);

  // Chemistry
  const chemMod = getTeamChemistryOVRModifier(team);

  // Gameplan
  let total =
    offenseMatchup +
    defenseMatchup +
    coord.offenseBoost +
    coord.defenseBoost +
    coord.leadershipBoost +
    chemMod;

  total = applyGameplanModifiers(total, team);

  return total;
}

/* ------------------------------------------------------------
   7. Integrate Into Game Simulation (Hook)
------------------------------------------------------------ */

const oldSimulateGame = simulateGame;

simulateGame = function(game, tMap, userStrat, uid) {
  // Base simulation
  let result = oldSimulateGame(game, tMap, userStrat, uid);
  if (!result) return result;

  // Resolve team objects from the game/teamMap args
  var tMapRef = tMap || (typeof teamMap !== 'undefined' ? teamMap : {});
  var teamA = game && tMapRef ? tMapRef[game.homeTeamId] : null;
  var teamB = game && tMapRef ? tMapRef[game.awayTeamId] : null;
  if (!teamA || !teamB) return result;

  // Apply scheme + coordinator modifiers
  const modA = calculateTeamGameModifier(teamA, teamB);
  const modB = calculateTeamGameModifier(teamB, teamA);

  // Adjust win probability
  result.teamAWinChance = (result.teamAWinChance || 50) + modA;
  result.teamBWinChance = (result.teamBWinChance || 50) + modB;

  // Normalize
  const total = result.teamAWinChance + result.teamBWinChance;
  result.teamAWinChance = (result.teamAWinChance / total) * 100;
  result.teamBWinChance = (result.teamBWinChance / total) * 100;

  return result;
};

<script>
/* ============================================================
   PATCH: COACH REGRESSION SAFEGUARD
   Coaches cannot regress below their season baseline.
   ============================================================ */

/* ------------------------------------------------------------
   1. Initialize season baselines at season start
------------------------------------------------------------ */

function initializeCoachSeasonBaselines() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    const hc = team.coach;
    const oc = team.oc;
    const dc = team.dc;

    // Head Coach
    hc.seasonBaseOff = hc.offenseRating;
    hc.seasonBaseDef = hc.defenseRating;
    hc.seasonBaseLead = hc.leadership;

    // OC
    oc.seasonBaseOff = oc.offenseRating;

    // DC
    dc.seasonBaseDef = dc.defenseRating;
  });
}

/* ------------------------------------------------------------
   2. Clamp ratings but never below season baseline
------------------------------------------------------------ */

function clampCoachRatingWithBaseline(value, baseline) {
  /* Guard against undefined/NaN baseline — use 40 as the hard floor */
  var floor = (typeof baseline === 'number' && !isNaN(baseline)) ? baseline : 40;
  var v     = (typeof value   === 'number' && !isNaN(value))   ? value   : floor;
  return Math.max(floor, Math.min(99, v));
}

/* ------------------------------------------------------------
   3. Patch OC Development
------------------------------------------------------------ */

function developOC(team, gameStats) {
  const oc = team.oc;
  if (!oc) return;

  const passYds = gameStats.passYds || 0;
  const passTD = gameStats.passTD || 0;
  const rushYds = gameStats.rushYds || 0;
  const rushTD = gameStats.rushTD || 0;

  let delta = 0;

  // Passing performance
  if (passYds >= 275) delta += 1;
  if (passYds >= 325) delta += 1;
  if (passTD >= 2) delta += 1;

  // Rushing performance
  if (rushYds >= 100) delta += 1;
  if (rushYds >= 150) delta += 1;
  if (rushTD >= 1) delta += 1;

  // Scheme fit bonus
  if (oc.scheme === "Air Raid" && passYds >= 300) delta += 1;
  if (oc.scheme === "Power Run" && rushYds >= 120) delta += 1;

  // Underperformance penalty (small)
  if (passYds < 150 && rushYds < 60) delta -= 1;

  const newRating = oc.offenseRating + delta;

  oc.offenseRating = clampCoachRatingWithBaseline(
    newRating,
    oc.seasonBaseOff
  );
}

/* ------------------------------------------------------------
   4. Patch DC Development
------------------------------------------------------------ */

function developDC(team, gameStats) {
  const dc = team.dc;
  if (!dc) return;

  const ptsAllowed = gameStats.ptsAllowed || 0;
  const sacks = gameStats.sacks || 0;
  const turnovers = gameStats.turnovers || 0;
  const yardsAllowed = gameStats.yardsAllowed || 0;

  let delta = 0;

  // Strong defensive performance
  if (ptsAllowed <= 20) delta += 1;
  if (ptsAllowed <= 14) delta += 1;
  if (sacks >= 3) delta += 1;
  if (turnovers >= 2) delta += 1;

  // Scheme fit bonuses
  if (dc.scheme === "Blitz Heavy" && sacks >= 4) delta += 1;
  if (dc.scheme === "Cover 2" && ptsAllowed <= 17) delta += 1;

  // Bad defensive performance (small)
  if (ptsAllowed >= 35) delta -= 1;
  if (yardsAllowed >= 450) delta -= 1;

  const newRating = dc.defenseRating + delta;

  dc.defenseRating = clampCoachRatingWithBaseline(
    newRating,
    dc.seasonBaseDef
  );
}

/* ------------------------------------------------------------
   5. Patch Head Coach Development
------------------------------------------------------------ */

function developHeadCoach(team, gameStats, didWin) {
  const hc = team.coach;
  if (!hc) return;

  let deltaOff = 0;
  let deltaDef = 0;
  let deltaLead = 0;

  // Overachieving offense
  if (gameStats.passYds >= 300 || gameStats.rushYds >= 120) deltaOff += 1;

  // Overachieving defense
  if (gameStats.ptsAllowed <= 17) deltaDef += 1;

  // Leadership grows on wins
  if (didWin) deltaLead += 1;

  // Blowout win
  if (didWin && gameStats.margin >= 17) {
    deltaOff += 1;
    deltaDef += 1;
    deltaLead += 1;
  }

  // Embarrassing loss (small penalty)
  if (!didWin && gameStats.margin <= -21) {
    deltaOff -= 1;
    deltaDef -= 1;
    deltaLead -= 1;
  }

  // Apply with baseline protection
  hc.offenseRating = clampCoachRatingWithBaseline(
    hc.offenseRating + deltaOff,
    hc.seasonBaseOff
  );

  hc.defenseRating = clampCoachRatingWithBaseline(
    hc.defenseRating + deltaDef,
    hc.seasonBaseDef
  );

  hc.leadership = clampCoachRatingWithBaseline(
    hc.leadership + deltaLead,
    hc.seasonBaseLead
  );
}

<script>
/* ============================================================
   PHASE 6D — PART 5
   FULL COACHING CAROUSEL (BLACK MONDAY + POACHING + PROMOTIONS)

/* ------------------------------------------------------------
   1. Coach Contract Structure
------------------------------------------------------------ */

function assignCoachContract(coach) {
  coach.contractYears = randomInt(2, 5);
  coach.contractRemaining = coach.contractYears;
}

/* ------------------------------------------------------------
   2. Build HC Candidate Pool (Promotions + Free Agents)
------------------------------------------------------------ */

let headCoachCandidates = [];

function buildHeadCoachCandidatePool() {
  headCoachCandidates = [];

  const teams = listAllTeams(league);

  // 1. Add coordinator promotions
  teams.forEach(team => {
    const oc = team.oc;
    const dc = team.dc;

    // OC promotion candidate
    if (oc.offenseRating >= 80 || oc.leadership >= 75) {
      headCoachCandidates.push({
        name: oc.name,
        offenseRating: oc.offenseRating,
        defenseRating: randomInt(55, 75),
        leadership: randomInt(oc.leadership, 95),
        source: "OC Promotion",
        id: "HCcand_" + oc.name
      });
    }

    // DC promotion candidate
    if (dc.defenseRating >= 80 || dc.leadership >= 75) {
      headCoachCandidates.push({
        name: dc.name,
        offenseRating: randomInt(55, 75),
        defenseRating: dc.defenseRating,
        leadership: randomInt(dc.leadership, 95),
        source: "DC Promotion",
        id: "HCcand_" + dc.name
      });
    }
  });

  // 2. Add unemployed coaches
  coachFreeAgents.forEach(c => {
    headCoachCandidates.push({
      name: c.name,
      offenseRating: c.offenseRating,
      defenseRating: c.defenseRating,
      leadership: c.leadership,
      source: "Former HC",
      id: "HCcand_FA_" + c.name
    });
  });
}

/* ------------------------------------------------------------
   3. CPU Hiring Logic for Head Coaches
------------------------------------------------------------ */

function cpuHireHeadCoach(team) {
  if (headCoachCandidates.length === 0) buildHeadCoachCandidatePool();

  let best = null;
  let bestScore = -Infinity;

  headCoachCandidates.forEach(c => {
    let score = c.leadership * 1.5;

    // Match team weakness
    const offWeak = (team.offenseOVR || 75) < (team.defenseOVR || 75);
    if (offWeak) score += c.offenseRating;
    else score += c.defenseRating;

    // Good teams attract better coaches
    score += (team.wins || 0) * 2;

    if (score > bestScore) {
      bestScore = score;
      best = c;
    }
  });

  if (!best) return;

  team.coach = {
    name: best.name,
    offenseRating: best.offenseRating,
    defenseRating: best.defenseRating,
    leadership: best.leadership,
    jobSecurity: 60
  };

  assignCoachContract(team.coach);

  logTransaction("Coach Hiring", `${team.city} ${team.nickname} hired ${best.name} as Head Coach`, team.id, null);

  // Remove from candidate pool
  headCoachCandidates = headCoachCandidates.filter(c => c.id !== best.id);
}

/* ------------------------------------------------------------
   4. Coordinator Poaching (CPU steals your OC/DC)
------------------------------------------------------------ */

function cpuPoachCoordinators() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    // Skip user team for hiring, but they can be poached FROM
    const candidates = [];

    // Add all OCs/DCs from all teams
    teams.forEach(t => {
      if (t.id !== team.id) {
        candidates.push({
          coach: t.oc,
          type: "OC",
          team: t
        });
        candidates.push({
          coach: t.dc,
          type: "DC",
          team: t
        });
      }
    });

    // Pick best coordinator
    let best = null;
    let bestScore = -Infinity;

    candidates.forEach(c => {
      let score = c.coach.leadership * 1.2;

      if (c.type === "OC") score += c.coach.offenseRating;
      else score += c.coach.defenseRating;

      if (score > bestScore) {
        bestScore = score;
        best = c;
      }
    });

    if (!best) return;

    // Poach coordinator
    if (best.type === "OC") {
      team.oc = {
        name: best.coach.name,
        offenseRating: best.coach.offenseRating,
        scheme: best.coach.scheme,
        jobSecurity: 60
      };
    } else {
      team.dc = {
        name: best.coach.name,
        defenseRating: best.coach.defenseRating,
        scheme: best.coach.scheme,
        jobSecurity: 60
      };
    }

    logTransaction("Coordinator Poached",
      `${team.city} ${team.nickname} poached ${best.coach.name} from ${best.team.city} ${best.team.nickname}`,
      team.id,
      null
    );
  });
}

/* ------------------------------------------------------------
   5. Black Monday Firing Logic
------------------------------------------------------------ */

function runBlackMonday() {
  const teams = listAllTeams(league);

  buildHeadCoachCandidatePool();

  teams.forEach(team => {
    const hc = team.coach;

    // Contract protection
    if (hc.contractRemaining > 1 && hc.jobSecurity >= 35) return;

    // Fire if job security is awful
    if (hc.jobSecurity <= 25) {
      logTransaction("Coach Firing", `${team.city} ${team.nickname} fired ${hc.name}`, team.id, null);

      // Old HC becomes FA
      coachFreeAgents.push({
        name: hc.name,
        offenseRating: hc.offenseRating,
        defenseRating: hc.defenseRating,
        leadership: hc.leadership
      });

      // Hire replacement
      cpuHireHeadCoach(team);
    }
  });

  // Poach coordinators AFTER HC hires
  cpuPoachCoordinators();
}

/* ------------------------------------------------------------
   6. UI: Black Monday Button
------------------------------------------------------------ */

function renderBlackMonday() {
  runBlackMonday();

  let html = `
    <h2>Black Monday Complete</h2>
    <p class="small">Head coaches and coordinators have been fired, hired, and poached.</p>
    <button onclick="renderRoster()">Back</button>
  `;

  setMainContent(html);
}

  const sidebar = document.getElementById("sidebar");

  const bmBtn = document.createElement("button");
  bmBtn.textContent = "Black Monday Simulation";
  bmBtn.onclick = renderBlackMonday;

  const rosterSection = Array.from(sidebar.querySelectorAll(".section"))
    .find(sec => sec.querySelector("h2")?.textContent === "Roster");

  if (rosterSection) rosterSection.appendChild(bmBtn);
});

/* ------------------------------------------------------------
   1. Injury Regression (NEW)
------------------------------------------------------------ */

function calculateInjuryRegression(player) {
  if (!player.injuryHistory) return 0;

  let penalty = 0;

  player.injuryHistory.forEach(inj => {
    if (inj.severity === "minor") penalty -= 0.5;
    if (inj.severity === "moderate") penalty -= 1;
    if (inj.severity === "major") penalty -= 2;
    if (inj.severity === "careerThreatening") penalty -= 4;
  });

  return Math.floor(penalty);
}

/* ------------------------------------------------------------
   2. Age Regression (ALLOWED TO DROP BELOW BASELINE)
------------------------------------------------------------ */

function calculateAgeRegression(player) {
  const age = player.age;

  if (age <= 27) return 0;
  if (age <= 30) return -1;
  if (age <= 33) return -2;
  if (age <= 36) return -3;
  return -4;
}

/* ------------------------------------------------------------
   3. Apply Development (UPDATED)
------------------------------------------------------------ */

function applyPlayerDevelopment(player, team, stats) {
  const perf = calculatePerformanceGrowth(player, stats);
  const depth = getDepthChartMultiplier(player, team);
  const scheme = getSchemeFitMultiplier(player, team);
  const morale = getMoraleMultiplier(player);
  const chem = getChemistryMultiplier(team);

  // Performance-based growth (cannot drop below baseline)
  let performanceGrowth = perf * depth * scheme * morale * chem;
  performanceGrowth = Math.round(performanceGrowth);

  // Age + injury regression (CAN drop below baseline)
  const ageReg = calculateAgeRegression(player);
  const injReg = calculateInjuryRegression(player);

  // Total change
  let totalDelta = performanceGrowth + ageReg + injReg;

  // Apply performance growth with baseline protection
  let newOVR = player.attributes.overall + performanceGrowth;

  // Performance cannot drop below baseline
  if (newOVR < player.seasonBaseOVR) {
    newOVR = player.seasonBaseOVR;
  }

  // Now apply age + injury regression (allowed to drop below baseline)
  newOVR += ageReg + injReg;

  // Final clamp
  player.attributes.overall = Math.max(40, Math.min(99, Math.round(newOVR)));
}
</script>
<script>
/* ============================================================
   PHASE 6E — PART 2
   EARNED DEVELOPMENT TRAIT UPGRADES (NO RNG, NO HIDDEN TRAITS)
   ============================================================ */

/* ------------------------------------------------------------
   1. Dev Trait Tiers
------------------------------------------------------------ */

const DEV_TIERS = ["Normal", "Star", "Superstar", "X-Factor"];

function upgradeDevTrait(player) {
  const current = DEV_TIERS.indexOf(player.devTrait || "Normal");
  if (current < DEV_TIERS.length - 1) {
    player.devTrait = DEV_TIERS[current + 1];
  }
}

/* ------------------------------------------------------------
   2. Statistical Thresholds for Dev Upgrades
------------------------------------------------------------ */

function meetsStatThreshold(player, stats) {
  /* stats = player.stats (actual accumulated keys) */
  switch (player.positions[0]) {
    case 'QB':   return (stats.passingYards||0) >= 3800 || (stats.passingTD||0) >= 27;
    case 'RB':   return (stats.rushingYards||0) >= 1200 || (stats.rushingTD||0) >= 10;
    case 'WR':   return (stats.receivingYards||0) >= 1000 || (stats.receivingTD||0) >= 8;
    case 'TE':   return (stats.receivingYards||0) >= 700  || (stats.receivingTD||0) >= 6;
    case 'EDGE': return (stats.sacks||0) >= 10;
    case 'DT':   return (stats.sacks||0) >= 7;
    case 'LB':   return (stats.tackles||0) >= 110;
    case 'CB':
    case 'FS':
    case 'SS':   return (stats.interceptions||0) >= 4;
    case 'T':
    case 'G':
    case 'C':    return (stats.gamesPlayed||0) >= 15;
    case 'K':    return (stats.fieldGoalsMade||0) >= 28;
    default:     return false;
  }
}

/* ------------------------------------------------------------
   3. Team Leader Bonus
------------------------------------------------------------ */

function isTeamLeader(player, team) {
  var pos   = player.positions[0];
  var stats = player.stats || {};

  function best(filterPos, statKey) {
    return (team.roster || [])
      .filter(function(p) { return p.positions[0] === filterPos; })
      .every(function(p) { return ((p.stats || {})[statKey] || 0) <= (stats[statKey] || 0); });
  }

  switch (pos) {
    case 'WR': return best('WR', 'receivingYards');
    case 'RB': return best('RB', 'rushingYards');
    case 'QB': return best('QB', 'passingYards');
    case 'EDGE': return best('EDGE', 'sacks');
    case 'LB': return best('LB', 'tackles');
    case 'CB': case 'FS': case 'SS': return best(pos, 'interceptions');
    default: return false;
  }
}

/* ------------------------------------------------------------
   4. Award-Based Upgrades
------------------------------------------------------------ */

function awardBasedUpgrade(player) {
  if (!player.awards) return false;

  const awards = player.awards;

  if (
    awards.includes("Pro Bowl") ||
    awards.includes("All-Pro") ||
    awards.includes("MVP") ||
    awards.includes("OPOY") ||
    awards.includes("DPOY") ||
    awards.includes("ROTY")
  ) {
    return true;
  }

  return false;
}

/* ------------------------------------------------------------
   5. Apply Dev Trait Upgrades
------------------------------------------------------------ */

function applyDevTraitUpgrades() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    team.roster.forEach(player => {
      const stats = player.stats || {};   /* use p.stats, not p.seasonStats */

      const earnedStatUpgrade = meetsStatThreshold(player, stats);
      const earnedLeaderUpgrade = isTeamLeader(player, team);
      const earnedAwardUpgrade = awardBasedUpgrade(player);

      // If player earned ANY upgrade trigger
      if (earnedStatUpgrade || earnedLeaderUpgrade || earnedAwardUpgrade) {
        upgradeDevTrait(player);
      }
    });
  });
}

/* ------------------------------------------------------------
   6. Hook Into End-of-Season Flow
------------------------------------------------------------ */

function runEndOfSeasonProgression() {
  runEndOfSeasonDevelopment(); // from Part 1
  applyDevTraitUpgrades();     // new dev trait system
}
</script>

function runFullOffseason() {

     triggered by beginAwardsPhase → window.runEndOfSeasonProgression.
     Do NOT call it here too — that caused double-aging every offseason. */
  runBlackMonday();            // 6D Part 5
  applyCapRollover();

/* ------------------------------------------------------------
   2. Finalize Season Stats
------------------------------------------------------------ */

function finalizeSeasonStats() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    team.roster.forEach(player => {
      if (!player.seasonStats) player.seasonStats = {};
      // Stats already accumulated during season
    });
  });
}

/* ------------------------------------------------------------
   3. Cap Rollover
------------------------------------------------------------ */

function applyCapRollover() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    const rollover = Math.max(0, team.salaryCap - team.capUsed);
    team.salaryCap += Math.floor(rollover * 0.5); // 50% rollover
  });
}

/* ------------------------------------------------------------
   4. Contract Expirations
------------------------------------------------------------ */

function processContractExpirations() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    const remaining = [];

    team.roster.forEach(player => {
      if (player.contract && player.contract.years <= 1) {
        // Remove cap hit before releasing
        team.capUsed -= (player.contract.capHitPerYear || 0);
        // Tag with previous team before releasing so re-signings screen can find them
        player.previousTeamId = team.id;
        player.isFreeAgent = true;
        freeAgents.push(player);
      } else {
        if (player.contract) player.contract.years -= 1;
        remaining.push(player);
      }
    });

    team.roster = remaining;
    // Clamp capUsed to actual roster (catches any rounding drift)
    team.capUsed = Math.max(0, team.capUsed);
  });

  // Full recalculation as a safety net — source of truth is the roster
  recalcAllTeamCap();
}

/* Recalculate capUsed from scratch for all teams */
function recalcAllTeamCap() {
  if (!league || typeof listAllTeams !== 'function') return;
  listAllTeams(league).forEach(function (team) {
    team.capUsed = (team.roster || []).reduce(function (sum, p) {
      return sum + ((p.contract && p.contract.capHitPerYear) || 0);
    }, 0);
  });
}

window.downloadDraftTemplate = function() {
  if (!draftClass || !draftClass.length) {

  var _DRAFT_ATTR_COLS = [
    'speed','acceleration','agility','strength','stamina','awareness',

    'elusiveness','trucking','jukeMoves','spinMove','ballCarrierVision','carrying',

/* ─── Import a custom draft class from CSV/TSV ────────────────── */
window.importCustomDraftClass = function(file) {
  if (!file) return;
  var _DRAFT_ATTR_COLS = [
    'speed','acceleration','agility','strength','stamina','awareness',
    'throwPower','throwAccShort','throwAccMid','throwAccDeep',
    'elusiveness','trucking','jukeMoves','spinMove','ballCarrierVision','carrying',
    'catching','catchInTraffic','routeRunning','release','spectacularCatch',
    'passBlock','runBlock','passBlockStrength','passBlockFootwork',
    'runBlockStrength','runBlockFinesse',
    'blockShedding','tackle','powerMoves','finesseMoves',
    'pursuit','playRecognition','manCoverage','zoneCoverage','press','hitPower',
    'kickPower','kickAccuracy'
  ];
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var lines = e.target.result.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
      /* Auto-detect delimiter */
      var delim = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
      function splitRow(row) {
        if (delim === '\t') return row.split('\t').map(function(c){ return c.trim(); });
        var res = [], cur = '', inQ = false;
        for (var i = 0; i < row.length; i++) {
          var c = row[i];
          if (c === '"') { if (inQ && row[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
          else if (c === ',' && !inQ) { res.push(cur.trim()); cur=''; }
          else cur += c;
        }
        res.push(cur.trim());
        return res;
      }
      var headers = splitRow(lines[0]).map(function(h){ return h.trim().toLowerCase().replace(/[^a-z_]/g,''); });
      var iName   = headers.indexOf('name');
      var iPos    = headers.indexOf('position');
      var iAge    = headers.indexOf('age');
      var iDev    = headers.indexOf('devtrait');
      var iOvr    = headers.indexOf('overall');

      if (iName < 0 || iPos < 0) {
        if (typeof _toast==='function') _toast('⚠ CSV must have name and position columns', false);
        return;
      }

      /* headers[] are lowercased+stripped — normalise the key the same way
         before looking it up, then store under the original camelCase key  */
      var attrIdx = {};
      _DRAFT_ATTR_COLS.forEach(function(k) {
        var normKey = k.toLowerCase().replace(/[^a-z_]/g, '');
        var idx = headers.indexOf(normKey);
        if (idx >= 0) attrIdx[k] = idx;
      });

      var prospects = [];
      for (var i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        var cols = splitRow(lines[i]);
        var pos  = (cols[iPos] || 'QB').trim().toUpperCase();
        var name = (cols[iName] || 'Unknown').trim();
        var age  = parseInt(cols[iAge]) || 21;
        var dev  = iDev >= 0 ? (cols[iDev] || 'Normal').trim() : 'Normal';
        if (['Normal','Star','Superstar','X-Factor'].indexOf(dev) < 0) dev = 'Normal';

        /* Build granular attribute bag */
        var g = {};
        _DRAFT_ATTR_COLS.forEach(function(k) {
          if (attrIdx[k] !== undefined) {
            var val = parseInt(cols[attrIdx[k]]);
            g[k] = isNaN(val) ? 60 : Math.max(20, Math.min(99, val));
          }
        });

        /* Derive OVR — use calcPosOVR if available, else legacy overall col, else 72 */
        var overall = 72;
        if (Object.keys(g).length && typeof window.calcPosOVR === 'function') {
          overall = window.calcPosOVR(g, pos);
        } else if (iOvr >= 0) {
          overall = parseInt(cols[iOvr]) || 72;
        }
        overall = Math.max(40, Math.min(99, overall));

        var comp = { athleticism:72, intelligence:72, toughness:72, discipline:72 };
        if (Object.keys(g).length && typeof window.deriveComposites === 'function') {
          comp = window.deriveComposites(g);
        }

        var positions = typeof generatePositionsForPlayer === 'function'
          ? generatePositionsForPlayer(pos) : [pos];

        var p = {
          id           : 'rookie_' + (typeof globalPlayerId !== 'undefined' ? globalPlayerId++ : Math.floor(Math.random()*1e8)),
          name         : name,
          positions    : positions,
          age          : age,
          devTrait     : dev !== 'Normal' ? dev : undefined,
          attributes   : {
            overall      : overall,
            athleticism  : comp.athleticism,
            intelligence : comp.intelligence,
            toughness    : comp.toughness,
            discipline   : comp.discipline
          },
          granularAttrs: Object.keys(g).length ? g : undefined,
          contract     : null,
          stats        : typeof defaultPlayerStats === 'function' ? defaultPlayerStats() : {},
          isRookie     : true
        };
        prospects.push(p);
      }

      if (!prospects.length) {
        if (typeof _toast==='function') _toast('⚠ No valid prospects found in file', false);
        return;
      }

      /* Replace the draft class */
      draftClass = prospects;
      window._customDraftImported = { count: prospects.length };

      /* Update badge if hub is still open */
      var badge = document.getElementById('_draftImportBadge');
      if (badge) {
        badge.innerHTML = '✅ ' + prospects.length + ' custom prospects loaded';
        badge.style.display = 'block';
      }
      if (typeof _toast==='function') _toast('✅ Draft class imported — ' + prospects.length + ' prospects', true);

    } catch(err) {
      if (typeof _toast==='function') _toast('⚠ Import failed: ' + err.message, false);
    }
  };
  reader.readAsText(file);
};

<script>
/* ============================================================
   PHASE 6F — PART 2
   CPU OFFSEASON LOGIC (RE-SIGN, FA, DRAFT, ROSTER, DEPTH CHART)
   ============================================================ */

/* ------------------------------------------------------------
   1. CPU Re-Signing Logic
------------------------------------------------------------ */

function cpuRunResignings() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    if (team.id === userTeamId) return;

    const expiring = freeAgents.filter(p => p.previousTeamId === team.id);

    expiring.forEach(player => {
      const mv = calculateMarketValue(player);
      const interest = calculateInterest(player, team, mv.capHitPerYear, mv.years);

      // Simple threshold: if interest is high and cap space exists, re-sign
      if (interest >= 0.6 && team.capUsed + mv.capHitPerYear <= team.salaryCap) {
        signPlayerToTeam(player, team, mv.capHitPerYear, mv.years);
      }
    });
  });
}

/* ------------------------------------------------------------
   2. CPU Free Agency Bidding
------------------------------------------------------------ */

function cpuRunFreeAgency() {
  const teams = listAllTeams(league);

  freeAgents.forEach(player => {
    let bestTeam = null;
    let bestScore = -Infinity;
    let bestOffer = null;

    teams.forEach(team => {
      if (team.id === userTeamId) return;

      const mv = calculateMarketValue(player);
      if (team.capUsed + mv.capHitPerYear > team.salaryCap) return;

      const interest = evaluateOffer(player, team, mv.capHitPerYear, mv.years);

      // Weight by team need at position
      const need = getTeamNeedAtPosition(team, player.positions[0]);
      const score = interest + need * 0.3;

      if (score > bestScore) {
        bestScore = score;
        bestTeam = team;
        bestOffer = mv;
      }
    });

    if (bestTeam && bestOffer) {
      signPlayerToTeam(player, bestTeam, bestOffer.capHitPerYear, bestOffer.years);
    }
  });
}

/* ------------------------------------------------------------
   3. Team Need Evaluation
------------------------------------------------------------ */

function getTeamNeedAtPosition(team, pos) {
  const playersAtPos = team.roster.filter(p => p.positions[0] === pos);

  if (playersAtPos.length === 0) return 1.0;

  const avgOVR =
    playersAtPos.reduce((sum, p) => sum + p.attributes.overall, 0) /
    playersAtPos.length;

  if (avgOVR >= 85) return 0.0;
  if (avgOVR >= 80) return 0.2;
  if (avgOVR >= 75) return 0.5;
  if (avgOVR >= 70) return 0.7;
  return 1.0;
}

/* ------------------------------------------------------------
   4. CPU Draft Strategy
------------------------------------------------------------ */

function cpuRunDraft() {
  const teams = listAllTeams(league);

  // Assume draftOrder is an array of team IDs in pick order
  draftOrder.forEach(teamId => {
    const team = teams.find(t => t.id === teamId);
    if (!team) return;

    const bestPlayer = cpuSelectBestDraftPlayerForTeam(team);
    if (!bestPlayer) return;

    team.roster.push(bestPlayer);
    draftClass = draftClass.filter(p => p.id !== bestPlayer.id);
  });
}

function cpuSelectBestDraftPlayerForTeam(team) {
  let best = null;
  let bestScore = -Infinity;

  draftClass.forEach(player => {
    const pos = player.positions[0];
    const need = getTeamNeedAtPosition(team, pos);
    const ovr = player.attributes.overall;

    let score = ovr + need * 20;

    // Dev trait bonus
    if (player.devTrait === "Star") score += 3;
    if (player.devTrait === "Superstar") score += 6;
    if (player.devTrait === "X-Factor") score += 10;

    if (score > bestScore) {
      bestScore = score;
      best = player;
    }
  });

  return best;
}

/* ------------------------------------------------------------
   5. CPU Roster Balancing
------------------------------------------------------------ */

function cpuBalanceRosters() {
  const teams = listAllTeams(league);

  const idealCounts = {
    QB: 3,
    RB: 4,
    WR: 6,
    TE: 3,
    OL: 9,
    DL: 8,
    EDGE: 4,
    LB: 6,
    CB: 6,
    S: 4,
    K: 1,
    P: 1
  };

  teams.forEach(team => {
    // Cut excess
    Object.keys(idealCounts).forEach(pos => {
      let playersAtPos = team.roster.filter(p => p.positions[0] === pos);

      while (playersAtPos.length > idealCounts[pos]) {
        const cut = playersAtPos.sort((a, b) => a.attributes.overall - b.attributes.overall)[0];
        freeAgents.push(cut);
        team.roster = team.roster.filter(p => p.id !== cut.id);
        playersAtPos = team.roster.filter(p => p.positions[0] === pos);
      }
    });
  });
}

/* ------------------------------------------------------------
   6. CPU Depth Chart Logic
------------------------------------------------------------ */

function cpuSetDepthCharts() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    const byPos = {};

    team.roster.forEach(p => {
      const pos = p.positions[0];
      if (!byPos[pos]) byPos[pos] = [];
      byPos[pos].push(p);
    });

    Object.keys(byPos).forEach(pos => {
      byPos[pos].sort((a, b) => b.attributes.overall - a.attributes.overall);
      byPos[pos].forEach((p, idx) => {
        p.depthChartRank = idx + 1;
      });
    });
  });
}

/* ------------------------------------------------------------
   7. Integrate CPU Logic into Offseason Flow
------------------------------------------------------------ */

function runFullOffseasonCPU() {
  // CPU re-signings
  cpuRunResignings();

  // CPU free agency
  cpuRunFreeAgency();

  // CPU draft
  cpuRunDraft();

  // Roster balancing + depth charts
  // (runUDFA fires in beginNewSeason after the user's draft completes)
  cpuBalanceRosters();
  cpuSetDepthCharts();
}

/* ------------------------------------------------------------
   8. Hook CPU Offseason into Offseason Hub
------------------------------------------------------------ */

function runFullOffseason() {
  finalizeSeasonStats();
  /* NOTE: runEndOfSeasonProgression fires via beginAwardsPhase — do NOT call here too. */
  runBlackMonday();            // coaching carousel
  applyCapRollover();
  /* NOTE: processContractExpirations fires inside beginFreeAgencyPhase — do NOT call here too.
     Calling it here AND there was decrementing contract years twice every offseason,
     causing players on multi-year deals to become free agents a season early. */

  // CPU handles its own re-signings + FA + draft
  runFullOffseasonCPU();

  // User goes through re-signings + FA + draft via UI
  renderResigningsHub();
}

<script>
/* ============================================================
   COMPATIBILITY PATCH
   The Phase 6D simulateGame overrides were written for a different
   API (expecting a result object with teamAWinChance/statsA etc.)
   but the original returns undefined. The overrides also receive
   (game, teamMap) and treat them as (teamA, teamB) team objects.

   This patch:
   1. Makes calculateTeamGameModifier null-safe so it doesn't crash
      when passed a game object instead of a team object.
   2. Wraps the override chain in try-catch so if the Phase 6D
      post-processing crashes, the game state (already updated by
      the original function) is preserved.
   ============================================================ */
(function() {
  // 1. Null-safe calculateTeamGameModifier
  var _origMod = calculateTeamGameModifier;
  calculateTeamGameModifier = function(team, opponent) {
    if (!team || !team.oc || !team.dc) return 0;
    if (!opponent || !opponent.oc || !opponent.dc) return 0;
    try { return _origMod(team, opponent); } catch(e) { return 0; }
  };

  // 2. Null-safe getCoordinatorModifiers
  var _origCoord = getCoordinatorModifiers;
  getCoordinatorModifiers = function(team) {
    if (!team || !team.oc || !team.dc || !team.coach)
      return { offenseBoost: 0, defenseBoost: 0, leadershipBoost: 0 };
    try { return _origCoord(team); } catch(e) {
      return { offenseBoost: 0, defenseBoost: 0, leadershipBoost: 0 };
    }
  };

  // 3. Wrap the simulateGame override chain in try-catch.
  //    The original simulation always runs first and updates all
  //    game state (scores, wins/losses, player stats) before any
  //    Phase 6D code can crash. We catch and swallow the crash.
  var _chain = simulateGame;
  simulateGame = function(game, teamMap, userStrategy, userTeamId) {
    try {
      _chain(game, teamMap, userStrategy, userTeamId);
    } catch(e) {
      // Phase 6D post-processing failed; game outcome already recorded.
    }
  };
})();

  team.roster.forEach(function(p) {
    var pos = p.positions[0];
    if (byPos[pos]) byPos[pos].push(p);
  });

  POSITIONS.forEach(function(pos) {
    var group = byPos[pos];
    /* Sort: existing ranks first, then by OVR for unranked players */
    group.sort(function(a, b) {
      var ra = a.depthChartRank != null ? a.depthChartRank : 999;
      var rb = b.depthChartRank != null ? b.depthChartRank : 999;
      if (ra !== rb) return ra - rb;
      return b.attributes.overall - a.attributes.overall;
    });
    /* Re-number sequentially to keep ranks tidy */
    group.forEach(function(p, i) { p.depthChartRank = i + 1; });
  });
}

/* ── Get roster grouped and sorted by position ─────────── */
function getDepthByPos(team) {
  var byPos = {};
  POSITIONS.forEach(function(pos) { byPos[pos] = []; });
  team.roster.forEach(function(p) {
    var pos = p.positions[0];
    if (byPos[pos]) byPos[pos].push(p);
  });
  POSITIONS.forEach(function(pos) {
    byPos[pos].sort(function(a, b) {
      return (a.depthChartRank || 999) - (b.depthChartRank || 999);
    });
  });
  return byPos;
}

/* ── Move a player one slot up in their position group ─── */
/* ── Tap-to-select, tap-to-swap depth chart ──────────────────
   First tap  : select a player (highlighted).
   Second tap : swap selected player with tapped player
                (must be in the same position group).
   Same player: deselect.
──────────────────────────────────────────────────────────── */
window._dcSelectedId = null;

window.dcSelectPlayer = function(playerId) {
  var sel = window._dcSelectedId;

  /* Save scroll position so the page doesn't jump to top on re-render */
  function _rdcKeepScroll() {
    var m = document.getElementById('main');
    var savedTop = m ? m.scrollTop : 0;
    renderDepthChart();
    if (m) m.scrollTop = savedTop;
  }

  /* Tapping the already-selected player = deselect */
  if (sel && String(sel) === String(playerId)) {
    window._dcSelectedId = null;
    _rdcKeepScroll();
    return;
  }

  var team = getTeamById(userTeamId);
  if (!team) return;

  /* If nothing selected yet, just select this player */
  if (!sel) {
    window._dcSelectedId = playerId;
    _rdcKeepScroll();
    return;
  }

  /* A different player is already selected — attempt swap */
  var pA = team.roster.find(function(p) { return String(p.id) === String(sel); });
  var pB = team.roster.find(function(p) { return String(p.id) === String(playerId); });

  if (!pA || !pB) { window._dcSelectedId = null; _rdcKeepScroll(); return; }

  /* Must be same position group */
  if (pA.positions[0] !== pB.positions[0]) {
    /* Different position — start a fresh selection */
    window._dcSelectedId = playerId;
    _rdcKeepScroll();
    return;
  }

  /* Swap their depthChartRanks */
  var tmp = pA.depthChartRank;
  pA.depthChartRank = pB.depthChartRank;
  pB.depthChartRank = tmp;

  window._dcSelectedId = null;
  _rdcKeepScroll();
};

/* Keep old arrow functions as no-ops for safety */
window.dcMoveUp   = function() {};
window.dcMoveDown = function() {};



/* ── Render ────────────────────────────────────────────── */
function renderDepthChart() {
  if (!userTeamId) return;
  var team = getTeamById(userTeamId);
  if (!team) return;

  ensureDepthChart(team);
  var byPos = getDepthByPos(team);

  /* Dev-trait badge helper */
  function traitBadge(player) {
    var t = player.devTrait;
    if (!t || t === 'Normal') return '';
    var cls = t === 'Star' ? 'dc-badge-star'
            : t === 'Superstar' ? 'dc-badge-ss'
            : t === 'X-Factor' ? 'dc-badge-xfactor'
            : '';
    return cls ? '<span class="dc-badge ' + cls + '">' + t + '</span>' : '';
  }

  /* OVR colour helper */
  function ovrColor(ovr) {
    if (ovr >= 90) return '#c084fc';
    if (ovr >= 85) return '#60a5fa';
    if (ovr >= 80) return '#4ade80';
    if (ovr >= 75) return '#facc15';
    if (ovr >= 70) return var_fallback;
    return '#ef4444';
  }
  /* can't use CSS vars in JS easily — use muted2 fallback */
  var var_fallback = '#94a3b8';

  /* Render one position group */
  function renderGroup(pos) {
    var players = byPos[pos] || [];
    if (!players.length) return '';

    var rows = players.map(function(p, i) {
      var starter  = i === 0;
      var canUp    = i > 0;
      var canDown  = i < players.length - 1;
      var ovr      = p.attributes.overall;

      var rankCell = starter
        ? '<span style="color:var(--accent2);font-size:11px">●</span>'
        : '<span>' + (i + 1) + '</span>';

      var upBtn   = canUp   ? '<button class="dc-arr" onclick="window._dcMove(\''+p.id+'\',-1)">▲</button>' : '<span class="dc-arr-ph"></span>';
      var downBtn = canDown ? '<button class="dc-arr" onclick="window._dcMove(\''+p.id+'\',1)">▼</button>'  : '<span class="dc-arr-ph"></span>';

      return '<div class="dc-row' + (starter ? ' dc-starter' : '') + '">' +
        '<div class="dc-rank">' + rankCell + '</div>' +
        '<div class="dc-info">' +
          '<span class="dc-name">' + p.name + '</span>' +
          '<span class="dc-meta" style="color:' + ovrColor(ovr) + '">' +
            'OVR ' + ovr +
          '</span>' +
        '</div>' +
        traitBadge(p) +
        '<div class="dc-arrows">' + upBtn + downBtn + '</div>' +
      '</div>';
    }).join('');

    return '<div class="dc-group">' +
      '<div class="dc-pos-header">' + pos + '</div>' +
      rows +
    '</div>';
  }

  /* Render a labelled section (Offense / Defense / Special) */
  function section(label, positions) {
    var groups = positions.map(renderGroup).join('');
    if (!groups) return '';
    return '<div class="dc-section-label">' + label + '</div>' +
           '<div class="dc-grid">' + groups + '</div>';
  }

  var html =
    '<h2>' + team.city + ' ' + team.nickname + ' — Depth Chart</h2>' +
    '<p class="small" style="margin-bottom:14px">' +
      '● = starter &nbsp;|&nbsp; ▲▼ to reorder within a position' +
    '</p>' +
    section('Offense',       ['QB','RB','WR','TE','OL']) +
    section('Defense',       ['EDGE','DT','LB','CB','S']) +
    section('Special Teams', ['K','P']);

  setMainContent(html);
}

/* ── Wire button on DOMContentLoaded ───────────────────── */
window.addEventListener('DOMContentLoaded', function() {
  var btn = document.getElementById('btnDepthChart');
  if (btn) btn.addEventListener('click', renderDepthChart);
});
</script>

<script>
/* ============================================================
   SEASON PROGRESSION SYSTEM
   Hides offseason features from the sidebar and triggers them
   in the correct NFL calendar order:
     Regular Season → Awards → Black Monday →
     Free Agency → Draft → New Season
   ============================================================ */

(function() {

  /* ── Utility ──────────────────────────────────────────── */
  function showSection(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = '';
  }
  function hideSection(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = 'none';
  }
  function phaseCard(title, sub, body, buttons) {

  /* ── Wire the Transactions section buttons ───────────── */
  window.addEventListener('DOMContentLoaded', function() {
