/* ------------------------------------------------------------
   Rookie Name Generator
------------------------------------------------------------ */

const ROOKIE_FIRST_NAMES = [
  "Jayden","Khalil","Darius","Trevon","Zay","Micah","Javon","Tyrese",
  "Roman","Kade","Braylon","Amari","Jett","Kason","DeShawn","Tariq",
  "Elijah","Kamari","Zion","Devin","Jalen","Xavier","Kyrie","Bryce"
];

const ROOKIE_LAST_NAMES = [
  "Henderson","Carter","Mitchell","Bennett","Douglas","Reed","Walker",
  "Simmons","Harris","Wright","Thompson","Brooks","Foster","Hayes",
  "Parker","Coleman","Stevens","Gibson","Marshall","Grant","Dixon"
];

function generateRookieName() {
  return (
    ROOKIE_FIRST_NAMES[randomInt(0, ROOKIE_FIRST_NAMES.length - 1)] +
    " " +
    ROOKIE_LAST_NAMES[randomInt(0, ROOKIE_LAST_NAMES.length - 1)]
  );
}

/* ------------------------------------------------------------
   Rookie Attribute Curves (more variance than veterans)
------------------------------------------------------------ */

function generateRookieAttributes(position) {
  /* Use granular system when available — same pipeline as veterans but
     with 'rookie' tier so the target OVR follows N(72, 6).            */
  if (window.POS_BIAS && window.ATTR_LABELS && window.deriveComposites && window.calcPosOVR) {
    var result = _generateAttrsGranular(position, 'rookie');
    result.attrs._granularBag = result.granular;
    return result.attrs;
  }
  /* Safety fallback */
  var overall = Math.max(50, Math.min(96, Math.round(72 + (Math.random() - 0.5) * 16)));
  return { overall: overall,
           athleticism: randomInt(50, 85), intelligence: randomInt(50, 85),
           toughness:   randomInt(50, 85), discipline:   randomInt(50, 85) };
}

/* ------------------------------------------------------------
   Rookie Position Generator (weighted by NFL draft tendencies)
------------------------------------------------------------ */

function generateRookiePosition() {
  /* Uses exact roster positions (T/G/C for OL, FS/SS for S) */
  /* Weights increased for QB, TE, C, K, P, SS, FS per user request */
  const weighted = [
    "QB","QB","QB","QB",
    "RB","RB","RB",
    "WR","WR","WR","WR",
    "TE","TE","TE","TE",
    "T","T","T","T",
    "G","G","G",
    "C","C","C","C",
    "EDGE","EDGE","EDGE",
    "DT","DT",
    "LB","LB","LB",
    "CB","CB","CB","CB",
    "FS","FS","FS","FS",
    "SS","SS","SS","SS",
    "K","K","K",
    "P","P","P"
  ];
  return weighted[randomInt(0, weighted.length - 1)];
}

/* ------------------------------------------------------------
   Rookie Player Object
------------------------------------------------------------ */

function generateRookie(pos) {
  if (!pos) pos = generateRookiePosition();
  var attributes  = generateRookieAttributes(pos);
  var granularBag = attributes._granularBag || null;
  delete attributes._granularBag;
  var player = {
    id: "rookie_" + globalPlayerId++,
    name: generateRookieName(),
    positions: [pos],
    age: randomInt(20, 23),
    attributes: attributes,
    contract: null,
    stats: defaultPlayerStats(),
    isRookie: true
  };
  if (granularBag) player.granularAttrs = granularBag;
  return player;
}

/* ------------------------------------------------------------
   Draft Class Generator (7 rounds × 32 picks = 224 rookies)
   Guarantees minimum counts per position so every roster slot
   is always addressable in the draft.
------------------------------------------------------------ */

let draftClass = []; // array of rookie players

var DRAFT_POSITION_MINS = {
  QB:16, RB:14, WR:24, TE:16,
  T:14, G:10, C:14,
  EDGE:16, DT:12, LB:16,
  CB:20, FS:16, SS:16,
  K:12, P:12
};

function generateDraftClass() {
  draftClass = [];
  const TOTAL_PICKS = 400; // 400 prospects per draft class

  /* Build a pool that guarantees minimums per position */
  var pool = [];
  Object.keys(DRAFT_POSITION_MINS).forEach(function(pos) {
    for (var i = 0; i < DRAFT_POSITION_MINS[pos]; i++) pool.push(pos);
  });

  /* Fill remaining slots with weighted random picks */
  while (pool.length < TOTAL_PICKS) {
    pool.push(generateRookiePosition());
  }

  /* Fisher-Yates shuffle so picks aren't grouped by position */
  for (var i = pool.length - 1; i > 0; i--) {
    var j = randomInt(0, i);
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  for (var i = 0; i < TOTAL_PICKS; i++) {
    draftClass.push(generateRookie(pool[i]));
  }
}

/* ------------------------------------------------------------

------------------------------------------------------------ */

function renderDraftClassPreview() {

        <td>${p.positions[0]}</td>

        <td>${p.attributes.overall}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;

  setMainContent(html);
}

<script>
/* ============================================================
   PHASE 5 — PART 4 (UPGRADED)
   DYNAMIC PLAYER + PICK TRADING SYSTEM

/* ------------------------------------------------------------
   1. PICK VALUE CHART (Dynamic)
------------------------------------------------------------ */

function getPickValue(round, pick) {
  // Base chart (approximate Jimmy Johnson chart)
  const baseChart = {
    1: 3000, 2: 2600, 3: 2200, 4: 1800, 5: 1600, 6: 1400, 7: 1300,
    8: 1200, 9: 1150, 10: 1100, 11: 1050, 12: 1000, 13: 950, 14: 900,
    15: 850, 16: 800, 17: 750, 18: 700, 19: 650, 20: 600, 21: 550,
    22: 500, 23: 450, 24: 400, 25: 350, 26: 300, 27: 250, 28: 200,
    29: 150, 30: 100, 31: 75, 32: 50
  };

  let value = baseChart[pick] || 50;

  // Round multiplier
  const roundMultiplier = {
    1: 1.0,
    2: 0.45,
    3: 0.25,
    4: 0.15,
    5: 0.10,
    6: 0.06,
    7: 0.03
  };

  value *= roundMultiplier[round];

  // Draft class strength modifier
  const classStrength = 0.9 + Math.random() * 0.2; // 0.9–1.1
  value *= classStrength;

  return Math.round(value);
}

/* ------------------------------------------------------------
   2. PLAYER VALUE MODEL (Dynamic)
------------------------------------------------------------ */

function getPlayerValue(player) {
  const ovr = player.attributes.overall;
  const age = player.age;

  // Potential = average of attributes
  const potential =
    (player.attributes.athleticism +
     player.attributes.intelligence +
     player.attributes.toughness +
     player.attributes.discipline) / 4;

  // Base value from OVR
  let value = ovr * 40;

  // Age curve
  if (age <= 24) value *= 1.25;
  else if (age <= 27) value *= 1.1;
  else if (age <= 30) value *= 0.9;
  else value *= 0.7;

  // Potential modifier
  value *= (potential / 80);

  // Contract efficiency
  if (player.contract) {
    const efficiency = (player.attributes.overall * 200000) / player.contract.capHitPerYear;
    value *= Math.min(1.3, Math.max(0.7, efficiency));
  }

  // Positional scarcity
  const scarcePositions = ["QB", "EDGE", "CB"];
  if (scarcePositions.includes(player.positions[0])) {
    value *= 1.2;
  }

  return Math.round(value);
}

/* ------------------------------------------------------------
   3. TEAM NEEDS (Moderate GM Logic)
------------------------------------------------------------ */

function evaluateTeamNeeds(team) {
  const counts = {};
  POSITIONS.forEach(pos => counts[pos] = 0);

  team.roster.forEach(p => {
    counts[p.positions[0]]++;
  });

  const needs = {};
  POSITIONS.forEach(pos => {
    if (counts[pos] < 3) needs[pos] = 1.3; // high need
    else if (counts[pos] < 5) needs[pos] = 1.1; // moderate need
    else needs[pos] = 1.0; // no need
  });

  return needs;
}

/* ------------------------------------------------------------
   4. TRADE EVALUATION
------------------------------------------------------------ */

function evaluateTrade(teamAAssets, teamBAssets, teamA, teamB) {
  let valueA = 0;
  let valueB = 0;

  const needsA = evaluateTeamNeeds(teamA);
  const needsB = evaluateTeamNeeds(teamB);

  // Team A assets
  teamAAssets.players.forEach(p => {
    valueA += getPlayerValue(p) * needsB[p.positions[0]];
  });
  teamAAssets.picks.forEach(p => {
    valueA += getPickValue(p.round, p.pick);
  });

  // Team B assets
  teamBAssets.players.forEach(p => {
    valueB += getPlayerValue(p) * needsA[p.positions[0]];
  });
  teamBAssets.picks.forEach(p => {
    valueB += getPickValue(p.round, p.pick);
  });

  return { valueA, valueB };
}

    <div id="tradeResult"></div>
  `;

/* ------------------------------------------------------------
   6. Render Team Assets (Players + Picks)
------------------------------------------------------------ */

function renderTeamAssets(side) {
  const teamId = $("tradeTeam" + side).value;
  const team = getTeamById(teamId);

  let html = `<h4>${team.city} ${team.nickname}</h4>`;

  // Players
  html += `<p><strong>Players</strong></p>`;
  html += `<select id="players${side}" multiple size="8" style="width:100%;">`;
  team.roster.forEach(p => {
    html += `<option value="${p.id}">${p.name} (${p.positions[0]}, OVR ${p.attributes.overall})</option>`;
  });
  html += `</select>`;

  // Picks
  html += `<p><strong>Picks</strong></p>`;
  html += `<select id="picks${side}" multiple size="8" style="width:100%;">`;
  for (let r = 1; r <= 7; r++) {
    for (let p = 1; p <= 32; p++) {
      const key = `${r}-${p}`;
      const owner = draftTrades[key]?.to || draftOrder[p - 1];
      if (owner === teamId) {
        html += `<option value="${key}">Round ${r}, Pick ${p}</option>`;
      }
    }
  }
  html += `</select>`;

  $("team" + side + "Assets").innerHTML = html;
}

/* ------------------------------------------------------------
   7. Propose Trade
------------------------------------------------------------ */

function proposeTrade() {
  const teamAId = $("tradeTeamA").value;
  const teamBId = $("tradeTeamB").value;

  const teamA = getTeamById(teamAId);
  const teamB = getTeamById(teamBId);

  const playersA = Array.from($("playersA").selectedOptions).map(o =>
    teamA.roster.find(p => p.id == o.value)
  );
  const playersB = Array.from($("playersB").selectedOptions).map(o =>
    teamB.roster.find(p => p.id == o.value)
  );

  const picksA = Array.from($("picksA").selectedOptions).map(o => {
    const [round, pick] = o.value.split("-").map(Number);
    return { round, pick };
  });
  const picksB = Array.from($("picksB").selectedOptions).map(o => {
    const [round, pick] = o.value.split("-").map(Number);
    return { round, pick };
  });

  const tradeEval = evaluateTrade(
    { players: playersA, picks: picksA },
    { players: playersB, picks: picksB },
    teamA,
    teamB
  );

  const diff = tradeEval.valueA - tradeEval.valueB;

  let result = "";

  if (Math.abs(diff) < 300) {
    result = `<p style="color:lightgreen;">Trade Accepted</p>`;
    executeTrade(teamA, teamB, playersA, playersB, picksA, picksB);
  } else if (diff > 0) {
    result = `<p style="color:orange;">Team B rejects: They need more value.</p>`;
  } else {
    result = `<p style="color:orange;">Team A rejects: They need more value.</p>`;
  }

  $("tradeResult").innerHTML = result;
}

/* ------------------------------------------------------------
   8. Execute Trade
------------------------------------------------------------ */

function executeTrade(teamA, teamB, playersA, playersB, picksA, picksB) {
  // Swap players
  playersA.forEach(p => {
    teamA.roster = teamA.roster.filter(x => x.id !== p.id);
    teamB.roster.push(p);
  });
  playersB.forEach(p => {
    teamB.roster = teamB.roster.filter(x => x.id !== p.id);
    teamA.roster.push(p);
  });

  // Swap picks
  picksA.forEach(pk => {
    const key = `${pk.round}-${pk.pick}`;
    draftTrades[key] = { from: teamA.id, to: teamB.id };
  });
  picksB.forEach(pk => {
    const key = `${pk.round}-${pk.pick}`;
    draftTrades[key] = { from: teamB.id, to: teamA.id };
  });

  renderTradePicksUI();
}

  if (draftSection) draftSection.appendChild(tradeBtn);
});

/* ============================================================

/* ------------------------------------------------------------
   1. TEAM NEEDS MODEL
------------------------------------------------------------ */

function computeTeamNeeds(team) {
  const counts = {};
  POSITIONS.forEach(pos => counts[pos] = 0);

  team.roster.forEach(p => {
    counts[p.positions[0]]++;
  });

  const needs = {};

  POSITIONS.forEach(pos => {
    if (counts[pos] < 2) needs[pos] = 1.6;       // Critical need
    else if (counts[pos] < 4) needs[pos] = 1.3;  // Moderate need
    else if (counts[pos] < 6) needs[pos] = 1.1;  // Mild need
    else needs[pos] = 0.8;                       // No need / surplus
  });

  return needs;
}

/* ------------------------------------------------------------
   2. CPU PLAYER SCORE
------------------------------------------------------------ */

function cpuScorePlayer(player, team) {
  const baseValue = getPlayerValue(player);
  const pos = player.positions[0];
  const needs = computeTeamNeeds(team);

  // Weighted score
  let score = baseValue * needs[pos];

  // CPU aggressiveness (moderate)
  if (Math.random() < 0.05) {
    score *= 1.15; // occasional reach
  }

  return score;
}

/* ------------------------------------------------------------
   3. CPU DRAFT PICK (Smarter)
------------------------------------------------------------ */

function cpuDraftPlayer() {
  const team = getTeamOnClock();
  const available = getAvailableRookies();

  if (available.length === 0) return;

  // Score all rookies
  const scored = available.map(p => ({
    player: p,
    score: cpuScorePlayer(p, team)
  }));

  // Sort by score
  scored.sort((a, b) => b.score - a.score);

  // CPU selects best fit
  const pick = scored[0].player;

  pick.drafted = true;
  pick.contract = {
    years: 4,
    totalValue: (pick.attributes.overall * 200000) + 500000,
    capHitPerYear: Math.round((pick.attributes.overall * 200000 + 500000) / 4)
  };

  team.roster.push(pick);
  team.capUsed += pick.contract.capHitPerYear;

  advanceDraft();
}

/* ------------------------------------------------------------
   4. CPU TRADE-UP LOGIC (Moderate)
------------------------------------------------------------ */

function cpuConsiderTradeUp() {
  // Only early rounds
  if (draftRound > 2) return;

  const team = getTeamOnClock();
  const available = getAvailableRookies();

  if (available.length === 0) return;

  // Identify elite prospects
  const elite = available.filter(p => p.attributes.overall >= 88);

  if (elite.length === 0) return;

  // CPU may trade up 10% of the time
  if (Math.random() > 0.10) return;

  // Find a team behind them to trade with
  const targetPick = draftIndex + randomInt(1, 4);
  if (targetPick >= 32) return;

  const targetTeamId = draftOrder[targetPick];
  const targetTeam = getTeamById(targetTeamId);

  // CPU offers a mid-round pick
  const offerRound = randomInt(3, 5);
  const offerPick = randomInt(1, 32);

  const key = `${offerRound}-${offerPick}`;
  draftTrades[key] = { from: team.id, to: targetTeam.id };

  // Swap positions in the draft order
  const temp = draftOrder[draftIndex];
  draftOrder[draftIndex] = draftOrder[targetPick];
  draftOrder[targetPick] = temp;
}

/* ------------------------------------------------------------
   5. Override advanceDraft to include CPU trade-up
------------------------------------------------------------ */

const oldAdvanceDraft = advanceDraft;

advanceDraft = function() {
  // CPU may trade up before making its pick
  if (getTeamOnClock().id !== userTeamId) {
    cpuConsiderTradeUp();
  }

  // Continue normal draft flow
  oldAdvanceDraft();
};

/* ------------------------------------------------------------
   Market Value Calculation
   (Used later for contract offers)
------------------------------------------------------------ */

function calculateMarketValue(player) {
  /* ── Position-aware NFL salary curve ───────────────────────
     Base curve calibrated for a skill position at peak age.
     QB gets a large multiplier since they're paid 2x everyone
     else in the real NFL. All other positions have realistic
     individual caps based on actual market (2024 comps):
       EDGE/Pass rusher: tops ~$35M  (Parsons, Garrett)
       WR:               tops ~$30M  (Jefferson, Hill)
       CB:               tops ~$27M  (Ramsey, Gardner)
       LT/T:             tops ~$22M  (Tunsil, Brown)
       DT:               tops ~$20M  (Jones, Williams)
       LB:               tops ~$20M  (Warner, Davis)
       FS/SS:            tops ~$18M  (Adams, Smith)
       TE:               tops ~$17M  (Kelce, Andrews)
       RB:               tops ~$17M  (McCaffrey, Barkley)
       QB:               tops ~$55M  (Mahomes, Hurts, Lamar)  */

  var ovr = player.attributes.overall;
  var age = player.age;
  var pos = player.positions[0];

  /* Base curve — calibrated for non-QB skill positions */
  var base;
  if      (ovr >= 95) base = 26_000_000;
  else if (ovr >= 90) base = 18_000_000 + (ovr - 90) * 1_600_000;
  else if (ovr >= 85) base = 12_000_000 + (ovr - 85) * 1_200_000;
  else if (ovr >= 80) base =  7_500_000 + (ovr - 80) *   900_000;
  else if (ovr >= 75) base =  4_500_000 + (ovr - 75) *   600_000;
  else if (ovr >= 70) base =  2_500_000 + (ovr - 70) *   400_000;
  else if (ovr >= 65) base =  1_200_000 + (ovr - 65) *   260_000;
  else                base =    750_000 + Math.max(0, ovr - 55) * 45_000;

  /* Position multipliers — reflects real market demand */
  var posMult = {
    QB  : 2.10,   /* Mahomes/Lamar tier at OVR95 → ~$54M */
    EDGE: 1.35,   /* Parsons tier → ~$35M */
    WR  : 1.15,   /* Jefferson tier → ~$30M */
    CB  : 1.05,   /* Ramsey tier → ~$27M */
    T   : 0.90,   /* Tunsil tier → ~$23M */
    DT  : 0.80,   /* Jones tier → ~$21M */
    LB  : 0.78,   /* Warner tier → ~$20M */
    FS  : 0.72,   /* Adams tier → ~$19M */
    SS  : 0.70,
    TE  : 0.68,   /* Kelce tier → ~$18M */
    RB  : 0.65,   /* CMC tier → ~$17M */
    G   : 0.70,
    C   : 0.68,
    K   : 0.20,
    P   : 0.18,
  };
  var pm = posMult[pos] !== undefined ? posMult[pos] : 0.80;

  /* Age multiplier */
  var ageMult;
  if      (age <= 23) ageMult = 1.08;
  else if (age <= 26) ageMult = 1.00;
  else if (age <= 29) ageMult = 0.88;
  else if (age <= 32) ageMult = 0.72;
  else                ageMult = 0.52;

  var salary = Math.round(base * pm * ageMult);

  /* Contract length */
  var years = 1;
  if      (ovr >= 85 && age <= 28) years = 4;
  else if (ovr >= 80 && age <= 30) years = 3;
  else if (ovr >= 72 && age <= 31) years = 2;

  return {
    years,
    totalValue    : salary * years,
    capHitPerYear : salary
  };
}

  $("btnFreeAgency").addEventListener("click", () => {
    renderFreeAgencyScreen();

function renderContractOffer(playerId) {

  let html = `

/* ------------------------------------------------------------
   3. Player Acceptance Logic
------------------------------------------------------------ */

function evaluateOffer(player, team, salary, years) {
  const mv = calculateMarketValue(player);

  // Salary competitiveness
  let score = salary / mv.capHitPerYear;

  // Team record attractiveness
  const recordScore = (team.wins - team.losses) / 10;
  score += recordScore;

  // Coach quality
  const coachScore =
    (team.coach.offenseRating + team.coach.defenseRating + team.coach.leadership) / 300;
  score += coachScore;

  // Scheme fit (simple: QB, WR, RB prefer high offense rating)
  if (["QB", "WR", "RB"].includes(player.positions[0])) {
    score += team.coach.offenseRating / 200;
  }

  // Age curve: older players prefer longer deals
  if (player.age >= 29 && years >= 3) score += 0.2;

  return score;
}

/* ------------------------------------------------------------
   4. CPU Teams Make Competing Offers
------------------------------------------------------------ */

function cpuOffersForPlayer(player) {
  const teams = listAllTeams(league);

  const offers = [];

  teams.forEach(team => {
    if (team.id === userTeamId) return; // user handled separately

    // CPU only bids if they need the position
    const needs = computeTeamNeeds(team);
    const needFactor = needs[player.positions[0]];

    if (needFactor < 1.0) return; // not interested

    const mv = calculateMarketValue(player);

    // CPU offer salary
    let salary = mv.capHitPerYear * (0.9 + Math.random() * 0.4); // 90%–130% of MV
    salary = Math.round(salary);

    // CPU offer years
    let years = mv.years;
    if (Math.random() < 0.2) years += 1; // sometimes offer longer deals

    // Cap check
    if (team.capUsed + salary > team.salaryCap) return;

    const score = evaluateOffer(player, team, salary, years);

    offers.push({
      team,
      salary,
      years,
      score
    });
  });

  return offers;
}

/* ------------------------------------------------------------
   5. Submit Contract Offer
------------------------------------------------------------ */

function submitContractOffer(playerId) {
  const player = freeAgents.find(p => p.id === playerId);
  const team = getTeamById(userTeamId);

  const salary = parseInt($("offerSalary").value);
  const years = parseInt($("offerYears").value);

  // Cap check
  if (team.capUsed + salary > team.salaryCap) {
    alert("You do not have enough cap space.");
    return;
  }

  // User offer
  const userScore = evaluateOffer(player, team, salary, years);

  // CPU offers
  const cpu = cpuOffersForPlayer(player);

  // Determine winner
  let bestOffer = {
    team,
    salary,
    years,
    score: userScore
  };

  cpu.forEach(o => {
    if (o.score > bestOffer.score) bestOffer = o;
  });

  // Apply signing
  player.contract = {
    years: bestOffer.years,
    totalValue: bestOffer.salary * bestOffer.years,
    capHitPerYear: bestOffer.salary
  };

  bestOffer.team.roster.push(player);
  bestOffer.team.capUsed += bestOffer.salary;

  // Remove from FA pool
  freeAgents = freeAgents.filter(p => p.id !== player.id);

  // Feedback
  let html = `
    <h2>Signing Result</h2>
    <p>${player.name} has signed with the
    <strong>${bestOffer.team.city} ${bestOffer.team.nickname}</strong>.</p>

    <p>Contract: ${bestOffer.years} years,
    $${bestOffer.salary.toLocaleString()} per year</p>

    <button onclick="renderFreeAgencyScreen()">Back to Free Agency</button>
  `;

  setMainContent(html);
  /* Fire signing animation only when user's team got the player */
  if (bestOffer.team.id === userTeamId) {
    setTimeout(function () { if (typeof window._ctxAnimate === 'function') window._ctxAnimate('signing'); }, 120);
  }
}

<script>
/* ============================================================
   PHASE 6A — PART 3
   CPU FREE AGENCY PERIOD (WAVES)
   ============================================================ */

/* ------------------------------------------------------------
   1. CPU Offer Generator
------------------------------------------------------------ */

function cpuGenerateOffer(player, team) {
  const mv = calculateMarketValue(player);
  const needs = computeTeamNeeds(team);

  // CPU only bids if they need the position
  const needFactor = needs[player.positions[0]];
  if (needFactor < 1.0) return null;

  // CPU salary offer (90%–140% of MV)
  let salary = mv.capHitPerYear * (0.9 + Math.random() * 0.5);
  salary = Math.round(salary);

  // CPU years (based on MV)
  let years = mv.years;
  if (Math.random() < 0.2) years += 1;

  // Cap check
  if (team.capUsed + salary > team.salaryCap) return null;

  const score = evaluateOffer(player, team, salary, years);

  return {
    team,
    salary,
    years,
    score
  };
}

/* ------------------------------------------------------------
   2. CPU Signs a Single Player
------------------------------------------------------------ */

function cpuSignPlayer(player) {
  const teams = listAllTeams(league);

  const offers = [];

  teams.forEach(team => {
    if (team.id === userTeamId) return; // user handled separately

    const offer = cpuGenerateOffer(player, team);
    if (offer) offers.push(offer);
  });

  if (offers.length === 0) return false;

  // Best offer wins
  offers.sort((a, b) => b.score - a.score);
  const best = offers[0];

  // Apply signing
  player.contract = {
    years: best.years,
    totalValue: best.salary * best.years,
    capHitPerYear: best.salary
  };

  best.team.roster.push(player);
  best.team.capUsed += best.salary;

  // Remove from FA pool
  freeAgents = freeAgents.filter(p => p.id !== player.id);

  return true;
}

/* ------------------------------------------------------------
   3. CPU Free Agency Waves
------------------------------------------------------------ */

function simulateFreeAgencyWave(minOVR, maxOVR) {
  const targets = freeAgents.filter(
    p => p.attributes.overall >= minOVR && p.attributes.overall <= maxOVR
  );

  // Shuffle to avoid deterministic patterns
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]];
  }

  targets.forEach(player => {
    cpuSignPlayer(player);
  });
}

/* ------------------------------------------------------------
   4. Full CPU Free Agency Simulation
------------------------------------------------------------ */

function simulateFullFreeAgency() {
  if (freeAgents.length === 0) generateFreeAgentPool();

  // Wave 1: Elite players (85+)
  simulateFreeAgencyWave(85, 99);

  // Wave 2: Starters (78–84)
  simulateFreeAgencyWave(78, 84);

  // Wave 3: Depth players (70–77)
  simulateFreeAgencyWave(70, 77);

  // Wave 4: Camp bodies (below 70)
  simulateFreeAgencyWave(0, 69);

  renderFreeAgencyResults();
}

   5. Free Agency Results Screen
------------------------------------------------------------ */

function renderFreeAgencyResults() {
  let html = `

    <p class="small">CPU teams have signed players based on needs and cap space.</p>

  simBtn.onclick = simulateFullFreeAgency;

  if (faSection) faSection.appendChild(simBtn);

<script>
/* ============================================================
   PHASE 6A — PART 4
   PLAYER RELEASES + DEAD MONEY + ROSTER SIZE ENFORCEMENT
   ============================================================ */

/* ------------------------------------------------------------
   1. Dead Money Calculation
------------------------------------------------------------ */

function calculateDeadMoney(player) {
  if (!player.contract) return 0;

  const remainingYears = player.contract.years;
  const remainingValue = player.contract.capHitPerYear * remainingYears;

  // Simple realistic model:
  // 40% of remaining contract accelerates as dead money
  const deadMoney = Math.round(remainingValue * 0.40);

  return deadMoney;
}

/* ------------------------------------------------------------
   2. Release Player (User)
------------------------------------------------------------ */

function releasePlayer(team, playerId) {
  const player = team.roster.find(p => p.id === playerId);
  if (!player) return;

  const deadMoney = calculateDeadMoney(player);

  // Subtract current cap hit first, then apply dead money (net = dead - salary)
  team.capUsed -= (player.contract ? (player.contract.capHitPerYear || 0) : 0);
  team.capUsed += deadMoney;

  // Remove from roster
  team.roster = team.roster.filter(p => p.id !== playerId);

  // Add to free agent pool
  player.isFreeAgent = true;
  freeAgents.push(player);

  alert(`${player.name} released. Dead money: $${deadMoney.toLocaleString()}`);
}

/* ------------------------------------------------------------
   3. Add Release Button to Roster Screen
------------------------------------------------------------ */

const oldRenderRoster = renderRoster;

renderRoster = function() {
  oldRenderRoster();

  const team = getTeamById(userTeamId);

  let html = `
    <h3>Release a Player</h3>
    <p class="small">Releasing a player creates dead money.</p>

    <select id="releasePlayerSelect">
      ${team.roster
        .map(p => `<option value="${p.id}">${p.name} (${p.positions[0]}, OVR ${p.attributes.overall})</option>`)
        .join("")}
    </select>

    <button onclick="confirmRelease()">Release Player</button>
  `;

  const container = document.createElement("div");
  container.innerHTML = html;

  document.getElementById("main").appendChild(container);
};

function confirmRelease() {
  const team = getTeamById(userTeamId);
  const playerId = $("releasePlayerSelect").value;

  // Guard: can't drop below minimum roster size
  const MIN_USER_ROSTER = 37;
  if (team.roster.length <= MIN_USER_ROSTER) {
    alert(`Cannot release — your roster is already at the minimum of ${MIN_USER_ROSTER} players.`);
    return;
  }

  // Guard: can't leave any required depth-chart position empty
  const player = team.roster.find(p => p.id === playerId);
  if (player) {
    const pos = player.positions[0];
    if (REQUIRED_POSITIONS.includes(pos)) {
      const remaining = team.roster.filter(p => p.id !== playerId && p.positions[0] === pos).length;
      if (remaining === 0) {
        alert(`Cannot release ${player.name} — you would have zero ${pos}s on the roster. Sign or trade for another ${pos} first.`);
        return;
      }
    }
  }

  releasePlayer(team, playerId);
  renderRoster();
}

/* ------------------------------------------------------------
   4. CPU Release Logic
------------------------------------------------------------ */

const REQUIRED_POSITIONS = ["QB","RB","WR","TE","T","G","C","EDGE","DT","LB","CB","FS","SS","K","P"];

function cpuShouldRelease(player, team) {
  const ovr = player.attributes.overall;
  const age = player.age;

  // Never cut the last player at a required depth-chart position
  const pos = player.positions[0];
  if (REQUIRED_POSITIONS.includes(pos)) {
    const count = team.roster.filter(p => p.positions[0] === pos).length;
    if (count <= 1) return false;
  }

  // CPU avoids cutting rookies unless terrible
  if (player.isRookie && ovr >= 65) return false;

  // Cut very old + low OVR
  if (age >= 32 && ovr <= 70) return true;

  // Cut expensive underperformers
  if (player.contract && player.contract.capHitPerYear > (ovr * 30000) && ovr < 75) {
    return Math.random() < 0.5;
  }

  // Cut depth players if overloaded
  const posCount = team.roster.filter(p => p.positions[0] === pos).length;
  if (posCount > 6 && ovr < 72) return Math.random() < 0.3;

  return false;
}

/* ------------------------------------------------------------
   5. CPU Roster Cleanup
------------------------------------------------------------ */

function cpuRosterCleanup() {
  const teams = listAllTeams(league);

  teams.forEach(team => {
    if (team.id === userTeamId) return;

    // 1. Release bad fits
    team.roster.slice().forEach(player => {
      if (cpuShouldRelease(player, team)) {
        const deadMoney = calculateDeadMoney(player);
        team.capUsed += deadMoney;

        team.roster = team.roster.filter(p => p.id !== player.id);
        player.isFreeAgent = true;
        freeAgents.push(player);
      }
    });

    // 2. Enforce roster size limits
    const MIN_ROSTER = 37;
    const MAX_ROSTER = 55;

    // If too small → sign depth players
    while (team.roster.length < MIN_ROSTER) {
      const fa = freeAgents.sort((a, b) => b.attributes.overall - a.attributes.overall)[0];
      if (!fa) break;

      const mv = calculateMarketValue(fa);
      if (team.capUsed + mv.capHitPerYear > team.salaryCap) break;

      fa.contract = {
        years: mv.years,
        totalValue: mv.totalValue,
        capHitPerYear: mv.capHitPerYear
      };

      team.roster.push(fa);
      team.capUsed += mv.capHitPerYear;

      freeAgents = freeAgents.filter(p => p.id !== fa.id);
    }

    // If too large → cut lowest OVR players
    while (team.roster.length > MAX_ROSTER) {
      const worst = team.roster.sort((a, b) => a.attributes.overall - b.attributes.overall)[0];
      const deadMoney = calculateDeadMoney(worst);

      team.capUsed -= (worst.contract ? (worst.contract.capHitPerYear || 0) : 0);
      team.capUsed += deadMoney;
      team.roster = team.roster.filter(p => p.id !== worst.id);

      worst.isFreeAgent = true;
      freeAgents.push(worst);
    }
  });
}

/* ------------------------------------------------------------
   6. Add CPU Cleanup Button to Free Agency Section
------------------------------------------------------------ */

window.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById("sidebar");

  const cleanupBtn = document.createElement("button");
  cleanupBtn.textContent = "CPU Roster Cleanup";
  cleanupBtn.onclick = () => {
    cpuRosterCleanup();
    alert("CPU rosters cleaned up.");
  };

  const faSection = Array.from(sidebar.querySelectorAll(".section"))
    .find(sec => sec.querySelector("h2")?.textContent === "Free Agency");

  if (faSection) faSection.appendChild(cleanupBtn);
});
</script>
<script>
/* ============================================================
   PHASE 6A — PART 5
   TRANSACTION LOG + OFFSEASON SUMMARY + TEAM REPORTS

/* ------------------------------------------------------------
   1. Global Transaction Log
------------------------------------------------------------ */

let transactionLog = [];

/* Helper to add a log entry */
function logTransaction(type, description, teamId = null, player = null, extraTeamId = null) {
  transactionLog.push({
    timestamp: Date.now(),
    week:   typeof currentWeekIndex !== 'undefined' ? currentWeekIndex + 1 : null,
    season: typeof window.simYear   !== 'undefined' ? window.simYear       : null,
    type,
    description,
    teamId,
    extraTeamId: extraTeamId || null,
    playerName: player ? player.name : null
  });
}

/* Helper: log a trade with full player/pick detail for both teams */
function logTradeTransaction(teamA, plA, pkA, teamB, plB, pkB) {
  function pickStr(ids) {
    return ids.map(function(id) {
      var m = id.match(/_R(\d+)_Y(\d+)/);
      return m ? 'Yr' + m[2] + ' Rd' + m[1] + ' pick' : 'a pick';
    });
  }
  function sideStr(players, picks) {
    var parts = (players || []).map(function(p) { return p.positions[0] + ' ' + p.name; })
                               .concat(pickStr(picks || []));
    return parts.length ? parts.join(', ') : 'nothing';
  }
  var desc = teamA.city + ' ' + teamA.nickname + ' traded ' + sideStr(plA, pkA)
           + ' to ' + teamB.city + ' ' + teamB.nickname
           + ' for ' + sideStr(plB, pkB) + '.';
  logTransaction('Trade', desc, teamA.id, null, teamB.id);
}

/* ------------------------------------------------------------
   2. Hook into existing actions to log moves
------------------------------------------------------------ */

/* Free agent signing */
const oldSubmitContractOffer = submitContractOffer;
submitContractOffer = function(playerId) {
  const player = freeAgents.find(p => p.id === playerId) || null; /* capture BEFORE removal */
  const before = freeAgents.length;
  oldSubmitContractOffer(playerId);

  const after = freeAgents.length;
  if (after < before) {
    logTransaction("Signing", `User signed a player`, userTeamId, player);
  }
};

/* CPU free agent signing */
const oldCpuSignPlayer = cpuSignPlayer;
cpuSignPlayer = function(player) {
  const result = oldCpuSignPlayer(player);

    logTransaction("Signing", `${team.city} ${team.nickname} signed ${player.name}`, team.id, player);
  }
  return result;
};

/* Player release */
const oldReleasePlayer = releasePlayer;
releasePlayer = function(team, playerId) {
  const player = team.roster.find(p => p.id === playerId);
  oldReleasePlayer(team, playerId);
  logTransaction("Release", `${team.city} ${team.nickname} released ${player.name}`, team.id, player);
};

/* Trades (from Part 4) */
const oldExecuteTrade = executeTrade;
executeTrade = function(teamA, teamB, playersA, playersB, picksA, picksB) {
  oldExecuteTrade(teamA, teamB, playersA, playersB, picksA, picksB);

  let desc = `${teamA.city} ${teamA.nickname} and ${teamB.city} ${teamB.nickname} completed a trade.`;

  logTransaction("Trade", desc, null, null);

        </tr>
      `;
    });

  html += `</tbody></table>`;

  setMainContent(html);
}

/* ------------------------------------------------------------
   5. Transaction Wire — full NFL-style transaction log
------------------------------------------------------------ */

function renderTransactionLog(filterTeam, filterType) {
  filterTeam = filterTeam || 'all';
  filterType = filterType || 'all';

  /* ── Build team list for dropdown ── */
  var allTeams = (typeof listAllTeams === 'function' && league)
    ? listAllTeams(league).slice().sort(function(a,b){ return (a.city+a.nickname).localeCompare(b.city+b.nickname); })
    : [];

  var teamOptions = '<option value="all">All Teams</option>';
  if (allTeams.length) {
    teamOptions += '<optgroup label="── Teams ──">';
    allTeams.forEach(function(t) {
      var sel = filterTeam === t.id ? ' selected' : '';
      teamOptions += '<option value="' + t.id + '"' + sel + '>'
        + t.city + ' ' + t.nickname
        + (t.id === userTeamId ? ' ★' : '')
        + '</option>';
    });
    teamOptions += '</optgroup>';
  }

  /* ── Type filter pills ── */
  var types = ['all','Trade','Signing','Re-sign','Release','Draft'];
  var typeLabels = { all:'All', Trade:'🔄 Trades', Signing:'✍ Signings', 'Re-sign':'🔒 Re-signs', Release:'✂ Cuts', Draft:'🎯 Draft' };

  function typePill(t) {
    var active = filterType === t;
    return '<button onclick="renderTransactionLog(\'' + filterTeam + '\',\'' + t + '\')" '
      + 'style="width:auto;padding:4px 11px;font-size:11px;font-weight:' + (active?'700':'400') + ';'
      + 'background:' + (active?'var(--accent-dim)':'var(--surface2)') + ';'
      + 'border:1px solid ' + (active?'var(--accent)':'var(--border)') + ';'
      + 'color:' + (active?'var(--accent2)':'var(--muted2)') + ';'
      + 'border-radius:99px;white-space:nowrap;margin-bottom:0">' + typeLabels[t] + '</button>';
  }

  /* ── Type badge colours ── */
  function typeBadge(type) {
    var cfg = {
      'Trade':    { bg:'rgba(59,130,246,.15)',  border:'#3b82f6', color:'#60a5fa' },
      'Signing':  { bg:'rgba(22,163,74,.15)',   border:'var(--accent)', color:'var(--accent2)' },
      'Re-sign':  { bg:'rgba(34,197,94,.12)',   border:'#16a34a', color:'#4ade80' },
      'Release':  { bg:'rgba(248,113,113,.12)', border:'#f87171', color:'#fca5a5' },
      'Draft':    { bg:'rgba(245,158,11,.12)',  border:'#f59e0b', color:'#fbbf24' },
    };
    var c = cfg[type] || { bg:'var(--surface3)', border:'var(--border)', color:'var(--muted2)' };
    return '<span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;'
      + 'font-weight:700;letter-spacing:.5px;background:' + c.bg + ';border:1px solid ' + c.border + ';'
      + 'color:' + c.color + ';white-space:nowrap">' + type.toUpperCase() + '</span>';
  }

  /* ── Filter entries ── */
  var entries = transactionLog.slice().reverse();
  if (filterTeam !== 'all') {
    entries = entries.filter(function(e) {
      return e.teamId === filterTeam || e.extraTeamId === filterTeam;
    });
  }
  if (filterType !== 'all') {
    entries = entries.filter(function(e) { return e.type === filterType; });
  }

  /* ── Week label helper ── */
  function weekLabel(e) {
    if (!e.season && !e.week) return '';
    var parts = [];
    if (e.season) parts.push('S' + e.season);
    if (e.week)   parts.push('Wk ' + e.week);
    return parts.join(' · ');
  }

  /* ── Rows ── */
  var rows = '';
  if (!entries.length) {
    rows = '<tr><td colspan="3" style="text-align:center;color:var(--muted2);padding:24px 0">'
      + 'No transactions match this filter.</td></tr>';
  } else {
    entries.forEach(function(e) {
      var isMyTeam = (e.teamId === userTeamId || e.extraTeamId === userTeamId);
      var rowBg = isMyTeam ? 'rgba(22,163,74,.05)' : '';
      var wk = weekLabel(e);
      rows += '<tr style="' + (rowBg ? 'background:' + rowBg + '!important' : '') + '">'
        + '<td style="min-width:80px">'
          + (wk ? '<div style="font-size:11px;font-weight:600;color:var(--accent2)">' + wk + '</div>' : '')
          + '<div style="font-size:10px;color:var(--muted)">'
            + new Date(e.timestamp).toLocaleDateString(undefined,{month:'short',day:'numeric'})
          + '</div>'
        + '</td>'
        + '<td style="min-width:90px">' + typeBadge(e.type) + '</td>'
        + '<td style="white-space:normal;font-size:12px;line-height:1.5;padding:8px 10px">'
          + (isMyTeam ? '<span style="color:var(--accent2);font-weight:600">★ </span>' : '')
          + e.description
        + '</td>'
      + '</tr>';
    });
  }

  /* ── Summary counts ── */
  var trades   = transactionLog.filter(function(e){ return e.type === 'Trade';   }).length;
  var signings = transactionLog.filter(function(e){ return e.type === 'Signing' || e.type === 'Re-sign'; }).length;
  var cuts     = transactionLog.filter(function(e){ return e.type === 'Release'; }).length;

  var html = '<div style="max-width:680px;margin:0 auto">'

    /* back + title */
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'
      + '<button onclick="setMainContent(document.querySelector(\'#homeHero\').parentElement.innerHTML)" '
        + 'style="width:auto;padding:5px 12px;font-size:12px">← Home</button>'
      + '<div>'
        + '<h2 style="margin:0;font-size:20px">Transaction Wire</h2>'
        + '<div style="font-size:11px;color:var(--muted2)">'
          + trades + ' trades · ' + signings + ' signings · ' + cuts + ' cuts'
        + '</div>'
      + '</div>'
    + '</div>'

    /* stat chips */
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'
      + _txChip('🔄', 'Trades',   trades)
      + _txChip('✍',  'Signings', signings)
      + _txChip('✂',  'Cuts',     cuts)
    + '</div>'

    /* team selector */
    + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">'
      + '<label style="font-size:11px;color:var(--muted2);margin:0;white-space:nowrap">Filter by team:</label>'
      + '<select onchange="renderTransactionLog(this.value,\'' + filterType + '\')" '
        + 'style="width:auto;padding:5px 28px 5px 10px;font-size:12px;margin:0">'
        + teamOptions
      + '</select>'
    + '</div>'

    /* type pills */
    + '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">'
      + types.map(typePill).join('')
    + '</div>'

    /* table */
    + '<div class="table-wrap">'
      + '<table>'
        + '<thead><tr>'
          + '<th>When</th><th>Type</th><th>Transaction</th>'
        + '</tr></thead>'
        + '<tbody>' + rows + '</tbody>'
      + '</table>'
    + '</div>'

  + '</div>';

  setMainContent(html);
}

function _txChip(icon, label, count) {
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;'
    + 'padding:8px 14px;display:flex;flex-direction:column;align-items:center;min-width:72px">'
    + '<div style="font-size:16px">' + icon + '</div>'
    + '<div style="font-size:18px;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;line-height:1">' + count + '</div>'
    + '<div style="font-size:10px;color:var(--muted2)">' + label + '</div>'
  + '</div>';
}

<script>
/* ============================================================
   PHASE 6B1 — PART 1
   CONTRACT NEGOTIATION SYSTEM (3 ROUNDS + PERSONALITIES)
   ============================================================ */

/* ------------------------------------------------------------
   1. Assign Player Personalities
------------------------------------------------------------ */

const PERSONALITIES = ["Greedy", "Loyal", "RingChaser", "SchemeFit", "ShortDeal"];

function assignPersonality(player) {
  if (!player.personality) {
    player.personality = PERSONALITIES[randomInt(0, PERSONALITIES.length - 1)];
  }
}

/* ------------------------------------------------------------
   2. Negotiation State
------------------------------------------------------------ */

let negotiationState = {
  player: null,
  round: 1,
  userOffer: null,
  counterOffer: null
};

/* ------------------------------------------------------------
   3. Render Negotiation Screen
------------------------------------------------------------ */

function renderNegotiationScreen(playerId) {
  const p = freeAgents.find(x => x.id === playerId);
  assignPersonality(p);

  negotiationState = {
    player: p,
    round: 1,
    userOffer: null,
    counterOffer: null
  };

  const mv = calculateMarketValue(p);

  let html = `
    <h2>Negotiation — ${p.name}</h2>
    <p class="small">Personality: <strong>${p.personality}</strong></p>
    <p class="small">Market Value: $${mv.capHitPerYear.toLocaleString()} / yr</p>

    <label>Years:</label>
    <select id="negYears">
      <option value="1">1 year</option>
      <option value="2">2 years</option>
      <option value="3">3 years</option>
      <option value="4">4 years</option>
    </select>

    <label>Salary per year:</label>
    <input id="negSalary" type="number" value="${mv.capHitPerYear}" />

    <button onclick="submitNegotiationOffer()">Submit Offer</button>
    <button onclick="renderFreeAgencyScreen()">Cancel</button>
  `;

  setMainContent(html);
}

/* ------------------------------------------------------------
   4. Player Interest Score
------------------------------------------------------------ */

function calculateInterest(player, team, salary, years) {
  const mv = calculateMarketValue(player);
  let score = salary / mv.capHitPerYear;

  // Personality modifiers
  switch (player.personality) {
    case "Greedy":
      score *= 1.15;
      break;
    case "Loyal":
      if (player.previousTeamId === team.id) score *= 1.2;
      break;
    case "RingChaser":
      score += (team.wins - team.losses) / 10;
      break;
    case "SchemeFit":
      if (["QB", "WR", "RB"].includes(player.positions[0])) {
        score += team.coach.offenseRating / 200;
      } else {
        score += team.coach.defenseRating / 200;
      }
      break;
    case "ShortDeal":
      if (years <= 2) score *= 1.2;
      else score *= 0.9;
      break;
  }

  return score;
}

/* ------------------------------------------------------------
   5. Player Counteroffer Logic
------------------------------------------------------------ */

function generateCounterOffer(player, team) {
  const mv = calculateMarketValue(player);

  let salary = mv.capHitPerYear;
  let years = mv.years;

  // Personality adjustments
  if (player.personality === "Greedy") salary *= 1.25;
  if (player.personality === "ShortDeal") years = Math.min(2, years);

  salary = Math.round(salary);

  return { salary, years };
}

/* ------------------------------------------------------------
   6. Submit Negotiation Offer
------------------------------------------------------------ */

function submitNegotiationOffer() {
  const p = negotiationState.player;
  const team = getTeamById(userTeamId);

  const salary = parseInt($("negSalary").value);
  const years = parseInt($("negYears").value);

  const interest = calculateInterest(p, team, salary, years);

  negotiationState.userOffer = { salary, years };

  // Round 1 → Player counteroffers
  if (negotiationState.round === 1) {
    negotiationState.counterOffer = generateCounterOffer(p, team);

    let html = `
      <h2>Counteroffer from ${p.name}</h2>
      <p>They want: ${negotiationState.counterOffer.years} years,
      $${negotiationState.counterOffer.salary.toLocaleString()} per year.</p>

      <button onclick="renderNegotiationRound2()">Continue Negotiation</button>
      <button onclick="acceptCounterOffer()">Accept Counteroffer</button>
      <button onclick="renderFreeAgencyScreen()">Walk Away</button>
    `;

    negotiationState.round = 2;
    setMainContent(html);
    return;
  }

  // Round 2 → Final decision
  if (negotiationState.round === 2) {
    const counter = negotiationState.counterOffer;

    // If user beats counteroffer → accept
    if (salary >= counter.salary && years >= counter.years) {
      finalizeNegotiationSigning(team, p, salary, years);
      return;
    }

    // Otherwise → player chooses best offer
    const cpuOffers = cpuOffersForPlayer(p);
    const bestCPU = cpuOffers.length ? cpuOffers.sort((a, b) => b.score - a.score)[0] : null;

    const userScore = calculateInterest(p, team, salary, years);
    const cpuScore = bestCPU ? bestCPU.score : 0;

    if (userScore >= cpuScore) {
      finalizeNegotiationSigning(team, p, salary, years);
    } else {
      finalizeNegotiationSigning(bestCPU.team, p, bestCPU.salary, bestCPU.years);
    }
  }
}

/* ------------------------------------------------------------
   7. Round 2 Negotiation Screen
------------------------------------------------------------ */

function renderNegotiationRound2() {
  const p = negotiationState.player;
  const mv = calculateMarketValue(p);

  let html = `
    <h2>Final Offer — ${p.name}</h2>
    <p class="small">Counteroffer: ${negotiationState.counterOffer.years} years,
    $${negotiationState.counterOffer.salary.toLocaleString()} per year.</p>

    <label>Years:</label>
    <select id="negYears">
      <option value="1">1 year</option>
      <option value="2">2 years</option>
      <option value="3">3 years</option>
      <option value="4">4 years</option>
    </select>

    <label>Salary per year:</label>
    <input id="negSalary" type="number" value="${negotiationState.counterOffer.salary}" />

    <button onclick="submitNegotiationOffer()">Submit Final Offer</button>
    <button onclick="renderFreeAgencyScreen()">Walk Away</button>
  `;

  setMainContent(html);
}

/* ------------------------------------------------------------
   8. Accept Counteroffer
------------------------------------------------------------ */

function acceptCounterOffer() {
  const p = negotiationState.player;
  const team = getTeamById(userTeamId);
  const c = negotiationState.counterOffer;

  finalizeNegotiationSigning(team, p, c.salary, c.years);
}

/* ------------------------------------------------------------
   9. Finalize Signing
------------------------------------------------------------ */

function finalizeNegotiationSigning(team, player, salary, years) {
  player.contract = {
    years,
    totalValue: salary * years,
    capHitPerYear: salary
  };

  team.roster.push(player);
  team.capUsed += salary;

  freeAgents = freeAgents.filter(p => p.id !== player.id);

  logTransaction("Signing", `${team.city} ${team.nickname} signed ${player.name}`, team.id, player);

  let html = `
    <h2>Signed!</h2>
    <p>${player.name} has signed with the
    <strong>${team.city} ${team.nickname}</strong>.</p>

    <p>Contract: ${years} years,
    $${salary.toLocaleString()} per year</p>

    <button onclick="renderFreeAgencyScreen()">Back to Free Agency</button>
  `;

  setMainContent(html);
}
</script>
<script>
/* ============================================================

/* ------------------------------------------------------------
   1. Render Cap Chart
------------------------------------------------------------ */

function renderCapChart() {

  team.roster.forEach(p => {

/* ------------------------------------------------------------
   2. Restructure Screen
------------------------------------------------------------ */

function renderRestructureScreen(playerId) {
  const team = getTeamById(userTeamId);
  const p = team.roster.find(x => x.id === playerId);

  if (!p.contract) {
    alert("Cannot restructure a player without a contract.");
    return;
  }

  let html = `
    <h2>Restructure — ${p.name}</h2>
    <p class="small">Current cap hit: $${p.contract.capHitPerYear.toLocaleString()}</p>

    <label>Convert to Bonus:</label>
    <input id="bonusAmount" type="number" value="${Math.round(p.contract.capHitPerYear * 0.3)}" />

    <button onclick="applyRestructure('${p.id}')">Apply Restructure</button>
    <button onclick="renderCapChart()">Cancel</button>
  `;

  setMainContent(html);
}

/* ------------------------------------------------------------
   3. Apply Restructure
------------------------------------------------------------ */

function applyRestructure(playerId) {
  const team = getTeamById(userTeamId);
  const p = team.roster.find(x => x.id === playerId);
  const bonus = parseInt($("bonusAmount").value);

  if (bonus <= 0 || bonus > p.contract.capHitPerYear * 0.5) {
    alert("Invalid bonus amount.");
    return;
  }

  const years = p.contract.years;

  // Reduce current cap hit
  p.contract.capHitPerYear -= bonus;

  // Spread bonus across remaining years
  const spread = Math.round(bonus / years);

  // Increase future cap hits
  p.contract.capHitPerYear += spread;

  // Apply immediate cap relief
  team.capUsed -= bonus;

  logTransaction("Restructure", `${p.name} restructured contract`, team.id, p);

  renderCapChart();
}

/* ------------------------------------------------------------
   4. Add Cap Tools Button to Sidebar
------------------------------------------------------------ */

window.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById("sidebar");

  const capBtn = document.createElement("button");
  capBtn.textContent = "Salary Cap Overview";
  capBtn.onclick = renderCapChart;

  const faSection = Array.from(sidebar.querySelectorAll(".section"))
    .find(sec => sec.querySelector("h2")?.textContent === "Free Agency");

  if (faSection) faSection.appendChild(capBtn);
});
