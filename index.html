      }).join('');

      return '<div style="background:var(--surface);border:1px solid '
        + (good ? 'var(--accent)' : 'var(--border)') + ';border-radius:10px;'
        + 'padding:14px;margin-bottom:10px'
        + (good ? ';box-shadow:0 0 0 1px rgba(22,163,74,.15)' : '') + '">'

        + '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">'
          + '<div>'
            + '<div style="font-size:14px;font-weight:700;color:var(--accent2)">'
              + o.team.city + ' ' + o.team.nickname + '</div>'
            + '<div style="font-size:10px;color:' + il.c + ';margin-top:2px">' + il.txt + '</div>'
            + '<div style="font-size:10px;color:' + needColor + ';margin-top:1px">' + needTxt + '</div>'
          + '</div>'
          + '<div style="text-align:right">'
            + '<div style="font-size:11px;font-weight:700;color:' + vc + '">' + vl + '</div>'
            + '<div style="font-size:10px;color:var(--muted2);margin-top:2px">'
              + o.value.toLocaleString() + ' vs ' + pVal.toLocaleString() + ' pts'
              + (pct > 0 ? ' (' + (good ? '+' : '-') + pct + '%)' : '')
            + '</div>'
          + '</div>'
        + '</div>'

        + (plRows || '') + (pkRows || '')

        + '<button onclick="window._acceptTradeOffer(' + idx + ')" '
          + 'style="width:100%;margin-top:10px;font-size:12px;font-weight:600;'
          + 'background:' + (good?'var(--accent-dim)':'var(--surface2)') + ';'
          + 'border-color:' + (good?'var(--accent)':'var(--border)') + ';'
          + 'color:' + (good?'var(--accent2)':'var(--muted2)') + '">'
          + 'Accept Trade'
        + '</button>'
      + '</div>';
    }

    /* ── Trade preference: what the user wants back ───────────
       null = any, 'picks' = draft picks only, else = position code */
    if (window._tradePreference === undefined) window._tradePreference = null;

    var ALL_POSITIONS = ['QB','RB','WR','TE','T','G','C','EDGE','DT','LB','CB','FS','SS','K','P'];

    function offerMatchesPref(o, pref) {
      if (!pref) return true;
      if (pref === 'picks') return o.picks.length > 0;
      return o.players.some(function(p){ return p.positions[0] === pref; });
    }

    function prefPanelHTML() {
      var pref = window._tradePreference;
      function pill(val, label) {
        var active = (pref === val) || (val === null && !pref);
        return '<button onclick="window._setTradePref(\'' + val + '\',\'' + playerId + '\')" '
          + 'style="width:auto;padding:4px 10px;font-size:11px;font-weight:' + (active?'700':'400') + ';'
          + 'background:' + (active?'var(--accent-dim)':'var(--surface2)') + ';'
          + 'border:1px solid ' + (active?'var(--accent)':'var(--border)') + ';'
          + 'color:' + (active?'var(--accent2)':'var(--muted2)') + ';'
          + 'border-radius:99px;white-space:nowrap">' + label + '</button>';
      }
      return '<div style="background:var(--surface);border:1px solid var(--border);'
        + 'border-radius:10px;padding:12px 14px;margin-bottom:14px">'
        + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;'
          + 'letter-spacing:.8px;color:var(--accent2);margin-bottom:8px">'
          + '📣 I\'m looking for…'
          + (pref ? ' <span style="font-size:10px;color:var(--muted2);font-weight:400">'
              + '— filtering for ' + (pref === 'picks' ? 'draft picks' : pref) + '</span>' : '')
        + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:5px">'
          + pill(null, 'Any')
          + pill('picks', '🎯 Picks')
          + ALL_POSITIONS.map(function(p){ return pill(p, p); }).join('')
        + '</div>'
        + '</div>';
    }

    window._setTradePref = function(pref, pid) {
      var cur = window._tradePreference;
      window._tradePreference = (!pref || pref === 'null' || pref === cur) ? null : pref;
      window.renderTradeOffers(pid);
    };

    var pref = window._tradePreference;
    var sortedOffers = offers.slice().sort(function(a, b) {
      var am = offerMatchesPref(a, pref) ? 0 : 1;
      var bm = offerMatchesPref(b, pref) ? 0 : 1;
      if (am !== bm) return am - bm;
      return a.gap - b.gap;
    });

    function offerCardWithPref(o, idx) {
      var base = offerCard(o, idx);
      if (!pref) return base;
      var matches = offerMatchesPref(o, pref);
      var badge = matches
        ? '<div style="font-size:10px;color:#4ade80;font-weight:600;margin-bottom:6px">✓ Matches your request</div>'
        : '<div style="font-size:10px;color:var(--muted);font-style:italic;margin-bottom:6px">'
          + '· No ' + (pref === 'picks' ? 'picks' : pref) + ' in this offer</div>';
      return '<div style="opacity:' + (matches ? '1' : '0.55') + '">' + badge + base + '</div>';
    }

    var uniqueTeams = new Set(offers.map(function(o){return o.team.id;})).size;
    var matchCount  = pref ? sortedOffers.filter(function(o){return offerMatchesPref(o,pref);}).length : offers.length;

    var header = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
      + '<div style="display:flex;align-items:center;gap:10px">'
        + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" '
          + 'style="width:auto;padding:5px 12px;font-size:12px">← Back</button>'
        + '<div>'
          + '<h2 style="margin:0;font-size:18px">Trade Offers — ' + player.name + '</h2>'
          + '<div style="font-size:11px;color:var(--muted2)">'
            + player.positions[0] + ' · OVR ' + player.attributes.overall
            + ' · ' + pVal.toLocaleString() + ' pts trade value'
          + '</div>'
        + '</div>'
      + '</div>'
      + '<button onclick="window.renderQuickRoster()" '
        + 'style="width:auto;padding:5px 12px;font-size:11px;'
        + 'background:rgba(59,130,246,.15);border-color:#3b82f6;color:#60a5fa">'
        + '👥 My Roster'
      + '</button>'
    + '</div>';

    var note = offers.length
      ? '<p class="small" style="color:var(--muted2);margin-bottom:12px">'
          + (pref
            ? matchCount + ' of ' + offers.length + ' offer' + (offers.length!==1?'s':'')
              + ' include ' + (pref === 'picks' ? 'draft picks' : pref)
            : offers.length + ' offer' + (offers.length!==1?'s':'') + ' from '
              + uniqueTeams + ' team' + (uniqueTeams!==1?'s':''))
          + ' · <span style="color:#4ade80">✦ scheme fit</span>'
          + ' / <span style="color:#f87171">✦ poor fit</span>'
        + '</p>'
      : '';

    var body = offers.length
      ? '<div style="max-width:580px;margin:0 auto">'
          + header + prefPanelHTML() + note
          + sortedOffers.map(function(o){ return offerCardWithPref(o, offers.indexOf(o)); }).join('')
        + '</div>'
      : '<div style="max-width:580px;margin:0 auto">'
          + header + prefPanelHTML()
          + '<div style="background:var(--surface2);border-radius:8px;padding:24px;'
            + 'text-align:center;color:var(--muted2);font-size:13px">'
            + 'No teams are interested right now. Try next week or check a lower-demand player.'
          + '</div>'
        + '</div>';


    setMainContent(body);
  };

  /* ── Update _buildAssetPanel player rows to show trade value ─ */
  var _origBuildPanel = window._buildAssetPanel || function(){};
  /* Override _refreshTC to add value hints */
  var _origRefresh = window._refreshTC;
  window._refreshTC = function () {
    if (typeof _origRefresh === 'function') _origRefresh();
  };

})();
</script>

<script>
/* ============================================================
   NEW GAME FLOW
   startNewGame → renderFranchisePicker → renderCoachCreation
   → saveNewCoach → home screen

   Franchise is set once here; sidebar/home dropdowns are
   hidden and kept in sync silently from this point on.
   ============================================================ */

/* ── Helper: colour a power rating ─────────────────────────── */
function _pwrColor(r) {
  return r >= 82 ? '#4ade80' : r >= 76 ? '#facc15' : r >= 70 ? '#94a3b8' : '#f87171';
}
function _pwrLabel(r) {
  return r >= 82 ? 'Elite' : r >= 76 ? 'Good' : r >= 70 ? 'Average' : 'Rebuilding';
}

/* ── Silently sync both dropdowns whenever the team changes ── */
function _syncTeamSelects(tid) {
  ['teamSelect','homeTeamSelect'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = tid;
  });
  if (typeof userTeamId !== 'undefined') userTeamId = tid;
}

/* ── Update the home hero franchise name ─────────────────────  */
function _updateHomeFranchiseName(teamId) {
  var el  = document.getElementById('homeFranchiseName');
  var team = typeof getTeamById === 'function' ? getTeamById(teamId) : null;
  if (el && team) el.textContent = team.city + ' ' + team.nickname;
}

/* ═══════════════════════════════════════════════════════════
   STEP 0 — Entry point
   If active game exists, confirm before wiping.
═══════════════════════════════════════════════════════════ */
window.startNewGame = function () {
  var hasGame = typeof league !== 'undefined' && league
    && typeof userTeamId !== 'undefined' && userTeamId;

  if (!hasGame) {
    _doStartNewGame();
    return;
  }

  setMainContent(
    '<div style="max-width:400px;margin:60px auto;text-align:center;padding:24px">'
    + '<div style="font-size:44px;margin-bottom:12px">🏈</div>'
    + '<h2 style="margin-bottom:8px">Start New Game?</h2>'
    + '<p style="color:var(--muted2);font-size:13px;margin-bottom:24px">'
      + 'This resets your current franchise. Export your save first if you want to keep it.'
    + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:center">'
      + '<button onclick="renderHome()" style="flex:1;max-width:160px">← Cancel</button>'
      + '<button onclick="_doStartNewGame()" style="flex:1;max-width:160px;'
        + 'background:rgba(239,68,68,.15);border-color:#ef4444;color:#f87171;font-weight:700">'
        + '🔄 Confirm'
      + '</button>'
    + '</div>'
    + '</div>'
  );
};

function _doStartNewGame() {
  /* Fresh league */
  league             = buildLeague();
  schedule           = generateSchedule(league);
  teamMap            = buildTeamMap(league);
  currentWeekIndex   = 0;
  window.simYear     = 1;
  window.gmPhase     = 'season';
  window.pickRegistry = {};
  window.playoffs    = null;
  if (typeof window.initDraftPicks === 'function') window.initDraftPicks();
  renderFranchisePicker();
}

/* ═══════════════════════════════════════════════════════════
   STEP 1 — Franchise Picker: 32 team tiles
═══════════════════════════════════════════════════════════ */
window.renderFranchisePicker = function () {
  var teams = listAllTeams(league).slice().sort(function (a, b) {
    var ka = (a.conference || '') + (a.division || '') + a.city;
    var kb = (b.conference || '') + (b.division || '') + b.city;
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });

  teams.forEach(function (t) {
    t.powerRating = computeTeamPowerRating(t);
  });

  var tiles = teams.map(function (t) {
    var pr = t.powerRating || 70;
    var pc = _pwrColor(pr);
    return '<div onclick="renderCoachCreation(\'' + t.id + '\')" '
      + 'style="background:var(--surface);border:2px solid var(--border);border-radius:10px;'
      + 'padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;'
      + 'text-align:center;gap:4px;min-height:96px;justify-content:center;'
      + 'transition:border-color .12s,background .12s" '
      + 'onmouseover="this.style.borderColor=\'var(--accent)\';this.style.background=\'var(--surface2)\'" '
      + 'onmouseout="this.style.borderColor=\'var(--border)\';this.style.background=\'var(--surface)\'">'
        + '<div style="font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.9px">'
          + (t.conference || '') + ' · ' + (t.division || '')
        + '</div>'
        + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:19px;font-weight:700;'
          + 'color:var(--accent2);line-height:1.1;margin-top:2px">' + t.city + '</div>'

window.saveNewCoach = function () {
