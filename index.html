  function slotLabel(slotIdx) {
    return 'Slot ' + (slotIdx + 1);
  }

  /* ── Render save/load screen ─────────────────────────────── */
  /* ─────────────────────────────────────────────────────────
     SAVE / LOAD — FILE-FIRST SYSTEM

     Save  = always exports a .txt download file.
     Load  = always imports a .txt file from disk.
     localStorage used only as a convenience cache so the
     "last save" info can be displayed; never relied upon.
  ──────────────────────────────────────────────────────── */

  function _toast(msg, ok) {
    var t = document.createElement('div');
    t.style.cssText =
      'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);'
      + 'background:' + (ok ? 'rgba(22,163,74,.95)' : 'rgba(239,68,68,.95)') + ';'
      + 'border:1px solid ' + (ok ? '#16a34a' : '#ef4444') + ';'
      + 'color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;'
      + 'font-weight:600;z-index:99999;pointer-events:none;'
      + 'box-shadow:0 4px 20px rgba(0,0,0,.6)';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 3000);
  }

  function _downloadFile(str, filename) {
    var blob = new Blob([str], { type: 'text/plain;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  /* ── SAVE: always exports a file ─────────────────────── */
  window._doSave = function () {
    if (typeof league === 'undefined' || !league) {
      _toast('⚠ No active game to save', false); return;
    }
    var state, str;
    try {
      state = captureState();
      str   = _saveStr(state);
    } catch (e) {
      _toast('❌ Save failed: ' + e.message, false); return;
    }

    var team = state.userTeamId && typeof getTeamById === 'function'
      ? getTeamById(state.userTeamId) : null;
    var teamSlug = team
      ? (team.city + '_' + team.nickname).replace(/\s+/g, '_')
      : 'game';
    var filename = 'gm_' + teamSlug + '_S' + (state.simYear || 1)
                 + '_W' + (state.currentWeekIndex || 0)
                 + '_' + new Date().toISOString().slice(0, 10)
                 + '.txt';

    _downloadFile(str, filename);
    /* Also cache in localStorage for the "last save" display */
    try { localStorage.setItem('gm_last_save_meta', JSON.stringify({
      savedAt : state.savedAt,
      simYear : state.simYear,
      week    : state.currentWeekIndex,
      teamName: team ? team.city + ' ' + team.nickname : '—',
      record  : team ? (team.wins + '-' + team.losses) : ''
    })); } catch(e) { /* ignore */ }

    _toast('✅ Save file downloading…', true);
    renderSaveLoad();
  };

  /* ── LOAD: file picker, then restoreState ───────────────── */
  window._doLoad = function () {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.txt,.json';
    input.style.display = 'none';
    input.onchange = function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var state;
        try { state = _loadStr(ev.target.result); } catch(err) {
          _toast('❌ Invalid save file: ' + err.message, false); return;
        }
        if (!state || !state.league) {
          _toast('❌ Save file appears empty or corrupt', false); return;
        }
        if (!restoreState(state)) return;
        /* Re-run post-load hooks */
        if (typeof window.initDraftPicks === 'function') window.initDraftPicks();
        if (typeof window.syncPlaybookDropdowns === 'function') window.syncPlaybookDropdowns();
        if (typeof renderHome === 'function') renderHome();
        _toast('✅ Game loaded — ' + (state.userTeamId && typeof getTeamById === 'function'
          ? (function(t){ return t ? t.city+' '+t.nickname : ''; })(getTeamById(state.userTeamId))
          : ''), true);
        renderSaveLoad();
      };
      reader.readAsText(file);
    };
    document.body.appendChild(input);
    input.click();
    document.body.removeChild(input);
  };

  /* Keep old aliases pointing at new functions */
  window._importSave       = window._doLoad;
  window._exportSave       = window._doSave;
  window._doLoadAutosave   = window._doLoad;

  /* ── Render the save/load screen ────────────────────────── */
  window.renderSaveLoad = function () {
    var meta = null;
    try {
      var raw = localStorage.getItem('gm_last_save_meta');
      if (raw) meta = JSON.parse(raw);
    } catch(e) { /* ignore */ }

    var lastSaveHtml = meta
      ? '<div style="background:var(--surface2);border:1px solid var(--border);'
        + 'border-radius:8px;padding:12px 14px;margin-bottom:16px">'
        + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;'
          + 'letter-spacing:.8px;margin-bottom:6px">Last saved game</div>'
        + '<div style="font-size:14px;font-weight:600;color:var(--accent2)">'
          + (meta.teamName || '—') + '</div>'
        + '<div style="font-size:11px;color:var(--muted2);margin-top:2px">'
          + 'Season ' + (meta.simYear || '?')
          + ' · Week '  + (meta.week || 0)
          + (meta.record ? ' · ' + meta.record : '')
          + ' · ' + (meta.savedAt ? new Date(meta.savedAt).toLocaleDateString() : '')
        + '</div>'
      + '</div>'
      : '<div style="font-size:12px;color:var(--muted2);margin-bottom:16px;font-style:italic">'
        + 'No save on record in this browser yet.</div>';

    var activeGame = typeof league !== 'undefined' && league;

    setMainContent(
      '<h2>💾 Save / Load</h2>'
      + '<p class="small" style="margin-bottom:14px">'
        + 'Saves download as <strong>.txt</strong> files to your device. '
        + 'Load them back with the Import button. Works across browsers and devices.'
      + '</p>'
      + lastSaveHtml
      + '<div style="display:flex;flex-direction:column;gap:10px">'

        /* Save button */
        + '<div style="background:var(--surface);border:1px solid var(--border);'
          + 'border-radius:10px;padding:16px">'
          + '<div style="font-size:13px;font-weight:600;margin-bottom:4px">Export Save File</div>'
          + '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">'
            + 'Downloads your current game as a .txt file.'
          + '</div>'
          + '<button onclick="window._doSave()" style="width:100%;background:var(--accent-dim);'
            + 'border-color:var(--accent);color:var(--accent2);font-weight:700;font-size:14px;'
            + 'padding:12px;' + (!activeGame ? 'opacity:.45;pointer-events:none' : '') + '">'
            + '⬇ Save & Download'
          + '</button>'
          + (!activeGame ? '<div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:center">'
            + 'Start a new game first</div>' : '')
        + '</div>'

        /* Load button */
        + '<div style="background:var(--surface);border:1px solid var(--border);'
          + 'border-radius:10px;padding:16px">'
          + '<div style="font-size:13px;font-weight:600;margin-bottom:4px">Import Save File</div>'
          + '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">'
            + 'Load a .txt save file from your device to resume a game.'
          + '</div>'
          + '<button onclick="window._doLoad()" style="width:100%;background:rgba(59,130,246,.15);'
            + 'border-color:#3b82f6;color:#60a5fa;font-weight:700;font-size:14px;padding:12px">'
            + '⬆ Import & Load'
          + '</button>'
        + '</div>'

      + '</div>'
    );
  };

})();
</script>

<script>
/* ============================================================
   PATCH — DRAFT PICK REGISTRY CONNECTION + PICK VALUE FIX

   Problem 1: pickV() used regex on the pick ID string.
   If it ever misses, defaults to round 4 (350), making
   traded picks look cheaper than they are.
   Fix: look up the actual round from the registry object.

   Problem 2: The draft used draftOrder[] (32 team IDs) with no
   knowledge of the pick registry. Traded picks were ignored.
   Fix: buildDraftPickList() creates an ordered 224-entry list
   from the registry. Every draft function now uses that list.
   ============================================================ */
(function () {

  /* ── Canonical pick value from registry ─────────────────── */
  var PICK_VALUES = [3200, 1600, 800, 400, 200, 100, 50]; /* R1-R7 */

  function pickValueById(pickId) {
    /* Walk the full registry to find the pick and read its round */
    var found = null;
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        if (pk.pickId === pickId) found = pk;
      });
    });
    if (found) {
      /* Future picks get a 10% discount per year beyond next draft */
      var nextYr   = (window.simYear || 1) + 1;
      var yearDiff = Math.max(0, (found.year || nextYr) - nextYr);
      var base     = PICK_VALUES[(found.round || 4) - 1] || 50;
      return Math.round(base * Math.pow(0.90, yearDiff));
    }
    /* Fallback: parse round from ID string */
    var m = pickId.match(/_R(\d+)_/);
    var r = m ? parseInt(m[1]) : 4;
    return PICK_VALUES[r - 1] || 50;
  }

  /* Patch _proposeTrade to use the correct pickV ─────────── */
  var _origPT = window._proposeTrade;
  window._proposeTrade = function () {
    /* Temporarily shadow the local pickV used inside _proposeTrade
       by replacing it on window so the function picks it up.
       This is safe because _proposeTrade reads window._pickV if
       we replace it — BUT _proposeTrade has its own local pickV.
       So we fully replace _proposeTrade instead. */
    _rewrittenProposeTrade();
  };

  function _rewrittenProposeTrade() {
    var selA = document.getElementById('tcTeamA');
    var selB = document.getElementById('tcTeamB');
    var result = document.getElementById('tcResult');
    if (!selA || !selB || !result) return;
    if (selA.value === selB.value) {
      result.innerHTML = '<p style="color:#f87171">Select two different teams.</p>'; return;
    }

    var teamA = getTeamById(selA.value);
    var teamB = getTeamById(selB.value);

    var plA = Array.from(document.getElementById('tcPlayersA').selectedOptions)
      .map(function (o) { return teamA.roster.find(function (p) { return String(p.id) === o.value; }); })
      .filter(Boolean);
    var plB = Array.from(document.getElementById('tcPlayersB').selectedOptions)
      .map(function (o) { return teamB.roster.find(function (p) { return String(p.id) === o.value; }); })
      .filter(Boolean);
    var pkA = Array.from(document.getElementById('tcPicksA').selectedOptions).map(function (o) { return o.value; });
    var pkB = Array.from(document.getElementById('tcPicksB').selectedOptions).map(function (o) { return o.value; });

    if (!plA.length && !pkA.length && !plB.length && !pkB.length) {
      result.innerHTML = '<p style="color:#f87171">Select at least one asset on each side.</p>'; return;
    }
    if ((!plA.length && !pkA.length) || (!plB.length && !pkB.length)) {
      result.innerHTML = '<p style="color:#f87171">Both sides must offer at least one asset.</p>'; return;
    }

    function pv(p) {
      if (!p || !p.attributes) return 0;
      var ovr = p.attributes.overall, age = p.age || 27;
      var val = ovr * 50;
      if (age <= 22) val *= 1.5; else if (age <= 24) val *= 1.25;
      else if (age <= 27) val *= 1.1; else if (age <= 30) val *= 0.85;
      else if (age <= 33) val *= 0.65; else val *= 0.45;
      if (['QB','EDGE','CB'].indexOf(p.positions[0]) !== -1) val *= 1.2;
      return Math.round(val);
    }

    var valA = plA.reduce(function (s, p) { return s + pv(p); }, 0)
             + pkA.reduce(function (s, id) { return s + pickValueById(id); }, 0);
    var valB = plB.reduce(function (s, p) { return s + pv(p); }, 0)
             + pkB.reduce(function (s, id) { return s + pickValueById(id); }, 0);

    var avg = (valA + valB) / 2 || 1;
    var gap = Math.abs(valA - valB) / avg;

    /* Pick descriptions for summary */
    function pickDesc(id) {
      var m = id.match(/_R(\d+)_Y(\d+)/);
      if (!m) return 'pick';
      var orig = null;
      Object.keys(window.pickRegistry || {}).forEach(function (tid) {
        (window.pickRegistry[tid] || []).forEach(function (pk) {
          if (pk.pickId === id) orig = pk;
        });
      });
      var via = orig && orig.origOwner !== orig.curOwner
        ? ' (via ' + (getTeamById(orig.origOwner) ? getTeamById(orig.origOwner).nickname : '?') + ')'
        : '';
      return 'Yr' + m[2] + ' Rd' + m[1] + via;
    }

    var breakdown =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px">' +
        '<div style="background:var(--surface2);border-radius:6px;padding:8px">' +
          '<div style="color:var(--muted2);margin-bottom:4px">' + teamA.nickname + ' gives</div>' +
          '<div style="font-size:18px;font-weight:700;color:var(--text)">' + valA.toLocaleString() + ' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>' +
          '<div style="color:var(--muted);font-size:10px">trade value</div>' +
        '</div>' +
        '<div style="background:var(--surface2);border-radius:6px;padding:8px">' +
          '<div style="color:var(--muted2);margin-bottom:4px">' + teamB.nickname + ' gives</div>' +
          '<div style="font-size:18px;font-weight:700;color:var(--text)">' + valB.toLocaleString() + ' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>' +
          '<div style="color:var(--muted);font-size:10px">trade value</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">Value gap: ' +
        Math.round(gap * 100) + '% ' + (gap < 0.12 ? '✅ Fair' : gap < 0.25 ? '⚠️ Borderline' : '❌ Too lopsided') +
      '</div>';

    var teamBGivingMore = valB > valA;
    var rejectingTeam   = teamBGivingMore ? teamB : teamA;

    if (gap <= 0.12) {
      doExecute();
    } else if (gap <= 0.25) {
      var need = (typeof getTeamNeedAtPosition === 'function')
        ? getTeamNeedAtPosition(rejectingTeam,
            teamBGivingMore ? (plA[0] && plA[0].positions[0]) : (plB[0] && plB[0].positions[0]))
        : 0.5;
      if (need >= 0.7) doExecute();
      else result.innerHTML = breakdown + '<p style="color:#facc15;font-weight:600">⚠️ ' +
        rejectingTeam.nickname + ' hesitated — ' + _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB) + '</p>';
    } else {
      result.innerHTML = breakdown + '<p style="color:#f87171;font-weight:600">❌ ' +
        rejectingTeam.nickname + ' rejected — ' + _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB) + '</p>';
    }

    function doExecute() {
      plA.forEach(function (p) {
        teamA.roster = teamA.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamA.capUsed -= p.contract.capHitPerYear;
        teamB.roster.push(p);
        if (p.contract) teamB.capUsed += p.contract.capHitPerYear;
      });
      plB.forEach(function (p) {
        teamB.roster = teamB.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamB.capUsed -= p.contract.capHitPerYear;
        teamA.roster.push(p);
        if (p.contract) teamA.capUsed += p.contract.capHitPerYear;
      });
      pkA.forEach(function (id) { if (typeof transferPick === 'function') transferPick(id, teamA.id, teamB.id); });
      pkB.forEach(function (id) { if (typeof transferPick === 'function') transferPick(id, teamB.id, teamA.id); });
      if (typeof logTransaction === 'function')
        logTransaction('Trade', teamA.city + ' ↔ ' + teamB.city + ' trade completed.', null, null);

      result.innerHTML = breakdown +
        '<p style="color:#4ade80;font-weight:600">✅ Trade executed!</p>' +
        '<p class="small">' + teamA.nickname + ' sent: ' +
          plA.map(function (p) { return p.name + ' (OVR ' + p.attributes.overall + ')'; })
            .concat(pkA.map(pickDesc)).join(', ') + '</p>' +
        '<p class="small">' + teamB.nickname + ' sent: ' +
          plB.map(function (p) { return p.name + ' (OVR ' + p.attributes.overall + ')'; })
            .concat(pkB.map(pickDesc)).join(', ') + '</p>';

      setTimeout(function () { window.renderTradePicksUI && window.renderTradePicksUI(); }, 1800);
    }
  }; /* end _rewrittenProposeTrade */

  /* ══════════════════════════════════════════════════════════
     REGISTRY-CONNECTED DRAFT SYSTEM
     ════════════════════════════════════════════════════════ */

  /* Build an ordered 224-pick list from the registry.
     Slot order within each round = worst→best record (same
     as calculateDraftOrder). Current owner = whoever holds
     the pick after any trades.                              */
  function buildDraftPickList() {
    var yr = (window.simYear || 1) + 1;
    /* NOTE: Do NOT call initDraftPicks() here — it would create a circular
       call since initDraftPicks was patched to call buildDraftPickList. */

    /* Sort teams worst → best record for slot ordering */
    var teams = listAllTeams(league).slice().sort(function (a, b) {
      if (a.wins !== b.wins) return a.wins - b.wins;
      return (a.pointsFor - a.pointsAgainst) - (b.pointsFor - b.pointsAgainst);
    });

    /* Flat map: all registry picks keyed by pickId for O(1) lookup */
    var regMap = {};
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        regMap[pk.pickId] = pk;
      });
    });

    var list = [];
    for (var round = 1; round <= 7; round++) {
      teams.forEach(function (origTeam, slot) {
        var pickId  = origTeam.id + '_R' + round + '_Y' + yr;
        var regPick = regMap[pickId];
        list.push({
          pickId   : pickId,
          round    : round,
          slot     : slot + 1,           /* 1-based pick number within round */
          origOwner: origTeam.id,
          curOwner : regPick ? regPick.curOwner : origTeam.id,
          year     : yr,
        });
      });
    }

    return list;   /* always 224 entries */
  }

  /* Absolute index into the pick list */
  window._draftAbsIndex = 0;
  window._draftPickList = [];

  /* ── calculateDraftOrder: also build pick list ─────────── */
  var _origCDO = window.calculateDraftOrder;
  window.calculateDraftOrder = function () {
    if (typeof _origCDO === 'function') _origCDO(); /* keep draftOrder for backward compat */
    window._draftPickList  = buildDraftPickList();
    window._draftAbsIndex  = 0;
    draftRound = 1;
    draftIndex = 0;
  };

  /* ── getTeamOnClock: use pick list ─────────────────────── */
  window.getTeamOnClock = function () {
    var pl = window._draftPickList;
    if (!pl || !pl.length) {
      /* Fallback: use computed absolute index to handle rounds 2+ correctly */
      var _fbIdx = (draftRound - 1) * 32 + draftIndex;
      return getTeamById(draftOrder[_fbIdx]);
    }
    var pick = pl[window._draftAbsIndex || 0];
    if (!pick) return null;
    return getTeamById(pick.curOwner);
  };

  /* ── advanceDraft: iterative loop — no recursion risk ───── */
  window.advanceDraft = function () {
    /* Iterate forward through the pick list, running CPU picks
       synchronously in a loop until it's the user's turn or done.
       This avoids a 200+ frame recursive call stack.            */
    while (true) {
      window._draftAbsIndex = (window._draftAbsIndex || 0) + 1;

      var pl  = window._draftPickList;
      var idx = window._draftAbsIndex;

      if (!pl || idx >= pl.length) {
        renderDraftComplete();
        return;
      }

      var pick = pl[idx];
      draftRound = pick.round;
      draftIndex = pick.slot - 1;

      var team = getTeamById(pick.curOwner);
      if (!team) continue;  /* skip orphaned picks, advance again */

      if (team.id === userTeamId) {
        renderDraftScreen();
        return;   /* stop loop — wait for user input */
      }

      /* CPU pick — execute inline, then loop */
      _cpuPickInline(team);
      /* Loop continues to next pick */
    }
  };

  /* CPU picks one player for a team without calling advanceDraft */
  function _cpuPickInline(team) {
    var available = (draftClass || []).filter(function (p) { return !p.drafted; });
    if (!available.length) return;

    var best = available.reduce(function (b, p) {
      var need = (typeof getTeamNeedAtPosition === 'function')
        ? getTeamNeedAtPosition(team, p.positions[0]) : 0.5;
      var score = p.attributes.overall + need * 20;
      return score > b.score ? { p: p, score: score } : b;
    }, { p: available[0], score: 0 }).p;

    best.drafted = true;
    best.contract = {
      years: 4,
      totalValue   : best.attributes.overall * 200000 + 500000,
      capHitPerYear: Math.round((best.attributes.overall * 200000 + 500000) / 4),
    };
    team.roster.push(best);
    team.capUsed += best.contract.capHitPerYear;
    _consumePick(window._draftAbsIndex);
  }

  /* ── Team needs analysis for draft screen ─────────────────── */
  var _IDEAL_COUNTS = {
    QB:3, RB:5, WR:7, TE:3, T:4, G:3, C:2,
    EDGE:4, DT:5, LB:6, CB:7, FS:2, SS:2, K:1, P:1
  };
  var _POS_LABELS = {
    QB:'QB', RB:'RB', WR:'WR', TE:'TE', T:'T', G:'G', C:'C',
    EDGE:'EDGE', DT:'DT', LB:'LB', CB:'CB', FS:'FS', SS:'SS', K:'K', P:'P'
  };

  function buildTeamNeeds(team) {
    var counts = {}, topOVR = {};
    Object.keys(_IDEAL_COUNTS).forEach(function(pos){ counts[pos]=0; topOVR[pos]=99; });

    (team.roster || []).forEach(function(p) {
      var pos = p.positions[0];
      if (counts[pos] !== undefined) {
        counts[pos]++;
        /* Track LOWEST starter OVR (worst starter = biggest need) */
        var ovr = p.attributes ? p.attributes.overall : 70;
        if (ovr < topOVR[pos]) topOVR[pos] = ovr;
      }
    });

    var needs = [];
    Object.keys(_IDEAL_COUNTS).forEach(function(pos) {
      var ideal    = _IDEAL_COUNTS[pos];
      var have     = counts[pos];
      var starterOVR = topOVR[pos] === 99 ? 0 : topOVR[pos];
      var shortage = ideal - have;

      /* Priority: 3 = critical need, 2 = upgrade, 1 = depth */
      if (shortage > 0) {
        needs.push({ pos: pos, type: 'fill', shortage: shortage, ovr: starterOVR,
          label: pos + ' (' + have + '/' + ideal + ')',
          priority: shortage >= 2 ? 3 : 2 });
      } else if (starterOVR < 72 && have > 0) {
        needs.push({ pos: pos, type: 'upgrade', shortage: 0, ovr: starterOVR,
          label: pos + ' starter OVR ' + starterOVR,
          priority: starterOVR < 65 ? 3 : 1 });
      }
    });

    /* Sort: critical first, then alphabetical */
    needs.sort(function(a,b){ return b.priority - a.priority || a.pos.localeCompare(b.pos); });
    return needs;
  }

  function renderNeedsPill(need) {
    var color = need.priority === 3 ? '#f87171'
              : need.priority === 2 ? '#facc15' : '#94a3b8';
    var icon  = need.type === 'fill' ? '⚠' : '↑';
    return '<span style="display:inline-flex;align-items:center;gap:3px;'
      + 'background:rgba(0,0,0,.25);border:1px solid '+color+';'
      + 'border-radius:99px;padding:2px 8px;font-size:10px;'
      + 'font-weight:600;color:'+color+';white-space:nowrap;cursor:pointer" '
      + 'onclick="window._filterDraftByPos(\''+need.pos+'\')" '
      + 'title="'+(need.type==='fill'?'Roster spot needed':'Starter upgrade needed')+'">'
      + icon+' '+need.label+'</span>';
  }

  /* ── Quick roster modal (no page nav — overlay over draft) ── */
  window.renderQuickRoster = function() {
    var myTeam = typeof getTeamById === 'function' ? getTeamById(userTeamId) : null;

  /* ── Filter prospect table by position ─────────────────────── */
  window._draftCurrentFilter = null;

  window._renderDraftTable = function() {

  /* ── Position tab bar builder ──────────────────────────────── */
  window._buildDraftTabs = function() {

    function tab(label, pos) {
      var active  = pos === null ? !cur : cur === pos;

      var activeStyle = 'background:var(--accent-dim);border-color:var(--accent);color:var(--accent2);font-weight:700;';

  /* ── userDraftPlayer: unchanged logic, reads from registry ─ */
  window.userDraftPlayer = function (playerId) {
    var team   = getTeamOnClock();

    if (!rookie || !team) return;

    rookie.drafted      = true;
    rookie.draftedRound = draftRound;
    rookie.draftedPick  = draftIndex + 1;
    rookie.contract = {
      years: 4,
      totalValue   : rookie.attributes.overall * 200000 + 500000,
      capHitPerYear: Math.round((rookie.attributes.overall * 200000 + 500000) / 4),
    };
    team.roster.push(rookie);
    team.capUsed += rookie.contract.capHitPerYear;

    _consumePick(window._draftAbsIndex);
    window.advanceDraft();

  /* ── cpuDraftPlayer: now just a launchDraft entry point ─── */

  window.cpuDraftPlayer = function () {

    window.advanceDraft();  /* advanceDraft is iterative now — safe */

  /* Remove a pick from the registry after it's been used */
  function _consumePick(absIdx) {
    var pl   = window._draftPickList;
    var pick = pl && pl[absIdx];

    Object.keys(window.pickRegistry || {}).forEach(function (tid) {

  window.renderDraftOrder = function () {

    modal.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;'

<script>
/* ── Trade rejection message helper ─────────────────────────
   Explains clearly WHICH team is over/underpaying and by how
   much, so the user knows exactly what to adjust.            */
window._tradeMsg = function (teamBGivingMore, teamA, teamB, valA, valB) {
  var diff    = Math.abs(valB - valA);
  var pct     = Math.round(diff / Math.max(valA, valB) * 100);

  if (teamBGivingMore) {
    /* Team B is sending more value than they receive — B rejects */
    return teamB.city + ' ' + teamB.nickname + ' would send <strong>' + valB.toLocaleString() + ' pts</strong> in value but only receive <strong>'
      + valA.toLocaleString() + ' pts</strong> — they\'d be overpaying by <strong>'
      + diff.toLocaleString() + ' pts (' + pct + '%)</strong>. '
      + 'Add more to <em>' + teamA.nickname + '\'s</em> side to balance it out.';
  } else {
    /* Team A is sending more value than they receive — A "rejects" */
    return 'You\'d be sending <strong>' + valA.toLocaleString() + ' pts</strong> in value but only receiving <strong>'
      + valB.toLocaleString() + ' pts</strong> from '
      + teamB.city + ' ' + teamB.nickname + ' — you\'d be overpaying by <strong>'
      + diff.toLocaleString() + ' pts (' + pct + '%)</strong>. '
      + 'Remove some of your assets or ask <em>' + teamB.nickname + '</em> for more.';
  }
};
</script>

<script>
/* ============================================================
   PATCH — GATE FREE AGENCY TO OFFSEASON ONLY

   Problem: cpuOffersForPlayer() runs any time the user makes
   an offer, including mid-season. CPU teams would outbid the
   user even in Week 3. FA should only be competitive during
   the designated offseason phase.

   Fix:
   1. window.gmPhase tracks 'season' | 'offseason'
   2. cpuOffersForPlayer() returns [] during season
   3. cpuSignPlayer() is a no-op during season
   4. renderFreeAgencyScreen() shows scout-mode banner
      with disabled offer buttons during the season
   5. Phase transitions set gmPhase correctly
   ============================================================ */
(function () {

  /* Default to 'season' — offseason is unlocked by the pipeline */
  window.gmPhase = window.gmPhase || 'season';

  /* ── Set offseason when FA phase opens ─────────────────── */
  var _prevBFAP = window.beginFreeAgencyPhase;
  window.beginFreeAgencyPhase = function () {
    window.gmPhase = 'offseason';
    if (typeof _prevBFAP === 'function') _prevBFAP();
  };

  /* ── Reset to season when new season starts ─────────────── */
  var _prevBNS = window.beginNewSeason;
  window.beginNewSeason = function () {
    window.gmPhase = 'season';
    if (typeof _prevBNS === 'function') _prevBNS();
  };

  /* ── Also set offseason at Black Monday (before FA) ─────── */
  var _prevBBM = window.beginBlackMonday;
  window.beginBlackMonday = function () {
    /* Black Monday is still pre-FA, but it's postseason */
    window.gmPhase = 'postseason';
    if (typeof _prevBBM === 'function') _prevBBM();
  };

  /* ── Gate: cpuOffersForPlayer — no CPU bidding in-season ── */
  var _origCOFP = window.cpuOffersForPlayer || cpuOffersForPlayer;
  window.cpuOffersForPlayer = function (player) {
    if (window.gmPhase !== 'offseason') return [];
    return (typeof _origCOFP === 'function') ? _origCOFP(player) : [];
  };

  /* ── Gate: cpuSignPlayer — no CPU signings in-season ────── */
  var _origCSP = window.cpuSignPlayer || cpuSignPlayer;
  window.cpuSignPlayer = function (player) {
    if (window.gmPhase !== 'offseason') return false;
    return (typeof _origCSP === 'function') ? _origCSP(player) : false;
  };

  /* ── Gate: simulateFullFreeAgency — offseason only ──────── */
  var _origSFFA = window.simulateFullFreeAgency;
  window.simulateFullFreeAgency = function () {
    if (window.gmPhase !== 'offseason') return;
    if (typeof _origSFFA === 'function') _origSFFA();
  };

  /* ── Override renderFreeAgencyScreen with phase awareness ── */
  var _origRFAS = window.renderFreeAgencyScreen;
  window.renderFreeAgencyScreen = function () {
    if (window.gmPhase !== 'offseason') {
      _renderFAScoutMode();
      return;
    }
    if (typeof _origRFAS === 'function') _origRFAS();
  };

  function _renderFAScoutMode() {
    if (typeof freeAgents === 'undefined' || !freeAgents.length) {
      if (typeof generateFreeAgentPool === 'function') generateFreeAgentPool();
    }

    var weeksLeft = (typeof schedule !== 'undefined' && schedule)
      ? Math.max(0, schedule.length - (currentWeekIndex || 0))
      : '—';

    var banner =
      '<div style="background:rgba(59,130,246,.1);border:1px solid #3b82f6;border-radius:8px;'
      + 'padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px">'
      + '<span style="font-size:20px">🔭</span>'
      + '<div>'
        + '<div style="font-weight:600;color:#60a5fa;font-size:13px">Scouting Mode — Season in Progress</div>'
        + '<div style="font-size:11px;color:var(--muted2);margin-top:2px">'
          + 'Free agency opens after Week 17. '
          + (weeksLeft > 0 ? weeksLeft + ' week' + (weeksLeft !== 1 ? 's' : '') + ' remaining.' : 'Season complete — advance to offseason.')
        + '</div>'
      + '</div>'
    + '</div>';

    var pool = (typeof freeAgents !== 'undefined' ? freeAgents : [])
      .slice()
      .sort(function (a, b) { return b.attributes.overall - a.attributes.overall; });

    var rows = pool.map(function (p) {
      var mv  = typeof calculateMarketValue === 'function' ? calculateMarketValue(p) : { capHitPerYear: 0 };
      var ovr = p.attributes ? p.attributes.overall : 70;
      var dev = p.devTrait && p.devTrait !== 'Normal'
        ? ' <span style="font-size:9px;color:#facc15">' + p.devTrait + '</span>' : '';
      function ovc(v){return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';}
      return '<tr>'
        + '<td>' + p.name + dev + '</td>'
        + '<td>' + p.positions[0] + '</td>'
        + '<td>' + p.age + '</td>'
        + '<td style="color:' + ovc(ovr) + ';font-weight:600">' + ovr + '</td>'
        + '<td>$' + (mv.capHitPerYear ? mv.capHitPerYear.toLocaleString() : '—') + '/yr</td>'
        + '<td style="color:var(--muted);font-size:11px;font-style:italic">Opens in offseason</td>'
        + '</tr>';
    }).join('');

    setMainContent(
      '<h2>Free Agents — Scout Report</h2>'
      + banner
      + (pool.length
        ? '<table><thead><tr>'
            + '<th>Name</th><th>Pos</th><th>Age</th><th>OVR</th><th>Est. Value</th><th>Sign</th>'
          + '</tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p class="small" style="color:var(--muted2)">No free agents generated yet.</p>')
    );
  }

  /* ── Block user from submitting offers in-season too ────── */
  var _origSCO2 = window.submitContractOffer;
  window.submitContractOffer = function (playerId) {
    if (window.gmPhase !== 'offseason') {
      setMainContent(
        '<div class="welcome-hero">'
        + '<h2 style="color:#f87171">🚫 Signing Unavailable</h2>'
        + '<p style="color:var(--muted2);font-size:13px">Player signings are only allowed during the offseason free agency period. Finish the regular season first.</p>'
        + '<button onclick="renderFreeAgencyScreen()" style="margin-top:10px">← Back to Scouting</button>'
        + '</div>'
      );
      return;
    }
    if (typeof _origSCO2 === 'function') _origSCO2(playerId);
  };

  /* ── Block negotiation screen in-season too ─────────────── */
  var _origRNS2 = window.renderNegotiationScreen;
  window.renderNegotiationScreen = function (playerId) {
    if (window.gmPhase !== 'offseason') {
      setMainContent(
        '<div class="welcome-hero">'
        + '<h2 style="color:#f87171">🚫 Signing Unavailable</h2>'
        + '<p style="color:var(--muted2);font-size:13px">Negotiations open after the season ends.</p>'
        + '<button onclick="renderFreeAgencyScreen()" style="margin-top:10px">← Back to Scouting</button>'
        + '</div>'
      );
      return;
    }
    if (typeof _origRNS2 === 'function') _origRNS2(playerId);
  };

})();
</script>

<script>
/* ============================================================
   RE-SIGN FEATURE
   Allows user to negotiate a new contract extension with any
   player currently on their roster. Uses the same
   calculateMarketValue engine as free agency. The player
   stays on the roster — only the contract terms change.
   ============================================================ */

(function () {

  /* ── State ─────────────────────────────────────────────── */
  var reSignState = {
    playerId: null,
    round: 1,
    counterOffer: null
  };

  /* ── Patch renderPlayerDetail to inject the Re-sign button ─ */
  var _origRPD_resign = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _origRPD_resign === 'function') _origRPD_resign(playerId);

    /* After the original renders, inject the Re-sign button
       alongside Cut / Trade inside the actions flex row.        */
    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;

      /* Confirm this player is on the user's team */
      var p = null, onMyTeam = false;
      var tid = typeof activeTeamId === 'function' ? activeTeamId() : (typeof userTeamId !== 'undefined' ? userTeamId : null);
      if (!tid) return;
      listAllTeams(league).forEach(function (t) {
        t.roster.forEach(function (x) {
          if (String(x.id) === String(playerId)) {
            p = x;
            if (t.id === tid) onMyTeam = true;
          }
        });
      });
      if (!p || !onMyTeam) return;

      /* Find the actions flex row (the div holding Cut + Trade) */
      var allDivs = main.querySelectorAll('div');
      var actionsRow = null;
      allDivs.forEach(function (div) {
        if (div.style && div.style.display === 'flex' && div.style.gap === '8px' && div.style.marginTop === '14px') {
          /* Verify it contains the Cut button */
          if (div.querySelector && div.querySelector('button')) {
            var btns = div.querySelectorAll('button');
            var hasCut = false;
            btns.forEach(function (b) { if (b.textContent.indexOf('Cut') !== -1) hasCut = true; });
            if (hasCut) actionsRow = div;
          }
        }
      });

      if (!actionsRow) return;
      /* Avoid double-injection */
      if (actionsRow.querySelector('.resign-btn')) return;

      var btn = document.createElement('button');
      btn.className = 'resign-btn';
      btn.onclick = function () { window.renderReSignScreen(playerId); };
      btn.style.cssText = 'flex:1;background:rgba(245,158,11,.15);border-color:#f59e0b;color:#fbbf24;font-size:12px';
      btn.textContent = '📝 Re-sign';
      actionsRow.appendChild(btn);
    }, 50);
  };

  /* ── Patch renderPlayerDetail: inject Transaction History ── */
  var _origRPD_txHistory = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _origRPD_txHistory === 'function') _origRPD_txHistory(playerId);

    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;

      /* Find the player */
      var p = null;
      if (typeof listAllTeams === 'function' && league) {
        listAllTeams(league).forEach(function (t) {
          t.roster.forEach(function (x) {
            if (String(x.id) === String(playerId)) p = x;
          });
        });
      }
      /* Also check free agents */
      if (!p && typeof freeAgents !== 'undefined') {
        freeAgents.forEach(function (x) {
          if (String(x.id) === String(playerId)) p = x;
        });
      }
      if (!p) return;

      /* Don't double-inject */
      if (main.querySelector('.player-tx-history')) return;

      /* Gather matching transactions */
      var log = typeof transactionLog !== 'undefined' ? transactionLog : [];
      var entries = log.filter(function (e) {
        if (e.playerName && e.playerName === p.name) return true;
        if (e.description && e.description.indexOf(p.name) !== -1) return true;
        return false;
      }).slice().reverse();  /* newest first */

      /* Badge colour per type */
      function txBadge(type) {
        var cfg = {
          'Trade':    { bg:'rgba(59,130,246,.15)',  border:'#3b82f6', color:'#60a5fa' },
          'Signing':  { bg:'rgba(22,163,74,.15)',   border:'var(--accent)', color:'var(--accent2)' },
          'Re-sign':  { bg:'rgba(34,197,94,.12)',   border:'#16a34a', color:'#4ade80' },
          'Release':  { bg:'rgba(248,113,113,.12)', border:'#f87171', color:'#fca5a5' },
          'Draft':    { bg:'rgba(245,158,11,.12)',  border:'#f59e0b', color:'#fbbf24' },
        };
        var c = cfg[type] || { bg:'var(--surface3)', border:'var(--border)', color:'var(--muted2)' };
        return '<span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;'
          + 'font-weight:700;letter-spacing:.4px;white-space:nowrap;'
          + 'background:' + c.bg + ';border:1px solid ' + c.border + ';color:' + c.color + '">'
          + type.toUpperCase() + '</span>';
      }

      /* Render rows */
      var rows = '';
      if (!entries.length) {
        rows = '<div style="text-align:center;padding:20px 0;color:var(--muted2);font-size:13px">'
          + 'No transactions on record for this player yet.</div>';
      } else {
        entries.forEach(function (e) {
          var wk = '';
          if (e.season || e.week) {
            wk = '<span style="font-size:10px;font-weight:600;color:var(--accent2)">';
            if (e.season) wk += 'S' + e.season;
            if (e.season && e.week) wk += ' · ';
            if (e.week) wk += 'Wk ' + e.week;
            wk += '</span>';
          }
          var dt = new Date(e.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

          rows += '<div style="display:flex;gap:10px;align-items:flex-start;'
            + 'padding:10px 0;border-bottom:1px solid rgba(30,45,71,.5)">'

            /* left: dot + line */
            + '<div style="display:flex;flex-direction:column;align-items:center;padding-top:3px">'
              + '<div style="width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0"></div>'
            + '</div>'

            /* right: content */
            + '<div style="flex:1;min-width:0">'
              + '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px">'
                + txBadge(e.type)
                + '<span style="font-size:11px;color:var(--muted2)">'
                  + (wk ? wk + '&ensp;' : '') + dt
                + '</span>'
              + '</div>'
              + '<div style="font-size:12px;color:var(--text);line-height:1.5">' + e.description + '</div>'
            + '</div>'

          + '</div>';
        });
      }

      /* Build the section */
      var section = document.createElement('div');
      section.className = 'player-tx-history';
      section.style.cssText = 'margin-top:14px;background:var(--surface);border:1px solid var(--border);'
        + 'border-radius:10px;padding:16px';
      section.innerHTML = '<div style="font-size:10px;font-weight:600;letter-spacing:1px;'
          + 'text-transform:uppercase;color:var(--accent2);margin-bottom:12px;'
          + 'display:flex;align-items:center;justify-content:space-between">'
          + '<span>Transaction History</span>'
          + '<span style="font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted2);'
            + 'text-transform:none">'
            + entries.length + ' record' + (entries.length !== 1 ? 's' : '')
          + '</span>'
        + '</div>'
        + rows;

      main.appendChild(section);
    }, 80);
  };

  /* ── Patch renderPlayerDetail: inject Game Log ───────────── */
  var _origRPD_gameLog = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    if (typeof _origRPD_gameLog === 'function') _origRPD_gameLog(playerId);

    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;
      if (main.querySelector('.player-game-log')) return;

      /* Find the player */
      var p = null;
      if (typeof listAllTeams === 'function' && league) {
        listAllTeams(league).forEach(function (t) {
          t.roster.forEach(function (x) { if (String(x.id) === String(playerId)) p = x; });
        });
      }
      if (!p && typeof freeAgents !== 'undefined') {
        freeAgents.forEach(function (x) { if (String(x.id) === String(playerId)) p = x; });
      }
      if (!p) return;

      /* Walk schedule for per-game stats for this player */
      var gameLogs = [];
      if (typeof schedule !== 'undefined' && schedule) {
        schedule.forEach(function (wk) {
          if (!wk.games) return;
          wk.games.forEach(function (g) {
            if (!g.played) return;
            var entry = null, isHome = false;
            if (g.homePlayerStats && g.homePlayerStats[playerId]) {
              entry = g.homePlayerStats[playerId]; isHome = true;
            } else if (g.awayPlayerStats && g.awayPlayerStats[playerId]) {
              entry = g.awayPlayerStats[playerId]; isHome = false;
            }
            if (!entry) return;
            var myScore  = isHome ? g.homeScore : g.awayScore;
            var oppScore = isHome ? g.awayScore : g.homeScore;
            var oppId    = isHome ? g.awayTeamId : g.homeTeamId;
            var opp      = typeof getTeamById === 'function' ? getTeamById(oppId) : null;
            var won      = myScore > oppScore;
            var tied     = myScore === oppScore;
            gameLogs.push({
              week:     wk.weekNumber,
              oppName:  opp ? opp.nickname : '?',
              result:   (won ? 'W' : tied ? 'T' : 'L') + ' ' + myScore + '-' + oppScore,
              won:      won, tied: tied,
              s:        entry.stats || {}
            });
          });
        });
      }

      if (!gameLogs.length) return; /* no per-game data yet (week 1 not played) */

      /* Position-aware column config */
      var pos = p.positions[0];
      var cols;
      if (pos === 'QB') {
        cols = [
          { key:'passingYards',     label:'PASS YDS' },
          { key:'passingTD',        label:'TD' },
          { key:'interceptionsThrown', label:'INT' },
          { key:'rushingYards',     label:'RUSH YDS' },
          { key:'rushingTD',        label:'RUSH TD' }
        ];
      } else if (pos === 'RB') {
        cols = [
          { key:'rushingYards',   label:'RUSH YDS' },
          { key:'rushingTD',      label:'RUSH TD' },
          { key:'receivingYards', label:'REC YDS' },
          { key:'receivingTD',    label:'REC TD' }
        ];
      } else if (pos === 'WR' || pos === 'TE') {
        cols = [
          { key:'receivingYards', label:'REC YDS' },
          { key:'receivingTD',    label:'TD' },
          { key:'rushingYards',   label:'RUSH YDS' }
        ];
      } else if (pos === 'K') {
        cols = [
          { key:'fieldGoalsMade',   label:'FG'       },
          { key:'fieldGoalsMissed', label:'FG MISS'  },
          { key:'xpMade',           label:'XP'       },
          { key:'xpMissed',         label:'XP MISS'  }
        ];
      } else {
        /* Defense */
        cols = [
          { key:'tackles',       label:'TKL' },
          { key:'sacks',         label:'SCK' },
          { key:'interceptions', label:'INT' }
        ];
      }

      /* Trim cols that are all zeros */
      cols = cols.filter(function (c) {
        return gameLogs.some(function (gl) { return (gl.s[c.key] || 0) > 0; });
      });
      if (!cols.length) return;

      /* Header row */
      var thead = '<tr>'
        + '<th style="text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding:5px 8px">WK</th>'
        + '<th style="text-align:left;font-size:10px;color:var(--muted);font-weight:600;padding:5px 8px">OPP</th>'
        + '<th style="text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding:5px 8px">RESULT</th>'
        + cols.map(function (c) {
            return '<th style="text-align:right;font-size:10px;color:var(--muted);font-weight:600;padding:5px 8px">'
              + c.label + '</th>';
          }).join('')
        + '</tr>';

      /* Data rows */
      var trows = gameLogs.map(function (gl) {
        var rc = gl.won ? '#4ade80' : gl.tied ? '#facc15' : '#f87171';

        /* Highlight standout performance — any key > threshold */
        var standout = cols.some(function (c) {
          var v = gl.s[c.key] || 0;
          if (c.key === 'passingYards')  return v >= 300;
          if (c.key === 'rushingYards')  return v >= 100;
          if (c.key === 'receivingYards') return v >= 100;
          if (c.key === 'passingTD' || c.key === 'rushingTD' || c.key === 'receivingTD') return v >= 3;
          if (c.key === 'sacks')         return v >= 2;
          if (c.key === 'tackles')       return v >= 10;
          return false;
        });

        return '<tr style="' + (standout ? 'background:rgba(22,163,74,.06)' : '') + '">'
          + '<td style="text-align:center;font-size:12px;color:var(--muted2);padding:6px 8px">' + gl.week + '</td>'
          + '<td style="text-align:left;font-size:12px;padding:6px 8px">vs ' + gl.oppName + '</td>'
          + '<td style="text-align:center;font-size:12px;font-weight:600;color:' + rc + ';padding:6px 8px">' + gl.result + '</td>'
          + cols.map(function (c) {
              var v = gl.s[c.key] || 0;
              /* bold the stat if it's a standout value for that column */
              var hot = false;
              if (c.key === 'passingYards'  && v >= 300) hot = true;
              if (c.key === 'rushingYards'  && v >= 100) hot = true;
              if (c.key === 'receivingYards'&& v >= 100) hot = true;
              if ((c.key === 'passingTD' || c.key === 'rushingTD' || c.key === 'receivingTD') && v >= 3) hot = true;
              if (c.key === 'sacks'    && v >= 2)  hot = true;
              if (c.key === 'tackles'  && v >= 10) hot = true;
              return '<td style="text-align:right;font-size:12px;padding:6px 8px;'
                + (hot ? 'font-weight:700;color:var(--accent2)' : 'color:var(--text)') + '">'
                + v + '</td>';
            }).join('')
          + '</tr>';
      }).join('');

      /* Season averages footer */
      var avgRow = '<tr style="background:var(--surface2);border-top:1px solid var(--border)">'
        + '<td colspan="3" style="font-size:10px;font-weight:700;letter-spacing:.5px;'
          + 'text-transform:uppercase;color:var(--muted2);padding:5px 8px">AVG</td>'
        + cols.map(function (c) {
            var total = gameLogs.reduce(function (acc, gl) { return acc + (gl.s[c.key] || 0); }, 0);
            var avg   = gameLogs.length ? (total / gameLogs.length).toFixed(1) : '0';
            return '<td style="text-align:right;font-size:11px;color:var(--muted2);padding:5px 8px">' + avg + '</td>';
          }).join('')
        + '</tr>';

      /* Assemble section */
      var section = document.createElement('div');
      section.className = 'player-game-log';
      section.style.cssText = 'margin-top:14px;background:var(--surface);border:1px solid var(--border);'
        + 'border-radius:10px;padding:16px';
      section.innerHTML =
        '<div style="font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;'
          + 'color:var(--accent2);margin-bottom:10px;display:flex;align-items:center;'
          + 'justify-content:space-between">'
          + '<span>Game Log</span>'
          + '<span style="font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted2);'
            + 'text-transform:none">'
            + gameLogs.length + ' game' + (gameLogs.length !== 1 ? 's' : '')
          + '</span>'
        + '</div>'
        + '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
          + '<table style="width:100%;border-collapse:collapse;min-width:280px">'
            + '<thead>' + thead + '</thead>'
            + '<tbody>' + trows + '</tbody>'
            + '<tfoot>' + avgRow + '</tfoot>'
          + '</table>'
        + '</div>';

      main.appendChild(section);
    }, 110);
  };

  /* ── Helper: find player on user roster ──────────────────── */
  function getMyPlayer(playerId) {
    var tid = typeof activeTeamId === 'function' ? activeTeamId() : (typeof userTeamId !== 'undefined' ? userTeamId : null);
    var team = tid ? getTeamById(tid) : null;
    if (!team) return null;
    return team.roster.find(function (x) { return String(x.id) === String(playerId); }) || null;
  }

  /* ── assignPersonality shim (may already exist) ──────────── */
  function ensurePersonality(p) {
    if (!p.personality && typeof assignPersonality === 'function') assignPersonality(p);
    if (!p.personality) {
      var opts = ['Balanced','Greedy','Loyal','RingChaser','SchemeFit','ShortDeal'];
      p.personality = opts[Math.floor(Math.random() * opts.length)];
    }
  }

  /* ── Interest score for re-sign (loyalty bonus built in) ─── */
  function reSignInterest(p, team, salary, years) {
    var mv = calculateMarketValue(p);
    var score = salary / mv.capHitPerYear;

    /* Always a loyalty bonus — player is already on this team */
    score *= 1.15;

    switch (p.personality) {
      case 'Greedy':    score *= 1.05; break;
      case 'Loyal':     score *= 1.25; break;  /* extra loyalty boost */
      case 'RingChaser': score += (team.wins - team.losses) / 10; break;
      case 'SchemeFit':
        if (['QB','WR','RB'].indexOf(p.positions[0]) !== -1) score += team.coach.offenseRating / 200;
        else score += team.coach.defenseRating / 200;
        break;
      case 'ShortDeal': score *= (years <= 2 ? 1.2 : 0.9); break;
    }

    return score;
  }

  /* ── Counter-offer for re-sign ───────────────────────────── */
  function reSignCounter(p) {
    var mv = calculateMarketValue(p);
    var salary = mv.capHitPerYear;
    var years  = mv.years;

    /* Personality adjustments — player negotiates from market value
       but gives a small loyalty discount                            */
    if (p.personality === 'Greedy')    salary = Math.round(salary * 1.20);
    if (p.personality === 'Loyal')     salary = Math.round(salary * 0.90); /* takes less to stay */
    if (p.personality === 'ShortDeal') years  = Math.min(2, years);

    return { salary: Math.round(salary), years: years };
  }

  /* ── Screen helpers ──────────────────────────────────────── */

  /* ── Round 1 Screen ─────────────────────────────────────── */
  window.renderReSignScreen = function (playerId) {

    var cur = p.contract;
    var tid = typeof activeTeamId === 'function' ? activeTeamId() : userTeamId;
    var team = getTeamById(tid);

    reSignState = { playerId: playerId, round: 1, counterOffer: null };

      ? '$' + cur.capHitPerYear.toLocaleString() + '/yr · ' + cur.years + ' yr' + (cur.years !== 1 ? 's' : '') + ' remaining'
      : 'Expiring';

    var capSpace = team.salaryCap - team.capUsed;
    var afterRelease = capSpace + (cur ? cur.capHitPerYear : 0); /* space once old deal freed */

    setMainContent(
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'

      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:480px">'

        + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:var(--accent2);margin-bottom:4px">📝 Re-sign ' + p.name + '</div>'
        + '<div style="font-size:12px;color:var(--muted2);margin-bottom:16px">'
          + p.positions.join('/') + ' · Age ' + p.age
          + ' · OVR <span style="color:' + ovc(p.attributes.overall) + ';font-weight:600">' + p.attributes.overall + '</span>'
          + ' · Personality: <strong style="color:var(--gold)">' + p.personality + '</strong>'
        + '</div>'

        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'
          + '<div style="background:var(--surface2);border-radius:8px;padding:12px">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Current Contract</div>'
            + '<div style="font-size:13px;font-weight:500">' + curContract + '</div>'
          + '</div>'
          + '<div style="background:var(--surface2);border-radius:8px;padding:12px">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Market Value</div>'
            + '<div style="font-size:13px;font-weight:500;color:#4ade80">$' + mv.capHitPerYear.toLocaleString() + '/yr</div>'
          + '</div>'
          + '<div style="background:var(--surface2);border-radius:8px;padding:12px">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Available Cap Space</div>'
            + '<div style="font-size:13px;font-weight:500;color:' + (afterRelease < 0 ? '#f87171' : '#4ade80') + '">$' + afterRelease.toLocaleString() + '</div>'
          + '</div>'
          + '<div style="background:var(--surface2);border-radius:8px;padding:12px">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Market Years</div>'

        + '</div>'

        + '<div style="font-size:11px;color:var(--muted2);margin-bottom:6px">Your Offer</div>'

        + '<label style="font-size:12px;color:var(--muted2)">Salary per Year ($)</label>'

        + '<div style="display:flex;gap:8px">'

          + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="flex:1;font-size:12px">Cancel</button>'
        + '</div>'

      + '</div>'

  };

  /* ── Submit Round 1 ──────────────────────────────────────── */
  window.submitReSignOffer = function () {
    var playerId = reSignState.playerId;
    var p = getMyPlayer(playerId);
    if (!p) return;

    var tid = typeof activeTeamId === 'function' ? activeTeamId() : userTeamId;
    var team = getTeamById(tid);

    var salary = parseInt(document.getElementById('resignSalary').value) || 0;
    var years  = parseInt(document.getElementById('resignYears').value)  || 1;

    /* Cap check (net new money after releasing old deal) */
    var oldHit  = p.contract ? p.contract.capHitPerYear : 0;
    var netDelta = salary - oldHit;
    if (team.capUsed + netDelta > team.salaryCap) {
      alert('Not enough cap space. You need $' + (team.capUsed + netDelta - team.salaryCap).toLocaleString() + ' more room.');
      return;
    }

    /* Round 1 → generate counter */
    reSignState.counterOffer = reSignCounter(p);
    reSignState.round = 2;

    var counter = reSignState.counterOffer;
    var interest = reSignInterest(p, team, salary, years);

    /* If offer already meets or beats what player wants → done */
    if (salary >= counter.salary && years >= counter.years) {
      window.finalizeReSign(salary, years);
      return;
    }

    /* Low-ball → outright rejection */
    if (interest < 0.75) {
      setMainContent(
        '<div class="welcome-hero" style="max-width:480px">'
        + '<h2 style="color:#f87171">❌ Offer Rejected</h2>'
        + '<p style="color:var(--muted2);font-size:13px">'
          + p.name + ' rejected your offer as too low. They feel undervalued and want to test the open market.'
        + '</p>'
        + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="margin-top:10px">← Back to Profile</button>'
        + '</div>'
      );
      return;
    }

    /* Counter-offer round */
    setMainContent(
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'

      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:480px">'

        + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:var(--gold);margin-bottom:4px">💬 Counteroffer — ' + p.name + '</div>'
        + '<p style="font-size:13px;color:var(--muted2);margin-bottom:16px">' + p.name + ' reviewed your offer and came back with a counter.</p>'

        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">'
          + '<div style="background:var(--surface2);border-radius:8px;padding:12px;border:1px solid var(--border)">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Your Offer</div>'
            + '<div style="font-size:14px;font-weight:600">$' + salary.toLocaleString() + '/yr</div>'
            + '<div style="font-size:11px;color:var(--muted2)">' + years + ' yr' + (years !== 1 ? 's' : '') + '</div>'
          + '</div>'
          + '<div style="background:rgba(245,158,11,.1);border-radius:8px;padding:12px;border:1px solid #f59e0b">'
            + '<div style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Their Counter</div>'
            + '<div style="font-size:14px;font-weight:600;color:#fbbf24">$' + counter.salary.toLocaleString() + '/yr</div>'
            + '<div style="font-size:11px;color:var(--muted2)">' + counter.years + ' yr' + (counter.years !== 1 ? 's' : '') + '</div>'
          + '</div>'
        + '</div>'

        + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
          + '<button onclick="window.acceptReSignCounter()" style="flex:1;background:rgba(34,197,94,.15);border-color:#22c55e;color:#4ade80;font-weight:600">✅ Accept Counter</button>'

          + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="flex:1;font-size:12px">Walk Away</button>'
        + '</div>'

      + '</div>'
    );
  };

  /* ── Round 2 Screen ─────────────────────────────────────── */
  window.renderReSignRound2 = function () {

    var p = getMyPlayer(playerId);

    var counter = reSignState.counterOffer;

    setMainContent(
      '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="width:auto;padding:5px 14px;margin-bottom:14px;font-size:12px">← Player Profile</button>'

      + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:480px">'

        + '</p>'

        + '<label style="font-size:12px;color:var(--muted2)">Contract Length</label>'
        + '<select id="resignYears" style="margin-bottom:10px">'
          + '<option value="1">1 year</option>'
          + '<option value="2">2 years</option>'
          + '<option value="3" ' + (counter.years >= 3 ? 'selected' : '') + '>3 years</option>'
          + '<option value="4" ' + (counter.years >= 4 ? 'selected' : '') + '>4 years</option>'
          + '<option value="5">5 years</option>'
        + '</select>'

        + '<label style="font-size:12px;color:var(--muted2)">Salary per Year ($)</label>'
        + '<input id="resignSalary" type="number" value="' + counter.salary + '" style="margin-bottom:14px" />'

        + '<div style="display:flex;gap:8px">'
          + '<button onclick="window.submitReSignFinal()" style="flex:2;background:rgba(59,130,246,.2);border-color:#3b82f6;color:#60a5fa;font-weight:600">📤 Submit Final Offer</button>'
          + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="flex:1;font-size:12px">Walk Away</button>'
        + '</div>'

      + '</div>'
    );
  };

  /* ── Accept Counter ──────────────────────────────────────── */
  window.acceptReSignCounter = function () {
    var c = reSignState.counterOffer;
    window.finalizeReSign(c.salary, c.years);
  };

  /* ── Submit Final Offer ──────────────────────────────────── */
  window.submitReSignFinal = function () {
    var playerId = reSignState.playerId;
    var p = getMyPlayer(playerId);
    if (!p) return;
    var counter = reSignState.counterOffer;

    var salary = parseInt(document.getElementById('resignSalary').value) || 0;
    var years  = parseInt(document.getElementById('resignYears').value)  || 1;

    var tid = typeof activeTeamId === 'function' ? activeTeamId() : userTeamId;
    var team = getTeamById(tid);

    /* Cap check */
    var oldHit  = p.contract ? p.contract.capHitPerYear : 0;
    var netDelta = salary - oldHit;
    if (team.capUsed + netDelta > team.salaryCap) {
      alert('Not enough cap space. You need $' + (team.capUsed + netDelta - team.salaryCap).toLocaleString() + ' more room.');
      return;
    }

    /* Does the final offer beat or meet their counter? */
    if (salary >= counter.salary && years >= counter.years) {
      window.finalizeReSign(salary, years);
      return;
    }

    /* Below counter — player walks */
    setMainContent(
      '<div class="welcome-hero" style="max-width:480px">'
      + '<h2 style="color:#f87171">❌ Negotiations Broke Down</h2>'
      + '<p style="color:var(--muted2);font-size:13px">'
        + p.name + ' couldn\'t reach an agreement with your team. They will play out their current contract and test free agency when it expires.'
      + '</p>'
      + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="margin-top:10px">← Back to Profile</button>'
      + '</div>'
    );
  };

  /* ── Finalize Re-sign ────────────────────────────────────── */
  window.finalizeReSign = function (salary, years) {
    var playerId = reSignState.playerId;
    var p = getMyPlayer(playerId);
    if (!p) return;

    var tid = typeof activeTeamId === 'function' ? activeTeamId() : userTeamId;
    var team = getTeamById(tid);

    /* Cap adjustment: remove old cap hit, apply new */
    var oldHit = p.contract ? p.contract.capHitPerYear : 0;
    team.capUsed -= oldHit;
    team.capUsed += salary;

    /* Update contract in place — player stays on roster */
    p.contract = {
      years: years,
      totalValue: salary * years,
      capHitPerYear: salary
    };

    /* Mark previous team for loyalty tracking */
    p.previousTeamId = team.id;

    if (typeof logTransaction === 'function') {
      logTransaction('Re-sign', team.city + ' ' + team.nickname + ' extended ' + p.name, team.id, p);
    }

    setMainContent(
      '<div class="welcome-hero" style="max-width:480px">'
      + '<h2 style="color:var(--accent2)">✅ Contract Extended!</h2>'
      + '<p style="font-size:14px;color:var(--text);margin-bottom:6px">'
        + '<strong>' + p.name + '</strong> has re-signed with the '
        + '<strong>' + team.city + ' ' + team.nickname + '</strong>.'
      + '</p>'
      + '<p style="font-size:13px;color:var(--muted2)">'
        + 'New deal: <strong style="color:#4ade80">$' + salary.toLocaleString() + '/yr</strong>'
        + ' over <strong>' + years + ' year' + (years !== 1 ? 's' : '') + '</strong>'
        + ' ($' + (salary * years).toLocaleString() + ' total)'
      + '</p>'
      + '<p style="font-size:12px;color:var(--muted);margin-top:8px">'
        + 'Cap space remaining: <strong style="color:' + ((team.salaryCap - team.capUsed) < 0 ? '#f87171' : '#4ade80') + '">'
        + '$' + (team.salaryCap - team.capUsed).toLocaleString()
        + '</strong>'
      + '</p>'
      + '<div style="display:flex;gap:8px;margin-top:14px">'
        + '<button onclick="renderPlayerDetail(\'' + playerId + '\')" style="flex:1;background:rgba(22,163,74,.15);border-color:var(--accent);color:var(--accent2);font-weight:600">← View Player</button>'
        + '<button onclick="renderRoster()" style="flex:1">👥 Roster</button>'
      + '</div>'
      + '</div>'
    );
  };

})();
</script>

  /* ── 2. Position-Specific OVR Formulas (weights sum to 100) ─ */

    /* ── Offense ────────────────────────────────────────────────────────────
       Weights reflect how much each attribute contributes to positional value.
       All weights within a position sum to 100.                             */

    QB: {

    }
  };

  /* ── 3. Position Bias — how relevant each attr is per position ─
     1.0 = position-defining attr (generated near overall)
     0.2 = irrelevant attr (generated low)                        */

  var POS_BIAS = {
    QB:  {throwPower:.95,throwAccShort:.95,throwAccMid:.9,throwAccDeep:.85,awareness:.9,
          speed:.5,agility:.55,strength:.35,stamina:.6,acceleration:.45,

    RB:  {speed:.95,acceleration:.9,agility:.9,elusiveness:.9,trucking:.85,

          strength:.6,catching:.5,catchInTraffic:.45,awareness:.55,
          passBlock:.3,runBlock:.25,throwPower:.05,throwAccShort:.05,
          manCoverage:.1,zoneCoverage:.1,blockShedding:.1,tackle:.3,hitPower:.4,

    WR:  {speed:.95,routeRunning:.95,catching:.95,catchInTraffic:.85,

    /* Generic OL bias — used as fallback */
    OL:  {passBlock:.95,runBlock:.95,passBlockStrength:.9,passBlockFootwork:.88,
          runBlockStrength:.9,runBlockFinesse:.85,strength:.88,awareness:.7,agility:.6,
          stamina:.7,tackle:.35,blockShedding:.35,hitPower:.4,
          speed:.35,acceleration:.35,catching:.1,routeRunning:.05,
          throwPower:.05,throwAccShort:.05,manCoverage:.1,zoneCoverage:.1,
          kickPower:.05,kickAccuracy:.05},

    /* Tackle: pass-blocking technique is the differentiator */
    T:   {passBlockFootwork:.95,passBlockStrength:.92,runBlockStrength:.88,
          runBlockFinesse:.82,passBlock:.92,runBlock:.85,strength:.88,
          awareness:.7,agility:.62,stamina:.7,tackle:.3,blockShedding:.3,
          hitPower:.35,speed:.3,acceleration:.3,catching:.05,routeRunning:.03,
          throwPower:.03,throwAccShort:.03,manCoverage:.05,zoneCoverage:.05,
          kickPower:.03,kickAccuracy:.03},

    /* Guard: run-blocking and pulling emphasis */
    G:   {runBlockStrength:.95,runBlockFinesse:.92,passBlockStrength:.9,
          passBlockFootwork:.86,passBlock:.9,runBlock:.95,strength:.9,
          awareness:.65,agility:.65,stamina:.7,tackle:.3,blockShedding:.3,
          hitPower:.38,speed:.32,acceleration:.32,catching:.05,routeRunning:.03,
          throwPower:.03,throwAccShort:.03,manCoverage:.05,zoneCoverage:.05,
          kickPower:.03,kickAccuracy:.03},

    /* Center: awareness is uniquely elevated — makes protection calls */
    C:   {awareness:.95,passBlockStrength:.9,passBlockFootwork:.9,
          runBlockStrength:.88,runBlockFinesse:.84,passBlock:.88,runBlock:.88,
          strength:.86,agility:.6,stamina:.7,tackle:.3,blockShedding:.3,
          hitPower:.35,speed:.28,acceleration:.28,catching:.05,routeRunning:.03,
          throwPower:.03,throwAccShort:.03,manCoverage:.05,zoneCoverage:.05,

    EDGE:{powerMoves:.92,finesseMoves:.92,blockShedding:.9,speed:.82,
          strength:.85,pursuit:.8,awareness:.75,tackle:.7,agility:.7,
          acceleration:.65,stamina:.7,hitPower:.75,
          passBlock:.25,runBlock:.2,catching:.1,routeRunning:.05,
          throwPower:.05,throwAccShort:.05,manCoverage:.2,zoneCoverage:.2,
          kickPower:.05,kickAccuracy:.05},

    DT:  {blockShedding:.92,powerMoves:.92,strength:.9,tackle:.82,
          pursuit:.8,awareness:.75,stamina:.72,hitPower:.75,
          finesseMoves:.7,agility:.55,speed:.45,
          passBlock:.2,runBlock:.15,manCoverage:.1,zoneCoverage:.1,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    LB:  {tackle:.92,playRecognition:.88,zoneCoverage:.82,strength:.78,
          speed:.72,blockShedding:.78,pursuit:.82,hitPower:.85,
          awareness:.8,agility:.65,acceleration:.6,stamina:.72,
          manCoverage:.55,press:.4,powerMoves:.5,finesseMoves:.45,
          passBlock:.2,runBlock:.2,catching:.15,routeRunning:.1,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    CB:  {manCoverage:.95,zoneCoverage:.9,press:.88,speed:.92,
          agility:.88,awareness:.82,tackle:.65,acceleration:.82,
          pursuit:.6,hitPower:.55,elusiveness:.5,
          passBlock:.15,runBlock:.1,catching:.3,routeRunning:.2,
          blockShedding:.2,strength:.4,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    SS:  {tackle:.92,hitPower:.92,playRecognition:.82,zoneCoverage:.78,
          manCoverage:.72,speed:.75,strength:.8,pursuit:.72,awareness:.65,
          agility:.6,acceleration:.6,press:.45,
          blockShedding:.25,passBlock:.15,catching:.3,routeRunning:.15,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    FS:  {zoneCoverage:.95,playRecognition:.95,speed:.88,manCoverage:.82,
          awareness:.9,pursuit:.8,acceleration:.78,agility:.72,tackle:.6,
          hitPower:.5,strength:.45,press:.5,
          blockShedding:.2,passBlock:.15,catching:.4,routeRunning:.25,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    /* S kept as fallback */
    S:   {zoneCoverage:.92,playRecognition:.9,tackle:.87,manCoverage:.82,
          speed:.78,awareness:.88,hitPower:.82,strength:.65,
          agility:.7,acceleration:.7,pursuit:.75,press:.5,
          blockShedding:.3,passBlock:.15,catching:.35,routeRunning:.2,
          throwPower:.05,throwAccShort:.05,kickPower:.05,kickAccuracy:.05},

    K:   {kickPower:.95,kickAccuracy:.95,strength:.45,awareness:.55,
          speed:.3,agility:.3,acceleration:.3,stamina:.5,
          passBlock:.05,runBlock:.05,catching:.1,throwing:.05},

    P:   {kickPower:.95,kickAccuracy:.95,strength:.4,awareness:.55,
          speed:.3,agility:.3,acceleration:.3,stamina:.5}
  };

  /* ── 4. Composite Derivation ─────────────────────────────── */

  function deriveComposites(g) {
    function avg(keys) {
      var s = 0;
      keys.forEach(function(k){ s += (g[k]||60); });
      return Math.round(s / keys.length);
    }
    return {
      athleticism: avg(['speed','acceleration','agility','strength','stamina']),
      intelligence: avg(['awareness','playRecognition','throwAccShort','routeRunning','ballCarrierVision']),
      toughness:   avg(['strength','trucking','tackle','hitPower','blockShedding','carrying']),
      discipline:  avg(['awareness','stamina','passBlockFootwork','runBlockFinesse','zoneCoverage','carrying'])
    };
  }

  /* ── 5. Position-Specific OVR ────────────────────────────── */

  function calcPosOVR(g, pos) {
    /* Normalise all roster slot variants → canonical POS_OVR key */
    if (pos === 'LT' || pos === 'RT')              pos = 'T';
    if (pos === 'LG' || pos === 'RG')              pos = 'G';
    if (pos === 'DL' || pos === 'DE')              pos = 'DT';
    /* FS and SS have distinct formulas — do NOT collapse to S */
    if (pos === 'FS' && !POS_OVR['FS']) pos = 'S';
    if (pos === 'SS' && !POS_OVR['SS']) pos = 'S';
    if (pos === 'MLB' || pos === 'ILB' || pos === 'OLB') pos = 'LB';
    if (pos === 'FB')                              pos = 'RB';
    /* T, G, C fall back to generic OL if no specific formula exists */
    if ((pos === 'T' || pos === 'G' || pos === 'C') && !POS_OVR[pos]) pos = 'OL';
    var formula = POS_OVR[pos] || POS_OVR.LB;
    var total = 0, wsum = 0;
    Object.keys(formula).forEach(function(k){
      total += (g[k] || 60) * formula[k];
      wsum  += formula[k];
    });
    return Math.round(total / wsum);
  }

  /* ── 6. Granular Attribute Generation (lazy, cached) ─────── */

  window.initGranularAttrs = function (player) {
    if (player.granularAttrs) return player.granularAttrs;

    var a   = player.attributes || {};
    var pos = (player.positions && player.positions[0]) || 'LB';
    var ovr = a.overall      || 75;
    var ath = a.athleticism  || ovr;
    var intel = a.intelligence || ovr;
    var tough = a.toughness  || ovr;
    var disc  = a.discipline || ovr;

    var bias = POS_BIAS[pos] || POS_BIAS.LB;

    /* Composite pools — which composite base to draw from per group */
    var POOL = {
      speed:'ath', acceleration:'ath', agility:'ath', strength:'tough',
      stamina:'disc', awareness:'intel',
      throwPower:'ath', throwAccShort:'intel', throwAccMid:'intel', throwAccDeep:'intel',
      elusiveness:'ath', trucking:'tough', jukeMoves:'ath', spinMove:'ath',
      ballCarrierVision:'intel', carrying:'disc',
      catching:'intel', catchInTraffic:'tough', routeRunning:'intel',
      release:'ath', spectacularCatch:'ath',
      passBlock:'tough', runBlock:'tough',
      passBlockStrength:'tough', passBlockFootwork:'disc',
      runBlockStrength:'tough', runBlockFinesse:'intel',
      blockShedding:'tough', tackle:'tough',
      powerMoves:'tough', finesseMoves:'intel',
      pursuit:'ath', playRecognition:'intel',
      manCoverage:'intel', zoneCoverage:'intel',
      press:'ath', hitPower:'tough',
      kickPower:'ath', kickAccuracy:'intel'
    };

    var pools = { ath:ath, intel:intel, tough:tough, disc:disc };

    function gen(key) {
      var relevance = bias[key] !== undefined ? bias[key] : 0.2;
      var poolKey   = POOL[key] || 'ath';
      var composite = pools[poolKey] || ovr;
      /* At relevance 1.0: target ≈ overall, small spread
         At relevance 0.2: target ≈ 40+(ovr-40)*0.2, larger spread */
      var target = 40 + (ovr - 40) * relevance;
      /* Blend in composite to reflect the player's underlying quality */
      var base   = target * 0.75 + composite * 0.25 * relevance;
      var spread = 10 * (1.1 - relevance * 0.8);
      var val    = base + (Math.random() - 0.5) * spread * 2;
      return Math.max(40, Math.min(99, Math.round(val)));
    }

    var g = {};
    /* Generate every defined attribute */
    Object.keys(ATTR_LABELS).forEach(function(k){ g[k] = gen(k); });

    player.granularAttrs = g;

    /* Update composite attributes to reflect generated values */
    var comp = deriveComposites(g);
    player.attributes.athleticism  = comp.athleticism;
    player.attributes.intelligence = comp.intelligence;
    player.attributes.toughness    = comp.toughness;
    player.attributes.discipline   = comp.discipline;

    /* Update overall to position-specific value */
    player.attributes.overall = calcPosOVR(g, pos);

    return g;
  };

  /* ── 7. Render Attributes Screen ─────────────────────────── */

  window.renderAttributesScreen = function (playerId) {
    /* Guarantee snapshot exists before computing deltas */
    if (typeof window.initSeasonOVR === 'function') window.initSeasonOVR();

    /* Locate player across all teams, free agents, and draft class */
    var p = null, team = null;
    listAllTeams(league).forEach(function(t){
      t.roster.forEach(function(x){
        if (String(x.id) === String(playerId)){ p = x; team = t; }
      });
    });
    if (!p && typeof freeAgents !== 'undefined') {
      freeAgents.forEach(function(x){
        if (String(x.id) === String(playerId)) p = x;
      });
    }
    /* Also check draftClass so attrs work on prospects before they're drafted */
    if (!p && typeof draftClass !== 'undefined') {
      draftClass.forEach(function(x){
        if (String(x.id) === String(playerId)) p = x;
      });
    }
    if (!p) return;

    var g      = window.initGranularAttrs(p);
    var pos    = p.positions[0];
    var comp   = deriveComposites(g);
    var gStart = p.seasonStartGranular || null;

    function ovc(v){ return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171'; }

    function bar(label, val, attrKey) {
      val = val || 0;
      var c = ovc(val);
      var deltaHtml = '';
      if (attrKey && gStart && gStart[attrKey] !== undefined) {
        var d = val - gStart[attrKey];
        if (d > 0)
          deltaHtml = '<span style="font-size:9px;color:#4ade80;margin-left:3px;font-weight:700">+' + d + '</span>';
        else if (d < 0)
          deltaHtml = '<span style="font-size:9px;color:#f87171;margin-left:3px;font-weight:700">' + d + '</span>';
      }
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
        + '<div style="width:118px;font-size:11px;color:var(--muted2);white-space:nowrap;flex-shrink:0">' + label + '</div>'
        + '<div style="flex:1;height:5px;background:var(--surface3);border-radius:3px">'
          + '<div style="height:5px;width:' + val + '%;background:' + c + ';border-radius:3px"></div>'
        + '</div>'
        + '<div style="display:flex;align-items:center;justify-content:flex-end;width:52px;flex-shrink:0">'
          + '<span style="font-size:12px;font-weight:700;color:' + c + '">' + val + '</span>'
          + deltaHtml
        + '</div>'
        + '</div>';
    }

    function groupCard(title, keys) {
      return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">'
        + '<div style="font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px">' + title + '</div>'
        + keys.map(function(k){ return bar(ATTR_LABELS[k] || k, g[k], k); }).join('')
        + '</div>';
    }

    /* Composite ratings card */
    var compCard = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">'
      + '<div style="font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px">Composite Ratings</div>'
      + bar('Athleticism',  comp.athleticism)
      + bar('Intelligence', comp.intelligence)
      + bar('Toughness',    comp.toughness)
      + bar('Discipline',   comp.discipline)
      + '</div>';

    /* Position OVR table — all positions listed */
    var posRows = Object.keys(POS_OVR).map(function(pp){
      var pOVR   = calcPosOVR(g, pp);
      var isPrim = pp === pos;
      return '<div style="display:flex;align-items:center;justify-content:space-between;'
        + 'padding:5px 8px;border-radius:6px;margin-bottom:2px;'
        + 'background:' + (isPrim ? 'rgba(22,163,74,.12)' : 'transparent') + '">'
        + '<span style="font-size:12px;color:' + (isPrim ? 'var(--accent2)' : 'var(--muted2)') + ';font-weight:' + (isPrim ? '600' : '400') + '">'
          + pp + (isPrim ? ' <span style="color:var(--gold);font-size:10px">★ primary</span>' : '') + '</span>'
        + '<span style="font-size:14px;font-weight:700;color:' + ovc(pOVR) + '">' + pOVR + '</span>'
        + '</div>';
    }).join('');
