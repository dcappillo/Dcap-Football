  /* ── Cut player from detail screen ─────────────────────── */
  window.confirmCutPlayer = function (playerId) {
    var tid  = activeTeamId();
    var team = getTeamById(tid);
    var p    = team && team.roster.find(function(x){return String(x.id)===String(playerId);});
    if (!p) return;
    var dead = typeof calculateDeadMoney==='function' ? calculateDeadMoney(p) : 0;
    if (!confirm('Cut '+p.name+'?\nDead money: $'+dead.toLocaleString()+'\nThis cannot be undone.')) return;
    team.capUsed -= (p.contract ? (p.contract.capHitPerYear || 0) : 0);
    team.roster = team.roster.filter(function(x){return String(x.id)!==String(playerId);});
    team.capUsed += dead;
    if (typeof recalcAllTeamCap === 'function') recalcAllTeamCap();
    p.isFreeAgent = true;
    if (typeof freeAgents!=='undefined') freeAgents.push(p);
    if (typeof logTransaction==='function') logTransaction('Release',team.city+' '+team.nickname+' cut '+p.name,team.id,p);
    renderRoster();
  };

  /* ══════════════════════════════════════════════════════════
     DRAFT PICK REGISTRY — 7 rounds per team per year
     ════════════════════════════════════════════════════════ */
  window.pickRegistry = {};   /* teamId → [pick, ...] */
  window.simYear      = 1;

  window.initDraftPicks = function () {
    if (!league) return;
    var nextYr = window.simYear + 1;
    listAllTeams(league).forEach(function (t) {
      if (!window.pickRegistry[t.id]) window.pickRegistry[t.id] = [];
      /* Only add picks for next year if not already present */
      var already = window.pickRegistry[t.id].some(function(pk){return pk.year===nextYr;});
      if (already) return;
      for (var r=1; r<=7; r++) {
        var pid = t.id+'_R'+r+'_Y'+nextYr;
        window.pickRegistry[t.id].push({pickId:pid, round:r, year:nextYr, origOwner:t.id, curOwner:t.id});
      }
    });
  };

  window.transferPick = function (pickId, fromId, toId) {
    var picks = window.pickRegistry[fromId]||[];
    var idx = -1;
    picks.forEach(function(pk,i){if(pk.pickId===pickId)idx=i;});
    if (idx<0) return false;
    var pk = picks.splice(idx,1)[0];
    pk.curOwner = toId;
    if (!window.pickRegistry[toId]) window.pickRegistry[toId]=[];
    window.pickRegistry[toId].push(pk);
    return true;
  };

  /* Picks owned by a team (scans entire registry) */
  function picksOwnedBy(teamId) {
    var out=[];
    Object.keys(window.pickRegistry).forEach(function(id){
      (window.pickRegistry[id]||[]).forEach(function(pk){if(pk.curOwner===teamId)out.push(pk);});
    });
    return out.sort(function(a,b){return a.year!==b.year?a.year-b.year:a.round-b.round;});
  }

  /* ── Render user's picks ──────────────────────────────── */
  window.renderMyPicks = function () {
    var team=activeTeam(); if(!team){setMainContent('<p>Select a team first.</p>');return;}
    window.initDraftPicks();
    var picks=picksOwnedBy(team.id);
    var rows=picks.map(function(pk){
      var via=pk.origOwner!==team.id?(' <span style="font-size:10px;color:var(--gold)">(via '+(getTeamById(pk.origOwner)?getTeamById(pk.origOwner).nickname:pk.origOwner)+')</span>'):'';
      return '<tr><td>Year '+pk.year+'</td><td>Round '+pk.round+via+'</td></tr>';
    }).join('');
    setMainContent(
      '<h2>'+team.city+' '+team.nickname+' — Draft Picks</h2>'
      +'<p class="small">All picks currently owned by your team across future drafts.</p>'
      +(picks.length
        ?'<table><thead><tr><th>Draft Year</th><th>Pick</th></tr></thead><tbody>'+rows+'</tbody></table>'
        :'<p style="color:var(--muted2)">No picks owned — trade for some in the Trade Center.</p>')
      +'<button onclick="window.renderTradePicksUI&&window.renderTradePicksUI()" style="margin-top:12px">🔄 Go to Trade Center</button>'
    );
  };

  /* ══════════════════════════════════════════════════════════
     OVERHAULED TRADE CENTER — shows real pick ownership
     ════════════════════════════════════════════════════════ */
  window.renderTradePicksUI = function (preSelectPlayerId) {
    if (!league) return;
    window.initDraftPicks();
    var tid   = activeTeamId();
    var teams = listAllTeams(league);

    function teamOpts(selectedId) {
      return teams.map(function(t){
        return '<option value="'+t.id+'"'+(t.id===selectedId?' selected':'')+'>'+t.city+' '+t.nickname+'</option>';
      }).join('');
    }

    setMainContent(
      '<h2>Trade Center</h2>'
      +'<p class="small">Select two teams, choose players and picks, then propose.</p>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'
        +'<div><label>Team A (giving)</label><select id="tcTeamA" onchange="window._refreshTC()">'+teamOpts(tid)+'</select><div id="tcAssetsA"></div></div>'
        +'<div><label>Team B (giving)</label><select id="tcTeamB" onchange="window._refreshTC()">'+teamOpts(teams.find(function(t){return t.id!==tid;})||teams[0].id)+'</select><div id="tcAssetsB"></div></div>'
      +'</div>'
      +'<button onclick="window._proposeTrade()" style="margin-top:14px;width:100%;background:var(--accent-dim);border-color:var(--accent);color:var(--accent2);font-weight:600">📋 Propose Trade</button>'
      +'<div id="tcResult" style="margin-top:12px"></div>'
    );

    window._refreshTC();

    /* Pre-select player if coming from player detail */
    if (preSelectPlayerId) {
      setTimeout(function(){
        var selA=document.getElementById('tcPlayersA');
        if(!selA)return;
        for(var i=0;i<selA.options.length;i++){
          if(selA.options[i].value===String(preSelectPlayerId)){selA.options[i].selected=true;break;}
        }
      },80);
    }
  };

  window._refreshTC = function () {
    var selA=document.getElementById('tcTeamA'), selB=document.getElementById('tcTeamB');
    if (!selA||!selB) return;
    _buildAssetPanel('A', selA.value);
    _buildAssetPanel('B', selB.value);
  };

  function _buildAssetPanel(side, teamId) {
    var c=document.getElementById('tcAssets'+side); if(!c)return;
    var team=getTeamById(teamId); if(!team)return;

    var pOpts=team.roster.slice()
      .sort(function(a,b){return b.attributes.overall-a.attributes.overall;})
      .map(function(p){var d=(p.seasonStartOVR!==undefined&&p.attributes.overall!==p.seasonStartOVR)?(p.attributes.overall>p.seasonStartOVR?' ▲':' ▼'):'';return '<option value="'+p.id+'">'+p.name+' | '+p.positions[0]+' | Age '+p.age+' | OVR '+p.attributes.overall+d+'</option>';})
      .join('');

    var picks=picksOwnedBy(teamId);
    var pkOpts=picks.map(function(pk){
      var via=pk.origOwner!==teamId?' (via '+(getTeamById(pk.origOwner)?getTeamById(pk.origOwner).nickname:'?')+')':'';
      return '<option value="'+pk.pickId+'">Yr '+pk.year+' Rd '+pk.round+via+'</option>';
    }).join('') || '<option disabled>No picks owned</option>';

    c.innerHTML=
      '<p style="font-size:11px;color:var(--muted2);margin:8px 0 3px">'+team.city+' Players</p>'
      +'<select id="tcPlayers'+side+'" multiple size="7" style="width:100%;font-size:12px">'+pOpts+'</select>'
      +'<p style="font-size:11px;color:var(--muted2);margin:8px 0 3px">'+team.city+' Draft Picks</p>'
      +'<select id="tcPicks'+side+'" multiple size="5" style="width:100%;font-size:12px">'+pkOpts+'</select>';
  }

  window._proposeTrade = function () {
    var selA=document.getElementById('tcTeamA'), selB=document.getElementById('tcTeamB');
    var result=document.getElementById('tcResult');
    if (!selA||!selB||!result) return;
    if (selA.value===selB.value){result.innerHTML='<p style="color:#f87171">Select two different teams.</p>';return;}

    var teamA=getTeamById(selA.value), teamB=getTeamById(selB.value);

    var plA=Array.from(document.getElementById('tcPlayersA').selectedOptions)
      .map(function(o){return teamA.roster.find(function(p){return String(p.id)===o.value;});}).filter(Boolean);
    var plB=Array.from(document.getElementById('tcPlayersB').selectedOptions)
      .map(function(o){return teamB.roster.find(function(p){return String(p.id)===o.value;});}).filter(Boolean);
    var pkA=Array.from(document.getElementById('tcPicksA').selectedOptions).map(function(o){return o.value;});
    var pkB=Array.from(document.getElementById('tcPicksB').selectedOptions).map(function(o){return o.value;});

    if(!plA.length&&!pkA.length&&!plB.length&&!pkB.length){
      result.innerHTML='<p style="color:#f87171">Select at least one asset on each side.</p>';return;
    }
    if((!plA.length&&!pkA.length)||(!plB.length&&!pkB.length)){
      result.innerHTML='<p style="color:#f87171">Both sides must offer at least one asset.</p>';return;
    }

    /* Value functions */
    function pv(p){
      if(!p||!p.attributes)return 0;
      var ovr=p.attributes.overall, age=p.age||27;
      var val=ovr*50;
      if(age<=22)val*=1.5; else if(age<=24)val*=1.25; else if(age<=27)val*=1.1;
      else if(age<=30)val*=0.85; else if(age<=33)val*=0.65; else val*=0.45;
      /* Positional scarcity */
      var scarce=['QB','EDGE','CB'];
      if(scarce.indexOf(p.positions[0])!==-1)val*=1.2;
      return Math.round(val);
    }
    function pickV(pkId){
      var m=pkId.match(/_R(\d)_/);
      var r=m?parseInt(m[1]):4;
      return [3200,1400,700,350,175,80,40][r-1]||40;
    }

    var valA=plA.reduce(function(s,p){return s+pv(p);},0)+pkA.reduce(function(s,id){return s+pickV(id);},0);
    var valB=plB.reduce(function(s,p){return s+pv(p);},0)+pkB.reduce(function(s,id){return s+pickV(id);},0);

    var avg=(valA+valB)/2||1;
    var gap=Math.abs(valA-valB)/avg;  /* 0 = perfectly even */

    /* ── Value breakdown display ───────────────────────────
       Always show so user understands why a trade is rejected. */
    var breakdown=
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px">'
        +'<div style="background:var(--surface2);border-radius:6px;padding:8px">'
          +'<div style="color:var(--muted2);margin-bottom:4px">'+teamA.nickname+' gives</div>'
          +'<div style="font-size:18px;font-weight:700;color:var(--text)">'+valA.toLocaleString()+' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>'
          +'<div style="color:var(--muted);font-size:10px">trade value</div>'
        +'</div>'
        +'<div style="background:var(--surface2);border-radius:6px;padding:8px">'
          +'<div style="color:var(--muted2);margin-bottom:4px">'+teamB.nickname+' gives</div>'
          +'<div style="font-size:18px;font-weight:700;color:var(--text)">'+valB.toLocaleString()+' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>'
          +'<div style="color:var(--muted);font-size:10px">trade value</div>'
        +'</div>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">Value gap: '
        +Math.round(gap*100)+'% '+(gap<0.12?'✅ Fair':gap<0.25?'⚠️ Borderline':'❌ Too lopsided')
      +'</div>';

    /* ── Fair trade: gap < 12% always executes ────────────── */
    /* ── Borderline: 12-25%, CPU may accept based on team need */
    /* ── Lopsided: >25%, the team giving more value rejects   */
    var HARD_REJECT = 0.25;
    var AUTO_ACCEPT = 0.12;

    var teamBGivingMore = valB > valA;   /* B is offering more → B gets the worse deal */
    var rejectingTeam   = teamBGivingMore ? teamB : teamA;

    if (gap <= AUTO_ACCEPT) {
      executeTrade();
    } else if (gap <= HARD_REJECT) {
      /* Borderline — CPU accepts if they have a strong need */
      var needFactor = (typeof getTeamNeedAtPosition==='function')
        ? getTeamNeedAtPosition(rejectingTeam, teamBGivingMore ? plA[0]&&plA[0].positions[0] : plB[0]&&plB[0].positions[0])
        : 0.5;
      if(needFactor>=0.7){
        executeTrade();
      } else {
        result.innerHTML=breakdown
          +'<p style="color:#facc15;font-weight:600">⚠️ '+rejectingTeam.nickname
          +' hesitated — '+_tradeMsg(teamBGivingMore,teamA,teamB,valA,valB)+'</p>';
      }
    } else {
      /* Hard reject */
      result.innerHTML=breakdown
        +'<p style="color:#f87171;font-weight:600">❌ '+rejectingTeam.nickname
        +' rejected — '+_tradeMsg(teamBGivingMore,teamA,teamB,valA,valB)+'</p>';
    }

    function executeTrade(){
      plA.forEach(function(p){
        teamA.roster=teamA.roster.filter(function(x){return String(x.id)!==String(p.id);});
        if(p.contract)teamA.capUsed-=p.contract.capHitPerYear;
        teamB.roster.push(p);
        if(p.contract)teamB.capUsed+=p.contract.capHitPerYear;
      });
      plB.forEach(function(p){
        teamB.roster=teamB.roster.filter(function(x){return String(x.id)!==String(p.id);});
        if(p.contract)teamB.capUsed-=p.contract.capHitPerYear;
        teamA.roster.push(p);
        if(p.contract)teamA.capUsed+=p.contract.capHitPerYear;
      });
      pkA.forEach(function(id){window.transferPick(id,teamA.id,teamB.id);});
      pkB.forEach(function(id){window.transferPick(id,teamB.id,teamA.id);});
      if(typeof logTradeTransaction==='function')
        logTradeTransaction(teamA,plA,pkA,teamB,plB,pkB);
      result.innerHTML=breakdown
        +'<p style="color:#4ade80;font-weight:600">✅ Trade executed!</p>'
        +'<p class="small">'+teamA.nickname+' sent: '
          +(plA.map(function(p){return p.name+' (OVR '+p.attributes.overall+')';})
            .concat(pkA.map(function(id){var m=id.match(/_R(\d)_Y(\d+)/);return m?'Yr'+m[2]+' Rd'+m[1]:'pick';}))
            .join(', ')||'—')+'</p>'
        +'<p class="small">'+teamB.nickname+' sent: '
          +(plB.map(function(p){return p.name+' (OVR '+p.attributes.overall+')';})
            .concat(pkB.map(function(id){var m=id.match(/_R(\d)_Y(\d+)/);return m?'Yr'+m[2]+' Rd'+m[1]:'pick';}))
            .join(', ')||'—')+'</p>';
      setTimeout(function(){window.renderTradePicksUI();},1800);
    }
  };

  /* ── Accumulate career stats at season end ────────────── */
  window.accumulateCareerStats = function () {
    if (!league) return;
    listAllTeams(league).forEach(function(team){
      team.roster.forEach(function(p){
        if(!p.careerStats)p.careerStats={};
        var s=p.stats||{}, cs=p.careerStats;
        ['gamesPlayed','passingYards','passingTD','interceptionsThrown',
         'rushingYards','rushingTD','receivingYards','receivingTD',
         'tackles','sacks','interceptions','fieldGoalsMade','fieldGoalsMissed',
         'xpMade','xpMissed'
        ].forEach(function(k){cs[k]=(cs[k]||0)+(s[k]||0);});
      });
    });
  };

  var _bap=window.beginAwardsPhase;
  window.beginAwardsPhase=function(){window.accumulateCareerStats();if(typeof _bap==='function')_bap();};

  /* ── Wire up on load ──────────────────────────────────── */
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function(){
      if(typeof league!=='undefined'&&league) window.initDraftPicks();

      /* Add "My Draft Picks" to sidebar draft section */
      var ds=document.getElementById('section-draft');
      if(ds&&!ds.querySelector('[data-picks-btn]')){
        var b=document.createElement('button');
        b.textContent='📋 My Draft Picks';
        b.setAttribute('data-picks-btn','1');
        b.onclick=window.renderMyPicks;
        ds.appendChild(b);
      }

      /* Re-wire Trade Center button */
      var tcb=document.getElementById('btnTradeCenter');
      if(tcb){var nb=tcb.cloneNode(true);tcb.parentNode.replaceChild(nb,tcb);nb.addEventListener('click',function(){window.renderTradePicksUI();});}
    }, 300);
  });

})();
</script>


<script>
/* ============================================================
   PATCH — HOME BUTTON
   Captures the landing screen on load, exposes renderHome(),
   and injects a slim breadcrumb bar on every setMainContent page.
   ============================================================ */
(function () {

  var _homeHTML = null;

  /* Capture the landing screen once the DOM is ready */
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var main = document.getElementById('main');
      if (main) _homeHTML = main.innerHTML;
    }, 50);
  });

  /* Restore the landing screen */
  window.renderHome = function () {
    var main = document.getElementById('main');
    if (!main) return;
    if (_homeHTML) {
      main.innerHTML = _homeHTML;
      main.scrollTop = 0;
    }
    /* Re-sync the sim button label in case season ended */
    if (typeof syncSimButton === 'function') syncSimButton();
    /* syncBtn is the internal name used in patch 2 — try both */
    setTimeout(function () {
      var btn = document.getElementById('btnSimWeek');
      if (!btn) return;
      if (typeof schedule !== 'undefined' && typeof currentWeekIndex !== 'undefined') {
        var done = schedule && currentWeekIndex >= schedule.length;
        if (done) {
          btn.textContent = '🏆 Begin Offseason →';
          btn.style.cssText = 'background:var(--gold);border-color:var(--gold);color:#000;font-weight:700';
        }
      }
    }, 60);
  };

  /* Build the slim home breadcrumb injected at top of every page */
  function homeBar() {
    return '<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)">'
      + '<button class="home-nav-btn" onclick="renderHome()">⌂ Home</button>'
      + '</div>';
  }

  /* Patch setMainContent — wrap the chain that already exists.
     This runs LAST so our home bar is the very first thing rendered. */
  var _prevSMC = window.setMainContent;
  window.setMainContent = function (html) {
    /* Don't prepend the bar to the home screen itself */
    var isHome = html && (
      html.indexOf('welcome-hero') !== -1 ||
      html.indexOf('quick-grid')  !== -1
    );
    _prevSMC(isHome ? html : homeBar() + html);
  };

})();
</script>


<script>
/* ============================================================
   PATCH — FA FIX + OVR DELTA + HOME TILE SYNC
   ============================================================ */
(function () {

  /* ── Type-safe FA player lookup ──────────────────────────
     IDs passed through onclick="fn('123')" arrive as strings.
     Stored IDs may be numbers or strings. Always compare as strings. */
  function findFA(playerId) {
    if (typeof freeAgents === 'undefined') return undefined;
    return freeAgents.find(function (x) {
      return String(x.id) === String(playerId);
    });
  }

  /* Patch every function that looks up a free agent by ID */
  var _origRNS = window.renderNegotiationScreen;
  window.renderNegotiationScreen = function (playerId) {
    var p = findFA(playerId);
    if (!p) {
      setMainContent(
        '<h2>Player Unavailable</h2>'
        + '<p class="small">This player has already been signed or is no longer available.</p>'
        + '<button onclick="renderFreeAgencyScreen()">← Back to Free Agency</button>'
      );
      return;
    }
    /* Call original with the ACTUAL stored ID so its own find() succeeds */
    if (typeof _origRNS === 'function') _origRNS(p.id);
  };

  var _origRCO = window.renderContractOffer;
  if (typeof _origRCO === 'function') {
    window.renderContractOffer = function (playerId) {
      var p = findFA(playerId);
      if (p && typeof _origRCO === 'function') _origRCO(p.id);
    };
  }

  var _origSCO = window.submitContractOffer;
  if (typeof _origSCO === 'function') {
    window.submitContractOffer = function (playerId) {
      var p = findFA(playerId);
      if (p && typeof _origSCO === 'function') _origSCO(p.id);
    };
  }

  /* ── OVR Delta tracking ───────────────────────────────────
     Store each player's OVR at season start so we can show
     growth/regression deltas on the roster screen.           */

  function initSeasonOVR() {
    if (typeof league === 'undefined' || !league) return;
    listAllTeams(league).forEach(function (team) {
      team.roster.forEach(function (p) {
        /* Only set once per season — don't overwrite mid-season */
        if (p.seasonStartOVR === undefined || p._ovrSeasonSet !== window.simYear) {
          p.seasonStartOVR  = p.attributes.overall;
          p._ovrSeasonSet   = window.simYear || 1;
        }
      });
    });
  }

  /* Hook into game init */
  var _origInit = window.initPhase4Core;
  window.initPhase4Core = function () {
    if (typeof _origInit === 'function') _origInit();
    setTimeout(initSeasonOVR, 200);
  };

  /* Hook into new season start */
  var _origNS = window.beginNewSeason;
  window.beginNewSeason = function () {
    if (typeof _origNS === 'function') _origNS();
    /* beginNewSeason already increments simYear — do NOT increment again here */
    initSeasonOVR();
  };

  /* Also init when draft picks are first initialized (season 1) */
  var _origIDP = window.initDraftPicks;
  window.initDraftPicks = function () {
    if (typeof _origIDP === 'function') _origIDP();
    setTimeout(initSeasonOVR, 100);
  };

  /* ── Override renderRoster to show OVR delta ─────────────
     Replaces the Patch 3 version with identical logic + delta. */

  function ovc(v){
    return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';
  }

  function activeTeamId() {
    var sel = document.getElementById('teamSelect');
    return (sel && sel.value) ? sel.value : (window._activeTeamId || null);
  }

  window.renderRoster = function () {
    var tid  = activeTeamId(); if (!tid) return;
    var team = getTeamById(tid); if (!team) return;
    var space = team.salaryCap - team.capUsed;


    var rows = team.roster.slice()
      .sort(function (a, b) { return b.attributes.overall - a.attributes.overall; })
      .map(function (p, i) {
        var ovr   = p.attributes.overall;
        var hit   = p.contract ? p.contract.capHitPerYear : 0;
        var yrs   = p.contract ? p.contract.years : 0;

        /* ── OVR delta ── */
        var delta = (p.seasonStartOVR !== undefined)
          ? ovr - p.seasonStartOVR : 0;
        var deltaHtml = '';
        if (delta > 0) {
          deltaHtml = ' <span style="font-size:10px;color:#4ade80">(+' + delta + ')</span>';
        } else if (delta < 0) {
          deltaHtml = ' <span style="font-size:10px;color:#f87171">(' + delta + ')</span>';
        }

        /* Dev trait badge */
        var dev = (p.devTrait && p.devTrait !== 'Normal')
          ? ' <span style="font-size:9px;color:'
            + (p.devTrait==='X-Factor'?'#c084fc':p.devTrait==='Superstar'?'#60a5fa':'#facc15')
            + '">' + p.devTrait + '</span>'
          : '';

        return '<tr style="cursor:pointer" onclick="renderPlayerDetail(\'' + p.id + '\')">'
          + '<td>' + (i + 1) + '</td>'
          + '<td><span style="color:var(--accent2)">' + p.name + '</span>' + dev + '</td>'
          + '<td>' + p.positions.join('/') + '</td>'
          + '<td>' + p.age + '</td>'
          + '<td style="color:' + ovc(ovr) + ';font-weight:600">' + ovr + deltaHtml + '</td>'
          + '<td>' + yrs + 'yr</td>'
          + '<td>$' + (hit ? hit.toLocaleString() : '—') + '</td>'
          + '</tr>';
      }).join('');

    setMainContent(
      '<h2>' + team.city + ' ' + team.nickname + ' Roster</h2>'
      + '<p class="small">Coach: ' + team.coach.name
      + ' &nbsp;|&nbsp; Power: ' + team.powerRating
      + ' &nbsp;|&nbsp; Record: ' + team.wins + '-' + team.losses
      + (team.ties ? '-' + team.ties : '')
      + ' &nbsp;|&nbsp; Cap Space: <strong style="color:'
      + (space < 0 ? '#f87171' : '#4ade80') + '">$' + space.toLocaleString() + '</strong></p>'
      + '<p class="small" style="margin-top:-6px;color:var(--muted)">Tap any player to view full profile. OVR delta shows growth since season start.</p>'
      + '<table><thead><tr>'
      + '<th>#</th><th>Name</th><th>Pos</th><th>Age</th><th>OVR</th><th>Yrs</th><th>Cap Hit</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table>'
    );
  };

  /* Also show delta on player detail screen */
  var _origRPD = window.renderPlayerDetail;
  window.renderPlayerDetail = function (playerId) {
    /* Inject seasonStartOVR into the player before calling original
       so the delta is available if original ever uses it */
    if (typeof _origRPD === 'function') _origRPD(playerId);

    /* Patch the OVR badge in the already-rendered detail page */
    setTimeout(function () {
      var main = document.getElementById('main');
      if (!main) return;
      /* Find the player */
      var p = null;
      listAllTeams(league).forEach(function (t) {
        t.roster.forEach(function (x) {
          if (String(x.id) === String(playerId)) p = x;
        });
      });
      if (!p) return;
      var delta = (p.seasonStartOVR !== undefined)
        ? p.attributes.overall - p.seasonStartOVR : 0;
      if (delta === 0) return;

      /* Find the OVR badge div (contains the large OVR number) and
         append the delta label beneath it */
      var ovrDivs = main.querySelectorAll('div');
      ovrDivs.forEach(function (div) {
        if (div.textContent.trim() === String(p.attributes.overall)
            && div.style.fontSize === '26px') {
          if (!div.querySelector('.ovr-delta')) {
            var span = document.createElement('div');
            span.className = 'ovr-delta';
            span.style.cssText = 'font-size:11px;font-weight:600;color:'
              + (delta > 0 ? '#4ade80' : '#f87171');
            span.textContent = (delta > 0 ? '+' : '') + delta + ' this season';
            div.parentNode.appendChild(span);
          }
        }
      });
    }, 30);
  };

  /* Run OVR init once everything is loaded */
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(initSeasonOVR, 500);
  });

})();
</script>

<script>
/* ============================================================
   PATCH — COMPLETE PLAYER DEVELOPMENT SYSTEM (GROUND-UP REWRITE)

   Problem: runEndOfSeasonDevelopment, calculatePerformanceGrowth,
   and 5 other helper functions were called but NEVER defined —
   the entire system was a stub. runEndOfSeasonProgression was
   also never called by the awards pipeline. This patch defines
   everything from scratch and wires it into beginAwardsPhase.
   ============================================================ */
(function () {

  /* ── Position-aware performance score ──────────────────────
     Uses the actual player.stats keys that the sim accumulates. */
  function scorePerformance(player) {
    var s   = player.stats || {};
    var pos = player.positions[0];
    var gp  = Math.max(1, s.gamesPlayed || 1);

    switch (pos) {
      case 'QB':
        return (s.passingYards  || 0) / 250
             + (s.passingTD     || 0) * 0.6
             - (s.interceptionsThrown || 0) * 0.5;

      case 'RB':
        return (s.rushingYards   || 0) / 90
             + (s.rushingTD      || 0) * 0.5
             + (s.receivingYards || 0) / 250;

      case 'WR':
        return (s.receivingYards || 0) / 75
             + (s.receivingTD    || 0) * 0.6;

      case 'TE':
        return (s.receivingYards || 0) / 100
             + (s.receivingTD    || 0) * 0.5;

      case 'OL':
        /* OL don't accrue skill stats — reward consistent starts */
        return gp * 0.3;

      case 'EDGE':
        return (s.sacks    || 0) * 1.0
             + (s.tackles  || 0) / 20;

      case 'DT':
        return (s.sacks    || 0) * 0.8
             + (s.tackles  || 0) / 25;

      case 'LB':
        return (s.tackles      || 0) / 12
             + (s.sacks        || 0) * 0.5
             + (s.interceptions|| 0) * 0.8;

      case 'CB': case 'FS': case 'SS':
        return (s.interceptions || 0) * 1.2
             + (s.tackles       || 0) / 30;

      case 'S':
        return (s.interceptions || 0) * 1.0
             + (s.tackles       || 0) / 20;

      case 'K':
        return (s.fieldGoalsMade   || 0) * 0.4
             - (s.fieldGoalsMissed || 0) * 0.3
             + (s.xpMade           || 0) * 0.1
             - (s.xpMissed         || 0) * 0.15;

      default:
        return gp * 0.1;
    }
  }

  /* ── OVR change formula ─────────────────────────────────── */
  function calcOVRChange(player) {
    var score = scorePerformance(player);
    var age   = player.age;
    var ovr   = player.attributes.overall;

    /* Performance tier → base growth */
    var baseGrowth;
    if      (score >= 15) baseGrowth = 4;   /* elite season   */
    else if (score >= 9)  baseGrowth = 3;   /* great season   */
    else if (score >= 5)  baseGrowth = 2;   /* good season    */
    else if (score >= 2)  baseGrowth = 1;   /* average season */
    else if (score >= 0.5)baseGrowth = 0;   /* quiet season   */
    else                  baseGrowth = -1;  /* barely played  */

    /* Age development curve */
    var ageMult;
    if      (age <= 22) ageMult = 1.5;
    else if (age <= 24) ageMult = 1.2;
    else if (age <= 26) ageMult = 0.9;
    else if (age <= 28) ageMult = 0.6;
    else if (age <= 30) ageMult = 0.3;
    else                ageMult = 0.0;   /* no growth after 30 */

    /* Age regression (independent of performance) */
    var ageReg = 0;
    if      (age >= 34) ageReg = -3;
    else if (age >= 32) ageReg  = -2;  /* age regression, independent of growth multiplier */
    else if (age >= 30) ageReg = -1;

    /* Dev trait multiplier */
    var devMult = 1.0;
    var dt = player.devTrait || 'Normal';
    if      (dt === 'Star')      devMult = 1.3;
    else if (dt === 'Superstar') devMult = 1.6;
    else if (dt === 'X-Factor')  devMult = 2.0;

    /* Diminishing returns at high OVR */
    var capMult = 1.0;
    if      (ovr >= 95) capMult = 0.2;
    else if (ovr >= 90) capMult = 0.5;
    else if (ovr >= 85) capMult = 0.8;

    var growth = Math.round(baseGrowth * ageMult * devMult * capMult);
    var total  = growth + ageReg;

    return Math.max(-4, Math.min(5, total));
  }

  /* ── Dev trait upgrade check ────────────────────────────── */
  function checkDevUpgrade(player) {
    var s   = player.stats || {};
    var pos = player.positions[0];
    var DEV = ['Normal', 'Star', 'Superstar', 'X-Factor'];
    var cur = DEV.indexOf(player.devTrait || 'Normal');
    if (cur >= DEV.length - 1) return; /* already max */

    var qualified = false;
    switch (pos) {
      case 'QB':    qualified = (s.passingYards  || 0) >= 3800 || (s.passingTD  || 0) >= 27; break;
      case 'RB':    qualified = (s.rushingYards  || 0) >= 1200 || (s.rushingTD  || 0) >= 10; break;
      case 'WR':    qualified = (s.receivingYards|| 0) >= 1000 || (s.receivingTD|| 0) >= 8;  break;
      case 'TE':    qualified = (s.receivingYards|| 0) >=  800 || (s.receivingTD|| 0) >= 7;  break;
      case 'EDGE':  qualified = (s.sacks         || 0) >= 10;                                 break;
      case 'DT':    qualified = (s.sacks         || 0) >=  7;                                 break;
      case 'LB':    qualified = (s.tackles       || 0) >= 110;                                break;
      case 'CB':
      case 'S':     qualified = (s.interceptions || 0) >=  4;                                 break;
      case 'OL':    qualified = (s.gamesPlayed   || 0) >= 15;                                 break;
      case 'K':     qualified = (s.fieldGoalsMade|| 0) >= 28;                                 break;
    }

    if (qualified) player.devTrait = DEV[cur + 1];
  }

  /* ── End-of-season runner ──────────────────────────────────
     OVR changes now happen WEEKLY (see weekly progression patch).
     This function only handles dev trait upgrades and aging.    */
  /* ── Season minimum guarantee ─────────────────────────────
     Safety net: if a young player ended the season below their
     guaranteed minimum OVR gain, bring them up to the floor.
     This catches edge cases (mid-season load, first season etc.)

     Minimums per age + dev trait (matches accumulator math):
       ≤23 Normal=+4, Star=+6, Superstar=+7, X-Factor=+9
       ≤25 Normal=+4, Star=+5, Superstar=+6, X-Factor=+8
       ≤27 Normal=+2, Star=+3, Superstar=+4, X-Factor=+5
       ≤29 Normal=+0 (needs playing time)
       30+  → no minimum (regression possible)               */
  function minimumSeasonGrowth(p) {
    var age = p.age;
    if (age >= 30) return 0;  /* vets: no minimum */
    /* Use window.devMult if available, otherwise inline the calculation */
    var dm = (typeof window.devMult === 'function')
      ? window.devMult(p)
      : (function(t){ return t==='X-Factor'?2.0:t==='Superstar'?1.6:t==='Star'?1.3:1.0; })(p.devTrait||'Normal');
    if      (age <= 23) return Math.floor(0.280 * dm * 17);
    else if (age <= 25) return Math.floor(0.240 * dm * 17);
    else if (age <= 27) return Math.floor(0.140 * dm * 17);
    else                return 0;
  }

  function applySeasonMinimumGrowth(p) {
    if (!p.seasonStartOVR) return;
    var minGain  = minimumSeasonGrowth(p);
    if (minGain <= 0) return;
    var actual   = p.attributes.overall - p.seasonStartOVR;
    if (actual < minGain) {
      var boost = minGain - actual;
      p.attributes.overall = Math.min(99, p.attributes.overall + boost);
    }
  }

  /* Ensure coach baselines are set before development runs */
  function ensureCoachBaselines() {
    if (typeof league === 'undefined' || !league) return;
    listAllTeams(league).forEach(function (team) {
      var hc = team.coach || {};
      var oc = team.oc   || {};
      var dc = team.dc   || {};
      if (!hc.seasonBaseOff  || isNaN(hc.seasonBaseOff))  hc.seasonBaseOff  = hc.offenseRating  || 65;
      if (!hc.seasonBaseDef  || isNaN(hc.seasonBaseDef))  hc.seasonBaseDef  = hc.defenseRating  || 65;
      if (!hc.seasonBaseLead || isNaN(hc.seasonBaseLead)) hc.seasonBaseLead = hc.leadership     || 65;
      if (!oc.seasonBaseOff  || isNaN(oc.seasonBaseOff))  oc.seasonBaseOff  = oc.offenseRating  || 65;
      if (!dc.seasonBaseDef  || isNaN(dc.seasonBaseDef))  dc.seasonBaseDef  = dc.defenseRating  || 65;
    });
  }

  window.runEndOfSeasonDevelopment = function () {
    if (typeof league === 'undefined' || !league) return;
    ensureCoachBaselines();
    /* Recalculate cap for all teams — catches any drift from trades/signings */
    if (typeof recalcAllTeamCap === 'function') recalcAllTeamCap();
    listAllTeams(league).forEach(function (team) {
      team.roster.forEach(function (p) {
        applySeasonMinimumGrowth(p);  /* enforce minimum OVR gain */
        checkDevUpgrade(p);           /* dev trait upgrade check  */
        p.age++;                      /* age every player one year */
        p.devAccum = 0;              /* reset accumulator          */
      });
    });
  };

  window.runEndOfSeasonProgression = function () {
    window.runEndOfSeasonDevelopment();
  };

  /* ── Stub out the undefined helpers so nothing else crashes ─ */
  window.calculatePerformanceGrowth = function (p, s) { return scorePerformance(p); };
  window.getDepthChartMultiplier    = function ()      { return 1; };
  window.getSchemeFitMultiplier     = function ()      { return 1; };
  window.getMoraleMultiplier        = function ()      { return 1; };
  window.getChemistryMultiplier     = function ()      { return 1; };

  /* ── Wire into the awards pipeline ─────────────────────────
     beginAwardsPhase is the first thing called after the season.
     Development runs HERE — before awards display — so players
     already have their updated ratings when the user sees them. */
  var _prevBAP = window.beginAwardsPhase;
  window.beginAwardsPhase = function () {
    window.runEndOfSeasonProgression();
    if (typeof _prevBAP === 'function') _prevBAP();
  };

  /* ── seasonStartOVR — captured once per season ───────────── */
  function initSeasonOVR() {
    if (typeof league === 'undefined' || !league) return;
    var yr = window.simYear || 1;
    listAllTeams(league).forEach(function (team) {
      team.roster.forEach(function (p) {
        if (p.seasonStartOVR === undefined || p._ovrYear !== yr) {
          p.seasonStartOVR = p.attributes.overall;
          p._ovrYear       = yr;
          /* Snapshot granular attrs for per-attr delta display */
          if (p.granularAttrs) {
            p.seasonStartGranular = Object.assign({}, p.granularAttrs);
          }
        }
      });
    });
  }
  window.initSeasonOVR = initSeasonOVR;

  var _prevInit = window.initPhase4Core;
  window.initPhase4Core = function () {
    if (typeof _prevInit === 'function') _prevInit();
    setTimeout(initSeasonOVR, 1200);
  };

  var _prevNS = window.beginNewSeason;
  window.beginNewSeason = function () {
    if (typeof _prevNS === 'function') _prevNS();
    setTimeout(initSeasonOVR, 600);
  };

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(initSeasonOVR, 1500);
  });

  /* ── renderRoster with OVR delta ────────────────────────── */
  function ovc(v) {
    return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';
  }
  function getActiveTeamId() {
    var sel = document.getElementById('teamSelect');
    return (sel && sel.value) ? sel.value : (window._activeTeamId || null);
  }

  window.renderRoster = function () {
    if (typeof window.initSeasonOVR === 'function') window.initSeasonOVR();
    var tid  = getActiveTeamId(); if (!tid) return;
    var team = getTeamById(tid);  if (!team) return;
    var space = team.salaryCap - team.capUsed;

    var rows = team.roster.slice()
      .sort(function (a, b) { return b.attributes.overall - a.attributes.overall; })
      .map(function (p, i) {
        var ovr   = p.attributes.overall;
        var hit   = p.contract ? p.contract.capHitPerYear : 0;
        var yrs   = p.contract ? p.contract.years : 0;

        /* delta vs season start */
        var delta = (p.seasonStartOVR !== undefined) ? ovr - p.seasonStartOVR : null;
        var dHtml = '';
        if (delta !== null && delta > 0)
          dHtml = '<span style="font-size:10px;color:#4ade80;margin-left:3px">(+'+delta+')</span>';
        else if (delta !== null && delta < 0)
          dHtml = '<span style="font-size:10px;color:#f87171;margin-left:3px">('+delta+')</span>';

        /* dev trait badge */
        var dev = (p.devTrait && p.devTrait !== 'Normal')
          ? ' <span style="font-size:9px;color:'
            + (p.devTrait==='X-Factor'?'#c084fc':p.devTrait==='Superstar'?'#60a5fa':'#facc15')
            + '">'+p.devTrait+'</span>' : '';

        return '<tr style="cursor:pointer" onclick="renderPlayerDetail(\''+p.id+'\')">'+
          '<td>'+(i+1)+'</td>'+
          '<td><span style="color:var(--accent2)">'+p.name+'</span>'+dev+fitBadge(p)+'</td>'+
          '<td>'+p.positions.join('/')+'</td>'+
          '<td>'+p.age+'</td>'+
          '<td style="color:'+ovc(ovr)+';font-weight:600">'+ovr+dHtml+'</td>'+
          '<td>'+yrs+'yr</td>'+
          '<td>$'+(hit?hit.toLocaleString():'—')+'</td>'+
          '</tr>';
      }).join('');

    setMainContent(
      '<h2>'+team.city+' '+team.nickname+' Roster</h2>'+
      '<p class="small">'+
        'Coach: '+team.coach.name+
        ' &nbsp;|&nbsp; Power: '+team.powerRating+
        ' &nbsp;|&nbsp; Record: '+team.wins+'-'+team.losses+(team.ties?'-'+team.ties:'')+
        ' &nbsp;|&nbsp; Cap: <strong style="color:'+(space<0?'#f87171':'#4ade80')+'">$'+space.toLocaleString()+'</strong>'+
      '</p>'+
      '<p class="small" style="margin-top:-6px;color:var(--muted)">'+
        'Scheme: <span style="color:var(--gold)">'+(team.oc?team.oc.scheme:'—')+'</span> off'
        +' / <span style="color:var(--gold)">'+(team.dc?team.dc.scheme:'—')+'</span> def'
        +' &nbsp;·&nbsp; <span style="color:#4ade80">✦</span> fit'
        +' <span style="color:#64748b">✦</span> neutral'
        +' <span style="color:#f87171">✦</span> poor'
        +' &nbsp;·&nbsp; <span style="color:#4ade80">(+n)</span>/<span style="color:#f87171">(-n)</span> OVR change'+
      '</p>'+
      '<table><thead><tr>'+
        '<th>#</th><th>Name</th><th>Pos</th><th>Age</th><th>OVR</th><th>Yrs</th><th>Cap Hit</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table>'
    );
  };

})();
</script>

<script>
/* ============================================================
   PATCH — COMPREHENSIVE PLAYER PROGRESSION (FULL REWRITE)

   Changes from previous version:
   • Minimum baseline progression for ALL players every week
     (even bench warmers learn in practice)
   • Baseline scaled by age + dev trait (not just performance)
   • Performance bonus is ADDITIVE on top of baseline
   • RB scoring: lower yard threshold, higher TD weight
   • CB/S scoring: tackles now major contributor, not just INTs
   • OL scoring: based on games started, not runaway numbers
   • Floor fix: only blocks DROPS below seasonStartOVR,
     never blocks gains (previous logic would zero out +1
     if player ever dipped below their start OVR)
   • Dev trait multiplier on baseline AND performance
   ============================================================ */
(function () {

  /* ── Dev trait multiplier ─────────────────────────────── */
  function devMult(p) {
    var t = p.devTrait || 'Normal';
    return t === 'X-Factor' ? 2.0
         : t === 'Superstar' ? 1.6
         : t === 'Star'      ? 1.3
         : 1.0;
  }
  /* Expose globally so other script blocks can call it */
  window.devMult = devMult;

  /* ── OVR-relative gain multiplier ────────────────────────
     Lower OVR players benefit more from the same performance.
     OVR 60→1.67× | OVR 70→1.33× | OVR 80→1.0×
     OVR 85→0.83× | OVR 90→0.67× | OVR 95→0.50×           */
  function ovrGainMult(ovr) {
    return Math.max(0.15, Math.min(2.5, 1.0 + (80 - ovr) / 30));
  }

  /* ── Position-aware performance score (per-game average) ─
     All scores calibrated so:
       "elite" starter = ~1.2+   (good perf bonus)
       "good"  starter = ~0.60+  (modest perf bonus)
       "poor"  / bench = < 0.30  (no perf bonus)           */
  function weeklyPerfScore(p) {
    var s  = p.stats || {};
    var gp = Math.max(1, s.gamesPlayed || 1);
    var pos = p.positions[0];

    switch (pos) {
      case 'QB':
        /* Elite: 280+ yards/gm AND 2+ TDs/gm, clean */
        return (s.passingYards         ||0) / gp / 200
             + (s.passingTD            ||0) / gp * 0.65
             - (s.interceptionsThrown  ||0) / gp * 0.45
             + (s.rushingYards         ||0) / gp / 500;

      case 'RB':
        /* Elite: 90+ yards/gm OR 1+ TD/gm               */
        /* 100 yds/gm = 1.43, 1 TD/gm = 0.85 → combined = 2.28 */
        return (s.rushingYards   ||0) / gp / 70
             + (s.rushingTD      ||0) / gp * 0.85
             + (s.receivingYards ||0) / gp / 200;

      case 'WR':
        /* Elite: 80+ yds/gm or 1 TD/gm                  */
        return (s.receivingYards ||0) / gp / 65
             + (s.receivingTD    ||0) / gp * 0.80;

      case 'TE':
        /* Elite: 60+ yds/gm or 1 TD/gm                  */
        return (s.receivingYards ||0) / gp / 60
             + (s.receivingTD    ||0) / gp * 0.75;

      case 'T': case 'G': case 'C':
        /* OL: rewarded for consistent starts, capped at 1.4 */
        return Math.min(1.4, (s.gamesPlayed || 0) / 17 * 1.6);

      case 'EDGE':
        /* Elite: 1 sack/gm OR strong tackle total        */
        return (s.sacks   ||0) / gp * 1.2
             + (s.tackles ||0) / gp / 10;

      case 'DT':
        /* Elite: 0.7 sacks/gm or strong tackle numbers  */
        return (s.sacks   ||0) / gp * 0.9
             + (s.tackles ||0) / gp / 10;

      case 'LB':
        /* Elite: 10 tackles/gm or sacks + INTs           */
        return (s.tackles      ||0) / gp / 8
             + (s.sacks        ||0) / gp * 0.7
             + (s.interceptions||0) / gp * 1.2;

      case 'CB':
        /* DBs score well for tackles AND interceptions.
           Previously almost never hit elite since INTs are rare.
           Now: 7 tackles/gm = 0.88 (good), 1 INT/gm = 1.5 (elite) */
        return (s.interceptions||0) / gp * 1.5
             + (s.tackles      ||0) / gp / 8;

      case 'FS':
        /* Free safety: range, coverage, turnovers */
        return (s.interceptions||0) / gp * 1.4
             + (s.tackles      ||0) / gp / 9;

      case 'SS':
        /* Strong safety: tackling, run support, blitz */
        return (s.interceptions||0) / gp * 1.0
             + (s.tackles      ||0) / gp / 7;

      case 'K':
        return (s.fieldGoalsMade   ||0) / gp * 0.45
             - (s.fieldGoalsMissed ||0) / gp * 0.30
             + (s.xpMade           ||0) / gp * 0.10
             - (s.xpMissed         ||0) / gp * 0.15;

      default:
        return (s.gamesPlayed || 0) > 0 ? 0.15 : 0;
    }
  }

  /* ── Weekly progression — accumulator model ──────────────
     Every player has a devAccum bucket that fills each week.
     When it reaches 1.0 they gain +1 OVR. Remainder carries
     over so no week is ever wasted.

     Layer 1 — GUARANTEED baseline (deterministic, no RNG):
       Each week adds a fixed amount to devAccum.
       Young players fill the bucket in ≤17 weeks guaranteed.
       Calibrated so age ≤23 Normal always gets at least +1.

     Layer 2 — Performance bonus (additive on top of baseline,
       scales with game quality, still uses ovrGainMult so
       high-OVR stars develop slower than raw prospects).

     Layer 3 — Age regression (subtracts from the bucket for
       vets; can drive OVR below season floor for 30+).      */
  function progressTeamWeek(team) {
    team.roster.forEach(function (p) {
      var s   = p.stats || {};
      var age = p.age;
      var ovr = p.attributes.overall;
      var dm  = devMult(p);
      var gm  = ovrGainMult(ovr);
      var floor = (p.seasonStartOVR !== undefined) ? p.seasonStartOVR : ovr;

      /* Init accumulator */
      if (p.devAccum === undefined) p.devAccum = 0;

          /* ── Layer 1: Guaranteed baseline (no RNG) ──────────
         baseRate × dm × 17 weeks = minimum OVR gain per season:
           age ≤23  Normal   0.280 × 1.0 × 17 = 4.76 → +4 guaranteed
           age ≤23  Star     0.280 × 1.3 × 17 = 6.19 → +6 guaranteed
           age ≤23  Superstar 0.280 × 1.6 × 17= 7.62 → +7 guaranteed
           age ≤23  X-Factor  0.280 × 2.0 × 17= 9.52 → +9 guaranteed
           age ≤25  Normal   0.240 × 1.0 × 17 = 4.08 → +4 guaranteed
           age ≤25  Star     0.240 × 1.3 × 17 = 5.30 → +5 guaranteed
           age ≤27  Normal   0.140 × 1.0 × 17 = 2.38 → +2 guaranteed
           age ≤29  Normal   0.048 × 1.0 × 17 = 0.82 → needs perf
           age 30+  → 0, performance only
         ovrGainMult NOT applied to baseline: high-OVR players
         get the same minimum guarantee as raw prospects.       */
      var baseRate = 0;
      if      (age <= 23) baseRate = 0.280;
      else if (age <= 25) baseRate = 0.240;
      else if (age <= 27) baseRate = 0.140;
      else if (age <= 29) baseRate = 0.048;
      /* 30+ → 0 */

      p.devAccum += baseRate * dm;

      /* ── Layer 2: Performance bonus (uses ovrGainMult) ────
         Starters who play well add more to the bucket.
         Bench players only get baseline above.               */
      if (s.gamesPlayed && s.gamesPlayed > 0) {
        var perf = weeklyPerfScore(p);
        var bonus = 0;
        if      (perf >= 1.2) bonus = 0.130;
        else if (perf >= 0.60) bonus = 0.055;
        else if (perf >= 0.30) bonus = 0.015;
        p.devAccum += bonus * dm * gm;
      }

      /* ── Layer 3: Age regression (subtracts from bucket) ──
         Vets drain the bucket weekly; heavy enough drain means
         they lose a point despite any baseline they had.      */
      var regRate = 0;
      if      (age >= 36) regRate = 0.25;
      else if (age >= 33) regRate = 0.15;
      else if (age >= 30) regRate = 0.07;

      if (regRate > 0) {
        /* Elite play partially offsets regression */
        if (s.gamesPlayed > 0 && weeklyPerfScore(p) >= 1.2) regRate *= 0.55;
        p.devAccum -= regRate;
      }

      /* ── Apply accumulator ────────────────────────────────
         Gain: when bucket ≥ 1.0, award +1 and subtract 1.0
           (carry over remainder — no wasted accumulation).
         Loss: when bucket ≤ -1.0, apply -1 and add 1.0.
         Floor: young/prime players (age ≤29) cannot drop
           below their season-start OVR from regression alone. */
      var delta = 0;

      while (p.devAccum >= 1.0) {
        delta++;
        p.devAccum -= 1.0;
      }

      while (p.devAccum <= -1.0) {
        var drop = -1;
        /* Enforce floor for young players */
        if (age <= 29 && ovr + delta + drop < floor) { drop = 0; p.devAccum = -0.99; }
        delta += drop;
        p.devAccum += 1.0;
      }

      if (delta !== 0) {
        var newOvr = Math.max(40, Math.min(99, ovr + delta));
        p.attributes.overall = newOvr;

        /* ── Keep granularAttrs in sync with OVR drift ───────
           When OVR rises or falls, nudge every granular attr by
           the same delta so the two don't permanently diverge.
           We only move attrs that are in the player's primary
           position bias (bias > 0.5) to preserve position
           identity — secondary attrs stay unchanged.           */
        if (p.granularAttrs && window.POS_BIAS && p.positions && p.positions[0]) {
          var bias    = window.POS_BIAS[p.positions[0]] || {};
          var gAttrs  = p.granularAttrs;
          Object.keys(gAttrs).forEach(function(k) {
            var b = bias[k] !== undefined ? bias[k] : 0;
            if (b >= 0.5) {
              gAttrs[k] = Math.max(20, Math.min(99, gAttrs[k] + delta));
            }
          });
        }
      }
    });
  }

  /* ── Wrap simulateWeek ──────────────────────────────────── */
  var _origSW = window.simulateWeek;
  window.simulateWeek = function (week, teamMap, userStrategy, userTeamId) {
    if (typeof _origSW === 'function') _origSW(week, teamMap, userStrategy, userTeamId);
    if (typeof league !== 'undefined' && league && typeof listAllTeams === 'function') {
      listAllTeams(league).forEach(function (team) {
        progressTeamWeek(team);
      });
    }
  };

})();
</script>

<script>
/* ============================================================
   PATCH — MULTI-POSITION DEPTH CHART

   renderDepthChart updated so multi-position players appear in
   EVERY group their positions list includes, marked with a gold
   FLEX badge in secondary slots. They cannot occupy a starter
   slot in their secondary group.
   ============================================================ */
(function () {

  /* renderDepthChart with secondary position support */

  var OL_LABELS   = ['LT','LG','C','RG','RT'];
  var LB_LABELS   = ['WILL','MIKE','SAM'];
  var EDGE_LABELS = ['LE','RE'];
  var S_LABELS    = ['SS','FS'];

  function _ovc(v) {
    return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';
  }

  function _tbadge(p) {
    var t = p.devTrait;
    if (!t || t === 'Normal') return '';
    var c = t==='Star'?'dc-badge-star':t==='Superstar'?'dc-badge-ss':t==='X-Factor'?'dc-badge-xfactor':'';
    return c ? '<span class="dc-badge '+c+'">'+t+'</span>' : '';
  }

  /* Standard row (primary position, can be starter or depth) */
  function _dcRow(p, label, isStarter, canUp, canDown) {
    var ovr = p.attributes ? p.attributes.overall : 70;
    var isOut = (p.injury && p.injury.weeksRemaining > 0)
             || (p.suspension && p.suspension.weeksRemaining > 0);
    var outLabel = '', outColor = '';
    if (p.injury && p.injury.weeksRemaining > 0) {
      var smap = { minor:'#facc15', moderate:'#f97316', major:'#ef4444', careerThreatening:'#c084fc' };
      outColor = smap[p.injury.severity] || '#f87171';
      outLabel = '🤕 ' + p.injury.type + ' (' + p.injury.weeksRemaining + 'w)';
    } else if (p.suspension && p.suspension.weeksRemaining > 0) {
      outColor = '#c084fc'; outLabel = '🚫 Susp. (' + p.suspension.weeksRemaining + 'w)';
    }
    var rc = isOut
      ? '<span style="font-size:8px;font-weight:700;color:' + outColor + ';background:rgba(239,68,68,.12);border-radius:3px;padding:1px 4px">OUT</span>'
      : (isStarter && label && label !== '●')
        ? '<span style="color:var(--accent2);font-size:9px;font-weight:700">' + label + '</span>'
        : isStarter ? '<span style="color:var(--accent2)">●</span>'
                    : '<span style="color:var(--muted);font-size:11px">' + label + '</span>';
    var selStyle = isOut ? 'opacity:0.45;cursor:not-allowed'
      : isSel  ? 'background:var(--accent-dim);border-left:3px solid var(--accent);cursor:pointer'
      : hasSel ? 'cursor:pointer;opacity:0.85'
               : 'cursor:pointer';
    var clickAttr = isOut ? '' : 'onclick="window.dcSelectPlayer(\'' + p.id + '\')" ';
    return '<div class="dc-row' + (isStarter && !isOut ? ' dc-starter' : '') + '" '
      + clickAttr + 'style="' + selStyle + '">'
      + '<div class="dc-rank">' + rc + '</div>'
      + '<div class="dc-info">'
        + '<span class="dc-name" style="' + (isOut ? 'text-decoration:line-through;color:var(--muted)' : '') + '">' + p.name + '</span>'
        + (isOut ? '<span class="dc-meta" style="color:' + outColor + ';font-size:10px">' + outLabel + '</span>'
           : isSel ? '<span class="dc-meta" style="color:var(--accent2);font-size:10px">✎ tap another to swap</span>'
                   : '<span class="dc-meta" style="color:' + _ovc(ovr) + '">OVR ' + ovr + '</span>')
      + '</div>' + _tbadge(p)
      + (isSel && !isOut ? '<div style="color:var(--accent2);font-size:14px;padding:0 8px">✎</div>' : '')
    + '</div>';
  }

  /* Secondary/FLEX row — always depth, no reorder arrows, gold badge */
  function _dcFlexRow(p, fromPos) {
    var ovr = p.attributes ? p.attributes.overall : 70;
    return '<div class="dc-row" style="border-left:2px solid var(--gold);opacity:.85">'+
      '<div class="dc-rank"><span style="font-size:8px;color:var(--gold);font-weight:700;letter-spacing:.3px">FLEX</span></div>'+
      '<div class="dc-info">'+
        '<span class="dc-name">'+p.name+'</span>'+
        '<span class="dc-meta" style="color:'+_ovc(ovr)+'">OVR '+ovr+
          ' <span style="color:var(--gold)">· primary '+fromPos+'</span></span>'+
      '</div>'+_tbadge(p)+
      '<div class="dc-arrows"><span class="dc-arr-ph"></span><span class="dc-arr-ph"></span></div>'+
    '</div>';
  }

  /* Build one position group: primary players + FLEX secondary players */
  function _dcGrp(headerText, primaryPlayers, numStarters, labelArr, flexPlayers) {
    if (!primaryPlayers.length && !(flexPlayers && flexPlayers.length)) return '';
    var rows = primaryPlayers.map(function (p, i) {
      var s = i < numStarters;
      var lbl = (s && labelArr && labelArr[i]) ? labelArr[i] : s ? '●' : String(i + 1);
      return _dcRow(p, lbl, s, i > 0, i < primaryPlayers.length - 1);
    }).join('');
    /* Append FLEX entries for multi-position players */
    if (flexPlayers && flexPlayers.length) {
      rows += flexPlayers.map(function (entry) {
        return _dcFlexRow(entry.p, entry.fromPos);
      }).join('');
    }
    return '<div class="dc-group">'+
      '<div class="dc-pos-header">'+headerText+'</div>'+rows+
    '</div>';
  }

  function _dcSect(lbl, h) {
    return h ? '<div class="dc-section-label">'+lbl+'</div><div class="dc-grid">'+h+'</div>' : '';
  }

  window.renderDepthChart = function () {
    var tid  = document.getElementById('teamSelect') && document.getElementById('teamSelect').value;
    if (!tid) return;
    var team = getTeamById(tid); if (!team) return;
    if (typeof ensureDepthChart === 'function') ensureDepthChart(team);

    var ALL_POS = ['QB','RB','WR','TE','T','G','C','EDGE','DT','LB','CB','FS','SS','K','P'];

    /* Primary groups: keyed by position, holds player objects */
    var primary = {};
    ALL_POS.forEach(function (pos) { primary[pos] = []; });

    /* Flex groups: secondary appearances */
    var flex = {};
    ALL_POS.forEach(function (pos) { flex[pos] = []; });

    team.roster.forEach(function (p) {
      /* Add to primary group */
      var pp = p.positions[0];
      if (primary[pp]) primary[pp].push(p);

      /* Add to flex groups for each additional position */
      for (var i = 1; i < p.positions.length; i++) {
        var sp = p.positions[i];
        if (flex[sp]) flex[sp].push({ p: p, fromPos: pp });
      }
    });

    /* Sort primary groups by depth chart rank */
    ALL_POS.forEach(function (pos) {
      primary[pos].sort(function (a, b) {
        return (a.depthChartRank || 999) - (b.depthChartRank || 999);
      });
    });

    var sn = team.dc && team.dc.scheme ? ' · Scheme: '+team.dc.scheme : '';

    var offHtml =
      _dcGrp('QB',                        primary['QB'],   1, [],         flex['QB'])  +
      _dcGrp('T — LT / RT',   primary['T']||[],  2, ['LT','RT'],  flex['T']||[])  +
      _dcGrp('G — LG / RG',   primary['G']||[],  2, ['LG','RG'],  flex['G']||[])  +
      _dcGrp('C',             primary['C']||[],  1, [],           flex['C']||[])  +
      _dcGrp('RB',                        primary['RB'],   1, [],         flex['RB'])  +
      _dcGrp('WR — X / Y / Slot',         primary['WR'],   3, ['X','Y','Slot'], flex['WR'])  +
      _dcGrp('TE',                        primary['TE'],   1, [],         flex['TE']);

    var defHtml =
      _dcGrp('EDGE — LE / RE',            primary['EDGE'], 2, EDGE_LABELS,flex['EDGE'])+
      _dcGrp('DT',                        primary['DT'],   2, [],         flex['DT'])  +
      _dcGrp('LB — WILL / MIKE / SAM',    primary['LB'],   3, LB_LABELS,  flex['LB'])  +
      _dcGrp('CB — LC / RC / SlotC',      primary['CB'],   3, ['LC','RC','SlotC'], flex['CB'])  +
            _dcGrp('SS', primary['SS']||[], 1, ['SS'], flex['SS']||[]) +
      _dcGrp('FS', primary['FS']||[], 1, ['FS'], flex['FS']||[]);

    var stHtml =
      _dcGrp('K',                         primary['K'],    1, [],         flex['K'])   +
      _dcGrp('P',                         primary['P'],    1, [],         flex['P']);

    setMainContent(
      '<h2>'+team.city+' '+team.nickname+' — Depth Chart</h2>'+
      '<p class="small" style="margin-bottom:14px">'+
        '● = starter &nbsp;|&nbsp; ▲▼ = reorder &nbsp;|&nbsp; '+
        '<span style="color:var(--gold)">FLEX</span> = secondary position (no starter slot)'+sn+
      '</p>'+
      _dcSect('Offense',       offHtml)+
      _dcSect('Defense',       defHtml)+
      _dcSect('Special Teams', stHtml)
    );
  };

})();
</script>

  /* ── Helpers: compress to storage / decompress from storage ─ */
  function _saveStr(state) {

       LZString.compressToUTF16 produces high-Unicode characters that
       get corrupted by the browser's text encoding pipeline.          */
    return JSON.stringify(state);
  }
  function _loadStr(raw) {
    /* Try plain JSON first (new format), then LZString for old saves */
    try { return JSON.parse(raw); } catch (e) { /* try compressed */ }
    try {
      var dec = LZString.decompressFromUTF16(raw);

    } catch (e2) { /* give up */ }

  /* ── Collect all live game state into one object ─────────── */
  function captureState() {
    /* Find highest player ID so new-game IDs don't collide after load */
    var maxId = 0;
    if (league) {
      listAllTeams(league).forEach(function (t) {
        t.roster.forEach(function (p) {
          var n = parseInt(p.id, 10);
          if (!isNaN(n) && n > maxId) maxId = n;
        });
      });
    }

    return {
      version          : SAVE_VERSION,
      savedAt          : new Date().toISOString(),
      simYear          : window.simYear          || 1,
      currentWeekIndex : currentWeekIndex        || 0,
      userTeamId       : userTeamId              || null,
      globalPlayerId   : Math.max(globalPlayerId || 1, maxId + 1),
      league           : league,
      schedule         : schedule,
      freeAgents       : typeof freeAgents            !== 'undefined' ? freeAgents            : [],
      draftClass       : typeof draftClass            !== 'undefined' ? draftClass            : [],
      draftOrder       : typeof draftOrder            !== 'undefined' ? draftOrder            : [],
      draftRound       : typeof draftRound            !== 'undefined' ? draftRound            : 1,
      draftIndex       : typeof draftIndex            !== 'undefined' ? draftIndex            : 0,
      pickRegistry     : window.pickRegistry          || {},
      draftTrades      : window.draftTrades           || {},
      transactionLog   : typeof transactionLog        !== 'undefined' ? transactionLog        : [],
      coachFreeAgents  : typeof coachFreeAgents       !== 'undefined' ? coachFreeAgents       : [],
      coordinatorFAs   : typeof coordinatorFreeAgents !== 'undefined' ? coordinatorFreeAgents : [],
    };
  }

      return false;
    }

    /* Core game globals */
    window.simYear        = state.simYear        || 1;
    currentWeekIndex      = state.currentWeekIndex || 0;
    userTeamId            = state.userTeamId      || null;
    globalPlayerId        = state.globalPlayerId  || 1;

    teamMap = buildTeamMap(league);

    freeAgents            = state.freeAgents       || [];
    draftClass            = state.draftClass        || [];
    draftOrder            = state.draftOrder        || [];
    draftRound            = state.draftRound        || 1;
    draftIndex            = state.draftIndex        || 0;
    window.pickRegistry   = state.pickRegistry      || {};
    window.draftTrades    = state.draftTrades       || {};

        ? (function () {

            state.league.conferences.forEach(function (c) {
              c.divisions.forEach(function (d) {
                d.teams.forEach(function (tm) {
                  if (tm.id === state.userTeamId) t = tm;
                });
              });
            });
            return t;
          })()
        : null;
      return {
        savedAt  : state.savedAt,
        simYear  : state.simYear  || 1,
        week     : state.currentWeekIndex || 0,

        record   : team ? team.wins + '-' + team.losses   : '—',
