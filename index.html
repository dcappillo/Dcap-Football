    + 'background:rgba(239,68,68,.12);border-color:#ef4444;color:#f87171">🔥 Replace</button>'
  );

  var ocCard = card(
    'Offensive Coordinator', '⚡', oc,
    ratingBar('Offense Rating', oc.offenseRating),
    'Scheme: ' + ocScheme,
    '<button onclick="typeof renderUserOCHire===\'function\'&&renderUserOCHire()" '
    + 'style="width:auto;padding:4px 10px;font-size:11px">Change</button>'
  );

  var dcCard = card(
    'Defensive Coordinator', '🛡', dc,
    ratingBar('Defense Rating', dc.defenseRating),
    'Scheme: ' + dcScheme,
    '<button onclick="typeof renderUserDCHire===\'function\'&&renderUserDCHire()" '
    + 'style="width:auto;padding:4px 10px;font-size:11px">Change</button>'
  );

  setMainContent(
    '<h2>'+team.city+' '+team.nickname+' — Coaching Staff</h2>'
    + '<p class="small" style="margin-bottom:12px">Coaching ratings boost team performance each game. '
      + 'Scheme fit affects player morale and development.</p>'
    + fitHtml
    + '<div style="display:grid;grid-template-columns:1fr;gap:12px">'
      + hcCard + ocCard + dcCard
    + '</div>'
  );
};
</script>

<script>
/* ── Auto-sync playbook dropdowns to match current coordinator schemes ──
   When the page loads or a team is selected, pre-set the offensive and
   defensive playbook dropdowns to the coordinator's current scheme.
   The user can still override — this just gives them the optimal default. */
(function () {

  function syncPlaybookDropdowns() {
    var tid  = document.getElementById('teamSelect');
    if (!tid || !tid.value) return;
    var team = typeof getTeamById === 'function' ? getTeamById(tid.value) : null;
    if (!team) return;

    var offPB = document.getElementById('offPlaybook');
    var defPB = document.getElementById('defPlaybook');

    if (offPB && team.oc && team.oc.scheme) {
      offPB.value = team.oc.scheme;
    }
    if (defPB && team.dc && team.dc.scheme) {
      defPB.value = team.dc.scheme;
    }
  }

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(syncPlaybookDropdowns, 400);

    /* Re-sync when team changes */
    var sel = document.getElementById('teamSelect');
    if (sel) sel.addEventListener('change', function () {
      setTimeout(syncPlaybookDropdowns, 100);
    });
  });

  /* Expose so it can be called after hiring a new coordinator */
  window.syncPlaybookDropdowns = syncPlaybookDropdowns;

})();
</script>

<script>
/* ============================================================
   PATCH — SCHEME MATCHUP ACTUALLY APPLIED TO GAME OUTCOMES

   Problems fixed:
   1. Old Phase 6D hook calculated modifiers then tried to apply
      them to result.teamAWinChance which never exists — modifiers
      were calculated and immediately discarded.

   2. calculateTeamGameModifier used only the coordinator's
      scheme, not the playbook the user selected this week.

   3. Scheme matchup is now wired directly into coachingPowerBoost
      (the function that correctly applies to power ratings) using
      the user's actual weekly playbook selection.
   ============================================================ */
(function () {

  /* ── Full scheme matchup matrix (offense vs defense) ─────
     Positive = offense advantage, negative = defense advantage.
     Values are power rating points (scale: teams are 70-85).  */
  var SCHEME_MATRIX = {
    'Air Raid': {
      '4-3'         : +5,   /* 4-3 is susceptible to spread passing */
      '3-4'         : +2,   /* decent vs Air Raid but beatable       */
      'Cover 2'     : -5,   /* Cover 2 designed to stop passing      */
      'Blitz Heavy' : -6    /* blitz disrupts QB rhythm               */
    },
    'West Coast': {
      '4-3'         : +2,   /* WC exploits 4-3 underneath zones      */
      '3-4'         : -2,   /* 3-4 OLBs pressure WC timing           */
      'Cover 2'     : +5,   /* WC attacks the Cover 2 seam perfectly  */
      'Blitz Heavy' : -4    /* blitz kills timing routes              */
    },
    'Spread': {
      '4-3'         : +4,   /* Spread creates mismatches vs 4-3      */
      '3-4'         : +1,   /* slight advantage                      */
      'Cover 2'     : -3,   /* Cover 2 handles spread ok             */
      'Blitz Heavy' : -5    /* Spread QB needs time to read          */
    },
    'Power Run': {
      '4-3'         : -2,   /* 4-3 stacks box well                   */
      '3-4'         : +7,   /* Power Run gashes 3-4 gaps at LB level */
      'Cover 2'     : +1,   /* Cover 2 is vulnerable to runs         */
      'Blitz Heavy' : -1    /* blitz can disrupt run blocking         */
    }
  };

  /* ── Defensive style vs offensive playbook counter-matrix ──
     The user's defensive style choice also matters.
     "Defend Run" is stronger vs Power Run, weaker vs passing etc. */
  var DEF_STYLE_VS_OFF = {
    'Defend Run' : {
      'Power Run'  : +3,  /* specifically prepared for runs */
      'Air Raid'   : -2,  /* light box = vulnerable to pass */
      'Spread'     : -1,
      'West Coast' : -1
    },
    'Defend Pass': {
      'Air Raid'   : +3,  /* extra DBs vs passing           */
      'West Coast' : +3,
      'Spread'     : +2,
      'Power Run'  : -3   /* light box struggles vs runs    */
    },
    'Blitz Heavy': {
      'Air Raid'   : -4,  /* quick passes beat blitz        */
      'West Coast' : -3,  /* timing routes beat blitz       */
      'Spread'     : -2,  /* Spread QB can audible out      */
      'Power Run'  : +2   /* blitz in backfield disrupts RB */
    },
    'Balanced'   : { 'Air Raid':0, 'West Coast':0, 'Spread':0, 'Power Run':0 }
  };

  /* ── Override coachingPowerBoost to include scheme matchup ─── */
  window.coachingPowerBoost = function (team, opponent) {
    var oc    = (typeof safeOC    === 'function') ? safeOC(team)    : (team.oc    || {offenseRating:70});
    var dc    = (typeof safeDC    === 'function') ? safeDC(team)    : (team.dc    || {defenseRating:70});
    var coach = (typeof safeCoach === 'function') ? safeCoach(team) : (team.coach || {leadership:70});

    var chem  = (typeof getTeamChemistryOVRModifier === 'function')
                ? getTeamChemistryOVRModifier(team) : 0;

    /* Coordinator quality boosts */
    var offBoost  = Math.floor((oc.offenseRating - 75) / 4);
    var defBoost  = Math.floor((dc.defenseRating - 75) / 4);
    var leadBoost = Math.floor((coach.leadership  - 75) / 6);

    /* Scheme fit: average roster fit vs coordinator scheme */
    var fitScore = 0;
    if (team.roster && team.roster.length &&
        typeof calculateSchemeFit === 'function') {
      var sample = team.roster.slice(0, 22);
      fitScore = Math.floor(
        sample.reduce(function (s, p) {
          return s + calculateSchemeFit(p, team);
        }, 0) / sample.length / 20 - 2.5
      );
    }

    var total = offBoost + defBoost + leadBoost + fitScore + chem;

    /* ── Scheme matchup vs opponent ──────────────────────────
       Use the playbook the team actually selected this week,
       falling back to the coordinator's scheme if not set.    */
    if (opponent) {
      var offPlaybook = team._offPlaybook     || oc.scheme || 'Spread';
      var defPlaybook = team._defPlaybook     || dc.scheme || '4-3';
      var oppOffPB    = opponent._offPlaybook || (opponent.oc ? opponent.oc.scheme : 'Spread') || 'Spread';
      var defStyle    = team._defStyle        || 'Balanced';

      /* 1. Our offense vs their defense scheme */
      var oppDefPB = opponent._defPlaybook || (opponent.dc ? opponent.dc.scheme : '4-3') || '4-3';
      var offMatrix = SCHEME_MATRIX[offPlaybook];
      var offVsDef  = offMatrix ? (offMatrix[oppDefPB] || 0) : 0;

      /* 2. Our defense vs their offense scheme */
      var defMatrix = SCHEME_MATRIX[oppOffPB];
      var theirOff  = defMatrix ? (defMatrix[defPlaybook] || 0) : 0;
      var defVsOff  = -theirOff; /* flip: positive = our defense wins the matchup */

      /* 3. Our defensive style vs their offensive playbook */
      var styleMatrix = DEF_STYLE_VS_OFF[defStyle] || {};
      var styleBonus  = styleMatrix[oppOffPB] || 0;

      total += offVsDef + defVsOff + styleBonus;
    }

    return total;
  };

  /* ── Store _offPlaybook and _defPlaybook alongside _defStyle ─
     Patch the existing simulateGame wrapper to also persist the
     playbook selections onto the team objects before simulation. */
  var _prevSG = window.simulateWeek;   /* not re-wrapping simulateGame directly */

  /* Instead, patch applyStrategyModifier to store playbook on team */
  var _origASM = window.applyStrategyModifier || applyStrategyModifier;
  window.applyStrategyModifier = function (base, strat, team) {
    if (team && strat) {
      team._offPlaybook = strat.offPlaybook    || strat.offensivePlaybook || null;
      team._defPlaybook = strat.defPlaybook    || strat.defensivePlaybook || null;
      team._defStyle    = strat.defensiveStyle || strat.defStyle          || 'Balanced';
    }
    return (typeof _origASM === 'function') ? _origASM(base, strat, team) : base;
  };

  /* ── Also patch the coachingPowerBoost call inside simulateGame
     to pass the opponent object so the matchup can be calculated.
     The existing patch already calls coachingPowerBoost(home/away)
     without the opponent — patch it to pass both.               */
  var _origCPBWrap = window.simulateGame;
  window.simulateGame = function (game, teamMap, userStrategy, uid) {
    /* Apply strategy modifiers to store playbook onto teams BEFORE sim */
    if (game && teamMap) {
      var h = teamMap[game.homeTeamId];
      var a = teamMap[game.awayTeamId];
      if (h && a) {
        /* Temporarily boost with opponent-aware coaching modifier */
        var hBoost = window.coachingPowerBoost(h, a);
        var aBoost = window.coachingPowerBoost(a, h);
        h.powerRating += hBoost;
        a.powerRating += aBoost;
        try {
          /* Call the chain BELOW this wrapper (the original sim) */
          if (typeof _origCPBWrap === 'function') _origCPBWrap(game, teamMap, userStrategy, uid);
        } finally {
          h.powerRating -= hBoost;
          a.powerRating -= aBoost;
        }
        return;
      }
    }
    if (typeof _origCPBWrap === 'function') _origCPBWrap(game, teamMap, userStrategy, uid);
  };

})();
</script>

<script>
/* ============================================================
   PATCH — TRADE CENTER: REPLACE NATIVE MULTI-SELECT WITH
   TAP-TO-TOGGLE CHECKLIST

   Problem: <select multiple> requires Ctrl+Click on desktop
   and is completely unusable on mobile — you can only ever
   select one item at a time.

   Fix: custom scrollable checklist with tap-to-toggle rows.
   Selected items highlight in green. _proposeTrade reads
   from window._tradeSelected instead of .selectedOptions.
   ============================================================ */
(function () {

  /* Per-side selection state: { A: {players:Set, picks:Set}, B: {...} } */
  window._tradeSelected = {
    A: { players: new Set(), picks: new Set() },
    B: { players: new Set(), picks: new Set() }
  };

  /* ── Toggle a player selection ─────────────────────────── */
  window._tcTogglePlayer = function (side, playerId) {
    var sel = window._tradeSelected[side].players;
    playerId = String(playerId);
    if (sel.has(playerId)) sel.delete(playerId);
    else                   sel.add(playerId);
    _updateRowHighlight('tcp-' + side + '-' + playerId);
    _updateSelectionCount(side, 'players');
  };

  /* ── Toggle a pick selection ───────────────────────────── */
  window._tcTogglePick = function (side, pickId) {
    var sel = window._tradeSelected[side].picks;
    /* pickIds can have special chars — encode for element ID */
    var safeId = encodePickId(pickId);
    if (sel.has(pickId)) sel.delete(pickId);
    else                  sel.add(pickId);
    _updateRowHighlight('tcp-' + side + '-pk-' + safeId);
    _updateSelectionCount(side, 'picks');
  };

  function encodePickId(id) {
    return id.replace(/[^a-zA-Z0-9]/g, '_');
  }

  function _updateRowHighlight(elId) {
    var el = document.getElementById(elId);
    if (!el) return;
    var checked = el.getAttribute('data-checked') === '1';
    var newState = !checked;
    el.setAttribute('data-checked', newState ? '1' : '0');
    el.style.background    = newState ? 'rgba(22,163,74,.18)' : '';
    el.style.borderColor   = newState ? 'var(--accent)'       : 'transparent';
    var chk = el.querySelector('.tc-chk');
    if (chk) chk.textContent = newState ? '✓' : '○';
  }

  function _updateSelectionCount(side, type) {
    var count = type === 'players'
      ? window._tradeSelected[side].players.size
      : window._tradeSelected[side].picks.size;
    var label = document.getElementById('tc-count-' + side + '-' + type);
    if (label) label.textContent = count > 0 ? ' (' + count + ' selected)' : '';
  }

  /* ── Rebuild asset panel with tap-to-toggle rows ─────────── */
  function _buildAssetPanel(side, teamId) {
    var c = document.getElementById('tcAssets' + side);
    if (!c) return;
    var team = getTeamById(teamId);
    if (!team) return;

    /* Reset selection for this side when panel rebuilds */
    window._tradeSelected[side] = { players: new Set(), picks: new Set() };

    function ovc(v) {
      return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';
    }

    /* ── Player rows ──────────────────────────────────────── */
    var sortedRoster = team.roster.slice()
      .sort(function (a, b) { return b.attributes.overall - a.attributes.overall; });

    var playerRows = sortedRoster.map(function (p) {
      var ovr   = p.attributes ? p.attributes.overall : 70;
      var delta = (p.seasonStartOVR !== undefined && ovr !== p.seasonStartOVR)
        ? (ovr > p.seasonStartOVR ? ' <span style="color:#4ade80;font-size:9px">▲</span>'
                                  : ' <span style="color:#f87171;font-size:9px">▼</span>')
        : '';
      var elId  = 'tcp-' + side + '-' + p.id;
      return '<div id="' + elId + '" data-checked="0" '
        + 'onclick="window._tcTogglePlayer(\'' + side + '\',\'' + p.id + '\')" '
        + 'style="display:flex;align-items:center;gap:8px;padding:6px 10px;'
        + 'cursor:pointer;border:1px solid transparent;border-radius:6px;'
        + 'transition:background .12s,border-color .12s;margin-bottom:2px">'
        + '<span class="tc-chk" style="font-size:13px;color:var(--accent2);'
        + 'width:16px;flex-shrink:0">○</span>'
        + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
            + p.name + delta
          + '</div>'
          + '<div style="font-size:10px;color:var(--muted2)">'
            + p.positions[0] + ' · Age ' + p.age
          + '</div>'
        + '</div>'
        + '<span style="font-size:12px;font-weight:700;color:' + ovc(ovr) + '">' + ovr + '</span>'
      + '</div>';
    }).join('');

    /* ── Pick rows ───────────────────────────────────────── */
    var picks = (typeof picksOwnedBy === 'function') ? picksOwnedBy(teamId) : [];
    var pickRows = picks.map(function (pk) {
      var via    = pk.origOwner !== teamId
        ? ' <span style="color:var(--gold);font-size:9px">via '
          + ((getTeamById(pk.origOwner)||{}).nickname||'?') + '</span>'
        : '';
      var safeId = encodePickId(pk.pickId);
      var elId   = 'tcp-' + side + '-pk-' + safeId;
      var val    = (typeof pickValueById === 'function') ? pickValueById(pk.pickId) : 0;
      return '<div id="' + elId + '" data-checked="0" '
        + 'onclick="window._tcTogglePick(\'' + side + '\',\'' + pk.pickId.replace(/'/g,"\\'") + '\')" '
        + 'style="display:flex;align-items:center;gap:8px;padding:6px 10px;'
        + 'cursor:pointer;border:1px solid transparent;border-radius:6px;'
        + 'transition:background .12s,border-color .12s;margin-bottom:2px">'
        + '<span class="tc-chk" style="font-size:13px;color:var(--accent2);'
        + 'width:16px;flex-shrink:0">○</span>'
        + '<div style="flex:1">'
          + '<div style="font-size:12px;font-weight:500">Yr ' + pk.year + ' Rd ' + pk.round + via + '</div>'
          + (val ? '<div style="font-size:10px;color:var(--muted2)">Trade value: ' + val.toLocaleString() + ' pts</div>' : '')
        + '</div>'
      + '</div>';
    }).join('') || '<div style="font-size:11px;color:var(--muted);padding:6px 10px">No picks owned</div>';

    c.innerHTML =
      '<div style="font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;'
      + 'color:var(--accent2);margin:10px 0 4px">'
      + team.city + ' Players'
      + '<span id="tc-count-' + side + '-players" style="color:var(--muted2);font-weight:400"></span>'
      + '</div>'
      + '<div style="max-height:220px;overflow-y:auto;border:1px solid var(--border);'
      + 'border-radius:8px;padding:4px;background:var(--surface2)">'
      + playerRows
      + '</div>'
      + '<div style="font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;'
      + 'color:var(--accent2);margin:10px 0 4px">'
      + team.city + ' Draft Picks'
      + '<span id="tc-count-' + side + '-picks" style="color:var(--muted2);font-weight:400"></span>'
      + '</div>'
      + '<div style="max-height:140px;overflow-y:auto;border:1px solid var(--border);'
      + 'border-radius:8px;padding:4px;background:var(--surface2)">'
      + pickRows
      + '</div>';
  }

  /* ── Override _refreshTC to use new builder ─────────────── */
  window._refreshTC = function () {
    var selA = document.getElementById('tcTeamA');
    var selB = document.getElementById('tcTeamB');
    if (!selA || !selB) return;
    _buildAssetPanel('A', selA.value);
    _buildAssetPanel('B', selB.value);
  };

  /* ── Override _proposeTrade to read from _tradeSelected ──── */
  window._proposeTrade = function () {
    var selA   = document.getElementById('tcTeamA');
    var selB   = document.getElementById('tcTeamB');
    var result = document.getElementById('tcResult');
    if (!selA || !selB || !result) return;
    if (selA.value === selB.value) {
      result.innerHTML = '<p style="color:#f87171">Select two different teams.</p>'; return;
    }

    var teamA = getTeamById(selA.value);
    var teamB = getTeamById(selB.value);
    var selObj = window._tradeSelected;

    var plA = Array.from(selObj.A.players)
      .map(function (id) { return teamA.roster.find(function (p) { return String(p.id) === id; }); })
      .filter(Boolean);
    var plB = Array.from(selObj.B.players)
      .map(function (id) { return teamB.roster.find(function (p) { return String(p.id) === id; }); })
      .filter(Boolean);
    var pkA = Array.from(selObj.A.picks);
    var pkB = Array.from(selObj.B.picks);

    if (!plA.length && !pkA.length && !plB.length && !pkB.length) {
      result.innerHTML = '<p style="color:#f87171">Select at least one asset on each side.</p>'; return;
    }
    if ((!plA.length && !pkA.length) || (!plB.length && !pkB.length)) {
      result.innerHTML = '<p style="color:#f87171">Both sides must offer at least one asset.</p>'; return;
    }

    /* Value calculation */
    function pv(p) {
      if (!p || !p.attributes) return 0;
      var ovr = p.attributes.overall, age = p.age || 27;
      var val = ovr * 50;
      if      (age <= 22) val *= 1.5;
      else if (age <= 24) val *= 1.25;
      else if (age <= 27) val *= 1.1;
      else if (age <= 30) val *= 0.85;
      else if (age <= 33) val *= 0.65;
      else                val *= 0.45;
      if (['QB','EDGE','CB'].indexOf(p.positions[0]) !== -1) val *= 1.2;
      return Math.round(val);
    }

    var valA = plA.reduce(function (s, p) { return s + pv(p); }, 0)
             + pkA.reduce(function (s, id) { return s + (typeof pickValueById === 'function' ? pickValueById(id) : 200); }, 0);
    var valB = plB.reduce(function (s, p) { return s + pv(p); }, 0)
             + pkB.reduce(function (s, id) { return s + (typeof pickValueById === 'function' ? pickValueById(id) : 200); }, 0);

    var avg = (valA + valB) / 2 || 1;
    var gap = Math.abs(valA - valB) / avg;

    var breakdown =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px">'
      + '<div style="background:var(--surface2);border-radius:6px;padding:8px;text-align:center">'
        + '<div style="color:var(--muted2);font-size:11px;margin-bottom:3px">' + teamA.nickname + ' gives</div>'
        + '<div style="font-size:20px;font-weight:700">' + valA.toLocaleString() + ' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>'
      + '</div>'
      + '<div style="background:var(--surface2);border-radius:6px;padding:8px;text-align:center">'
        + '<div style="color:var(--muted2);font-size:11px;margin-bottom:3px">' + teamB.nickname + ' gives</div>'
        + '<div style="font-size:20px;font-weight:700">' + valB.toLocaleString() + ' <span style="font-size:11px;color:var(--muted2);font-weight:400">pts</span></div>'
      + '</div>'
      + '</div>'
      + '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px">Gap: '
        + Math.round(gap * 100) + '% ' + (gap < 0.12 ? '✅ Fair' : gap < 0.25 ? '⚠️ Borderline' : '❌ Lopsided')
      + '</div>';

    var teamBGivingMore = valB > valA;
    var rejectingTeam   = teamBGivingMore ? teamB : teamA;

    function doExecute() {
      plA.forEach(function (p) {
        teamA.roster = teamA.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamA.capUsed -= p.contract.capHitPerYear;
        teamB.roster.push(p);
        if (p.contract) teamB.capUsed += p.contract.capHitPerYear;
      });
      plB.forEach(function (p) {
        teamB.roster = teamB.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamB.capUsed -= p.contract.capHitPerYear;
        teamA.roster.push(p);
        if (p.contract) teamA.capUsed += p.contract.capHitPerYear;
      });
      pkA.forEach(function (id) { if (typeof transferPick === 'function') transferPick(id, teamA.id, teamB.id); });
      pkB.forEach(function (id) { if (typeof transferPick === 'function') transferPick(id, teamB.id, teamA.id); });
      if (typeof logTradeTransaction === 'function')
        logTradeTransaction(teamA, plA, pkA, teamB, plB, pkB);

      function pickDesc(id) {
        var m = id.match(/_R(\d+)_Y(\d+)/);
        return m ? 'Yr' + m[2] + ' Rd' + m[1] : 'pick';
      }

      result.innerHTML = breakdown
        + '<p style="color:#4ade80;font-weight:600">✅ Trade executed!</p>'
        + '<p class="small">' + teamA.nickname + ' sent: '
          + plA.map(function (p) { return p.name + ' (OVR ' + p.attributes.overall + ')'; })
              .concat(pkA.map(pickDesc)).join(', ') + '</p>'
        + '<p class="small">' + teamB.nickname + ' sent: '
          + plB.map(function (p) { return p.name + ' (OVR ' + p.attributes.overall + ')'; })
              .concat(pkB.map(pickDesc)).join(', ') + '</p>';

      setTimeout(function () {
        window.renderTradePicksUI && window.renderTradePicksUI();
      }, 1800);
    }

    if (gap <= 0.12) {
      doExecute();
    } else if (gap <= 0.25) {
      var need = (typeof getTeamNeedAtPosition === 'function' && (plA[0] || plB[0]))
        ? getTeamNeedAtPosition(rejectingTeam,
            teamBGivingMore ? (plA[0] && plA[0].positions[0]) : (plB[0] && plB[0].positions[0]))
        : 0.5;
      if (need >= 0.7) {
        doExecute();
      } else {
        result.innerHTML = breakdown
          + '<p style="color:#facc15;font-weight:600">⚠️ '
          + (typeof _tradeMsg === 'function'
              ? rejectingTeam.nickname + ' hesitated — ' + _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB)
              : rejectingTeam.nickname + ' wants more value.')
          + '</p>';
      }
    } else {
      result.innerHTML = breakdown
        + '<p style="color:#f87171;font-weight:600">❌ '
        + (typeof _tradeMsg === 'function'
            ? rejectingTeam.nickname + ' rejected — ' + _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB)
            : rejectingTeam.nickname + ' rejected — gap too large.')
        + '</p>';
    }
  };

})();
</script>

<script>
/* ── Home dashboard: team select + division standings + last game ───── */
(function () {

  /* Populate homeTeamSelect from the same source as teamSelect */
  function populateHomeSelect() {
    var sel = document.getElementById('homeTeamSelect');
    var src = document.getElementById('teamSelect');
    if (!sel || !src) return;
    sel.innerHTML = src.innerHTML;
    sel.value     = src.value;
  }

  /* Sync both dropdowns whenever either changes */
  function syncSelects(value) {
    var src  = document.getElementById('teamSelect');
    var home = document.getElementById('homeTeamSelect');
    if (src  && src.value  !== value) src.value  = value;
    if (home && home.value !== value) home.value = value;
    /* fire the existing change handler on the sidebar select */
    if (src) src.dispatchEvent(new Event('change'));
  }

  window.onHomeTeamChange = function (value) {
    syncSelects(value);
    renderHomeDashboard(value);
  };

  /* ── Render the dashboard panel ─────────────────────────── */
  window.renderHomeDashboard = function (tid) {
    var panel = document.getElementById('homeDashboard');
    if (!panel) return;

    if (!tid || typeof league === 'undefined' || !league
        || typeof teamMap === 'undefined' || !teamMap) {
      panel.innerHTML = '';
      return;
    }

    var team = typeof getTeamById === 'function' ? getTeamById(tid) : null;
    if (!team) { panel.innerHTML = ''; return; }

    /* ── 1. Last game result ──────────────────────────────── */
    var lastGameHtml = '';
    if (typeof schedule !== 'undefined' && schedule && currentWeekIndex > 0) {
      /* Walk backward to find the most recent played game involving this team */
      var lastGame = null, lastWeekNum = 0;
      for (var w = currentWeekIndex - 1; w >= 0; w--) {
        var wk = schedule[w];
        if (!wk) continue;
        var g = (wk.games || []).find(function (g) {
          return g.played && (g.homeTeamId === tid || g.awayTeamId === tid);
        });
        if (g) { lastGame = g; lastWeekNum = wk.weekNumber; break; }
      }

      if (lastGame) {
        var isHome     = lastGame.homeTeamId === tid;
        var oppId      = isHome ? lastGame.awayTeamId : lastGame.homeTeamId;
        var opp        = getTeamById(oppId) || { city:'', nickname: oppId };
        var myScore    = isHome ? lastGame.homeScore : lastGame.awayScore;
        var oppScore   = isHome ? lastGame.awayScore : lastGame.homeScore;
        var won        = myScore > oppScore;
        var tied       = myScore === oppScore;
        var resultTxt  = won ? 'W' : tied ? 'T' : 'L';
        var resultColor= won ? '#4ade80' : tied ? '#facc15' : '#f87171';
        var locLabel   = isHome ? 'vs' : '@';

        lastGameHtml =
          '<div style="background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:12px">'
          + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;'
            + 'letter-spacing:.8px;margin-bottom:6px">Week ' + lastWeekNum + ' Result</div>'
          + '<div style="display:flex;align-items:center;gap:8px">'
            + '<span style="font-size:20px;font-weight:800;color:'+resultColor+';'
              + 'font-family:\'Barlow Condensed\',sans-serif;min-width:20px">'
              + resultTxt + '</span>'
            + '<div style="flex:1">'
              + '<div style="font-size:13px;font-weight:600">'
                + locLabel + ' ' + opp.city + ' ' + opp.nickname
              + '</div>'
              + '<div style="font-size:18px;font-weight:700;font-family:\'Barlow Condensed\',sans-serif">'
                + '<span style="color:'+resultColor+'">' + myScore + '</span>'
                + ' <span style="color:var(--muted);font-size:14px">–</span> '
                + '<span>' + oppScore + '</span>'
              + '</div>'
            + '</div>'
          + '</div>'
        + '</div>';
      }
    }

    /* ── 2. Division standings ───────────────────────────── */
    var divTeams = [];
    if (league.conferences) {
      league.conferences.forEach(function (conf) {
        (conf.divisions || []).forEach(function (div) {
          var found = (div.teams || []).find(function (t) { return t.id === tid; });
          if (found) divTeams = div.teams.slice();
        });
      });
    }

    var standingsHtml = '';
    if (divTeams.length) {
      divTeams.sort(function (a, b) {
        if (b.wins !== a.wins) return b.wins - a.wins;
        return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
      });

      var divName = '';
      league.conferences.forEach(function (conf) {
        (conf.divisions || []).forEach(function (div) {
          if ((div.teams || []).find(function (t) { return t.id === tid; }))
            divName = div.name;
        });
      });

      var rows = divTeams.map(function (t, idx) {
        var isUser    = t.id === tid;
        var pd        = t.pointsFor - t.pointsAgainst;
        var pdTxt     = pd > 0 ? '+'+pd : String(pd);
        var rowBg     = isUser ? 'background:rgba(22,163,74,.12);' : '';
        var leader    = idx === 0 ? '🥇 ' : '';
        var nameStyle = isUser ? 'font-weight:700;color:var(--accent2)' : 'color:var(--text)';
        return '<tr style="'+rowBg+'">'
          + '<td style="padding:5px 8px;'+nameStyle+';font-size:12px">'
            + leader + t.city + ' ' + t.nickname
          + '</td>'
          + '<td style="padding:5px 8px;text-align:center;font-size:12px;color:#4ade80;font-weight:600">'
            + t.wins
          + '</td>'
          + '<td style="padding:5px 8px;text-align:center;font-size:12px;color:#f87171">'
            + t.losses
          + '</td>'
          + '<td style="padding:5px 8px;text-align:center;font-size:11px;color:var(--muted2)">'
            + (pd > 0 ? '<span style="color:#4ade80">'+pdTxt+'</span>'
               : pd < 0 ? '<span style="color:#f87171">'+pdTxt+'</span>'
               : pdTxt)
          + '</td>'
          + '</tr>';
      }).join('');

      standingsHtml =
        '<div style="background:var(--surface2);border-radius:8px;overflow:hidden">'
        + '<div style="padding:7px 10px;font-size:10px;color:var(--accent2);font-weight:700;'
          + 'text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)">'
          + divName
        + '</div>'
        + '<table style="width:100%;border-collapse:collapse">'
          + '<thead>'
            + '<tr>'
              + '<th style="padding:5px 8px;text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;border-bottom:1px solid var(--border)">Team</th>'
              + '<th style="padding:5px 8px;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.8px;font-weight:600;border-bottom:1px solid var(--border)">W</th>'
              + '<th style="padding:5px 8px;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.8px;font-weight:600;border-bottom:1px solid var(--border)">L</th>'
              + '<th style="padding:5px 8px;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.8px;font-weight:600;border-bottom:1px solid var(--border)">PD</th>'
            + '</tr>'
          + '</thead>'
          + '<tbody>' + rows + '</tbody>'
        + '</table>'
        + '</div>';
    }

    /* ── 3. Team stat line ────────────────────────────────── */
    var wk = typeof schedule !== 'undefined' && schedule ? currentWeekIndex : 0;
    var weekLabel = wk > 0
      ? 'Through Week ' + wk + ' of ' + (schedule ? schedule.length : 17)
      : 'Pre-season';
    var capSpace = team.salaryCap - team.capUsed;
    var capColor = capSpace < 0 ? '#f87171' : '#4ade80';

    var _seasonLabel = '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;'
      + 'letter-spacing:.8px;margin-bottom:3px">Season ' + (window.simYear || 1) + '</div>';

    var statLine =
      '<div style="display:flex;justify-content:space-between;align-items:center;'
      + 'margin-bottom:10px;flex-wrap:wrap;gap:4px">'
        + '<div>'
          + _seasonLabel
          + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;'
          + 'font-weight:700;color:var(--accent2)">'
          + team.wins + '-' + team.losses + (team.ties ? '-'+team.ties : '')
          + '</div>'
        + '</div>'
        + '<div style="font-size:11px;color:var(--muted2);text-align:right">'
          + weekLabel + '<br>'
          + '<span style="color:'+capColor+'">$' + capSpace.toLocaleString() + ' cap space</span>'
        + '</div>'
      + '</div>';

    /* ── 4. This week's matchup (or bye week notice) ────────── */
    var matchupHtml = '';
    if (typeof schedule !== 'undefined' && schedule && currentWeekIndex < schedule.length) {
      var thisWeek = schedule[currentWeekIndex];
      var thisGame = thisWeek && (thisWeek.games || []).find(function (g) {
        return g.homeTeamId === tid || g.awayTeamId === tid;
      });

      if (thisGame) {
        var mIsHome = thisGame.homeTeamId === tid;
        var mOppId  = mIsHome ? thisGame.awayTeamId : thisGame.homeTeamId;
        var mOpp    = getTeamById(mOppId) || { city: '', nickname: mOppId };
        var mLabel  = mIsHome ? 'HOME' : 'AWAY';
        var mLoc    = mIsHome ? 'vs' : '@';

        /* ── Unit ratings helper ───────────────────────────── */
        function unitRating(t, positions) {
          if (!t || !t.roster) return 70;
          var byPos = {};
          t.roster.forEach(function (p) {
            var pos = p.positions[0];
            if (!byPos[pos]) byPos[pos] = [];
            byPos[pos].push(p);
          });
          Object.keys(byPos).forEach(function (pos) {
            byPos[pos].sort(function (a, b) {
              var ra = a.depthChartRank != null ? a.depthChartRank : 999;
              var rb = b.depthChartRank != null ? b.depthChartRank : 999;
              return ra !== rb ? ra - rb : b.attributes.overall - a.attributes.overall;
            });
          });
          var ovrs = [], total = 0;
          positions.forEach(function (spec) {
            var pos = spec[0], n = spec[1];
            var grp = byPos[pos] || [];
            for (var i = 0; i < n; i++) {
              if (grp[i]) { ovrs.push(grp[i].attributes.overall); total++; }
            }
          });
          if (!ovrs.length) return 70;
          return Math.round(ovrs.reduce(function (s, v) { return s + v; }, 0) / ovrs.length);
        }

        function coachRating(t) {
          if (!t) return 70;
          var hc = (t.coach && t.coach.leadership)    || 70;
          var oc = (t.oc    && t.oc.offenseRating)    || 70;
          var dc = (t.dc    && t.dc.defenseRating)    || 70;
          return Math.round((hc + oc + dc) / 3);
        }

        var OFF_POS = [['QB',1],['RB',1],['WR',3],['TE',1],['T',2],['G',2],['C',1]];
        var DEF_POS = [['EDGE',2],['DT',2],['LB',3],['CB',3],['FS',1],['SS',1]];
        var ST_POS  = [['K',1],['P',1]];

        var myOff  = unitRating(team, OFF_POS);
        var myDef  = unitRating(team, DEF_POS);
        var myST   = unitRating(team, ST_POS);
        var myCoach= coachRating(team);
        var myOVR  = Math.round(computeTeamPowerRating(team));

        var opOff  = unitRating(mOpp, OFF_POS);
        var opDef  = unitRating(mOpp, DEF_POS);
        var opST   = unitRating(mOpp, ST_POS);
        var opCoach= coachRating(mOpp);
        var opOVR  = Math.round(computeTeamPowerRating(mOpp));

        var mFavored = myOVR >= opOVR;
        var mDiff    = Math.abs(myOVR - opOVR);
        var mSpread  = mFavored
          ? '<span style="color:#4ade80">Favored by ' + mDiff + '</span>'
          : mDiff === 0
            ? '<span style="color:#facc15">Pick\'em</span>'
            : '<span style="color:#f87171">Underdog by ' + mDiff + '</span>';

        /* ── Comparison row builder ────────────────────────── */
        function cmpRow(label, myVal, opVal) {
          var myWin = myVal > opVal;
          var opWin = opVal > myVal;
          var mc = myWin ? '#4ade80' : opWin ? '#f87171' : '#94a3b8';
          var oc = opWin ? '#4ade80' : myWin ? '#f87171' : '#94a3b8';
          /* Bar: total width 100%, split proportionally */
          var total = myVal + opVal || 1;
          var myPct = Math.round(myVal / total * 100);
          var opPct = 100 - myPct;
          return '<div style="margin-bottom:7px">'
            + '<div style="font-size:9px;color:var(--muted);text-transform:uppercase;'
              + 'letter-spacing:.7px;text-align:center;margin-bottom:3px">' + label + '</div>'
            + '<div style="display:flex;align-items:center;gap:5px">'
              + '<span style="font-size:12px;font-weight:700;color:' + mc + ';min-width:26px;text-align:right">'
                + myVal + '</span>'
              + '<div style="flex:1;height:5px;border-radius:3px;overflow:hidden;'
                + 'background:var(--surface)">'
                + '<div style="display:flex;height:100%">'
                  + '<div style="width:' + myPct + '%;background:' + mc + ';border-radius:3px 0 0 3px"></div>'
                  + '<div style="width:' + opPct + '%;background:' + oc + ';border-radius:0 3px 3px 0"></div>'
                + '</div>'
              + '</div>'
              + '<span style="font-size:12px;font-weight:700;color:' + oc + ';min-width:26px">'
                + opVal + '</span>'
            + '</div>'
          + '</div>';
        }

        matchupHtml =
          '<div style="background:var(--surface2);border:1px solid var(--border);'
          + 'border-radius:8px;padding:10px 12px;margin-bottom:12px">'

          /* Header row */
          + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
            + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Week ' + (currentWeekIndex + 1) + '</div>'
            + '<div style="font-size:10px;font-weight:700;color:var(--accent2);background:rgba(22,163,74,.15);border-radius:4px;padding:1px 7px">' + mLabel + '</div>'
          + '</div>'

          /* Team names + overall */
          + '<div style="display:flex;align-items:flex-end;gap:6px;margin-bottom:10px">'
            + '<div style="flex:1;text-align:left">'
              + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:14px;font-weight:700;color:var(--accent2);line-height:1.1">'
                + team.city + ' ' + team.nickname + '</div>'
              + '<div style="font-size:22px;font-weight:800;color:var(--accent2);font-family:\'Barlow Condensed\',sans-serif">' + myOVR + '</div>'
            + '</div>'
            + '<div style="font-size:11px;font-weight:700;color:var(--muted2);padding-bottom:6px">' + mLoc + '</div>'
            + '<div style="flex:1;text-align:right">'
              + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:14px;font-weight:700;color:var(--text);line-height:1.1">'
                + mOpp.city + ' ' + mOpp.nickname + '</div>'
              + '<div style="font-size:22px;font-weight:800;color:var(--text);font-family:\'Barlow Condensed\',sans-serif">' + opOVR + '</div>'
            + '</div>'
          + '</div>'

          /* Comparison bars */
          + cmpRow('Offense',       myOff,   opOff)
          + cmpRow('Defense',       myDef,   opDef)
          + cmpRow('Special Teams', myST,    opST)
          + cmpRow('Coaching',      myCoach, opCoach)

          /* Spread */
          + '<div style="text-align:center;margin-top:8px;font-size:10px;font-weight:600">' + mSpread + '</div>'
          + '</div>';

      } else {
        /* Bye week */
        matchupHtml =
          '<div style="background:var(--surface2);border:1px solid var(--border);'
          + 'border-radius:8px;padding:10px 12px;margin-bottom:12px;text-align:center">'
          + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;'
            + 'letter-spacing:.8px;margin-bottom:6px">Week ' + (currentWeekIndex + 1) + ' Matchup</div>'
          + '<div style="font-size:13px;font-weight:600;color:var(--muted2)">🛌 Bye Week</div>'
          + '<div style="font-size:11px;color:var(--muted);margin-top:2px">No game this week</div>'
          + '</div>';
      }
    }

    panel.innerHTML = statLine + lastGameHtml + matchupHtml + standingsHtml;
  };

  /* ── Wire up on DOM ready + after league init ──────────── */
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      populateHomeSelect();
      var tid = (document.getElementById('homeTeamSelect') || {}).value;
      if (tid) renderHomeDashboard(tid);
    }, 500);
  });

  /* Re-render dashboard when week is simulated */
  var _origRWR = window.renderWeekResults;
  window.renderWeekResults = function (week) {
    if (typeof _origRWR === 'function') _origRWR(week);
    /* Refresh home dashboard data silently (it reads from live state) */
  };

  /* Expose so syncPlaybookDropdowns or team-change patches can trigger it */
  var _origSel = window.addEventListener;
  document.addEventListener('teamChanged', function (e) {
    if (e.detail && e.detail.id) renderHomeDashboard(e.detail.id);
  });

  /* Patch renderHome to repopulate the select and refresh dashboard */
  var _origRH = window.renderHome;
  window.renderHome = function () {
    if (typeof _origRH === 'function') _origRH();
    setTimeout(function () {
      populateHomeSelect();
      var tid = (document.getElementById('homeTeamSelect') || {}).value
             || (document.getElementById('teamSelect') || {}).value;
      if (tid) renderHomeDashboard(tid);
    }, 80);
  };

  /* Also refresh after sim week completes */
  var _prevSMC = window.setMainContent;
  var _smcGuard = false;
  window.setMainContent = function (html) {
    if (typeof _prevSMC === 'function') _prevSMC(html);
    /* If home dashboard is visible, keep it current — guard against recursion */
    if (_smcGuard) return;
    var panel = document.getElementById('homeDashboard');
    if (panel && panel.innerHTML && document.getElementById('homeTeamSelect')) {
      var tid = (document.getElementById('homeTeamSelect') || {}).value;
      if (tid && typeof renderHomeDashboard === 'function') {
        _smcGuard = true;
        try { renderHomeDashboard(tid); } finally { _smcGuard = false; }
      }
    }
  };

})();
</script>

<script>
/* ── Global fitBadge — scheme fit symbol for roster screen ── */
window.fitBadge = function (p, team) {
  /* If team not passed, try to get the active team */
  if (!team) {
    var tid = document.getElementById('teamSelect') &&
              document.getElementById('teamSelect').value;
    team = tid && typeof getTeamById === 'function' ? getTeamById(tid) : null;
  }
  if (!team || typeof calculateSchemeFit !== 'function') return '';
  var score = calculateSchemeFit(p, team);
  var color = score >= 65 ? '#4ade80' : score < 45 ? '#f87171' : '#64748b';
  var label = score >= 65 ? 'Scheme fit' : score < 45 ? 'Poor fit' : 'Neutral fit';
  return '<span title="' + label + ': ' + score + '" style="font-size:11px;'
    + 'font-weight:700;color:' + color + ';margin-left:4px;cursor:default">✦</span>';
};
</script>

<script>
/* ============================================================
   PATCH — DRAFT PICK REGISTRY: COMPLETE RECONNECTION FIX

   Three root causes fixed:
   1. initDraftPicks only generated picks for simYear+1.
      Now generates picks for next 3 draft years so multi-year
      trading works correctly.
   2. Two parallel pick systems (old draftTrades + new pickRegistry)
      never connected. Old system now routes through pickRegistry.
   3. Trade center and draft screen read from different sources.
      Everything now reads from a single pickRegistry.
   ============================================================ */
(function () {

  /* ── 1. Override initDraftPicks to generate 3 years of picks ─ */
  window.initDraftPicks = function () {
    if (typeof league === 'undefined' || !league) return;
    if (!window.pickRegistry) window.pickRegistry = {};

    var baseYear = window.simYear || 1;

    /* Generate picks for years +1, +2, +3 */
    for (var yOff = 1; yOff <= 3; yOff++) {
      var yr = baseYear + yOff;

      listAllTeams(league).forEach(function (t) {
        if (!window.pickRegistry[t.id]) window.pickRegistry[t.id] = [];

        for (var r = 1; r <= 7; r++) {
          var pid = t.id + '_R' + r + '_Y' + yr;

          /* Only add if not already in registry (preserves traded state) */
          var exists = false;
          Object.keys(window.pickRegistry).forEach(function (tid) {
            if (!exists) {
              (window.pickRegistry[tid] || []).forEach(function (pk) {
                if (pk.pickId === pid) exists = true;
              });
            }
          });

          if (!exists) {
            window.pickRegistry[t.id].push({
              pickId   : pid,
              round    : r,
              year     : yr,
              origOwner: t.id,
              curOwner : t.id,
            });
          }
        }
      });
    }
  };

  /* ── 2. picksOwnedBy — scans full registry for curOwner match ─ */
  window.picksOwnedBy = function (teamId) {
    var out = [];
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        if (pk.curOwner === teamId) out.push(pk);
      });
    });
    return out.sort(function (a, b) {
      return a.year !== b.year ? a.year - b.year : a.round - b.round;
    });
  };

  /* ── 3. transferPick — moves pick between registry buckets ───── */
  window.transferPick = function (pickId, fromId, toId) {
    if (!window.pickRegistry) return false;

    /* Search all buckets — pick may have been traded already */
    var found = null, foundBucket = null;
    Object.keys(window.pickRegistry).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk, i) {
        if (pk.pickId === pickId && !found) {
          found       = pk;
          foundBucket = tid;
        }
      });
    });

    if (!found) return false;

    /* Remove from current bucket */
    window.pickRegistry[foundBucket] = window.pickRegistry[foundBucket]
      .filter(function (pk) { return pk.pickId !== pickId; });

    /* Update ownership */
    found.curOwner = toId;

    /* Add to new owner's bucket */
    if (!window.pickRegistry[toId]) window.pickRegistry[toId] = [];
    window.pickRegistry[toId].push(found);

    return true;
  };

  /* ── 4. pickValueById — reads round from registry ────────────── */
  var PICK_VALUES_R = [3200, 1600, 800, 400, 200, 100, 50];
  window.pickValueById = function (pickId) {
    var found = null;
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        if (pk.pickId === pickId) found = pk;
      });
    });
    if (found) {
      var yearDiff = Math.max(0, (found.year || 2) - ((window.simYear || 1) + 1));
      var base     = PICK_VALUES_R[(found.round || 4) - 1] || 50;
      return Math.round(base * Math.pow(0.90, yearDiff));
    }
    /* Fallback: parse round from ID string */
    var m = pickId.match(/_R(\d+)_/);
    return PICK_VALUES_R[(m ? parseInt(m[1]) : 4) - 1] || 50;
  };

  /* ── 5. buildDraftPickList — uses registry for traded picks ───── */
  window._buildDraftPickList = function () {
    if (typeof league === 'undefined' || !league) return [];

    /* Ensure picks exist for this draft year */
    window.initDraftPicks();

    var yr = (window.simYear || 1) + 1;

    /* Sort teams worst → best for draft order */
    var teams = listAllTeams(league).slice().sort(function (a, b) {
      if (a.wins !== b.wins) return a.wins - b.wins;
      return (a.pointsFor - a.pointsAgainst) - (b.pointsFor - b.pointsAgainst);
    });

    /* Build lookup of ALL registry picks for this year */
    var regMap = {};
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      (window.pickRegistry[tid] || []).forEach(function (pk) {
        if (pk.year === yr) regMap[pk.pickId] = pk;
      });
    });

    var list = [];
    for (var round = 1; round <= 7; round++) {
      teams.forEach(function (origTeam, slot) {
        var pickId  = origTeam.id + '_R' + round + '_Y' + yr;
        var regPick = regMap[pickId];
        list.push({
          pickId   : pickId,
          round    : round,
          slot     : slot + 1,
          origOwner: origTeam.id,
          curOwner : regPick ? regPick.curOwner : origTeam.id,
          year     : yr,
        });
      });
    }

    return list;  /* 224 entries */
  };

  /* Patch calculateDraftOrder to use the new builder */
  var _origCDO = window.calculateDraftOrder;
  window.calculateDraftOrder = function () {
    if (typeof _origCDO === 'function') _origCDO();
    window._draftPickList  = window._buildDraftPickList();
    window._draftAbsIndex  = 0;
    draftRound = 1;
    draftIndex = 0;
  };

  /* ── 6. _consumePick — removes pick from registry after it's used ─ */
  window._consumePick = function (absIdx) {
    var pl   = window._draftPickList;
    var pick = pl && pl[absIdx];
    if (!pick) return;
    Object.keys(window.pickRegistry || {}).forEach(function (tid) {
      window.pickRegistry[tid] = (window.pickRegistry[tid] || [])
        .filter(function (pk) { return pk.pickId !== pick.pickId; });
    });
  };

  /* ── 7. Auto-init picks on game start and after load ─────────── */
  var _origIPHC = window.initPhase4Core;
  window.initPhase4Core = function () {
    if (typeof _origIPHC === 'function') _origIPHC();
    setTimeout(function () {
      if (!window.pickRegistry) window.pickRegistry = {};
      window.initDraftPicks();
    }, 300);
  };

  /* Re-init after save/load */
  var _origDL = window._doLoad;
  window._doLoad = function (slotIdx) {
    if (typeof _origDL === 'function') _origDL(slotIdx);
    setTimeout(function () {
      if (!window.pickRegistry) window.pickRegistry = {};
      window.initDraftPicks();
    }, 400);
  };

  /* Re-init at start of each new season */
  var _origBNS = window.beginNewSeason;
  window.beginNewSeason = function () {
    if (typeof _origBNS === 'function') _origBNS();
    setTimeout(window.initDraftPicks, 100);
  };

  /* ── 8. Ensure trade center calls initDraftPicks before rendering ─ */
  var _origRTPU = window.renderTradePicksUI;
  window.renderTradePicksUI = function (preSelectId) {
    if (!window.pickRegistry) window.pickRegistry = {};
    window.initDraftPicks();
    if (typeof _origRTPU === 'function') _origRTPU(preSelectId);
  };

  /* ── 9. My draft picks view ───────────────────────────────────── */
  window.renderMyPicks = function () {
    var sel  = document.getElementById('teamSelect');
    var tid  = sel && sel.value;
    var team = tid && typeof getTeamById === 'function' ? getTeamById(tid) : null;
    if (!team) { setMainContent('<p>Select a team first.</p>'); return; }

    window.initDraftPicks();
    var picks = window.picksOwnedBy(tid);

    var rows = picks.map(function (pk) {
      var via = pk.origOwner !== tid
        ? ' <span style="font-size:10px;color:var(--gold)">(via '
          + ((getTeamById(pk.origOwner) || {}).nickname || pk.origOwner) + ')</span>'
        : '';
      var val = window.pickValueById(pk.pickId);
      return '<tr>'
        + '<td>Season ' + pk.year + '</td>'
        + '<td>Round ' + pk.round + via + '</td>'
        + '<td style="color:var(--muted2);font-size:11px">~' + val.toLocaleString() + ' pts</td>'
        + '</tr>';
    }).join('');

    setMainContent(
      '<h2>' + team.city + ' ' + team.nickname + ' — Draft Picks</h2>'
      + '<p class="small">All picks currently owned by your team. Values discount for future years.</p>'
      + (picks.length
        ? '<table><thead><tr><th>Draft Year</th><th>Pick</th><th>Est. Value</th></tr></thead>'
          + '<tbody>' + rows + '</tbody></table>'
        : '<p style="color:var(--muted2)">No picks owned — trade for some.</p>')
      + '<button onclick="window.renderTradePicksUI&&window.renderTradePicksUI()" style="margin-top:12px">🔄 Go to Trade Center</button>'
    );
  };

  /* ── 10. Initialize on DOMContentLoaded ──────────────────────── */
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (!window.pickRegistry) window.pickRegistry = {};
      if (typeof league !== 'undefined' && league) window.initDraftPicks();
    }, 600);
  });

})();
</script>

<script>
/* ============================================================
   PATCH — TRADE VALUE SYSTEM (KTC-INSPIRED EXPONENTIAL CURVE)

   Problems with old linear pv():
   1. Ten 70-OVR players = one 90-OVR player (absurd)
   2. Only QB/EDGE/CB got scarcity premiums (×1.2 flat)
   3. No "anchor rule" — junk volume beat elite talent

   This patch replaces pv() with a dynasty-community-standard
   exponential curve and adds three safeguards:

   Rule 1 — EXPONENTIAL VALUE CURVE
     value = 10 × 1.25^(ovr - 65) × ageMult × posMult
     At OVR 70 = 30pts. OVR 80 = 284pts. OVR 90 = 2647pts.
     90 OVR needs THREE 85s to match — not nine 70s.

   Rule 2 — POSITION SCARCITY (6 tiers)
     QB 1.5×, EDGE 1.3×, T 1.2×, CB/FS 1.15×,
     WR/SS/C 1.1×, everything else 1.0×

   Rule 3 — BEST PLAYER ANCHOR RULE
     The single most valuable player on EACH side must be
     worth at least 45% of that side's total value.
     Prevents packaging 20 cheap players to match one star.

   Rule 4 — SIDE SIZE CAP (4 players + 3 picks max per side)
     Keeps trades readable and prevents volume spam.
   ============================================================ */
(function () {

  /* ── Exponential OVR-to-value curve ─────────────────────── */
  var POS_MULT = {
    QB: 1.50, EDGE: 1.30, T: 1.20,
    CB: 1.15, FS: 1.15,
    WR: 1.10, SS: 1.10, C: 1.10,
    /* All others default to 1.0 */
  };

  window.tradeValueOf = function (p) {
    if (!p || !p.attributes) return 0;
    var ovr = Math.max(40, Math.min(99, p.attributes.overall));
    var age = p.age || 27;
    var pos = p.positions ? p.positions[0] : 'RB';

    /* Exponential base: doubles roughly every 10 OVR above 75 */
    var base = 10 * Math.pow(1.25, ovr - 65);

    /* Age multiplier — mirrors KTC's youth premium */
    var ageMult;
    if      (age <= 22) ageMult = 1.55;
    else if (age <= 24) ageMult = 1.30;
    else if (age <= 26) ageMult = 1.10;
    else if (age <= 28) ageMult = 0.95;
    else if (age <= 30) ageMult = 0.80;
    else if (age <= 32) ageMult = 0.60;
    else if (age <= 34) ageMult = 0.40;
    else                ageMult = 0.20;

    /* Position scarcity */
    var posMult = POS_MULT[pos] || 1.0;

    return Math.round(base * ageMult * posMult);
  };

  /* ── Side validation: anchor rule + size cap ─────────────── */
  var MAX_PLAYERS_PER_SIDE = 4;
  var MAX_PICKS_PER_SIDE   = 3;
  var ANCHOR_MIN_RATIO     = 0.45; /* best player ≥ 45% of side total */

  function validateTradeSide(players, picks, sideLabel) {
    var errors = [];

    if (players.length > MAX_PLAYERS_PER_SIDE)
      errors.push(sideLabel + ': max ' + MAX_PLAYERS_PER_SIDE + ' players per side');
    if (picks.length > MAX_PICKS_PER_SIDE)
      errors.push(sideLabel + ': max ' + MAX_PICKS_PER_SIDE + ' picks per side');

    var total = players.reduce(function (s, p) { return s + window.tradeValueOf(p); }, 0)
              + picks.reduce(function (s, id) {
                  return s + (typeof window.pickValueById === 'function'
                    ? window.pickValueById(id) : 200);
                }, 0);

    if (players.length > 1 && total > 0) {
      var best = players.reduce(function (mx, p) {
        return Math.max(mx, window.tradeValueOf(p));
      }, 0);
      var anchorRatio = best / total;
      if (anchorRatio < ANCHOR_MIN_RATIO) {
        errors.push(
          sideLabel + ': trade looks like a salary dump — '
          + 'your best player must be worth at least 45% of your total offer. '
          + 'Current best: ' + best.toLocaleString() + ' pts / total: ' + total.toLocaleString() + ' pts'
          + ' (' + Math.round(anchorRatio * 100) + '%)'
        );
      }
    }

    return { errors: errors, total: total };
  }

  /* ── Replace _proposeTrade with the new system ─────────────── */
  var PREV_PROPOSE = window._proposeTrade;
  window._proposeTrade = function () {
    var selA   = document.getElementById('tcTeamA');
    var selB   = document.getElementById('tcTeamB');
    var result = document.getElementById('tcResult');
    if (!selA || !selB || !result) return;
    if (selA.value === selB.value) {
      result.innerHTML = '<p style="color:#f87171">Select two different teams.</p>';
      return;
    }

    var teamA = getTeamById(selA.value);
    var teamB = getTeamById(selB.value);
    var sel   = window._tradeSelected;

    var plA = Array.from(sel.A.players)
      .map(function (id) { return teamA.roster.find(function (p) { return String(p.id) === id; }); })
      .filter(Boolean);
    var plB = Array.from(sel.B.players)
      .map(function (id) { return teamB.roster.find(function (p) { return String(p.id) === id; }); })
      .filter(Boolean);
    var pkA = Array.from(sel.A.picks);
    var pkB = Array.from(sel.B.picks);

    /* Must have assets on both sides */
    if (!plA.length && !pkA.length && !plB.length && !pkB.length) {
      result.innerHTML = '<p style="color:#f87171">Select assets on both sides.</p>'; return;
    }
    if ((!plA.length && !pkA.length) || (!plB.length && !pkB.length)) {
      result.innerHTML = '<p style="color:#f87171">Both sides must offer at least one asset.</p>'; return;
    }

    /* Validate both sides */
    var vA = validateTradeSide(plA, pkA, teamA.nickname);
    var vB = validateTradeSide(plB, pkB, teamB.nickname);

    var allErrors = vA.errors.concat(vB.errors);
    if (allErrors.length) {
      result.innerHTML = '<div style="background:rgba(239,68,68,.1);border:1px solid #ef4444;'
        + 'border-radius:8px;padding:10px 14px;margin-bottom:10px">'
        + allErrors.map(function (e) {
            return '<p style="color:#f87171;font-size:12px;margin:4px 0">⚠ ' + e + '</p>';
          }).join('')
        + '</div>';
      return;
    }

    var valA = vA.total;
    var valB = vB.total;

    /* Value gap as percentage of the larger side */
    var larger = Math.max(valA, valB);
    var gap    = Math.abs(valA - valB) / larger;

    /* Build value breakdown */
    function playerValueRow(p) {
      var v = window.tradeValueOf(p);
      return '<div style="display:flex;justify-content:space-between;font-size:11px;'
        + 'padding:2px 0;color:var(--muted2)">'
        + '<span>' + p.name + ' (' + p.positions[0] + ' · OVR ' + p.attributes.overall + ' · Age ' + p.age + ')</span>'
        + '<span style="color:var(--text);font-weight:600">' + v.toLocaleString() + ' pts</span>'
        + '</div>';
    }

    function pickValueRow(id) {
      var v = typeof window.pickValueById === 'function' ? window.pickValueById(id) : 0;
      var m = id.match(/_R(\d+)_Y(\d+)/);
      var label = m ? 'Yr ' + m[2] + ' Rd ' + m[1] : id;
      return '<div style="display:flex;justify-content:space-between;font-size:11px;'
        + 'padding:2px 0;color:var(--muted2)">'
        + '<span>' + label + ' (pick)</span>'
        + '<span style="color:var(--text);font-weight:600">' + v.toLocaleString() + '</span>'
        + '</div>';
    }

    var breakdown =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0">'
      /* Side A */
      + '<div style="background:var(--surface2);border-radius:8px;padding:10px">'
        + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">'
          + teamA.nickname + ' gives'
        + '</div>'
        + plA.map(playerValueRow).join('') + pkA.map(pickValueRow).join('')
        + '<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;'
          + 'display:flex;justify-content:space-between;font-size:13px;font-weight:700">'
          + '<span>Total</span>'
          + '<span style="color:var(--accent2)">' + valA.toLocaleString() + '</span>'
        + '</div>'
      + '</div>'
      /* Side B */
      + '<div style="background:var(--surface2);border-radius:8px;padding:10px">'
        + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">'
          + teamB.nickname + ' gives'
        + '</div>'
        + plB.map(playerValueRow).join('') + pkB.map(pickValueRow).join('')
        + '<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;'
          + 'display:flex;justify-content:space-between;font-size:13px;font-weight:700">'
          + '<span>Total</span>'
          + '<span style="color:var(--accent2)">' + valB.toLocaleString() + '</span>'
        + '</div>'
      + '</div>'
      + '</div>'
      + '<div style="font-size:11px;color:var(--muted2);margin-bottom:10px;text-align:center">'
        + 'Gap: <strong>' + Math.round(gap * 100) + '%</strong> '
        + (gap < 0.10 ? '✅ Fair' : gap < 0.22 ? '⚠️ Borderline' : '❌ Too lopsided')
      + '</div>';

    /* Decision */
    var teamBGivingMore = valB > valA;
    var rejectingTeam   = teamBGivingMore ? teamB : teamA;

    function doExecute() {
      plA.forEach(function (p) {
        teamA.roster = teamA.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamA.capUsed -= p.contract.capHitPerYear;
        teamB.roster.push(p);
        if (p.contract) teamB.capUsed += p.contract.capHitPerYear;
      });
      plB.forEach(function (p) {
        teamB.roster = teamB.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) teamB.capUsed -= p.contract.capHitPerYear;
        teamA.roster.push(p);
        if (p.contract) teamA.capUsed += p.contract.capHitPerYear;
      });
      pkA.forEach(function (id) { window.transferPick && window.transferPick(id, teamA.id, teamB.id); });
      pkB.forEach(function (id) { window.transferPick && window.transferPick(id, teamB.id, teamA.id); });
      if (typeof logTradeTransaction === 'function')
        logTradeTransaction(teamA, plA, pkA, teamB, plB, pkB);

      result.innerHTML = breakdown
        + '<div style="background:rgba(22,163,74,.15);border:1px solid var(--accent);'
          + 'border-radius:8px;padding:10px;text-align:center">'
          + '<span style="color:#4ade80;font-weight:700;font-size:14px">✅ Trade executed!</span>'
        + '</div>';

      setTimeout(function () { window.renderTradePicksUI && window.renderTradePicksUI(); }, 2000);
    }

    if (gap <= 0.10) {
      doExecute();
    } else if (gap <= 0.22) {
      /* Borderline — CPU accepts if they have a strong positional need */
      var need = 0.5;
      if (typeof getTeamNeedAtPosition === 'function' && (plA[0] || plB[0])) {
        var keyPlayer = teamBGivingMore ? (plA[0] && plA[0].positions[0]) : (plB[0] && plB[0].positions[0]);
        if (keyPlayer) need = getTeamNeedAtPosition(rejectingTeam, keyPlayer);
      }
      if (need >= 0.7) {
        doExecute();
      } else {
        var msg = typeof _tradeMsg === 'function'
          ? _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB)
          : rejectingTeam.nickname + ' wants more value.';
        result.innerHTML = breakdown
          + '<p style="color:#facc15;font-weight:600">⚠️ ' + rejectingTeam.nickname + ' hesitated — ' + msg + '</p>';
      }
    } else {
      var msg = typeof _tradeMsg === 'function'
        ? _tradeMsg(teamBGivingMore, teamA, teamB, valA, valB)
        : rejectingTeam.nickname + ' rejected.';
      result.innerHTML = breakdown
        + '<p style="color:#f87171;font-weight:600">❌ ' + rejectingTeam.nickname + ' rejected — ' + msg + '</p>';
    }
  };

  /* ── Trade Offers: generate CPU offers for a specific player ── */
  window.renderTradeOffers = function (playerId) {
    /* Use activeTeamId() which reads from DOM — avoids stale userTeamId */
    var tid = typeof activeTeamId === 'function' ? activeTeamId()
            : (typeof userTeamId !== 'undefined' ? userTeamId : null);

    /* Find player + team — search by active team first, then all teams */
    var myTeam = null, player = null;
    if (tid && typeof getTeamById === 'function') {
      myTeam = getTeamById(tid);
      if (myTeam) player = myTeam.roster.find(function(p){ return String(p.id) === String(playerId); });
    }
    /* Fallback: scan all teams (catches stale-ID edge case) */
    if (!player && typeof listAllTeams === 'function' && typeof league !== 'undefined') {
      listAllTeams(league).forEach(function(t) {
        if (player) return;
        var found = t.roster.find(function(p){ return String(p.id) === String(playerId); });
        if (found) { player = found; myTeam = t; }
      });
    }
    if (!player || !myTeam) return;

    var tv     = window.tradeValueOf;
    var pvById = window.pickValueById || function () { return 200; };
    var pos    = player.positions[0];
    var pVal   = tv(player);

    /* ── Build the picks list for a given team ──────────────── */
    function picksForTeam(cpu) {
      var out = [];
      Object.keys(window.pickRegistry || {}).forEach(function (tid) {
        (window.pickRegistry[tid] || []).forEach(function (pk) {
          if (pk.curOwner === cpu.id) out.push(pk);
        });
      });
      return out.sort(function (a, b) { return pvById(b.pickId) - pvById(a.pickId); });
    }

    /* ── Value of a picks array ─────────────────────────────── */
    function picksVal(pks) {
      return pks.reduce(function (s, id) { return s + pvById(id); }, 0);
    }

    /* ── Build + score one offer ────────────────────────────── */
    function makeOffer(cpu, pl, pks, interest, need) {
      var val = pl.reduce(function (s, p) { return s + tv(p); }, 0) + picksVal(pks);
      if (val <= 0) return null;
      /* Upper bound: whichever is greater of (2× asking value) OR (1000 pts above asking).
         Gives small players a generous floor so a team CAN overpay for a cheap TE,
         while preventing absurd offers on high-value players.                      */
      var maxOffer = Math.max(pVal * 2.0, pVal + 1000);
      if (val > maxOffer) return null;
      /* Also reject offers that are less than 35% of player value (insults) */
      if (val < pVal * 0.35) return null;
      var gap = (pVal - val) / Math.max(pVal, 1);
      return { team: cpu, players: pl.slice(), picks: pks.slice(),
               value: val, gap: gap, interest: interest, need: need };
    }

    /* ── Greedy best-fit: pick up to `maxPl` players summing to `target` ─ */
    function greedyPlayers(pool, target, maxPl) {
      if (target <= 0) return [];
      var pl = [], rem = target;
      /* Sort descending by value */
      var sorted = pool.slice().sort(function (a, b) { return tv(b) - tv(a); });
      for (var i = 0; i < sorted.length && pl.length < maxPl; i++) {
        var p = sorted[i], v = tv(p);
        /* Skip players worth more than 130% of the TOTAL target (not just remaining)
           — prevents a single high-value player dominating a low-value trade        */
        if (v > target * 1.30) continue;
        /* Allow up to 25% overshoot of remaining budget per player */
        if (v <= rem * 1.25) {
          pl.push(p);
          rem -= v;
          if (rem <= 0) break;
        }
      }
      return pl;
    }

    /* ── Pick greedy fill: add picks until we hit target ─────── */
    function greedyPicks(picks, target, max) {
      var pks = [], rem = target;
      for (var i = 0; i < picks.length && pks.length < max; i++) {
        var v = pvById(picks[i].pickId);
        if (v <= rem * 1.30) {
          pks.push(picks[i].pickId);
          rem -= v;
          if (rem <= 0) break;
        }
      }
      return pks;
    }

    /* ─────────────────────────────────────────────────────────
       MAIN OFFER GENERATION
    ───────────────────────────────────────────────────────── */
    var offers = [];

    (listAllTeams(league) || []).forEach(function (cpu) {
      if (cpu.id === userTeamId) return;

      var need = typeof getTeamNeedAtPosition === 'function'
        ? getTeamNeedAtPosition(cpu, pos) : 0.5;

      var interest = need * 0.65 + Math.random() * 0.45;
      if (interest < 0.35) return;

      /* High-need teams are willing to overpay — but max 25% premium */
      var stretch = Math.min(1.25, 1.0 + (need > 0.7 ? (need - 0.7) * 0.8 : 0));
      var budget  = Math.round(pVal * (0.72 + interest * 0.40) * stretch);

      var allSorted = (cpu.roster || [])
        .filter(function (p) {
          return p.contract && p.attributes && p.attributes.overall >= 60;
        })
        .sort(function (a, b) { return tv(b) - tv(a) });

      /* Tradeable = everyone below the top-1 UNLESS desperation (need>0.85) */
      var reserve = need >= 0.85 ? 1 : 2;
      var tradeable = allSorted.slice(reserve);
      /* Always have at least a small pool */
      if (!tradeable.length && allSorted.length) tradeable = allSorted.slice(1);

      /* Also offer "scheme misfits": players who fit poorly get prioritised
         as trade bait — the CPU is motivated to move them */
      var schemeMisfits = [];
      if (typeof calculateSchemeFit === 'function') {
        schemeMisfits = allSorted.filter(function (p) {
          return calculateSchemeFit(p, cpu) < 45 && tv(p) > 50;
        });
      }

      var cpuPicks = picksForTeam(cpu);

      /* ── Template A: Player package only (up to 4 players) ── */
      (function () {
        if (!tradeable.length) return;
        var pl  = greedyPlayers(tradeable, budget, 4);
        if (pl.length) offers.push(makeOffer(cpu, pl, [], interest, need));
      })();

      /* ── Template B: 1-2 players + 1 pick ────────────────── */
      (function () {
        if (!tradeable.length || !cpuPicks.length) return;
        var pk1   = cpuPicks[0];
        var pkV   = pvById(pk1.pickId);
        var pl    = greedyPlayers(tradeable, budget - pkV, 3);
        if (pl.length) offers.push(makeOffer(cpu, pl, [pk1.pickId], interest, need));
      })();

      /* ── Template C: 1-3 players + 2 picks ───────────────── */
      (function () {
        if (!tradeable.length || cpuPicks.length < 2) return;
        var topPks = cpuPicks.slice(0, 2).map(function (pk) { return pk.pickId; });
        var pkV    = picksVal(topPks);
        var pl     = greedyPlayers(tradeable, budget - pkV, 3);
        if (pl.length) offers.push(makeOffer(cpu, pl, topPks, interest, need));
      })();

      /* ── Template D: Picks only ───────────────────────────── */
      (function () {
        if (!cpuPicks.length) return;
        var pks = greedyPicks(cpuPicks, budget, 4);
        if (pks.length) offers.push(makeOffer(cpu, [], pks, interest, need));
      })();

      /* ── Template E: Scheme misfit dump ──────────────────── */
      (function () {
        if (!schemeMisfits.length) return;
        /* CPU wants to unload a misfit — package them as the headliner */
        var misfit = schemeMisfits[0];
        var rem    = budget - tv(misfit);
        var pl     = [misfit];
        /* Supplement with picks or more players */
        if (rem > 0 && cpuPicks.length) {
          var pks = greedyPicks(cpuPicks, rem, 2);
          if (pks.length) { offers.push(makeOffer(cpu, pl, pks, interest, need)); return; }
        }
        if (rem > 0) {
          var extra = greedyPlayers(
            tradeable.filter(function (p) { return p.id !== misfit.id; }), rem, 2
          );
          pl = pl.concat(extra);
        }
        offers.push(makeOffer(cpu, pl, [], interest, need));
      })();

      /* ── Template F: Desperate need — offer the 2nd-best player ─
         Only if the star's value is in the right ballpark (≤175% of
         pVal). Prevents a 94 OVR star being offered for a 64 OVR bench
         player just because the CPU needs that position.              */
      (function () {
        if (need < 0.75) return;
        var star = allSorted[1]; /* 2nd-best player on roster */
        if (!star) return;
        var starV = tv(star);
        /* Don't offer a player worth more than the same ceiling as makeOffer */
        var maxStarOffer = Math.max(pVal * 2.0, pVal + 1000);
        if (starV > maxStarOffer) return;
        var rem  = budget - starV;
        var pl   = [star];
        var pks  = rem > 0 && cpuPicks.length ? greedyPicks(cpuPicks, rem, 2) : [];
        if (rem > 0 && !pks.length) {
          var extra = greedyPlayers(
            tradeable.filter(function (p) { return p.id !== star.id; }), rem, 2
          );
          pl = pl.concat(extra);
        }
        var o = makeOffer(cpu, pl, pks, interest, need);
        if (o) offers.push(o);
      })();
    });

    /* Deduplicate near-identical offers from same team */
    var seenKey = {};
    offers = offers.filter(function (o) {
      /* Key = team + rounded value bucket */
      var playerIds = o.players.map(function (p) { return p.id; }).sort().join(',');
      var pickIds   = o.picks.slice().sort().join(',');
      var key = o.team.id + '|' + playerIds + '|' + pickIds;
      if (seenKey[key]) return false;
      seenKey[key] = true;
      return true;
    });

    /* Sort: overpaying first (best deal for user), cap at 32 */
    offers.sort(function (a, b) { return a.gap - b.gap; });
    offers = offers.slice(0, 32);

    /* ── Helpers ─────────────────────────────────────────────── */
    function ovc(v){return v>=90?'#c084fc':v>=85?'#60a5fa':v>=80?'#4ade80':v>=75?'#facc15':v>=70?'#94a3b8':'#f87171';}
    function schemeTag(p) {
      if (typeof calculateSchemeFit !== 'function' || typeof getTeamById !== 'function') return '';
      var score = calculateSchemeFit(p, myTeam);
      if (score >= 65) return ' <span style="font-size:9px;color:#4ade80;background:rgba(22,163,74,.15);'
        + 'border-radius:3px;padding:1px 4px">✦ scheme fit</span>';
      if (score < 45) return ' <span style="font-size:9px;color:#f87171;background:rgba(239,68,68,.12);'
        + 'border-radius:3px;padding:1px 4px">✦ poor fit</span>';
      return '';
    }
    function interestLabel(i) {
      if (i >= 0.80) return { txt:'🔥 Very Interested', c:'#f87171' };
      if (i >= 0.60) return { txt:'⭐ Interested',      c:'#facc15' };
      return               { txt:'📋 Making an Offer', c:'#94a3b8' };
    }

    /* ── Execute accepted trade ─────────────────────────────── */
    window._acceptTradeOffer = function acceptOffer(idx) {
      var o = offers[idx]; if (!o) return;
      myTeam.roster = myTeam.roster.filter(function (x) { return String(x.id) !== String(player.id); });
      if (player.contract) myTeam.capUsed -= player.contract.capHitPerYear;
      o.team.roster.push(player);
      if (player.contract) o.team.capUsed += player.contract.capHitPerYear;

      o.players.forEach(function (p) {
        o.team.roster = o.team.roster.filter(function (x) { return String(x.id) !== String(p.id); });
        if (p.contract) o.team.capUsed -= p.contract.capHitPerYear;
        myTeam.roster.push(p);
        if (p.contract) myTeam.capUsed += p.contract.capHitPerYear;
      });
      o.picks.forEach(function (id) {
        if (typeof window.transferPick === 'function') window.transferPick(id, o.team.id, myTeam.id);
      });
      if (typeof logTradeTransaction === 'function')
        logTradeTransaction(myTeam, [player], [], o.team, o.players, o.picks);

      var got = o.players.map(function (p) {
        return '<strong>' + p.name + '</strong> (' + p.positions[0] + ' · OVR ' + p.attributes.overall + ')';
      }).concat(o.picks.map(function (id) {
        var m = id.match(/_R(\d+)_Y(\d+)/);
        return m ? '<strong>Yr ' + m[2] + ' Rd ' + m[1] + ' pick</strong>' : '<strong>' + id + '</strong>';
      }));

      setMainContent(
        '<div style="max-width:520px;margin:0 auto">'
        + '<div style="background:rgba(22,163,74,.12);border:1px solid var(--accent);border-radius:12px;'
          + 'padding:22px 20px;text-align:center;margin-bottom:16px">'
          + '<div style="font-size:28px;margin-bottom:6px">🤝</div>'
          + '<div style="font-size:20px;font-weight:700;color:#4ade80;margin-bottom:8px;'
            + 'font-family:\'Barlow Condensed\',sans-serif">Trade Complete!</div>'
          + '<div style="font-size:13px;color:var(--muted2);margin-bottom:12px">'
            + '<strong style="color:var(--text)">' + player.name + '</strong>'
            + ' → ' + o.team.city + ' ' + o.team.nickname
          + '</div>'
          + '<div style="font-size:12px;color:var(--muted2);line-height:1.8">'
            + 'You received:<br>' + (got.join('<br>') || '—')
          + '</div>'
        + '</div>'
        + '<button onclick="renderRoster()" style="width:100%;background:var(--accent-dim);'
          + 'border-color:var(--accent);color:var(--accent2)">← Back to Roster</button>'
        + '</div>'
      );
      setTimeout(function () { if (typeof window._ctxAnimate === 'function') window._ctxAnimate('trade'); }, 120);
    }

    /* ── Render one offer card ───────────────────────────────── */
    function offerCard(o, idx) {
      var il  = interestLabel(o.interest);
      var good = o.gap < 0;
      var fair = o.gap <= 0.12;
      var vc   = good ? '#4ade80' : fair ? '#facc15' : '#f87171';
      var vl   = good ? '🟢 Above Market' : fair ? '🟡 Fair Value' : '🔴 Below Market';
      var pct  = Math.abs(Math.round(o.gap * 100));

      /* Need indicator */
      var needPct = Math.round(o.need * 100);
      var needColor = o.need >= 0.75 ? '#f87171' : o.need >= 0.55 ? '#facc15' : '#94a3b8';
      var needTxt = o.need >= 0.75 ? '🚨 Desperate need'
                  : o.need >= 0.55 ? '⚠ Has roster need'
                  : '· filling a depth spot';

      var plRows = o.players.map(function (p) {
        return '<div style="display:flex;align-items:center;gap:7px;padding:5px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:11px;font-weight:700;color:var(--accent2);min-width:34px">'
            + p.positions[0] + '</span>'
          + '<div style="flex:1">'
            + '<div style="font-size:12px;font-weight:500">' + p.name
              + schemeTag(p)
            + '</div>'
            + '<div style="font-size:10px;color:var(--muted2)">Age ' + p.age + '</div>'
          + '</div>'
          + '<span style="font-size:13px;font-weight:700;color:' + ovc(p.attributes.overall) + '">'
            + p.attributes.overall + '</span>'
          + '<span style="font-size:10px;color:var(--muted2);min-width:52px;text-align:right">'
            + tv(p).toLocaleString() + ' pts</span>'
        + '</div>';
      }).join('');

      var pkRows = o.picks.map(function (id) {
        var m = id.match(/_R(\d+)_Y(\d+)/);
        var origTeam = id.split('_R')[0];
        var via = (origTeam && origTeam !== o.team.id)
          ? ' <span style="color:var(--gold);font-size:9px">via '
            + ((getTeamById(origTeam)||{}).nickname||'?') + '</span>' : '';
        return '<div style="display:flex;align-items:center;gap:7px;padding:5px 0;'
          + 'border-bottom:1px solid rgba(30,45,71,.3)">'
          + '<span style="font-size:10px;font-weight:700;color:#facc15;min-width:34px">PICK</span>'
          + '<div style="flex:1;font-size:12px">'
            + (m ? 'Season ' + m[2] + ' · Round ' + m[1] : id) + via
          + '</div>'
          + '<span style="font-size:10px;color:var(--muted2);min-width:52px;text-align:right">'
            + pvById(id).toLocaleString() + ' pts</span>'
        + '</div>';
